<!DOCTYPE html>
<!-- build: v4 -->
<html lang="tr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuvar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--surface:#0f0f1a;--surface2:#161625;--surface3:#252528;--border:#2a2a3e;--border2:#38383f;--accent:#a855f7;--accent2:#c084fc;--text:#f0ede6;--text2:#9b9890;--text3:#5c5a56;--red:#c05444;--green:#4a9462;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:200;}
.nb{padding:5px 14px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;cursor:pointer;background:none;transition:all .15s;text-decoration:none;display:inline-block;font-family:'DM Sans',sans-serif;}
.nb:hover{background:var(--surface2);color:var(--text);}
.nb.active{background:rgba(201,150,58,.12);border-color:rgba(201,150,58,.3);color:var(--accent);}
.nb.stage{background:rgba(201,150,58,.18);border-color:rgba(201,150,58,.5);color:var(--accent);font-weight:500;}
.sync{margin-left:auto;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;}
.dot.ok{background:var(--green);}.dot.err{background:var(--red);}.dot.spin{background:var(--accent);animation:pu .8s ease infinite;}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:flex;height:calc(100vh - 56px);}
.lp{width:300px;min-width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.lph{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.lph h2{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;}
.bn{background:var(--accent);border:none;border-radius:6px;padding:5px 12px;color:#1a1000;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;}
.bn:hover{background:var(--accent2);}
.ls{overflow-y:auto;flex:1;}
.ls::-webkit-scrollbar{width:4px;}.ls::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.ri{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.ri:hover{background:var(--surface2);}
.ri.active{background:var(--surface2);border-left:3px solid var(--accent);padding-left:13px;}
.rn{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;}
.rm{font-size:11px;color:var(--text3);display:flex;gap:8px;}
.sp{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:500;}
.sc{background:#3d3a1a;color:#c8b050;}.sf{background:#1a2d1a;color:#6ab87a;}.sa{background:#1a1a2d;color:#7a8ab8;}
.dp{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.dp::-webkit-scrollbar{width:5px;}.dp::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text3);gap:12px;}
.dh{padding:20px 24px 0;border-bottom:1px solid var(--border);background:var(--surface);}
.dht{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:16px;}
.did{font-size:11px;color:var(--text3);margin-bottom:4px;}
.dn{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);}
.da{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.bi{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-decoration:none;display:inline-block;}
.bi:hover{border-color:var(--border2);color:var(--text);}
.bd{border-color:rgba(192,84,68,.3);color:var(--red);}
.bd:hover{background:rgba(192,84,68,.1);border-color:var(--red);}
.bstage{background:rgba(201,150,58,.15);border-color:rgba(201,150,58,.4);color:var(--accent);font-weight:500;}
.bstage:hover{background:rgba(201,150,58,.25);}
.dmr{display:flex;gap:20px;padding-bottom:14px;flex-wrap:wrap;}
.mc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.mc strong{color:var(--text);}
.is{padding:20px 24px;flex:1;}
.ih{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ih h3{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;}
.baw{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.baw:hover{border-color:var(--accent);color:var(--accent);}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);vertical-align:middle;}
tr:hover td{background:var(--surface2);}
.sq{width:52px;}
.si{width:44px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 6px;color:var(--accent);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;text-align:center;outline:none;cursor:pointer;transition:border-color .15s;-moz-appearance:textfield;}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none;}
.si:focus{border-color:var(--accent);}
.wn{color:var(--text);font-weight:500;}
.ws{font-size:11px;color:var(--text3);margin-top:2px;}
.cn{display:inline-block;background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--text2);}
.ra{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
tr:hover .ra{opacity:1;}
.br{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 7px;font-size:11px;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;}
.br:hover{color:var(--text);border-color:var(--border2);}
.br.dl:hover{color:var(--red);border-color:var(--red);}
.br:disabled{opacity:.25;cursor:not-allowed;}
.ei{padding:40px 0;text-align:center;color:var(--text3);font-size:13px;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;}
.md{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:92vw;max-height:85vh;overflow-y:auto;}
.md h2{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:18px;color:var(--text);}
.fr{margin-bottom:14px;}
.fl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:block;}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--accent);}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.bc{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 18px;color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.bs{background:var(--accent);border:none;border-radius:7px;padding:8px 18px;color:#1a1000;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;}
.bs:hover{background:var(--accent2);}
.wpl{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:7px;}
.wpl::-webkit-scrollbar{width:4px;}.wpl::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.wpi{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
.wpi:last-child{border-bottom:none;}
.wpi:hover{background:var(--surface2);}
.wpi.sel{background:rgba(201,150,58,.12);}
.wpn{font-size:13px;color:var(--text);}
.wps{font-size:11px;color:var(--text3);margin-top:1px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text2);z-index:999;animation:ti .2s ease;}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.er{border-color:var(--red);color:var(--red);}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .pf-tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px 3px 10px; border-radius: 20px;
    background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.35);
    color: var(--accent); font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .pf-tag button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 14px; padding: 0; line-height: 1; opacity: .7;
  }
  .pf-tag button:hover { opacity: 1; }
  .pf-dd-item {
    padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--text);
  }
  .pf-dd-item:hover { background: var(--surface2); }

  .be { color: #60a5fa !important; }
  .be:hover { border-color: #60a5fa !important; color: #93c5fd !important; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    nav { padding:0 8px; gap:3px; height:64px; overflow-x:auto; }
    .nb { font-size:11px; padding:4px 8px; white-space:nowrap; }
    .layout { flex-direction:column; height:auto; min-height:calc(100vh - 64px); }
    .lp { width:100%; min-width:unset; max-height:220px; border-right:none; border-bottom:1px solid var(--border); }
    .dc { padding:16px; }
    .dh { padding:14px 16px; }
    .dn { font-size:18px; }
    .da { flex-wrap:wrap; gap:6px; }
    .bi { font-size:11px; padding:5px 10px; }
    table { font-size:12px; }
    .ra { gap:3px; }
    .br { padding:3px 7px; font-size:11px; }
    .wm > div { padding:16px; }
    .wpl { max-height:160px; }
  }
  @media (max-width: 480px) {
    .nb[href="artiesten.html"], .nb[href="eserler.html"] { display:none; }
    .nb[href="index.html"] img { height:28px !important; }
    nav { height:52px; }
    .layout { min-height:calc(100vh - 52px); }
    .lp { max-height:180px; }
    .dmr { flex-direction:column; gap:6px; }
    .dt { font-size:11px; }
    .da { flex-wrap:wrap; gap:4px; }
    .bi { font-size:11px; padding:5px 8px; }
    /* Modals on small screen */
    #wm > div { width:92vw !important; max-height:85vh !important; overflow-y:auto; }
    #rm > div { width:92vw !important; }
  }

  /* ── MOBILE GLOBAL ── */
  @media (max-width: 768px) {
    body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button, a { min-height: 36px; }
    input, select, textarea { font-size: 16px !important; } /* prevent iOS zoom */
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .sb { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }


  @media (max-width: 600px) {
    #wm > div, #iem > div, #rm > div {
      width: 96vw !important;
      max-height: 88vh !important;
      overflow-y: auto;
      padding: 16px !important;
    }
    .wpl { max-height: 140px !important; }
    #iemCN, #iemMK { font-size: 16px; }
    div[style*="grid-template-columns:1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
  }

</style>
<script src="auth.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="nb">🏠 Ana Sayfa</a>
  <a href="eserler.html" class="nb">Eserler</a>
  <a href="repertoires.html" class="nb active">Repertuvar</a>
  <a href="artiesten.html" class="nb">Solistler</a>
  <a href="stage.html" class="nb stage">🎭 Sahne Modu</a>
  <div class="sync"><div class="dot spin" id="dot"></div><span id="sl">Bağlanıyor...</span></div>
<div id="userBadge"></div>
</nav>
<div class="layout">
  <aside class="lp">
    <div class="lph"><h2>Repertuvarlar</h2><button class="bn" onclick="openNew()">+ Yeni</button></div>
    <div class="ls" id="list"></div>
  </aside>
  <div class="dp" id="dp">
    <div class="es" id="es">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
      <p>Bir repertuvar seçin</p>
    </div>
    <div id="dc" style="display:none;"></div>
  </div>
</div>

<!-- Modal: Rep -->
<div class="mo" id="rm" style="display:none;">
  <div class="md">
    <h2 id="rmt">Yeni Repertuvar</h2>
    <div class="fr"><label class="fl">Repertuvar Adı *</label><input class="fi" id="fN" placeholder="örn. THM Eserleri Do Akort"></div>
    <div class="fr"><label class="fl">Tarih</label><input class="fi" id="fD" type="date"></div>
    <div class="fr"><label class="fl">Lokasyon</label><input class="fi" id="fV" placeholder="Sahne adı veya şehir"></div>
    <div class="fr"><label class="fl">Durum</label>
      <select class="fi" id="fS" style="appearance:none;cursor:pointer;">
        <option value="concept">Taslak</option>
        <option value="confirmed">Onaylandı</option>
        <option value="archive">Arşiv</option>
      </select>
    </div>
    <div class="fr"><label class="fl">Notlar</label><textarea class="fi" id="fNo" rows="3"></textarea></div>
    <div class="fa"><button class="bc" onclick="closeRM()">İptal</button><button class="bs" onclick="saveRep()">Kaydet</button></div>
  </div>
</div>

<!-- Modal: Work -->
<div class="mo" id="wm" style="display:none;">
  <div class="md">
    <h2>Eser Ekle</h2>
    <div class="fr"><input class="fi" id="ws" placeholder="Eser adı veya besteci ara..." oninput="filterW()" autocomplete="off"></div>
    <div class="wpl" id="wpl"></div>
    <!-- Eser bilgileri (seçince otomatik dolar) -->
    <div id="wInfoBox" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:13px;">
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <span id="wInfoMakam" style="color:var(--text2);"></span>
        <span id="wInfoInstr" style="color:var(--text2);"></span>
        <span id="wInfoComp" style="color:var(--text3);"></span>
      </div>
    </div>
    <div class="fr" style="margin-top:14px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;">
        <div style="grid-column:1/-1;">
          <label class="fl">İcracı Sanatçılar</label>
          <div id="pfTags" style="display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;align-items:center;cursor:text;" onclick="document.getElementById('pfInput').focus()">
            <!-- sanatçı tag'leri buraya gelecek -->
            <input id="pfInput" placeholder="Sanatçı ekle..." autocomplete="off"
              style="border:none;background:none;color:var(--text);font-size:13px;outline:none;min-width:140px;flex:1;"
              oninput="pfSuggest(this.value)" onkeydown="pfKeydown(event)">
          </div>
          <div id="pfDropdown" style="display:none;position:absolute;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:160px;overflow-y:auto;width:280px;margin-top:2px;"></div>
        </div>
        <div><label class="fl">Karar Sesi</label><input class="fi" id="fCN" placeholder="La, Do, Si..."></div>
      </div>
    </div>
    <div class="fr"><label class="fl">Makam <span style="color:var(--text3);font-size:11px;">(değişmez, bilgi amaçlı)</span></label><input class="fi" id="fMK" placeholder="—" readonly style="opacity:.5;cursor:not-allowed;"></div>
    <div class="fr"><label class="fl">Eser Notu</label><input class="fi" id="fIN" placeholder="Sahne notu, tempo..."></div>
    <div class="fa"><button class="bc" onclick="closeWM()">İptal</button><button class="bs" onclick="addWork()">Ekle</button></div>
  </div>
</div>

<script>

const H = {
  get apikey() { return SUPA_KEY; },
  get Authorization() { return 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY); },
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};
async function dbGet(table, qs='') {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs, {headers:H});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPost(table, data) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table, {method:'POST',headers:H,body:JSON.stringify(data)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPatch(table, id, data) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {method:'PATCH',headers:H,body:JSON.stringify(data)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbDel(table, id) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {method:'DELETE',headers:H});
  if (!r.ok) throw new Error(await r.text());
  return true;
}
async function dbDelWhere(table, col, val) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?'+col+'=eq.'+val, {method:'DELETE',headers:H});
  if (!r.ok) throw new Error(await r.text());
  return true;
}


let WL = {};
let WLIST = [];

async function loadWorksData() {
  try {
    const r = await fetch(SUPA_URL+'/rest/v1/works?order=name&limit=2000', {
      headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY}
    });
    const rows = await r.json();
    rows.forEach(w => {
      const id = String(w.id);
      WL[id] = { name: w.name||'', composer: w.composer||'', makam: w.makam||'', instrument: w.instrument||'', closingNote: w.closing_note||'', lyrics: w.lyrics||'' };
      WLIST.push({ id, name: w.name||'', composer: w.composer||'', makam: w.makam||'' });
    });
    // customWorks patch
    try {
      const customs = JSON.parse(localStorage.getItem('customWorks') || '[]');
      const deleted = JSON.parse(localStorage.getItem('deletedWorks') || '[]');
      deleted.forEach(function(did){ var sid=String(parseInt(did)); delete WL[sid]; for(var j=WLIST.length-1;j>=0;j--){if(WLIST[j].id===sid){WLIST.splice(j,1);break;}} });
      customs.forEach(function(w){ var sid=String(parseInt(w.id)); if(WL[sid]){if(w.name)WL[sid].name=w.name;if(w.lyrics!==undefined)WL[sid].lyrics=w.lyrics;} else WL[sid]={name:w.name||'',lyrics:w.lyrics||'',composer:w.composer||'',makam:w.makam||'',instrument:w.instrument||'',closingNote:w.closingNote||''}; var found=false; for(var k=0;k<WLIST.length;k++){if(WLIST[k].id===sid){if(w.name)WLIST[k].name=w.name;found=true;break;}} if(!found)WLIST.push({id:sid,name:w.name||'',composer:w.composer||'',makam:w.makam||''}); });
    } catch(e) {}
  } catch(e) { console.error('Works yüklenemedi:', e); }
}
let reps=[], selId=null, editId=null, selWId=null, addRepId=null;

function sync(s,t){document.getElementById('dot').className='dot '+s;document.getElementById('sl').textContent=t;}
function toast(m,t='ok'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500);}

let SOLISTLER = []; // sanatçı listesi

async function load(){
  sync('spin','Yükleniyor...');
  try{
    const [r,i,s] = await Promise.all([
      dbGet('repertoires','order=created_at'),
      dbGet('repertoire_items','order=seq'),
      dbGet('solistler','order=name')
    ]);
    SOLISTLER = (s||[]).map(x=>x.name).filter(Boolean);
    reps = r.map(x=>({...x, items:(i||[]).filter(t=>t.repertoire_id===x.id).sort((a,b)=>a.seq-b.seq).map(t=>({...t,workId:String(t.work_id),closingNote:t.closing_note||'',performer:t.performer||''}))}));
    sync('ok','Senkronize');
    renderList();
    if(selId) renderDetail();
    else if(reps.length){selId=reps[0].id;renderList();renderDetail();}
  }catch(e){sync('err','Bağlantı hatası');toast(e.message,'er');}
}

function renderList(){
  const el=document.getElementById('list');
  if(!reps.length){el.innerHTML='<div style="padding:30px 16px;text-align:center;color:var(--text3);">Henüz repertuvar yok</div>';return;}
  const sl={concept:'Taslak',confirmed:'Onaylandı',archive:'Arşiv'};
  const sc={concept:'sc',confirmed:'sf',archive:'sa'};
  el.innerHTML=reps.map(r=>`<div class="ri${selId===r.id?' active':''}" onclick="sel('${r.id}')">
    <div class="rn">${r.name}</div>
    <div class="rm"><span class="sp ${sc[r.status]||'sc'}">${sl[r.status]||'Taslak'}</span>${r.date?'<span>'+r.date+'</span>':''}<span>${(r.items||[]).length} eser</span></div>
  </div>`).join('');
}

function sel(id){selId=id;renderList();renderDetail();}
function getRep(id){return reps.find(r=>r.id===id);}

function renderDetail(){
  const rep=getRep(selId);
  document.getElementById('es').style.display=rep?'none':'flex';
  const dc=document.getElementById('dc');

  const rows=items.length?items.map((it,idx)=>{
    const w=WL[it.workId]||{};

    return `<tr>
      <td class="sq"><input class="si" type="number" min="1" max="${items.length}" value="${it.seq}" onchange="chSeq('${rep.id}',${idx},this.value)" onclick="event.stopPropagation()"></td>

      <td><div class="ra">
        <button class="br" onclick="mv('${rep.id}',${idx},-1)" ${idx===0?'disabled':''}>↑</button>
        <button class="br" onclick="mv('${rep.id}',${idx},1)" ${idx===items.length-1?'disabled':''}>↓</button>
        <button class="br be" onclick="openItemEdit('${rep.id}','${it.id}')">✏️</button>
        <button class="br dl" onclick="rmItem('${rep.id}','${it.id}')">Sil</button>
      </div></td>
    </tr>`;
  }).join(''):`<tr><td colspan="5" class="ei">Henüz eser eklenmedi.</td></tr>`;

  dc.innerHTML=`
    <div class="dh">
      <div class="dht">
        <div><div class="did">#${rep.id.slice(0,8).toUpperCase()}</div><div class="dn">${rep.name}</div></div>
        <div class="da">
          <a href="stage.html" class="bi bstage" onclick="localStorage.setItem('stageRepId','${rep.id}')">🎭 Sahneye Çık</a>
          <button class="bi" onclick="openEdit('${rep.id}')">✏️ Düzenle</button>
          <button class="bi" onclick="printR('${rep.id}')">🖨️ Yazdır</button>
          <button class="bi bd" onclick="delRep('${rep.id}')">Sil</button>
        </div>
      </div>
      <div class="dmr">
        <div class="mc"><span class="sp ${sc[rep.status]||'sc'}">${sl[rep.status]||'Taslak'}</span></div>

        ${rep.venue?`<div class="mc">📍 <strong>${rep.venue}</strong></div>`:''}

    <div class="is">
      <div class="ih"><h3>${items.length} Eser</h3><button class="baw" onclick="openWM('${rep.id}')">+ Eser Ekle</button></div>

function openNew(){editId=null;document.getElementById('rmt').textContent='Yeni Repertuvar';['fN','fD','fV','fNo'].forEach(x=>document.getElementById(x).value='');document.getElementById('fS').value='concept';document.getElementById('rm').style.display='flex';setTimeout(()=>document.getElementById('fN').focus(),50);}
function openEdit(id){const r=getRep(id);if(!r)return;editId=id;document.getElementById('rmt').textContent='Düzenle';document.getElementById('fN').value=r.name;document.getElementById('fD').value=r.date||'';document.getElementById('fV').value=r.venue||'';document.getElementById('fS').value=r.status||'concept';document.getElementById('fNo').value=r.notes||'';document.getElementById('rm').style.display='flex';}
function closeRM(){document.getElementById('rm').style.display='none';}

async function saveRep(){
  const name=document.getElementById('fN').value.trim();
  if(!name){document.getElementById('fN').focus();return;}
  const data={name,date:document.getElementById('fD').value||null,venue:document.getElementById('fV').value.trim()||null,status:document.getElementById('fS').value,notes:document.getElementById('fNo').value.trim()||null,user_id:getUserId()||undefined};
  sync('spin','Kaydediliyor...');
  try{
    if(editId){await dbPatch('repertoires',editId,data);}
    else{const r=await dbPost('repertoires',data);selId=r[0]?.id||r.id;}
    closeRM();toast('Kaydedildi ✓');await load();
  }catch(e){sync('err','Hata');toast(e.message,'er');}
}

async function delRep(id){
  if(!confirm('Bu repertuvarı silmek istiyor musunuz?'))return;
  try{await dbDel('repertoires',id);if(selId===id)selId=null;toast('Silindi');await load();}catch(e){toast(e.message,'er');}
}

function openWM(repId){addRepId=repId;selWId=null;document.getElementById('ws').value='';document.getElementById('fCN').value='';document.getElementById('fIN').value='';filterW();document.getElementById('wm').style.display='flex';setTimeout(()=>document.getElementById('ws').focus(),50);}

// ── İCRACILAR TAG UI ──
let pfSelected = []; // seçili sanatçılar

function pfRender() {
  const container = document.getElementById('pfTags');
  const input = document.getElementById('pfInput');
  // Remove old tags
  container.querySelectorAll('.pf-tag').forEach(el => el.remove());
  // Insert tags before input
  pfSelected.forEach(name => {
    const tag = document.createElement('span');
    tag.className = 'pf-tag';
    tag.innerHTML = name + '<button type="button" onclick="pfRemove(\''+name+'\')">×</button>';
    container.insertBefore(tag, input);
  });
}

function pfAdd(name) {
  name = name.trim();
  if (!name || pfSelected.includes(name)) return;
  pfSelected.push(name);
  pfRender();
  document.getElementById('pfInput').value = '';
  pfHideDropdown();
}

function pfRemove(name) {
  pfSelected = pfSelected.filter(n => n !== name);
  pfRender();
}

function pfKeydown(e) {
  const val = e.target.value.trim();
  if ((e.key === 'Enter' || e.key === ',') && val) {
    e.preventDefault();
    pfAdd(val);
  } else if (e.key === 'Backspace' && !val && pfSelected.length) {
    pfRemove(pfSelected[pfSelected.length - 1]);
  }
}

function pfSuggest(q) {
  const dd = document.getElementById('pfDropdown');
  if (!q) { pfHideDropdown(); return; }
  const matches = SOLISTLER.filter(n => n.toLowerCase().includes(q.toLowerCase()) && !pfSelected.includes(n));
  if (!matches.length) { pfHideDropdown(); return; }
  dd.innerHTML = matches.slice(0,8).map(n =>
    '<div class="pf-dd-item" onmousedown="event.preventDefault();pfAdd(\''+n+'\')">' + n + '</div>'
  ).join('');
  dd.style.display = 'block';
}

function pfHideDropdown() {
  document.getElementById('pfDropdown').style.display = 'none';
}

function pfReset() {
  pfSelected = [];
  pfRender();
  const inp = document.getElementById('pfInput');
  if (inp) inp.value = '';
  pfHideDropdown();
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('#pfTags') && !e.target.closest('#pfDropdown')) pfHideDropdown();
});
function closeWM(){
  document.getElementById('wm').style.display='none';
  selWId=null; addRepId=null;
  ['fCN','fIN','fMK','ws'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  pfReset();
  var box=document.getElementById('wInfoBox');if(box)box.style.display='none';
}
function filterW(){
  const q=document.getElementById('ws').value.toLowerCase().trim();
  const list=q?WLIST.filter(w=>(w.name+w.composer+w.makam).toLowerCase().includes(q)):WLIST;
  document.getElementById('wpl').innerHTML=list.slice(0,80).map(w=>`<div class="wpi${selWId===w.id?' sel':''}" onclick="pickW('${w.id}')"><div class="wpn">${w.name}</div><div class="wps">${[w.composer,w.makam].filter(Boolean).join(' · ')}</div></div>`).join('')||'<div style="padding:16px;text-align:center;color:var(--text3);">Bulunamadı</div>';
}
function pickW(id){
  selWId=id;
  const w=WL[id];
  if(!w) return filterW();
  // Kapanış notasını doldur (boşsa)
  if(w.closingNote && !document.getElementById('fCN').value)
    document.getElementById('fCN').value = w.closingNote;
  // Makamı doldur (readonly)
  document.getElementById('fMK').value = w.makam || '—';
  // Eser bilgi kutusunu göster
  const box = document.getElementById('wInfoBox');
  document.getElementById('wInfoMakam').textContent = w.makam ? '🎵 ' + w.makam : '';
  document.getElementById('wInfoInstr').textContent = w.instrument ? '🎸 ' + w.instrument : '';
  document.getElementById('wInfoComp').textContent = w.composer ? '✍️ ' + w.composer : '';
  box.style.display = (w.makam||w.instrument||w.composer) ? 'block' : 'none';
  filterW();
}

async function addWork(){
  if(!selWId){alert('Lütfen bir eser seçin.');return;}
  const rep=getRep(addRepId);if(!rep)return;
  const items=rep.items||[];
  const nextSeq=items.length?Math.max(...items.map(i=>i.seq))+1:1;
  sync('spin','Ekleniyor...');
  try{
    await dbPost('repertoire_items',{repertoire_id:addRepId,work_id:selWId,seq:nextSeq,closing_note:document.getElementById('fCN').value.trim()||null,note:document.getElementById('fIN').value.trim()||null,performer:pfSelected.length?pfSelected.join(', '):null});
    closeWM();toast('Eser eklendi ✓');await load();
  }catch(e){toast(e.message,'er');}
}

async function rmItem(repId,itemId){
  try{await dbDel('repertoire_items',itemId);toast('Silindi');await load();}catch(e){toast(e.message,'er');}
}

async function mv(repId,idx,dir){
  const rep=getRep(repId);if(!rep)return;
  const items=[...rep.items];
  const ni=idx+dir;
  if(ni<0||ni>=items.length)return;
  [items[idx],items[ni]]=[items[ni],items[idx]];
  items.forEach((it,i)=>it.seq=i+1);
  sync('spin','...');
  try{
    await Promise.all(items.map(it=>dbPatch('repertoire_items',it.id,{seq:it.seq})));
    await load();
  }catch(e){toast(e.message,'er');}
}

async function chSeq(repId,idx,val){
  const rep=getRep(repId);if(!rep)return;
  const items=[...rep.items];
  const ns=parseInt(val);
  if(isNaN(ns)||ns<1||ns>items.length){renderDetail();return;}
  const [moved]=items.splice(idx,1);
  items.splice(ns-1,0,moved);
  items.forEach((it,i)=>it.seq=i+1);
  sync('spin','...');
  try{
    await Promise.all(items.map(it=>dbPatch('repertoire_items',it.id,{seq:it.seq})));
    await load();
  }catch(e){toast(e.message,'er');}
}

function printR(repId){
  const rep=getRep(repId);if(!rep)return;
  const items=rep.items||[];
  const sl={concept:'Taslak',confirmed:'Onaylandı',archive:'Arşiv'};
  const rows=items.map(it=>{const w=WL[String(it.workId)]||{};const cn=it.closingNote||w.closingNote||'';return`<tr><td style="width:40px;color:#888;text-align:center;">${it.seq}</td><td style="padding:9px 12px;"><div style="font-weight:500;color:#111;">${w.name||it.workId}</div><div style="font-size:11px;color:#666;">${[w.composer,w.makam].filter(Boolean).join(' · ')}</div></td><td style="width:80px;text-align:center;color:#444;">${cn}</td><td style="width:120px;font-size:12px;color:#666;">${it.note||''}</td></tr>`;}).join('');
  const win=window.open('','_blank','width=800,height=900');
  win.document.write(`<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>${rep.name}</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'DM Sans',sans-serif;font-size:14px;color:#111;padding:32px 40px;}h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;margin-bottom:8px;}hr{border:none;border-top:2px solid #111;margin:16px 0;}table{width:100%;border-collapse:collapse;}th{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#888;text-align:left;padding:6px 12px;border-bottom:1px solid #ddd;}td{padding:9px 12px;border-bottom:1px solid #eee;vertical-align:middle;}</style></head><body><div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;margin-bottom:24px;">Repertuvar — ${new Date().toLocaleDateString('tr-TR')}</div><h1>${rep.name}</h1><div style="display:flex;gap:16px;font-size:12px;color:#666;margin-bottom:16px;">${rep.date?'📅 '+rep.date:''}${rep.venue?' 📍 '+rep.venue:''}${rep.status?' ● '+sl[rep.status]:''} 🎼 ${items.length} eser</div><hr><table><thead><tr><th>#</th><th>Eser Adı</th><th>Kapanış</th><th>Not</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=function(){setTimeout(function(){window.print();},400);}<\/script>


</body></html>`);
  win.document.close();
}

document.getElementById('rm').addEventListener('click',e=>{if(e.target.id==='rm')closeRM();});
document.getElementById('wm').addEventListener('click',e=>{if(e.target.id==='wm')closeWM();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRM();closeWM();}});

// customWorks patch
(function(){
  try {
    var customs = JSON.parse(localStorage.getItem('customWorks') || '[]');
    var deleted = JSON.parse(localStorage.getItem('deletedWorks') || '[]');
    var i, sid;
    for(i=0;i<deleted.length;i++){
      sid = String(parseInt(deleted[i]));
      for(var j=WLIST.length-1;j>=0;j--){ if(WLIST[j].id===sid){WLIST.splice(j,1);break;} }
      delete WL[sid];
    }
    for(i=0;i<customs.length;i++){
      var w = customs[i];
      sid = String(parseInt(w.id));
      var found = false;
      for(var k=0;k<WLIST.length;k++){
        if(WLIST[k].id===sid){
          if(w.name) WLIST[k].name = w.name;
          if(w.composer) WLIST[k].composer = w.composer;
          if(w.makam) WLIST[k].makam = w.makam;
          found = true; break;
        }
      }
      if(!found) WLIST.push({id:sid, name:w.name||'', composer:w.composer||'', makam:w.makam||''});
      if(WL[sid]){
        if(w.name) WL[sid].name = w.name;
        if(w.lyrics !== undefined) WL[sid].lyrics = w.lyrics;
        if(w.composer) WL[sid].composer = w.composer;
      } else {
        WL[sid] = {name:w.name||'',lyrics:w.lyrics||'',composer:w.composer||'',makam:w.makam||'',instrument:w.instrument||'',closingNote:w.closingNote||''};
      }
    }
  } catch(e){ console.warn('patch err',e); }
})();

async function dbPatch(table, id, data) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {
    method: 'PATCH',
    headers: {...H, 'Prefer': 'return=minimal'},
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
}
let iemRepId=null,iemItemId=null,iemPfSelected=[];
function openItemEdit(repId,itemId){
  iemRepId=repId;iemItemId=itemId;
  const rep=getRep(repId);if(!rep)return;
  const it=(rep.items||[]).find(x=>x.id===itemId);if(!it)return;
  const w=WL[it.workId]||{};
  const el=function(id){return document.getElementById(id);};
  if(el('iemWorkName')) el('iemWorkName').textContent=w.name||'#'+it.workId;
  if(el('iemWorkInfo')) el('iemWorkInfo').textContent=[w.makam,w.composer].filter(Boolean).join(' · ');
  if(el('iemMK')) el('iemMK').value=w.makam||'—';
  if(el('iemCN')) el('iemCN').value=it.closingNote||w.closingNote||'';
  if(el('iemNote')) el('iemNote').value=it.note||'';
  iemPfSelected=it.performer?it.performer.split(', ').filter(Boolean):[];
  iemPfRender();
  if(el('iem')) el('iem').style.display='flex';
  else console.error('Modal #iem not found in DOM');
}
function closeIEM(){
  document.getElementById('iem').style.display='none';
  iemRepId=null;iemItemId=null;iemPfSelected=[];iemPfRender();
  const inp=document.getElementById('iemPfInput');if(inp)inp.value='';
}
async function saveIEM(){
  try{
    const data={
      closing_note:document.getElementById('iemCN').value.trim()||null,
      note:document.getElementById('iemNote').value.trim()||null,
      performer:iemPfSelected.length?iemPfSelected.join(', '):null
    };
    await dbPatch('repertoire_items',iemItemId,data);
    closeIEM();toast('Kaydedildi ✓');await load();
  }catch(e){toast(e.message,'er');}
}
function iemPfRender(){
  const c=document.getElementById('iemPfTags');if(!c)return;
  const inp=document.getElementById('iemPfInput');
  c.querySelectorAll('.pf-tag').forEach(el=>el.remove());
  iemPfSelected.forEach(name=>{
    const t=document.createElement('span');t.className='pf-tag';
    t.innerHTML=name+'<button type="button" onclick="iemPfRemove(\''+name+'\')">×</button>';
    c.insertBefore(t,inp);
  });
}
function iemPfAdd(name){
  name=name.trim();if(!name||iemPfSelected.includes(name))return;
  iemPfSelected.push(name);iemPfRender();
  document.getElementById('iemPfInput').value='';
  document.getElementById('iemPfDropdown').style.display='none';
}
function iemPfRemove(name){iemPfSelected=iemPfSelected.filter(n=>n!==name);iemPfRender();}
function iemPfKeydown(e){
  const val=e.target.value.trim();
  if((e.key==='Enter'||e.key===',')&&val){e.preventDefault();iemPfAdd(val);}
  else if(e.key==='Backspace'&&!val&&iemPfSelected.length)iemPfRemove(iemPfSelected[iemPfSelected.length-1]);
}
function iemPfSuggest(q){
  const dd=document.getElementById('iemPfDropdown');
  if(!q){dd.style.display='none';return;}
  const m=SOLISTLER.filter(n=>n.toLowerCase().includes(q.toLowerCase())&&!iemPfSelected.includes(n));
  if(!m.length){dd.style.display='none';return;}
  dd.innerHTML=m.slice(0,8).map(n=>'<div class="pf-dd-item" onmousedown="event.preventDefault();iemPfAdd(\''+n+'\')">'+n+'</div>').join('');
  dd.style.display='block';
}
document.addEventListener('click',function(e){
  if(!e.target.closest('#iemPfTags')&&!e.target.closest('#iemPfDropdown')){
    const dd=document.getElementById('iemPfDropdown');if(dd)dd.style.display='none';
  }
});

(async function() {

  renderUserBadge('userBadge');

})();

        <div style="grid-column:1/-1;">
          <label class="fl">İcracı Sanatçılar</label>
          <div id="pfTags" style="display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;align-items:center;cursor:text;" onclick="document.getElementById('pfInput').focus()">
            <!-- sanatçı tag'leri buraya gelecek -->
            <input id="pfInput" placeholder="Sanatçı ekle..." autocomplete="off"
              style="border:none;background:none;color:var(--text);font-size:13px;outline:none;min-width:140px;flex:1;"
              oninput="pfSuggest(this.value)" onkeydown="pfKeydown(event)">
          </div>
          <div id="pfDropdown" style="display:none;position:absolute;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:160px;overflow-y:auto;width:280px;margin-top:2px;"></div>
        </div>
        <div><label class="fl">Karar Sesi</label><input class="fi" id="fCN" placeholder="La, Do, Si..."></div>
      </div>
    </div>
    <div class="fr"><label class="fl">Makam <span style="color:var(--text3);font-size:11px;">(değişmez, bilgi amaçlı)</span></label><input class="fi" id="fMK" placeholder="—" readonly style="opacity:.5;cursor:not-allowed;"></div>
    <div class="fr"><label class="fl">Eser Notu</label><input class="fi" id="fIN" placeholder="Sahne notu, tempo..."></div>
    <div class="fa"><button class="bc" onclick="closeWM()">İptal</button><button class="bs" onclick="addWork()">Ekle</button></div>
  </div>
</div>



<!-- ESER DÜZENLE MODAL -->
<div id="iem" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;" onclick="if(event.target===this)closeIEM()">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:min(480px,92vw);max-height:85vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="font-size:15px;font-weight:600;color:var(--text);">✏️ Eseri Düzenle</h2>
      <button onclick="closeIEM()" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;">✕</button>
    </div>
    <!-- Eser adı (readonly bilgi) -->
    <div id="iemWorkName" style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;"></div>
    <div id="iemWorkInfo" style="font-size:12px;color:var(--text3);margin-bottom:16px;"></div>
    <!-- İcracılar -->
    <div style="margin-bottom:14px;">
      <label class="fl">İcracı Sanatçılar</label>
      <div id="iemPfTags" style="display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;align-items:center;cursor:text;margin-top:4px;" onclick="document.getElementById('iemPfInput').focus()">
        <input id="iemPfInput" placeholder="Sanatçı ekle..." autocomplete="off"
          style="border:none;background:none;color:var(--text);font-size:13px;outline:none;min-width:140px;flex:1;"
          oninput="iemPfSuggest(this.value)" onkeydown="iemPfKeydown(event)">
      </div>
      <div id="iemPfDropdown" style="display:none;position:absolute;z-index:400;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:160px;overflow-y:auto;width:280px;margin-top:2px;"></div>
    </div>
    <!-- Karar Sesi -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div><label class="fl">Karar Sesi</label><input class="fi" id="iemCN" placeholder="La, Do, Si..." style="margin-top:4px;"></div>
      <div><label class="fl">Makam <span style="color:var(--text3);font-size:11px;">(bilgi)</span></label><input class="fi" id="iemMK" placeholder="—" readonly style="margin-top:4px;opacity:.5;cursor:not-allowed;"></div>
    </div>
    <!-- Not -->
    <div style="margin-bottom:20px;"><label class="fl">Sahne Notu</label><input class="fi" id="iemNote" placeholder="Tempo, not..." style="margin-top:4px;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeIEM()" style="padding:8px 18px;border-radius:8px;background:none;border:1px solid var(--border);color:var(--text2);font-size:13px;cursor:pointer;">İptal</button>
      <button onclick="saveIEM()" style="padding:8px 18px;border-radius:8px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Kaydet</button>
    </div>
  </div>
</div>
</body>
</html>
