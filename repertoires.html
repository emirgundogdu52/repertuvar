<html lang="tr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="rep.sayfaBaslik">Repertuvar</title>
<style>
:root{--bg:#07071a;--surface:#0f0f2e;--surface2:#13132e;--border:rgba(140,120,255,0.38);--border2:rgba(140,120,255,0.58);--accent:#7c6fff;--accent2:#a78bfa;--accent3:#c4b5fd;--text:#e2e0ff;--text2:#9d9bc4;--text3:#5e5c8a;--red:#f87171;--green:#4ade80;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;font-size:14px;}
.nb{padding:5px 14px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;cursor:pointer;background:none;transition:all .15s;text-decoration:none;display:inline-block;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;}
.nb:hover{background:var(--surface2);color:var(--text);}
.nb.active{background:rgba(201,150,58,.12);border-color:rgba(201,150,58,.3);color:var(--accent);}
.nb.stage{background:rgba(201,150,58,.18);border-color:rgba(201,150,58,.5);color:var(--accent);font-weight:500;}
.sync{margin-left:auto;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;}
.dot.ok{background:var(--green);}.dot.err{background:var(--red);}.dot.spin{background:var(--accent);animation:pu .8s ease infinite;}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:flex;height:calc(100vh - 66px - env(safe-area-inset-top));height:calc(100dvh - 66px - env(safe-area-inset-top));}
@media(max-width:1023px){.layout{height:calc(100vh - 66px - env(safe-area-inset-top) - 68px - env(safe-area-inset-bottom));height:calc(100dvh - 66px - env(safe-area-inset-top) - 68px - env(safe-area-inset-bottom));}}
.lp{width:300px;min-width:300px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.lph{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.lph h2{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;}
.bn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:6px;padding:5px 12px;color:#1a1000;font-size:12px;font-weight:500;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;cursor:pointer;}
.bn:hover{background:var(--accent2);}
.ls{overflow-y:auto;overflow-x:hidden;flex:1;padding:10px 10px 4px;}
.ls::-webkit-scrollbar{width:4px;}.ls::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.ri-wrap{position:relative;overflow:hidden;border-radius:10px;margin-bottom:8px;}
.ri-wrap .ri{margin-bottom:0;position:relative;z-index:2;touch-action:pan-y;}
.ri-edit-bg{position:absolute;top:0;left:0;bottom:0;width:84px;background:var(--accent2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;z-index:1;cursor:pointer;}
.ri-delete-bg{position:absolute;top:0;right:0;bottom:0;width:84px;background:#FF5A5F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;z-index:1;cursor:pointer;}
.ri-hide-bg{background:#4A90D9;}
.ri-delete-bg i,.ri-edit-bg i{font-size:18px;}
/* Swipe sırasında mavi→kırmızı gradient çerçeve — parmak ne kadar kayarsa o kadar belirginleşir */
.ri-wrap::before {
  content:''; position:absolute; inset:0; border-radius:10px; padding:2.5px;
  background:linear-gradient(90deg,#4DA3FF,#FF5A5F);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:var(--swipe-glow,0); pointer-events:none; z-index:3;
}

.ri{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .15s,transform .15s;display:flex;align-items:center;justify-content:space-between;gap:10px;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none;}
.ri:hover{border-color:var(--border2);background:var(--surface2);}
.ri.active{border-color:var(--accent);}
.ri:active{transform:scale(.98);border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,200,61,.35),0 4px 18px rgba(255,200,61,.18);}
.rn{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px;}
.rm{font-size:11px;color:var(--text3);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rc{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;}
.sp{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:500;}
.sc{background:#3d3a1a;color:#c8b050;}.sf{background:#1a2d1a;color:#6ab87a;}.sa{background:#1a1a2d;color:#7a8ab8;}
.dp{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.dp::-webkit-scrollbar{width:5px;}.dp::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text3);gap:12px;}
.dh{padding:8px 14px 0;border-bottom:1px solid var(--border);background:var(--surface);}
.dht{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:16px;}
.did{font-size:11px;color:var(--text3);margin-bottom:4px;}
.dn{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;font-size:18px;font-weight:700;color:var(--text);}
.da{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.da-wrap{position:relative;}
.da-fade{position:absolute;top:0;right:0;bottom:0;width:26px;pointer-events:none;background:linear-gradient(to right,transparent,var(--surface) 75%);border-radius:0 6px 6px 0;display:none;}
@media (max-width:1023px){.da-fade{display:block;}}
.bi{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text2);font-size:12px;cursor:pointer;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;transition:all .15s;text-decoration:none;display:inline-block;}
.bi:hover{border-color:var(--border2);color:var(--text);}
.bd{border-color:rgba(192,84,68,.3);color:var(--red);}
.bd:hover{background:rgba(192,84,68,.1);border-color:var(--red);}
.bstage{background:rgba(201,150,58,.15);border-color:rgba(201,150,58,.4);color:var(--accent);font-weight:500;}
.bstage:hover{background:rgba(201,150,58,.25);}
.dmr{display:flex;gap:20px;padding-bottom:14px;flex-wrap:wrap;}
.mc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.mc strong{color:var(--text);}
.is{padding:4px 14px;flex:1;}
.ih{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ih h3{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;}
.baw{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;color:var(--text2);font-size:12px;cursor:pointer;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;transition:all .15s;}
.baw:hover{border-color:var(--accent);color:var(--accent);}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);vertical-align:middle;}
tr:nth-child(even) td{background:var(--surface);}tr.zebra-tr td{background:var(--surface);}tr:hover td{background:rgba(124,111,255,0.1);}tr.drag-over td{background:rgba(124,111,255,0.15);border-top:2px solid var(--accent);}
.sq{width:28px;}
.col-kapanis{width:80px;}
.col-not{width:60px;}
@media(max-width:768px){.col-kapanis,.col-not{display:none;} .sq{width:24px;}}
.si{width:44px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 6px;color:var(--accent);font-size:13px;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;font-weight:500;text-align:center;outline:none;cursor:pointer;transition:border-color .15s;-moz-appearance:textfield;}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none;}
.si:focus{border-color:var(--accent);}
.wn{color:var(--text);font-weight:500;}
.ws{font-size:11px;color:var(--text3);margin-top:2px;}
.cn{display:inline-block;background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--text2);}
/* (2026-08-09) SATIR DÜĞMELERİ ARTIK HEP GÖRÜNÜR.
   Eskiden `opacity:0` idi ve yalnızca satırın üstüne gelince beliriyordu.
   Sorunları: (a) dokunmatik cihazda "hover" yok, düğmeleri bulmak için
   deneme yanılma gerekiyordu; (b) Emir "aramak zorunda kalıyorum" dedi;
   (c) geliştirici araçları açıkken imleç yakalanınca düğmeler hiç
   görünmüyordu; (d) beliren düğmelere nişan alırken imleç kayıp YANLIŞ
   SATIRIN düğmesine basma riski vardı — potpuri karışıklıklarının bir
   kısmı bundan olabilir.
   Şimdi: her zaman görünür ama SOLUK; satırın üstüne gelince tam belirginlik. */
.ra{display:flex;gap:4px;opacity:.45;transition:opacity .15s;}
tr:hover .ra{opacity:1;}
tr.item-active .ra{opacity:1;}
@media (hover:none){ .ra{opacity:.8;} }   /* dokunmatikte daha okunur */
.br{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 7px;font-size:11px;color:var(--text3);cursor:pointer;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;transition:all .12s;}
.br.active{border-color:var(--accent);color:var(--accent);}
.br:hover{color:var(--text);border-color:var(--border2);}
.br.dl:hover{color:var(--red);border-color:var(--red);}
.br:disabled{opacity:.25;cursor:not-allowed;}
/* ── POTPURİ (2026-07-19) — zincir satırları ───────────────────────────────
   linked_prev ile birbirine bağlanan ARDIŞIK satırlar tek blok gibi görünür. */
.br.bl{filter:grayscale(1);opacity:.55;}
.br.bl:hover:not(:disabled){filter:none;opacity:1;border-color:var(--accent);}
.br.bl.linked{filter:none;opacity:1;border-color:var(--accent);background:rgba(124,111,255,.14);}
tr.medley-row td:first-child{position:relative;}
tr.medley-row td:first-child::before{
  content:'';position:absolute;left:3px;width:3px;background:var(--accent);border-radius:2px;
  top:0;bottom:0;
}
tr.medley-head td:first-child::before{top:50%;border-radius:2px 2px 0 0;}
tr.medley-end  td:first-child::before{bottom:50%;border-radius:0 0 2px 2px;}
tr.medley-row{background:rgba(124,111,255,.05);}
.medley-chip{font-size:11px;opacity:.85;}
/* Potpuri içeren repertuvar rozeti — liste kartı + detay başlığı */
/* ── Paylaş penceresi (2026-07-19) ── */
#shareOverlay{display:none;position:fixed;inset:0;z-index:1250;background:rgba(0,0,0,.62);align-items:center;justify-content:center;padding:16px;}
.share-box{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:440px;padding:0 0 12px;box-shadow:0 18px 50px rgba(0,0,0,.55);}
.share-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;}
.share-name{padding:12px 14px 4px;font-size:13px;color:var(--text);font-weight:600;}
.share-link{margin:6px 14px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:11.5px;color:var(--accent3);word-break:break-all;user-select:all;}
.share-note{padding:2px 14px 10px;font-size:11px;color:var(--text3);line-height:1.5;}
.share-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 14px;}

/* ── Sıralama önizleme ekranı (2026-07-19) ── */
#sortOverlay{display:none;position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.62);align-items:center;justify-content:center;padding:16px;}
.sort-box{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);}
.sort-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;}
.sort-x{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px 6px;}
.sort-modes{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.sort-mode{flex:1;min-width:90px;padding:7px 8px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.sort-mode.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.sort-body{overflow-y:auto;padding:8px 14px;flex:1;}
.sort-row{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.sort-row.chained{background:rgba(124,111,255,.07);}
.sort-no{color:var(--text3);font-size:11px;min-width:18px;}
.sort-name{flex:1;font-size:13px;color:var(--text);}
.sort-mk{font-size:11px;color:var(--text3);white-space:nowrap;}
.sort-tr{font-size:10.5px;padding:3px 0 3px 26px;letter-spacing:.02em;}
.sort-tr.ok{color:var(--green);}
.sort-tr.mid{color:var(--text3);}
.sort-tr.bad{color:var(--red);}
.sort-tr.na{color:var(--text3);opacity:.7;}
.sort-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);}
.sort-score{flex:1;font-size:11px;color:var(--text3);}
.rep-medley{display:inline-flex;align-items:center;gap:3px;background:rgba(124,111,255,.16);border:1px solid var(--accent);color:var(--accent3);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;line-height:1.6;white-space:nowrap;}

/* ═══ Detay başlığı: 2 seviyeli düzen (CTA satırı + meta satırı) ═══ */
.cta-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bstage-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1400;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;flex:1;box-shadow:0 4px 14px rgba(255,200,61,.22);transition:transform .15s,box-shadow .15s;}
.bstage-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,200,61,.32);color:#1a1400;}
.ov-menu{position:relative;flex-shrink:0;}
.ov-menu summary{list-style:none;}
.ov-menu summary::-webkit-details-marker{display:none;}
.ov-menu[open] summary{border-color:var(--border2);color:var(--text);}
.ov-menu-body{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:150px;box-shadow:0 10px 28px rgba(0,0,0,.4);z-index:50;display:flex;flex-direction:column;gap:2px;}
.ov-menu-body button{background:none;border:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;width:100%;}
.ov-menu-body button:hover{background:rgba(255,255,255,.06);color:var(--text);}
.ov-menu-body button.ov-danger{color:var(--red);}
.ov-menu-body button.ov-danger:hover{background:rgba(192,84,68,.12);}
.chip-vis{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;}
.chip-vis.pub{background:rgba(52,211,153,.12);color:#34d399;border-color:rgba(52,211,153,.3);}
.chip-vis.pub:hover{background:rgba(52,211,153,.2);}
.chip-vis.grp{background:rgba(124,111,255,.12);color:#7c6fff;border-color:rgba(124,111,255,.3);}
.chip-vis.grp:hover{background:rgba(124,111,255,.2);}
.chip-vis.priv{background:var(--surface2);color:var(--text3);border-color:var(--border);}
.chip-vis.priv:hover{border-color:var(--border2);color:var(--text2);}
@media(max-width:1023px){.bstage-primary{font-size:12px;padding:9px 14px;}}

/* ═══ Sürükle tutamağı: daha belirgin ═══ */
.drag-handle{color:var(--text3);font-size:22px;line-height:1;padding:8px 6px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .12s,color .12s;}
.drag-handle:hover,.drag-handle:active{background:rgba(255,200,61,.14);color:var(--accent);}

/* ═══ Aktif eser satırı (sahne modunda çalınan) ═══ */
tr.item-active td{background:rgba(255,200,61,.09) !important;}
tr.item-active{box-shadow:inset 3px 0 0 var(--accent);}
.play-indicator{color:var(--accent);font-weight:700;}

.ei{padding:40px 0;text-align:center;color:var(--text3);font-size:13px;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;}
.md{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:92vw;max-height:85vh;overflow-y:auto;}
.md h2{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;font-size:18px;margin-bottom:18px;color:var(--text);}
.fr{margin-bottom:14px;}
.fl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:block;}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--text);font-size:14px;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--accent);}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.bc{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 18px;color:var(--text2);font-size:13px;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;cursor:pointer;}
.bs{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:7px;padding:8px 18px;color:#1a1000;font-size:13px;font-weight:500;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;cursor:pointer;}
.bs:hover{background:var(--accent2);}
.wpl{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:7px;}
.wpl::-webkit-scrollbar{width:4px;}.wpl::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.wpi{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
.wpi:last-child{border-bottom:none;}
.wpi:hover{background:var(--surface2);}
.wpi.sel{background:rgba(124,111,255,0.18);border-left:3px solid var(--accent);color:var(--text);}
.wpn{font-size:13px;color:var(--text);}
.wps{font-size:11px;color:var(--text3);margin-top:1px;}
/* (2026-08-23) Toast alt menunun (68px + safe-area) UZERINE cikiyor; eskiden 24px idi ve butonlarin uzerine binip dokunuslari engelliyordu. Masaustunde alt menu gizli, 24px e donuyor. */
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom, 0px));right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text2);z-index:999;animation:ti .2s ease;}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.er{border-color:var(--red);color:var(--red);}
@media (min-width: 1024px) { .toast { bottom: 24px; } }
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .pf-tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px 3px 10px; border-radius: 20px;
    background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.35);
    color: var(--accent); font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .pf-tag button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 14px; padding: 0; line-height: 1; opacity: .7;
  }
  .pf-tag button:hover { opacity: 1; }
  .pf-dd-item {
    padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--text);
  }
  .pf-dd-item:hover { background: var(--surface2); }

  .be { color: #60a5fa !important; }
  .be:hover { border-color: #60a5fa !important; color: #93c5fd !important; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .nb { font-size:11px; padding:4px 8px; white-space:nowrap; }
    .layout { flex-direction:column; height:calc(100vh - 56px - 68px); }
    .lp { width:100%; min-width:unset; flex:1; height:100%; max-height:none; border-right:none; border-bottom:none; display:flex; flex-direction:column; overflow:hidden; }
    .lph { flex-shrink:0; }
    .ls { flex:1; overflow-y:scroll; -webkit-overflow-scrolling:touch; min-height:0; }
    .dp { display:none; }
    .dp.mobile-open { display:flex !important; flex-direction:column; min-height:0; -webkit-overflow-scrolling:touch; }
    .dp.mobile-open #dc { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
    .lp.mobile-hidden { display:none !important; }
    .mobile-back-btn { display:flex; align-items:center; gap:8px; padding:12px 16px; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; border-bottom:1px solid var(--border); background:var(--surface); }
    .dc { padding:16px; }
    .dh { padding:14px 16px; }
    .dn { font-size:18px; }
    .da { flex-wrap:nowrap; overflow-x:auto; gap:4px; }
    .bi { font-size:11px; padding:5px 10px; }
    table { font-size:12px; }
    .ra { gap:3px; }
    .br { padding:3px 7px; font-size:11px; }
    .wm > div { padding:16px; }
    .wpl { max-height:160px; }
  }
  @media (max-width: 480px) {
    .nb[href="artiesten.html"], .nb[href="eserler.html"] { display:none; }
    .nb[href="index.html"] img { height:28px !important; }
    .layout { min-height:calc(100vh - 52px); }
    /* .lp max-height removed — fixMobileHeight() handles this dynamically */
    .dmr { flex-direction:column; gap:6px; }
    .dt { font-size:11px; }
    .da { flex-wrap:nowrap; overflow-x:auto; gap:4px; }
    .bi { font-size:11px; padding:5px 8px; }
    /* Modals on small screen */
    #wm > div { width:92vw !important; max-height:85vh !important; overflow-y:auto; }
    #rm > div { width:92vw !important; }
  }

  /* ── MOBILE GLOBAL ── */
  @media (max-width: 768px) {
    body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button:not(.r-theme-toggle), a:not(.r-theme-toggle) { min-height: 36px; }
    input, select, textarea { font-size: 16px !important; } /* prevent iOS zoom */
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .sb { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }


  @media (max-width: 600px) {
    #wm > div, #iem > div, #rm > div {
      width: 96vw !important;
      max-height: 88vh !important;
      overflow-y: auto;
      padding: 16px !important;
    }
    .wpl { max-height: 140px !important; }
    #iemCN, #iemMK { font-size: 16px; }
    div[style*="grid-template-columns:1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
  }


  .bshare { color: #34d399 !important; border-color: rgba(52,211,153,.3) !important; }
  .bshare:hover { background: rgba(52,211,153,.1) !important; border-color: rgba(52,211,153,.6) !important; }
  
  /* Share modal */
  .share-modal { display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;
    align-items:center;justify-content:center; }
  .share-modal.open { display:flex; }
  .share-box { background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:28px;width:min(440px,92vw); }
  .share-title { font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px; }
  .share-desc { font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6; }
  .share-link-box { display:flex;gap:8px;align-items:center;
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px; }
  .share-link-box span { font-size:12px;color:var(--text2);flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:monospace; }
  .copy-btn { padding:5px 12px;border-radius:6px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1a1000;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit; }
  .share-note { font-size:11px;color:var(--text3);margin-top:10px;line-height:1.5; }
  .share-close { float:right;background:none;border:none;color:var(--text2);
    font-size:20px;cursor:pointer;line-height:1; }

  /* Görünürlük seçici — Kişisel / Grup / Genel */
  .vis-opt { display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 12px;
    border-radius:8px;border:1px solid var(--border);background:var(--surface2);
    transition:all .15s; }
  .vis-opt span { font-size:13px;color:var(--text2); }
  .vis-opt:has(input:checked) {
    border-color: var(--accent);
    background: rgba(124,111,255,0.1);
  }
  .vis-opt:has(input:checked) span {
    color: var(--text);
  }


  .sb-user-x { position:relative; }
  .sb-user-dropdown { display:none; position:fixed; bottom:90px; left:10px; right:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:4px; z-index:9999; box-shadow:0 -4px 20px rgba(0,0,0,.5); }
  .sb-user-dropdown.open { display:block; }
  .sb-dd-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:7px;
    font-size:12px; font-weight:600; color:var(--text2); text-decoration:none; cursor:pointer;
    transition:all .15s; background:none; border:none; width:100%; font-family:inherit; }
  .sb-dd-item:hover { background:rgba(124,111,255,0.12); color:var(--text); }
  .sb-dd-item.danger { color:var(--red); }
  .sb-dd-item.danger:hover { background:rgba(248,113,113,0.1); }

</style>
<script src="i18n.js"></script>
<script src="auth.js"></script>
<script src="qrcode.min.js"></script>
<script src="topnav.js" defer></script>
<link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/fonts/tabler-icons.woff2?v3.44.0" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link rel="manifest" href="manifest.json">
  <script src="db.js"></script>
</head>
<body>
<div id="r-topnav-container"></div>

<div class="main-wrap">
<div class="layout">
  <aside class="lp">
    <div class="lph"><h2 data-i18n="rep.mevcut">Mevcut Repertuvarlar</h2><button class="bn" onclick="openNew()" title="+ Yeni Repertuvar Oluştur" data-i18n-title="rep.yeniRepT" data-i18n="rep.yeni">+ Yeni</button></div>
    <div style="padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;">
      <input type="text" id="repSearchInput" placeholder="Repertuvar veya eser adı ara..." data-i18n-ph="rep.ph_ara" oninput="onRepSearchInput(this.value)"
        style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border-color .15s;"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
    </div>
    <div class="ls" id="list"></div>
  </aside>
  <div class="dp" id="dp">
    <div class="es" id="es">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
      <p data-i18n="rep.sec">Bir repertuvar seçin</p>
    </div>
    <div id="dc" style="display:none;"></div>
  </div>
</div>

<!-- Modal: Rep -->
<div class="mo" id="rm" style="display:none;">
  <div class="md">
    <h2 id="rmt" data-i18n="rep.yenirep">Yeni Repertuvar</h2>
    <div class="fr"><label class="fl"><span data-i18n="rep.ad">Repertuvar Adı</span> *</label><input class="fi" id="fN" placeholder="örn. THM Eserleri Do Akort" data-i18n-ph="rep.ph_ad"></div>
    <div class="fr"><label class="fl" data-i18n="rep.tarih">Tarih</label><input class="fi" id="fD" type="date"></div>
    <div class="fr"><label class="fl" data-i18n="rep.lokasyon">Lokasyon</label><input class="fi" id="fV" placeholder="Sahne adı veya şehir" data-i18n-ph="rep.ph_yer"></div>
    <div class="fr"><label class="fl" data-i18n="rep.durum">Durum</label>
      <select class="fi" id="fS" style="appearance:none;cursor:pointer;">
        <option value="concept" data-i18n="rep.taslak">Taslak</option>
        <option value="confirmed" data-i18n="rep.onaylandi">Onaylandı</option>
        <option value="archive" data-i18n="rep.arsiv">Arşiv</option>
      </select>
    </div>
    <div class="fr"><label class="fl" data-i18n="rep.notlar">Notlar</label><textarea class="fi" id="fNo" rows="3"></textarea></div>
    <div class="fr">
      <label class="fl" data-i18n="rep.gorunurluk">Görünürlük</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:2px;">
        <label class="vis-opt" id="visPrivateLabel">
          <input type="radio" name="fVisibility" id="fVisPrivate" value="private" checked style="accent-color:var(--accent);width:15px;height:15px;">
          <span>🔒 <strong data-i18n="rep.kisisel">Kişisel</strong> <span data-i18n="rep.kisisel_alt">— Sadece sen</span></span>
        </label>
        <label class="vis-opt" id="visGroupLabel">
          <input type="radio" name="fVisibility" id="fVisGroup" value="group" style="accent-color:var(--accent);width:15px;height:15px;">
          <span>👥 <strong data-i18n="rep.grup">Grup</strong> <span data-i18n="rep.grup_alt">— Grubunun üyeleri</span></span>
        </label>
        <label class="vis-opt" id="visPublicLabel">
          <input type="radio" name="fVisibility" id="fVisPublic" value="public" style="accent-color:var(--accent);width:15px;height:15px;">
          <span>🌐 <strong data-i18n="rep.genel">Genel</strong> <span data-i18n="rep.genel_alt">— Herkes görebilir</span></span>
        </label>
      </div>
    </div>
    <div class="fa"><button class="bc" onclick="closeRM()" data-i18n="ortak.iptal">İptal</button><button class="bs" onclick="saveRep()" data-i18n="ortak.kaydet">Kaydet</button></div>
  </div>
</div>

<!-- Modal: Work -->
<div class="mo" id="wm" style="display:none;">
  <div class="md">
    <h2 data-i18n="rep.eserekle">Eser Ekle</h2>
    <div class="fr"><input class="fi" id="ws" placeholder="Eser adı veya besteci ara..." data-i18n-ph="rep.ph_eserara" oninput="filterW()" autocomplete="off"></div>
    <div id="wDupWarn" style="display:none;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.4);color:#ef4444;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;font-weight:600;" data-i18n="rep.zatenvar">Bu eser zaten bu repertuvarda mevcut</div>
    <div class="wpl" id="wpl"></div>
    <!-- Eser bilgileri (seçince otomatik dolar) -->
    <div id="wInfoBox" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:13px;">
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <span id="wInfoMakam" style="color:var(--text2);"></span>
        <span id="wInfoInstr" style="color:var(--text2);"></span>
        <span id="wInfoComp" style="color:var(--text3);"></span>
      </div>
    </div>
    <div class="fr" style="margin-top:14px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;">
        <div style="grid-column:1/-1;">
          <label class="fl" data-i18n="rep.icracilar">İcracı Sanatçılar</label>
          <div id="pfTags" style="display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;align-items:center;cursor:text;" onclick="document.getElementById('pfInput').focus()">
            <!-- sanatçı tag'leri buraya gelecek -->
            <input id="pfInput" placeholder="Sanatçı ekle..." data-i18n-ph="rep.ph_sanatci" autocomplete="off"
              style="border:none;background:none;color:var(--text);font-size:13px;outline:none;min-width:140px;flex:1;"
              oninput="pfSuggest(this.value)" onkeydown="pfKeydown(event)">
          </div>
          <div id="pfDropdown" style="display:none;position:absolute;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:160px;overflow-y:auto;width:280px;margin-top:2px;"></div>
        </div>
        <div><label class="fl" data-i18n="rep.karar">Karar Sesi</label><input class="fi" id="fCN" placeholder="La, Do, Si..." data-i18n-ph="rep.ph_karar"></div>
      </div>
    </div>
    <div class="fr"><label class="fl"><span data-i18n="rep.makam">Makam</span> <span style="color:var(--text3);font-size:11px;" data-i18n="rep.degismez_bilgi">(değişmez, bilgi amaçlı)</span></label><input class="fi" id="fMK" placeholder="—" readonly style="opacity:.5;cursor:not-allowed;"></div>
    <div class="fr"><label class="fl" data-i18n="rep.esernotu">Eser Notu</label><input class="fi" id="fIN" placeholder="Sahne notu, tempo..." data-i18n-ph="rep.ph_not"></div>
    <div class="fa"><button class="bc" onclick="closeWM()" data-i18n="ortak.iptal">İptal</button><button class="bs" onclick="addWork()" data-i18n="rep.ekle">Ekle</button></div>
  </div>
</div>

<!-- (2026-08-06) SATIR DÜZENLEME MODALI GERİ EKLENDİ.
     Kalem düğmesi hiçbir şey yapmıyordu: `openItemEdit()` verileri hazırlayıp
     `#iem`i açmaya çalışıyor, bulamayınca konsola "Modal #iem not found in DOM"
     yazıp sessizce çıkıyordu (konsolda 37 kez görüldü). Modal bir noktada
     sayfadan düşmüş; CSS'i (:286 #iemCN/#iemMK) hâlâ duruyordu.
     Alan adları repertoires.js'teki openItemEdit/saveIEM ile birebir aynı. -->
<div class="mo" id="iem" style="display:none;">
  <div class="md">
    <h2 style="margin-bottom:2px;" data-i18n="rep.eserduzenle">Eseri Düzenle</h2>
    <div id="iemWorkName" style="font-size:15px;font-weight:700;color:var(--text);margin-top:6px;"></div>
    <div id="iemWorkInfo" style="font-size:12px;color:var(--text3);margin-top:2px;"></div>

    <div class="fr" style="margin-top:14px;">
      <div style="grid-column:1/-1;width:100%;">
        <label class="fl" data-i18n="rep.icracilar">İcracı Sanatçılar</label>
        <div id="iemPfTags" style="display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;align-items:center;cursor:text;" onclick="document.getElementById('iemPfInput').focus()">
          <input id="iemPfInput" placeholder="Sanatçı ekle..." data-i18n-ph="rep.ph_sanatci" autocomplete="off"
            style="border:none;background:none;color:var(--text);font-size:13px;outline:none;min-width:140px;flex:1;"
            oninput="iemPfSuggest(this.value)" onkeydown="iemPfKeydown(event)">
        </div>
        <div id="iemPfDropdown" style="display:none;position:absolute;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:160px;overflow-y:auto;width:280px;margin-top:2px;"></div>
      </div>
    </div>

    <div class="fr">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;">
        <div><label class="fl" data-i18n="rep.karar">Karar Sesi</label><input class="fi" id="iemCN" placeholder="La, Do, Si..." data-i18n-ph="rep.ph_karar"></div>
        <div><label class="fl"><span data-i18n="rep.makam">Makam</span> <span style="color:var(--text3);font-size:11px;" data-i18n="rep.degismez">(değişmez)</span></label><input class="fi" id="iemMK" placeholder="—" readonly style="opacity:.5;cursor:not-allowed;"></div>
      </div>
    </div>

    <div class="fr"><label class="fl" data-i18n="rep.esernotu">Eser Notu</label><input class="fi" id="iemNote" placeholder="Sahne notu, tempo..." data-i18n-ph="rep.ph_not"></div>

    <!-- (2026-08-06) Eserin KENDİ bilgileri (söz, akor, nota, besteci…) burada
         TEKRARLANMIYOR. Aynı alanların iki ayrı formda durması ikisinin
         zamanla ayrışmasına yol açar. Bunun yerine Eserler sayfasındaki
         hazır eser formu açılıyor ve kaydedince buraya geri dönülüyor. -->
    <div class="fr">
      <button type="button" onclick="iemOpenWorkEditor()" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;">
        <i class="ti ti-edit" style="font-size:15px;" aria-hidden="true"></i> <span data-i18n="rep.eserbilgi">Eser bilgilerini düzenle (söz, akor, nota…)</span>
      </button>
      <div style="font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5;" data-i18n="rep.alanAciklama">Eserin kendi bilgileri her repertuvarda aynıdır. Yukarıdaki alanlar ise yalnızca bu repertuvara özeldir.</div>
    </div>

    <div class="fa"><button class="bc" onclick="closeIEM()" data-i18n="ortak.iptal">İptal</button><button class="bs" onclick="saveIEM()" data-i18n="ortak.kaydet">Kaydet</button></div>
  </div>
</div>

<script src="repertoires.js"></script>

</div><!-- /main-wrap -->
<div id="sortOverlay"></div>
</body>
</html>
