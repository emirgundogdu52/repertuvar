<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuvar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--surface:#0f0f1a;--surface2:#161625;--surface3:#2a2a3e;--border:#2a2a3e;--border2:#38383f;--accent:#a855f7;--accent2:#c084fc;--text:#f1f0ff;--text2:#8b8aa8;--text3:#3d3d58;--red:#c05444;--green:#4a9462;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:48px;display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:200;}
.nb{padding:5px 14px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;cursor:pointer;background:none;transition:all .15s;text-decoration:none;display:inline-block;font-family:'DM Sans',sans-serif;}
.nb:hover{background:var(--surface2);color:var(--text);}
.nb.active{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3);color:var(--accent);}
.nb.stage{background:rgba(168,85,247,.18);border-color:rgba(168,85,247,.5);color:var(--accent);font-weight:500;}
.sync{margin-left:auto;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;}
.dot.ok{background:var(--green);}.dot.err{background:var(--red);}.dot.spin{background:var(--accent);animation:pu .8s ease infinite;}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:flex;height:calc(100vh - 48px);}
.lp{width:300px;min-width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.lph{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.lph h2{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;}
.bn{background:var(--accent);border:none;border-radius:6px;padding:5px 12px;color:#0a0818;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;}
.bn:hover{background:var(--accent2);}
.ls{overflow-y:auto;flex:1;}
.ls::-webkit-scrollbar{width:4px;}.ls::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.ri{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.ri:hover{background:var(--surface2);}
.ri.active{background:var(--surface2);border-left:3px solid var(--accent);padding-left:13px;}
.rn{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;}
.rm{font-size:11px;color:var(--text3);display:flex;gap:8px;}
.sp{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:500;}
.sc{background:#3d3a1a;color:#c8b050;}.sf{background:#1a2d1a;color:#6ab87a;}.sa{background:#1a1a2d;color:#7a8ab8;}
.dp{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.dp::-webkit-scrollbar{width:5px;}.dp::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text3);gap:12px;}
.dh{padding:20px 24px 0;border-bottom:1px solid var(--border);background:var(--surface);}
.dht{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:16px;}
.did{font-size:11px;color:var(--text3);margin-bottom:4px;}
.dn{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);}
.da{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.bi{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-decoration:none;display:inline-block;}
.bi:hover{border-color:var(--border2);color:var(--text);}
.bd{border-color:rgba(192,84,68,.3);color:var(--red);}
.bd:hover{background:rgba(192,84,68,.1);border-color:var(--red);}
.bstage{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);color:var(--accent);font-weight:500;}
.bstage:hover{background:rgba(168,85,247,.25);}
.dmr{display:flex;gap:20px;padding-bottom:14px;flex-wrap:wrap;}
.mc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.mc strong{color:var(--text);}
.is{padding:20px 24px;flex:1;}
.ih{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ih h3{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;}
.baw{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.baw:hover{border-color:var(--accent);color:var(--accent);}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);vertical-align:middle;}
tr:hover td{background:var(--surface2);}
.sq{width:52px;}
.si{width:44px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 6px;color:var(--accent);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;text-align:center;outline:none;cursor:pointer;transition:border-color .15s;-moz-appearance:textfield;}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none;}
.si:focus{border-color:var(--accent);}
.wn{color:var(--text);font-weight:500;}
.ws{font-size:11px;color:var(--text3);margin-top:2px;}
.cn{display:inline-block;background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--text2);}
.ra{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
tr:hover .ra{opacity:1;}
.br{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 7px;font-size:11px;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;}
.br:hover{color:var(--text);border-color:var(--border2);}
.br.dl:hover{color:var(--red);border-color:var(--red);}
.br:disabled{opacity:.25;cursor:not-allowed;}
.ei{padding:40px 0;text-align:center;color:var(--text3);font-size:13px;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;}
.md{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:92vw;max-height:85vh;overflow-y:auto;}
.md h2{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:18px;color:var(--text);}
.fr{margin-bottom:14px;}
.fl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:block;}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--accent);}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.bc{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 18px;color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.bs{background:var(--accent);border:none;border-radius:7px;padding:8px 18px;color:#0a0818;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;}
.bs:hover{background:var(--accent2);}
.wpl{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:7px;}
.wpl::-webkit-scrollbar{width:4px;}.wpl::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.wpi{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
.wpi:last-child{border-bottom:none;}
.wpi:hover{background:var(--surface2);}
.wpi.sel{background:rgba(168,85,247,.12);}
.wpn{font-size:13px;color:var(--text);}
.wps{font-size:11px;color:var(--text3);margin-top:1px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text2);z-index:999;animation:ti .2s ease;}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.er{border-color:var(--red);color:var(--red);}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<nav>
  <a href="index.html" class="nb">🏠 Ana Sayfa</a>
  <a href="eserler.html" class="nb">Eserler</a>

<div class="layout">

    <div class="ls" id="list"></div>
  </aside>
  <div class="dp" id="dp">
    <div class="es" id="es">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
      <p>Bir repertuvar seçin</p>
    </div>
    <div id="dc" style="display:none;"></div>
  </div>
</div>

<!-- Modal: Rep -->
<div class="mo" id="rm" style="display:none;">
  <div class="md">
    <h2 id="rmt">Yeni Repertuvar</h2>
    <div class="fr"><label class="fl">Repertuvar Adı *</label><input class="fi" id="fN" placeholder="örn. THM Eserleri Do Akort"></div>
    <div class="fr"><label class="fl">Tarih</label><input class="fi" id="fD" type="date"></div>
    <div class="fr"><label class="fl">Lokasyon</label><input class="fi" id="fV" placeholder="Sahne adı veya şehir"></div>
    <div class="fr"><label class="fl">Durum</label>
      <select class="fi" id="fS" style="appearance:none;cursor:pointer;">
        <option value="concept">Taslak</option>
        <option value="confirmed">Onaylandı</option>
        <option value="archive">Arşiv</option>
      </select>
    </div>
    <div class="fr"><label class="fl">Notlar</label><textarea class="fi" id="fNo" rows="3"></textarea></div>
    <div class="fa"><button class="bc" onclick="closeRM()">İptal</button><button class="bs" onclick="saveRep()">Kaydet</button></div>
  </div>
</div>

<!-- Modal: Work -->
<div class="mo" id="wm" style="display:none;">
  <div class="md">
    <h2>Eser Ekle</h2>
    <div class="fr"><input class="fi" id="ws" placeholder="Eser adı veya besteci ara..." oninput="filterW()" autocomplete="off"></div>
    <div class="wpl" id="wpl"></div>
    <div class="fr" style="margin-top:14px;"><label class="fl">Kapanış Notası</label><input class="fi" id="fCN" placeholder="La, Do, Si..."></div>
    <div class="fr"><label class="fl">Eser Notu</label><input class="fi" id="fIN" placeholder="Sahne notu, tempo..."></div>
    <div class="fa"><button class="bc" onclick="closeWM()">İptal</button><button class="bs" onclick="addWork()">Ekle</button></div>
  </div>
</div>

  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};
async function dbGet(table, qs='') {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs, {headers:H});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPost(table, data) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table, {method:'POST',headers:H,body:JSON.stringify(data)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbPatch(table, id, data) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {method:'PATCH',headers:H,body:JSON.stringify(data)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbDel(table, id) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {method:'DELETE',headers:H});
  if (!r.ok) throw new Error(await r.text());
  return true;
}
async function dbDelWhere(table, col, val) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?'+col+'=eq.'+val, {method:'DELETE',headers:H});

  return true;
}

": "Çarşamba'yı Sel Aldı", "composer": "", "makam": "Hicaz"}, {"id": "347", "name": "Çayir Biçiyom Çayir", "composer": "", "makam": ""}, {"id": "243", "name": "Çifte çıkar martinimin dumanı", "composer": "", "makam": "Muhayyer Kürdi"}, {"id": "87", "name": "Çiğdem Der Ki Ben Alayım", "composer": "", "makam": ""}, {"id": "278", "name": "Çıkmasaydı Şu Kaçkar'ın Dağına", "composer": "Cengiz Dilaver", "makam": "Eviç"}, {"id": "432", "name": "Ömrümüzün Baharı Birlikte Geçsin", "composer": "", "makam": ""}, {"id": "353", "name": "Öyle ağırım ki kendime / Sen benden gittin gideli", "composer": "Mazlum Çimen", "makam": ""}, {"id": "361", "name": "Öyle bir yerdeyim ki", "composer": "", "makam": ""}, {"id": "255", "name": "Üflediler Söndüm", "composer": "", "makam": ""}, {"id": "112", "name": "Ünyeden çıktımda başım selamet", "composer": "Fethi Gençalioğlu", "makam": "Hicaz"}, {"id": "192", "name": "Şafak Türküsü", "composer": "", "makam": ""}, {"id": "415", "name": "ŞEN OLASIN ÜRGÜP DUMANIN GİTMEZ", "composer": "Nida Tüfekçi", "makam": "Muhayyer Kürdi"}, {"id": "78", "name": "Şifa İstemem Balından", "composer": "", "makam": ""}, {"id": "136", "name": "Şiir 1", "composer": "", "makam": ""}, {"id": "137", "name": "Şiir 2", "composer": "", "makam": ""}, {"id": "138", "name": "Şiir 3", "composer": "", "makam": ""}, {"id": "422", "name": "ŞU AKKUŞ'UN GÜRGENLERİ", "composer": "Şener GÖK", "makam": "Çargah"}, {"id": "150", "name": "Şu Dağlar Könürdendir", "composer": "", "makam": ""}, {"id": "84", "name": "Şu Dağların Yükseğine Erseler", "composer": "", "makam": ""}, {"id": "401", "name": "Şu dünyanın gam yükünü", "composer": "", "makam": ""}, {"id": "261", "name": "Şu fani dünyaya geldin gidiyo'n", "composer": "", "makam": ""}, {"id": "210", "name": "Şu kanlı zalimin ettiği işler", "composer": "Hasret Gültekin", "makam": ""}, {"id": "215", "name": "Şu karşıki dağda kar var duman yok", "composer": "", "makam": "Eviç"}, {"id": "402", "name": "ŞU METRİSİN ÖNÜ BİR UZUN ALAN", "composer": "", "makam": ""}, {"id": "209", "name": "Şu yalan dünyaya geldim giderim", "composer": "Lütfü Gültekin", "makam": ""}, {"id": "212", "name": "Şu Yüce Dağların Karı Eridi", "composer": "", "makam": "Eviç"}];

let reps=[], selId=null, editId=null, selWId=null, addRepId=null;

function sync(s,t){document.getElementById('dot').className='dot '+s;document.getElementById('sl').textContent=t;}
function toast(m,t='ok'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500);}

async function load(){
  sync('spin','Yükleniyor...');
  try{
    const [r,i] = await Promise.all([
      dbGet('repertoires','order=created_at'),
      dbGet('repertoire_items','order=seq')
    ]);
    reps = r.map(x=>({...x, items:(i||[]).filter(t=>t.repertoire_id===x.id).sort((a,b)=>a.seq-b.seq).map(t=>({...t,workId:String(t.work_id),closingNote:t.closing_note||''}))}));
    sync('ok','Senkronize');
    renderList();
    if(selId) renderDetail();
    else if(reps.length){selId=reps[0].id;renderList();renderDetail();}
  }catch(e){sync('err','Bağlantı hatası');toast(e.message,'er');}
}

function renderList(){
  const el=document.getElementById('list');
  if(!reps.length){el.innerHTML='<div style="padding:30px 16px;text-align:center;color:var(--text3);">Henüz repertuvar yok</div>';return;}
  const sl={concept:'Taslak',confirmed:'Onaylandı',archive:'Arşiv'};
  const sc={concept:'sc',confirmed:'sf',archive:'sa'};
  el.innerHTML=reps.map(r=>`<div class="ri${selId===r.id?' active':''}" onclick="sel('${r.id}')">
    <div class="rn">${r.name}</div>
    <div class="rm"><span class="sp ${sc[r.status]||'sc'}">${sl[r.status]||'Taslak'}</span>${r.date?'<span>'+r.date+'</span>':''}<span>${(r.items||[]).length} eser</span></div>
  </div>`).join('');
}

function sel(id){selId=id;renderList();renderDetail();}
function getRep(id){return reps.find(r=>r.id===id);}

function renderDetail(){
  const rep=getRep(selId);
  document.getElementById('es').style.display=rep?'none':'flex';
  const dc=document.getElementById('dc');
  dc.style.display=rep?'block':'none';
  if(!rep)return;
  const sl={concept:'Taslak',confirmed:'Onaylandı',archive:'Arşiv'};
  const sc={concept:'sc',confirmed:'sf',archive:'sa'};
  const items=rep.items||[];
  const rows=items.length?items.map((it,idx)=>{
    const w=WL[it.workId]||{};
    const cn=it.closingNote||w.closingNote||'';
    return `<tr>
      <td class="sq"><input class="si" type="number" min="1" max="${items.length}" value="${it.seq}" onchange="chSeq('${rep.id}',${idx},this.value)" onclick="event.stopPropagation()"></td>
      <td><div class="wn">${w.name||'#'+it.workId}</div><div class="ws">${[w.makam,w.composer].filter(Boolean).join(' · ')}</div></td>
      <td>${cn?'<span class="cn">'+cn+'</span>':''}</td>
      <td style="color:var(--text3);font-size:12px;">${it.note||''}</td>
      <td><div class="ra">
        <button class="br" onclick="mv('${rep.id}',${idx},-1)" ${idx===0?'disabled':''}>↑</button>
        <button class="br" onclick="mv('${rep.id}',${idx},1)" ${idx===items.length-1?'disabled':''}>↓</button>
        <button class="br dl" onclick="rmItem('${rep.id}','${it.id}')">Sil</button>
      </div></td>
    </tr>`;
  }).join(''):`<tr><td colspan="5" class="ei">Henüz eser eklenmedi.</td></tr>`;

  dc.innerHTML=`
    <div class="dh">
      <div class="dht">
        <div><div class="did">#${rep.id.slice(0,8).toUpperCase()}</div><div class="dn">${rep.name}</div></div>
        <div class="da">
          <a href="stage.html" class="bi bstage" onclick="localStorage.setItem('stageRepId','${rep.id}')">🎭 Sahneye Çık</a>
          <button class="bi" onclick="openEdit('${rep.id}')">✏️ Düzenle</button>
          <button class="bi" onclick="printR('${rep.id}')">🖨️ Yazdır</button>
          <button class="bi bd" onclick="delRep('${rep.id}')">Sil</button>
        </div>
      </div>
      <div class="dmr">
        <div class="mc"><span class="sp ${sc[rep.status]||'sc'}">${sl[rep.status]||'Taslak'}</span></div>
        ${rep.date?`<div class="mc">📅 <strong>${rep.date}</strong></div>`:''}
        ${rep.venue?`<div class="mc">📍 <strong>${rep.venue}</strong></div>`:''}
        ${rep.notes?`<div class="mc" style="color:var(--text3)">📝 ${rep.notes}</div>`:''}
      </div>
    </div>
    <div class="is">
      <div class="ih"><h3>${items.length} Eser</h3><button class="baw" onclick="openWM('${rep.id}')">+ Eser Ekle</button></div>
      <table><thead><tr><th>#</th><th>Eser Adı</th><th>Kapanış</th><th>Not</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

function openNew(){editId=null;document.getElementById('rmt').textContent='Yeni Repertuvar';['fN','fD','fV','fNo'].forEach(x=>document.getElementById(x).value='');document.getElementById('fS').value='concept';document.getElementById('rm').style.display='flex';setTimeout(()=>document.getElementById('fN').focus(),50);}
function openEdit(id){const r=getRep(id);if(!r)return;editId=id;document.getElementById('rmt').textContent='Düzenle';document.getElementById('fN').value=r.name;document.getElementById('fD').value=r.date||'';document.getElementById('fV').value=r.venue||'';document.getElementById('fS').value=r.status||'concept';document.getElementById('fNo').value=r.notes||'';document.getElementById('rm').style.display='flex';}
function closeRM(){document.getElementById('rm').style.display='none';}

async function saveRep(){
  const name=document.getElementById('fN').value.trim();
  if(!name){document.getElementById('fN').focus();return;}
  const data={name,date:document.getElementById('fD').value||null,venue:document.getElementById('fV').value.trim()||null,status:document.getElementById('fS').value,notes:document.getElementById('fNo').value.trim()||null};
  sync('spin','Kaydediliyor...');
  try{
    if(editId){await dbPatch('repertoires',editId,data);}
    else{const r=await dbPost('repertoires',data);selId=r[0]?.id||r.id;}
    closeRM();toast('Kaydedildi ✓');await load();
  }catch(e){sync('err','Hata');toast(e.message,'er');}
}

async function delRep(id){
  if(!confirm('Bu repertuvarı silmek istiyor musunuz?'))return;
  try{await dbDel('repertoires',id);if(selId===id)selId=null;toast('Silindi');await load();}catch(e){toast(e.message,'er');}
}

function openWM(repId){addRepId=repId;selWId=null;document.getElementById('ws').value='';document.getElementById('fCN').value='';document.getElementById('fIN').value='';filterW();document.getElementById('wm').style.display='flex';setTimeout(()=>document.getElementById('ws').focus(),50);}
function closeWM(){document.getElementById('wm').style.display='none';}
function filterW(){
  const q=document.getElementById('ws').value.toLowerCase().trim();
  const list=q?WLIST.filter(w=>(w.name+w.composer+w.makam).toLowerCase().includes(q)):WLIST;
  document.getElementById('wpl').innerHTML=list.slice(0,80).map(w=>`<div class="wpi${selWId===w.id?' sel':''}" onclick="pickW('${w.id}')"><div class="wpn">${w.name}</div><div class="wps">${[w.composer,w.makam].filter(Boolean).join(' · ')}</div></div>`).join('')||'<div style="padding:16px;text-align:center;color:var(--text3);">Bulunamadı</div>';
}
function pickW(id){selWId=id;const w=WL[id];if(w&&w.closingNote&&!document.getElementById('fCN').value)document.getElementById('fCN').value=w.closingNote;filterW();}

async function addWork(){
  if(!selWId){alert('Lütfen bir eser seçin.');return;}
  const rep=getRep(addRepId);if(!rep)return;
  const items=rep.items||[];
  const nextSeq=items.length?Math.max(...items.map(i=>i.seq))+1:1;
  sync('spin','Ekleniyor...');
  try{
    await dbPost('repertoire_items',{repertoire_id:addRepId,work_id:selWId,seq:nextSeq,closing_note:document.getElementById('fCN').value.trim()||null,note:document.getElementById('fIN').value.trim()||null});
    closeWM();toast('Eser eklendi ✓');await load();
  }catch(e){toast(e.message,'er');}
}

async function rmItem(repId,itemId){
  try{await dbDel('repertoire_items',itemId);toast('Silindi');await load();}catch(e){toast(e.message,'er');}
}

async function mv(repId,idx,dir){
  const rep=getRep(repId);if(!rep)return;
  const items=[...rep.items];
  const ni=idx+dir;
  if(ni<0||ni>=items.length)return;
  [items[idx],items[ni]]=[items[ni],items[idx]];
  items.forEach((it,i)=>it.seq=i+1);
  sync('spin','...');
  try{
    await Promise.all(items.map(it=>dbPatch('repertoire_items',it.id,{seq:it.seq})));
    await load();
  }catch(e){toast(e.message,'er');}
}

async function chSeq(repId,idx,val){
  const rep=getRep(repId);if(!rep)return;
  const items=[...rep.items];
  const ns=parseInt(val);
  if(isNaN(ns)||ns<1||ns>items.length){renderDetail();return;}
  const [moved]=items.splice(idx,1);
  items.splice(ns-1,0,moved);
  items.forEach((it,i)=>it.seq=i+1);
  sync('spin','...');
  try{
    await Promise.all(items.map(it=>dbPatch('repertoire_items',it.id,{seq:it.seq})));
    await load();
  }catch(e){toast(e.message,'er');}
}

function printR(repId){
  const rep=getRep(repId);if(!rep)return;
  const items=rep.items||[];
  const sl={concept:'Taslak',confirmed:'Onaylandı',archive:'Arşiv'};
  const rows=items.map(it=>{const w=WL[String(it.workId)]||{};const cn=it.closingNote||w.closingNote||'';return`<tr><td style="width:40px;color:#888;text-align:center;">${it.seq}</td><td style="padding:9px 12px;"><div style="font-weight:500;color:#111;">${w.name||it.workId}</div><div style="font-size:11px;color:#666;">${[w.composer,w.makam].filter(Boolean).join(' · ')}</div></td><td style="width:80px;text-align:center;color:#444;">${cn}</td><td style="width:120px;font-size:12px;color:#666;">${it.note||''}</td></tr>`;}).join('');
  const win=window.open('','_blank','width=800,height=900');
  win.document.write(`<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>${rep.name}</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'DM Sans',sans-serif;font-size:14px;color:#111;padding:32px 40px;}h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;margin-bottom:8px;}hr{border:none;border-top:2px solid #111;margin:16px 0;}table{width:100%;border-collapse:collapse;}th{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#888;text-align:left;padding:6px 12px;border-bottom:1px solid #ddd;}td{padding:9px 12px;border-bottom:1px solid #eee;vertical-align:middle;}</style></head><body><div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;margin-bottom:24px;">Repertuvar — ${new Date().toLocaleDateString('tr-TR')}</div><h1>${rep.name}</h1><div style="display:flex;gap:16px;font-size:12px;color:#666;margin-bottom:16px;">${rep.date?'📅 '+rep.date:''}${rep.venue?' 📍 '+rep.venue:''}${rep.status?' ● '+sl[rep.status]:''} 🎼 ${items.length} eser</div><hr><table><thead><tr><th>#</th><th>Eser Adı</th><th>Kapanış</th><th>Not</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=function(){setTimeout(function(){window.print();},400);}<\/script></body></html>`);
  win.document.close();
}

document.getElementById('rm').addEventListener('click',e=>{if(e.target.id==='rm')closeRM();});
document.getElementById('wm').addEventListener('click',e=>{if(e.target.id==='wm')closeWM();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRM();closeWM();}});

load();
</script>
</body>
