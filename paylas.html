<!-- paylas.html — 2026-08-01
     Misafir solistin gördüğü SALT OKUNUR repertuvar sayfası.
     - Giriş YOK: sunucudaki get_shared_repertoire(token) RPC'si anon anahtarla çağrılır,
       token/iptal/süre kontrolünü sunucu yapar.
     - ÖNBELLEK YOK: bilerek localStorage/IndexedDB/service worker kullanılmıyor.
       Süre dolunca misafirin cihazında temizlenecek bir kopya kalmasın diye.
     - AKOR YOK: RPC zaten chords döndürmüyor.
     - Yazdır düğmesi var: sahnede internet kötüyse misafir kâğıda alsın. -->

<style>
  :root{ --bg:#0F1629; --surface:#19233F; --surface2:#1F2A4A; --border:rgba(140,120,255,.22);
         --text:#fff; --text2:#9d9bc4; --text3:#5e5c8a; --accent:#FFC83D; --accent2:#4DA3FF; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:var(--font-ui, -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif);
       padding:16px 14px 48px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:720px;margin:0 auto;}
  .brand{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.4px;margin-bottom:14px;}
  h1{font-size:21px;margin:0 0 6px;line-height:1.25;}
  .meta{font-size:12.5px;color:var(--text2);margin-bottom:4px;}
  .expires{font-size:11.5px;color:var(--text3);margin:10px 0 18px;}
  .note{background:var(--surface2);border:1px solid var(--border);border-radius:9px;
        padding:10px 12px;font-size:12.5px;color:var(--text2);margin:0 0 18px;}
  ol{list-style:none;counter-reset:s;margin:0;padding:0;}
  li{counter-increment:s;background:var(--surface);border:1px solid var(--border);
     border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;gap:11px;}
  li::before{content:counter(s);color:var(--text3);font-size:12px;font-weight:700;
             min-width:20px;padding-top:2px;}
  .linked::before{content:'↳';color:var(--accent2);}
  .nm{font-size:14.5px;font-weight:600;line-height:1.3;}
  .sub{font-size:11.5px;color:var(--text2);margin-top:3px;}
  .perf{font-size:11.5px;color:var(--accent2);margin-top:3px;}
  .cl{font-size:11.5px;color:var(--accent);margin-top:3px;}
  .ly{margin-top:8px;font-size:12.5px;color:var(--text2);white-space:pre-wrap;line-height:1.5;}
  .msg{text-align:center;padding:56px 16px;color:var(--text2);font-size:14px;}
  .msg b{display:block;color:var(--text);font-size:17px;margin-bottom:8px;}
  .cta{display:block;margin:26px auto 0;max-width:280px;text-align:center;
       background:var(--yt-btn,var(--accent));color:#1a1a1a;font-weight:700;font-size:13.5px;
       padding:11px 16px;border-radius:9px;text-decoration:none;}
  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);
       font:inherit;font-size:12.5px;padding:8px 14px;border-radius:8px;cursor:pointer;}
  @media print{
    body{background:#fff;color:#000;padding:0;}
    li{background:#fff;border:1px solid #ccc;}
    .nm,.msg b{color:#000;} .sub,.ly,.meta,.note{color:#333;}
    .btn,.cta,.expires,.brand{display:none;}
  }
</style>

const T = METIN[DIL];
document.documentElement.lang = DIL;
document.documentElement.dir = DIL === 'ar' ? 'rtl' : 'ltr';
document.title = T.repertuvar;
(function(){ const y = document.querySelector('#root .msg'); if (y) y.textContent = T.yukleniyor; })();

function expired(){
  document.getElementById('root').innerHTML =
    '<div class="msg"><b>' + T.suresiDoldu + '</b>' + T.suresiDolduMetin + '</div>' +
    '<a class="cta" href="https://repertuvar.app">' + T.kesfet + '</a>';
}

function render(d){
  const items = d.items || [];
  const rows = items.map(it => {
    const sub = [it.makam ? T.makam + it.makam : '', it.composer].filter(Boolean).join(' · ');
    return '<li class="' + (it.linked_prev ? 'linked' : '') + '"><div>' +
      '<div class="nm">' + esc(it.name || T.eser) + '</div>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
      (it.performer ? '<div class="perf">🎤 ' + esc(it.performer) + '</div>' : '') +
      (it.closing_note ? '<div class="cl">' + esc(T.karar + it.closing_note) + '</div>' : '') +
      (it.note ? '<div class="sub">' + esc(it.note) + '</div>' : '') +
      (it.lyrics ? '<div class="ly">' + esc(it.lyrics) + '</div>' : '') +
      '</div></li>';
  }).join('');

  const meta = [d.date, d.venue].filter(Boolean).map(esc).join(' · ');
  const bitis = new Date(d.expires_at).toLocaleString(DIL === 'tr' ? 'tr-TR' : (navigator.language || 'en-GB'));
  document.getElementById('root').innerHTML =
    '<div class="brand">repertuvar.app</div>' +
    '<h1>' + esc(d.name || T.repertuvar) + '</h1>' +
    (meta ? '<div class="meta">' + meta + '</div>' : '') +
    (d.notes ? '<div class="note">' + esc(d.notes) + '</div>' : '') +
    '<div class="expires">' + T.gecerlilik.replace('{t}', esc(bitis)) + T.internet + '</div>' +
    '<button class="btn" onclick="window.print()">' + T.yazdir + '</button>' +
    '<ol style="margin-top:16px;">' + rows + '</ol>' +
    '<a class="cta" href="https://repertuvar.app">' + T.olustur + '</a>' +
    // (2026-10-17) Apple Guideline 1.2: oturumsuz misafir için bildirme yolu (uygulamadaki Bildir'e erişemez)
    '<div class="expires" style="margin-top:14px;">' + T.bildir +
      '<a href="mailto:info@repertuvar.app?subject=' + encodeURIComponent('Repertuvar bildirim: ' + (d.name || '')) + '">info@repertuvar.app</a></div>';
}

(async function(){
  const token = new URLSearchParams(location.search).get('t');
  if(!token){ expired(); return; }
  try{
    const r = await fetch(SUPA_URL + '/rest/v1/rpc/get_shared_repertoire', {
      method:'POST',
      headers:{ apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if(!r.ok) throw new Error(await r.text());
    const d = await r.json();
    if(!d || d.ok !== true){ expired(); return; }
    render(d);
  }catch(e){
    document.getElementById('root').innerHTML =
      '<div class="msg"><b>' + T.acilamadi + '</b>' + T.kontrol + '</div>';
  }
})();
</script>
