<!DOCTYPE html>
<!-- DESIGN-TEST-ALT-F-FINAL -->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuvar — Giriş</title>
<link rel="icon" href="Repertuvar_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@500;900&display=swap" rel="stylesheet">
<style>
body { overflow: hidden; }
#splash-overlay {
  position:fixed;inset:0;z-index:9999;
  background:#ffffff;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.8s ease;
}
#splash-overlay.fade-out { opacity:0; pointer-events:none; }
.sp-logo-wrap { display:flex;flex-direction:column;align-items:center; }
.sp-logo-row  { display:flex;align-items:baseline;line-height:1; }
#sp-rep {
  font-family:'Inter',sans-serif;font-weight:900;
  font-size:clamp(36px,8vw,68px);color:#1A1733;
  letter-spacing:-2px;opacity:0;transform:translateX(-80px);
}
#sp-dot {
  font-family:'Inter',sans-serif;font-weight:900;
  font-size:clamp(36px,8vw,68px);color:#1A1733;
  letter-spacing:-2px;opacity:0;transform:translateY(-120px);display:inline-block;
}
#sp-app {
  font-family:'Inter',sans-serif;font-weight:900;
  font-size:clamp(36px,8vw,68px);color:#3522C9;
  letter-spacing:-2px;opacity:0;transform:translateX(80px);
}
.sp-lines { display:flex;margin-top:10px; }
#sp-line-blue {
  height:8px;background:#3522C9;border-radius:4px;
  opacity:0;transform:translateY(24px);
}
#sp-line-dark {
  height:8px;background:#1A1733;border-radius:4px;
  opacity:0;transform:translateY(24px);margin-left:12px;
}
#sp-slogan {
  font-family:'Inter',sans-serif;font-weight:500;
  font-size:clamp(13px,2.5vw,21px);color:#3522C9;
  margin-top:1rem;min-height:2.8em;
  letter-spacing:0.01em;text-align:center;
  line-height:1.6;white-space:pre-line;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0D1117;--surface:#161B22;--surface2:#21262D;
  --border:#30363D;--text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;
  --accent:#58A6FF;--accent2:#BC8CFF;--green:#3FB950;--red:#F85149;
}
body{background:var(--bg);font-family:"Sora",sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:32px;}
.logo-wrap img{height:auto;width:220px;}
.logo-wrap h1{font-size:22px;font-weight:600;letter-spacing:-.01em;}
.logo-wrap p{font-size:13px;color:var(--text2);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:400px;}

.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:8px;padding:4px;margin-bottom:24px;}
.tab{flex:1;padding:8px;border-radius:6px;border:none;background:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--text3);}

.btn-primary{width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:4px;}
.btn-primary:hover{opacity:.85;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}

.btn-google{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s;margin-bottom:20px;}
.btn-google:hover{border-color:var(--text2);}

.divider{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.divider hr{flex:1;border:none;border-top:1px solid var(--border);}
.divider span{font-size:11px;color:var(--text3);}

.forgot{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit;margin-top:12px;display:block;text-align:center;width:100%;}
.forgot:hover{text-decoration:underline;}

.msg{font-size:13px;text-align:center;padding:10px;border-radius:8px;margin-top:12px;display:none;}
.msg.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--red);}
.msg.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);color:var(--green);}
</style>
</head>
<body>

<!-- Splash Overlay -->
<div id="splash-overlay">
  <div class="sp-logo-wrap">
    <div class="sp-logo-row">
      <span id="sp-rep">repertuvar</span><span id="sp-dot">.</span><span id="sp-app">app</span>
    </div>
    <div class="sp-lines">
      <div id="sp-line-blue"></div>
      <div id="sp-line-dark"></div>
    </div>
    <div id="sp-slogan"></div>
  </div>
</div>

<div class="logo-wrap">
  <img src="logo_slogan_dark.png" alt="repertuvar.app">
</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Giriş Yap</button>
    <button class="tab" onclick="switchTab('register')">Kayıt Ol</button>
  </div>

  <!-- Google -->
  <button class="btn-google" onclick="loginGoogle()">
    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Google ile devam et
  </button>

  <div class="divider"><hr><span>veya</span><hr></div>

  <!-- Login form -->
  <div id="loginForm">
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="loginEmail" placeholder="ornek@mail.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()" id="loginBtn">Giriş Yap</button>
    <button class="forgot" onclick="doReset()">Şifremi unuttum</button>
  </div>

  <!-- Register form -->
  <div id="registerForm" style="display:none;">
    <div class="field">
      <label>Ad Soyad *</label>
      <input type="text" id="regName" placeholder="Adınız ve soyadınız" autocomplete="name"
        onkeydown="if(event.key==='Enter') doRegister()">
    </div>
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="regEmail" placeholder="ornek@mail.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="regPass" placeholder="En az 6 karakter" autocomplete="new-password"
        onkeydown="if(event.key==='Enter') doRegister()">
    </div>
    <button class="btn-primary" onclick="doRegister()" id="regBtn">Kayıt Ol</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
const SUPA_URL = 'https://ehytkzxdhjyjuubizdnl.supabase.co';
const SUPA_KEY = 'sb_publishable_f_WsYxzN06B5dGROrkGyPQ_UDxKSbtO';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// Email onay / şifre sıfırlama token'ını yakala
(async () => {
  const hash = window.location.hash;
  if (hash.includes('access_token')) {
    const params = new URLSearchParams(hash.substring(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    const type = params.get('type'); // signup veya recovery
    if (access_token) {
      const { data, error } = await sb.auth.setSession({ access_token, refresh_token });
      if (data?.session) {
        localStorage.setItem('sb_token', data.session.access_token);
        localStorage.setItem('sb_refresh', data.session.refresh_token);
        if (type === 'recovery') {
          window.location.href = 'reset-password.html' + window.location.hash;
          return;
        } else {
          showMsg('ok', 'E-posta doğrulandı! Yönlendiriliyorsunuz...');
          setTimeout(() => window.location.href = 'index.html', 1500);
        }
        return;
      } else {
        showMsg('err', 'Doğrulama başarısız. Lütfen tekrar deneyin.');
      }
    }
  }
})();

// Zaten giriş yaptıysa yönlendir
// Sadece localStorage token kontrolü - SDK session cache değil
// Silme talebi mesajı
if(window.location.search.includes('msg=silme-talebi')) {
  setTimeout(() => showMsg('ok', 'Hesap silme talebiniz alındı. 30 gün içinde tüm verileriniz silinecek ve e-posta ile bilgilendirileceksiniz.'), 100);
}
if(window.location.search.includes('suspended=1')) {
  setTimeout(() => showMsg('err', 'Hesabınız askıya alınmıştır.<br><br>' +
    '<a href="mailto:info@repertuvar.app?subject=Hesap%20Ask%C4%B1ya%20Alma" style="color:var(--red);text-decoration:underline;">✉️ info@repertuvar.app</a>' +
    '&nbsp;&nbsp;&nbsp;' +
    '<a href="https://wa.me/31621301222?text=Merhaba%2C%20hesab%C4%B1m%20ask%C4%B1ya%20al%C4%B1nd%C4%B1." target="_blank" style="color:#25D366;text-decoration:underline;">💬 WhatsApp</a>'
  ), 100);
}
if(window.location.search.includes('deletion_requested=1')) {
  setTimeout(() => {
    const emailParam = new URLSearchParams(window.location.search).get('email') || '';
    const waText = encodeURIComponent('Merhaba, hesap silme talebimi geri almak istiyorum. E-posta: ' + emailParam);
    const mailSubject = encodeURIComponent('Silme Talebi İptali');
    const mailBody = encodeURIComponent('Merhaba,\n\nHesap silme talebimi geri almak istiyorum.\nE-posta: ' + emailParam);
    showMsg('err', 'Hesabınız silme sürecindedir ve erişiminiz kısıtlanmıştır.<br>Talebinizi geri almak için:<br><br>' +
      '<a href="mailto:info@repertuvar.app?subject=' + mailSubject + '&body=' + mailBody + '" style="color:var(--red);text-decoration:underline;">✉️ info@repertuvar.app</a>' +
      '&nbsp;&nbsp;&nbsp;' +
      '<a href="https://wa.me/31621301222?text=' + waText + '" target="_blank" style="color:#25D366;text-decoration:underline;">💬 WhatsApp</a>'
    );
  }, 100);
}
// Davet token'ını sakla
const _inviteToken = new URLSearchParams(window.location.search).get('invite');
if (_inviteToken) localStorage.setItem('pending_invite', _inviteToken);

if(!window.location.search.includes('logout=1') && !window.location.hash.includes('type=recovery')) {
  const token = localStorage.getItem('sb_token');
  if(token) window.location.href = 'index.html';
}

async function handlePendingInvite(userId) {
  const inviteToken = localStorage.getItem('pending_invite');
  if (!inviteToken) return;
  try {
    // Token ile daveti bul
    const r = await fetch(SUPA_URL + '/rest/v1/group_invites?token=eq.' + inviteToken + '&select=*', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token') }
    });
    const invites = await r.json();
    const invite = invites[0];
    if (!invite) { localStorage.removeItem('pending_invite'); return; }
    if (invite.used_by) { localStorage.removeItem('pending_invite'); return; } // zaten kullanılmış
    if (new Date(invite.expires_at) < new Date()) { localStorage.removeItem('pending_invite'); showMsg('err', 'Davet linki süresi dolmuş.'); return; }

    // Kullanıcıyı gruba ekle
    await fetch(SUPA_URL + '/rest/v1/group_members', {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token'), 'Content-Type': 'application/json', 'Prefer': 'resolution=ignore-duplicates' },
      body: JSON.stringify({ group_id: invite.group_id, user_id: userId, role: 'member', status: 'active' })
    });

    // Profili güncelle
    await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token'), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ group_id: invite.group_id })
    });

    // Daveti kullanıldı olarak işaretle
    await fetch(SUPA_URL + '/rest/v1/group_invites?token=eq.' + inviteToken, {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token'), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ used_by: userId, used_at: new Date().toISOString() })
    });

    localStorage.removeItem('pending_invite');
  } catch(e) { console.error('Invite error:', e); }
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('active', (i===0&&t==='login')||(i===1&&t==='register')));
  document.getElementById('loginForm').style.display = t==='login' ? '' : 'none';
  document.getElementById('registerForm').style.display = t==='register' ? '' : 'none';
  showMsg('','');
}

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg' + (type ? ' '+type : '');
  el.innerHTML = text;
  el.style.display = text ? 'block' : 'none';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  if(!email || !pass) { showMsg('err','E-posta ve şifre gerekli.'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
  const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
  if(error) { showMsg('err', error.message); btn.disabled=false; btn.textContent='Giriş Yap'; return; }
  if(data.session) {
    localStorage.setItem('sb_token', data.session.access_token);
    localStorage.setItem('sb_refresh', data.session.refresh_token);
    await handlePendingInvite(data.session.user.id);
    window.location.href = 'index.html';
  }
}

async function doRegister() {
  const fullName = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass  = document.getElementById('regPass').value;
  if(!fullName) { showMsg('err','Ad Soyad zorunludur.'); document.getElementById('regName').focus(); return; }
  if(!email || !pass) { showMsg('err','E-posta ve şifre gerekli.'); return; }
  if(pass.length < 6) { showMsg('err','Şifre en az 6 karakter olmalı.'); return; }
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const {data, error} = await sb.auth.signUp({email, password: pass});
  if(error) { showMsg('err', error.message); btn.disabled=false; btn.textContent='Kayıt Ol'; return; }

  // display_name'i profiles tablosuna yaz
  if (data?.user?.id) {
    try {
      await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + data.user.id, {
        method: 'PATCH',
        headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (data.session?.access_token || ''), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ display_name: fullName })
      });
    } catch(e) { console.error('display_name yazma hatası:', e); }
  }

  const hasPendingInvite = !!localStorage.getItem('pending_invite');
  if (hasPendingInvite) {
    showMsg('ok','Kayıt başarılı! E-postanızı doğrulayıp giriş yaptıktan sonra gruba otomatik ekleneceksiniz.');
  } else {
    showMsg('ok','Kayıt başarılı! E-postanızı doğrulayın.');
  }
  btn.disabled=false; btn.textContent='Kayıt Ol';
}

async function doReset() {
  const email = document.getElementById('loginEmail').value.trim();
  if(!email) { showMsg('err','Önce e-posta adresinizi girin.'); return; }
  const {error} = await sb.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: false }
  });
  if(error) { showMsg('err', error.message); return; }
  showMsg('ok','8 haneli kod e-postanıza gönderildi.');
  // OTP giriş formunu göster
  document.getElementById('loginForm').innerHTML = `
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="otpEmail" value="${email}" readonly style="opacity:.6;">
    </div>
    <div class="field">
      <label>E-postanıza gelen 8 haneli kod</label>
      <input type="text" id="otpCode" placeholder="00000000" maxlength="8" autocomplete="one-time-code"
        style="letter-spacing:.3em;font-size:20px;text-align:center;"
        onkeydown="if(event.key==='Enter') verifyOtp()">
    </div>
    <button class="btn-primary" onclick="verifyOtp()">Kodu Doğrula</button>
    <button class="forgot" onclick="location.reload()">← Geri dön</button>
  `;
}

async function verifyOtp() {
  const email = document.getElementById('otpEmail').value.trim();
  const token = document.getElementById('otpCode').value.trim();
  if(!token || token.length < 8) { showMsg('err','8 haneli kodu girin.'); return; }
  const {data, error} = await sb.auth.verifyOtp({ email, token, type: 'email' });
  if(error) { showMsg('err', 'Kod hatalı veya süresi dolmuş.'); return; }
  if(data.session) {
    localStorage.setItem('sb_token', data.session.access_token);
    localStorage.setItem('sb_refresh', data.session.refresh_token);
    window.location.href = 'reset-password.html';
  }
}

async function loginGoogle() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {redirectTo: 'https://www.repertuvar.app/login.html'}
  });
}
</script>
<script>
(async function() {
  const rep      = document.getElementById('sp-rep');
  const dot      = document.getElementById('sp-dot');
  const app      = document.getElementById('sp-app');
  const lineBlue = document.getElementById('sp-line-blue');
  const lineDark = document.getElementById('sp-line-dark');
  const slogan   = document.getElementById('sp-slogan');
  const overlay  = document.getElementById('splash-overlay');

  function anim(el, props, duration, delay, easing) {
    return new Promise(resolve => {
      setTimeout(() => {
        el.style.transition = `all ${duration}ms ${easing || 'cubic-bezier(0.22,1,0.36,1)'}`;
        Object.assign(el.style, props);
        setTimeout(resolve, duration);
      }, delay);
    });
  }

  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 500));

  lineBlue.style.width = rep.offsetWidth + 'px';
  lineDark.style.width = app.offsetWidth + 'px';

  await anim(dot, { opacity:'1', transform:'translateY(0)' }, 900, 0, 'cubic-bezier(0.34,1.3,0.64,1)');
  await new Promise(r => setTimeout(r, 300));

  anim(rep, { opacity:'1', transform:'translateX(0)' }, 900, 0);
  await anim(app, { opacity:'1', transform:'translateX(0)' }, 900, 0);
  await new Promise(r => setTimeout(r, 300));

  anim(lineBlue, { opacity:'1', transform:'translateY(0)' }, 700, 0, 'cubic-bezier(0.34,1.3,0.64,1)');
  await anim(lineDark, { opacity:'1', transform:'translateY(0)' }, 700, 150, 'cubic-bezier(0.34,1.3,0.64,1)');
  await new Promise(r => setTimeout(r, 400));

  const full = 'Modern Müzisyenler İçin\nAkıllı Sahne ve Repertuvar Yönetimi';
  let i = 0;
  await new Promise(resolve => {
    function typeChar() {
      if (i <= full.length) {
        slogan.textContent = full.slice(0, i) + (i < full.length ? '|' : '');
        i++;
        setTimeout(typeChar, 55);
      } else { resolve(); }
    }
    typeChar();
  });

  // 1.5 sn bekle sonra fade out
  await new Promise(r => setTimeout(r, 1500));
  overlay.classList.add('fade-out');
  setTimeout(() => {
    overlay.remove();
    document.body.style.overflow = '';
  }, 800);
})();
</script>
</body>
</html>
