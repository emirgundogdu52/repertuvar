<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuvar — Giriş</title>
<link rel="icon" type="image/png" href="Repertuvar_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080810;--surface:#0f0f1a;--surface2:#161625;
  --border:#2a2a3e;--accent:#a855f7;--accent2:#c084fc;
  --text:#f1f0ff;--text2:#8b8aa8;--text3:#3d3d58;
  --red:#c05444;--green:#4ade80;
}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:36px 32px;}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:32px;}
.logo img{height:80px;width:auto;}
.logo span{font-size:11px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;}
h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:28px;}
.tabs{display:flex;gap:0;background:var(--surface2);border-radius:8px;padding:3px;margin-bottom:24px;}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;
  border-radius:6px;cursor:pointer;color:var(--text2);transition:all .15s;}
.tab.active{background:var(--accent);color:#fff;}
.field{margin-bottom:16px;}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500;}
input{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .15s;}
input:focus{border-color:var(--accent);}
.btn{width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);
  color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:filter .15s;margin-top:4px;}
.btn:hover{filter:brightness(1.1);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
.msg.err{background:rgba(192,84,68,.12);border:1px solid rgba(192,84,68,.3);color:#e07060;}
.msg.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green);}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:12px;color:var(--text3);}
.google-btn{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
  background:none;color:var(--text2);font-size:13px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}
.google-btn:hover{border-color:var(--accent);color:var(--text);}
.forgot{text-align:center;margin-top:16px;font-size:12px;color:var(--text3);}
.forgot a{color:var(--accent);cursor:pointer;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="Repertuvar_logo.png" alt="Repertuvar">
    <span>Sahne Sizin</span>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">Giriş Yap</div>
    <div class="tab" id="tabRegister" onclick="switchTab('register')">Kayıt Ol</div>
  </div>

  <div id="msgBox" class="msg"></div>

  <!-- GİRİŞ FORMU -->
  <div id="loginForm">
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="loginEmail" placeholder="ornek@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Giriş Yap</button>
    <div class="forgot"><a onclick="showForgot()">Şifremi unuttum</a></div>
  </div>

  <!-- KAYIT FORMU -->
  <div id="registerForm" style="display:none;">
    <div class="field">
      <label>Ad Soyad</label>
      <input type="text" id="regName" placeholder="Adınız Soyadınız" autocomplete="name">
    </div>
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="regEmail" placeholder="ornek@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="regPass" placeholder="En az 6 karakter" autocomplete="new-password"
        onkeydown="if(event.key==='Enter')doRegister()">
    </div>
    <button class="btn" id="registerBtn" onclick="doRegister()">Kayıt Ol</button>
  </div>

  <div class="divider"><span>veya</span></div>
  <button class="google-btn" onclick="doGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.3z"/></svg>
    Google ile Devam Et
  </button>
</div>

<script>
const SUPA_URL = 'https://ehytkzxdhjyjuubizdnl.supabase.co';
const SUPA_KEY = 'sb_publishable_f_WsYxzN06B5dGROrkGyPQ_UDxKSbtO';

// Zaten giriş yapılmışsa yönlendir
async function checkSession() {
  const token = localStorage.getItem('sb_token');
  if (token) {
    try {
      const r = await fetch(SUPA_URL+'/auth/v1/user', {
        headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+token}
      });
      if (r.ok) { window.location.href = 'index.html'; return; }
    } catch(e) {}
    localStorage.removeItem('sb_token');
    localStorage.removeItem('sb_user');
  }
}
checkSession();

function switchTab(tab) {
  document.getElementById('loginForm').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab==='register' ? 'block' : 'none';
  document.getElementById('tabLogin').className = 'tab'+(tab==='login'?' active':'');
  document.getElementById('tabRegister').className = 'tab'+(tab==='register'?' active':'');
  clearMsg();
}

function showMsg(text, type='err') {
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg '+type;
  box.style.display = 'block';
}
function clearMsg() {
  document.getElementById('msgBox').style.display = 'none';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) { showMsg('E-posta ve şifre gerekli'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
  try {
    const r = await fetch(SUPA_URL+'/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {'apikey': SUPA_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if (!r.ok) { showMsg(data.error_description || data.msg || 'Giriş başarısız'); return; }
    localStorage.setItem('sb_token', data.access_token);
    localStorage.setItem('sb_refresh', data.refresh_token);
    localStorage.setItem('sb_user', JSON.stringify(data.user));
    window.location.href = 'index.html';
  } catch(e) { showMsg('Bağlantı hatası'); }
  finally { btn.disabled = false; btn.textContent = 'Giriş Yap'; }
}

async function doRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  if (!name || !email || !pass) { showMsg('Tüm alanlar gerekli'); return; }
  if (pass.length < 6) { showMsg('Şifre en az 6 karakter olmalı'); return; }
  const btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = 'Kayıt yapılıyor...';
  try {
    const r = await fetch(SUPA_URL+'/auth/v1/signup', {
      method: 'POST',
      headers: {'apikey': SUPA_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({email, password: pass, data: {full_name: name}})
    });
    const data = await r.json();
    if (!r.ok) { showMsg(data.error_description || data.msg || 'Kayıt başarısız'); return; }
    if (data.access_token) {
      localStorage.setItem('sb_token', data.access_token);
      localStorage.setItem('sb_refresh', data.refresh_token);
      localStorage.setItem('sb_user', JSON.stringify(data.user));
      window.location.href = 'index.html';
    } else {
      showMsg('Kayıt başarılı! E-postanızı doğrulayın.', 'ok');
    }
  } catch(e) { showMsg('Bağlantı hatası'); }
  finally { btn.disabled = false; btn.textContent = 'Kayıt Ol'; }
}

async function doGoogle() {
  try {
    const r = await fetch(SUPA_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(window.location.origin+'/repertuvar/index.html'), {
      headers: {'apikey': SUPA_KEY}
    });
    window.location.href = SUPA_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(window.location.origin+'/repertuvar/index.html');
  } catch(e) { showMsg('Google girişi başlatılamadı'); }
}

function showForgot() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showMsg('Önce e-posta adresinizi girin'); return; }
  fetch(SUPA_URL+'/auth/v1/recover', {
    method: 'POST',
    headers: {'apikey': SUPA_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify({email})
  }).then(() => showMsg('Şifre sıfırlama e-postası gönderildi', 'ok'));
}
</script>
</body>
</html>
