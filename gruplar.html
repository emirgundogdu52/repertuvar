<!DOCTYPE html>
<!--
  GRUPLAR.HTML — DEĞİŞİKLİK GÜNLÜĞÜ (en üstte tutulur)
  - 2026-08-06: ÇOKLU GRUP ÜYELİĞİ. Bir kullanıcı birden fazla gruba üye olabilir;
    üyeliğin tek kaynağı group_members, profiles.group_id yalnızca AKTİF grubu tutar.
    Sayfanın başına "Gruplarım" çipleri eklendi (aktif grup seçimi + Yeni Grup).
    "Kullanıcı Ara & Gruba Ekle" bölümü tamamen KALDIRILDI — search_users(q) sistemdeki
    herkesi ad/e-posta parçasıyla bulunabilir kılıyordu; katılım artık yalnızca davet
    linkiyle ve davet edilenin kabulüyle.
  - 2026-08-01 (b): Kullanıcı arama search_users(q) RPC'sine taşındı. profiles'taki
    SELECT true politikaları kaldırıldığı için doğrudan sorgu artık çalışmaz; ayrıca
    eski hali tüm kullanıcıların e-postasını çekilebilir yapıyordu. Asgari karakter
    2 → 3 (numaralandırmayı zorlaştırmak için).
  - 2026-08-01: Üye satırına 🎤 düğmesi eklendi — üyeyi Solistler listesine ekler
    (addMemberAsSolist). Yalnızca admin/kurucuda görünür, kalem düğmesinin yanında.
    Üye bağı YENİ `member_id` kolonunda; `user_id` bu tabloda "EKLEYEN" demek
    (artiesten.html grubu olmayan kullanıcıda listeyi user_id ile süzüyor), o yüzden
    anlamı değiştirilmedi. Mükerrer kontrolü group_id + member_id ile — ad benzersiz
    değil (iki "Ahmet" olabilir). member_id NULL = elle eklenen misafir solist.
    name NOT NULL olduğu için ad da yazılıyor: display_name → e-postanın @ öncesi.
    Gerekli SQL: alter table solistler add column if not exists member_id uuid
    references auth.users(id) on delete set null;
  - 2026-07-17: Mobil düzen katmanı eklendi (@media max-width:600px) — masaüstü
    değişmedi. Kenar boşlukları küçültüldü (.page-content/.section), yatay taşma
    kesildi, rol açılır menüsü (.role-dd-menu) sağ kenara yaslandı, iOS metin
    otomatik büyütmesi kapatıldı (-webkit-text-size-adjust), buton satırları mobilde
    sarıp tam genişliğe yayılıyor (.m-btn-row).
  - 2026-07-17 (b): (1) Davet linki artık capacitor://localhost yerine canlı web
    adresinden (origin http değilse https://app.repertuvar.app) kuruluyor — native
    app'te üretilen link de paylaşılabilir/açılabilir. (2) Topnav üstte sabitlendi
    (#r-topnav-container position:sticky).
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grup / Koro Yönetimi — Repertuvar</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="topnav.js" defer></script>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/fonts/tabler-icons.woff2?v3.44.0" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
<style>
.page-content { max-width: 680px; margin: 0; padding: 16px 20px 80px; }
/* Topnav'ı üstte sabitle (sayfa kayınca kaybolmasın) */
#r-topnav-container { position: sticky; top: 0; z-index: 500; background: var(--bg); }
/* Üye kartları + arama sonuçları: çift-dokunuş yakınlaştırmasını kapat (kıstırma-zoom kalır) */
#membersList, #membersList *, #userSearchResults, #userSearchResults * { touch-action: manipulation; }
/* Rol açılır menüsü: beyaz-üstü-beyaz okunmazlığını gider (her iki tema). Çıkar (inline kırmızı) korunur. */
#membersList .role-dd-menu, #userSearchResults .role-dd-menu { background: var(--surface); border: 1px solid var(--border); }
#membersList .role-dd-menu button, #userSearchResults .role-dd-menu button { color: var(--text); background: transparent; }
#membersList .role-dd-menu button:hover, #userSearchResults .role-dd-menu button:hover { background: var(--surface2); }
#membersList .role-dd-menu button.active, #userSearchResults .role-dd-menu button.active { color: var(--accent); }
.section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 16px; }
.group-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.group-avatar { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #fff; flex-shrink: 0; }
.group-name { font-size: 20px; font-weight: 700; color: var(--text); }
.group-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
.member-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); -webkit-user-select:none; -webkit-touch-callout:none; user-select:none; }
.member-item:last-child { border-bottom: none; }
.member-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
.member-info { flex: 1; min-width: 0; }
.member-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-email { font-size: 11px; color: var(--text3); }
.role-badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
.role-owner { background: rgba(124,111,255,.2); color: var(--accent2); border: 1px solid rgba(124,111,255,.3); }
.role-admin { background: rgba(74,222,128,.15); color: var(--green); border: 1px solid rgba(74,222,128,.2); }
.role-member { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
/* Grup çipleri (2026-08-06) — çoklu grup üyeliğinde aktif grubu seçmek için */
.grp-chip { display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:999px;
  background: var(--surface2); border:1px solid var(--border); color: var(--text2);
  font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition: all .15s; }
.grp-chip:hover { border-color: var(--accent); color: var(--text); }
.grp-chip.active { background: color-mix(in srgb, var(--accent) 16%, transparent);
  border-color: var(--accent); color: var(--text); cursor: default; }
.grp-chip .grp-role { font-size:11px; font-weight:600; color: var(--text3); }
/* Nokta CSS ile çiziliyor — ti-circle-check-filled webfont sürümünde yok. */
.grp-dot { width:13px; height:13px; border-radius:50%; flex-shrink:0; box-sizing:border-box;
  border:2px solid var(--text3); }
.grp-dot.on { border-color: var(--accent); background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.invite-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 16px; }
.invite-link { font-size: 12px; color: var(--text2); font-family: monospace; word-break: break-all; line-height: 1.6; }
.btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all .15s; }
.btn-primary { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #1a1200; }
.btn-primary:hover { background: var(--accent2); }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--red); }
.btn-danger:hover { background: rgba(248,113,113,.2); }
.fi { width: 100%; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; }
.fi:focus { border-color: var(--accent); }
.fl { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #238636; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 9999; white-space: nowrap; }
.toast.err { background: #b91c1c; }
.no-group { text-align: center; padding: 40px 20px; color: var(--text3); }
.no-group svg { opacity: .3; margin-bottom: 16px; }
.no-group p { margin-bottom: 20px; font-size: 15px; }
.member-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--text3); margin-top: 2px; }
.member-meta span { display: flex; align-items: center; gap: 3px; }
.member-instrument { font-size: 11px; color: var(--accent2); margin-top: 3px; display: flex; align-items: center; gap: 3px; }

/* ── MOBİL DÜZEN (masaüstünü etkilemez) ── */
html { -webkit-text-size-adjust: 100%; }
@media (max-width: 600px) {
  html, body { overflow-x: hidden; }
  .page-content { padding: 12px 12px 90px; }
  .section { padding: 16px; border-radius: 12px; margin-bottom: 14px; }
  .section-title { margin-bottom: 12px; }
  .group-avatar { width: 46px; height: 46px; font-size: 20px; border-radius: 12px; }
  .group-name { font-size: 18px; }
  .member-item { gap: 10px; }
  .member-meta { font-size: 10px; }
  .member-meta span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .role-dd-menu { right: 0; left: auto; }   /* açılır menü sağ kenardan taşmasın */
  .toast { white-space: normal; max-width: 90vw; text-align: center; }
  /* form buton satırları: sar + tam genişliğe yayıl (kolay dokunma) */
  .m-btn-row { flex-wrap: wrap; }
  .m-btn-row .btn { flex: 1 1 auto; min-height: 42px; }
}
</style>
</head>
<body>

<div id="r-topnav-container"></div>

<div class="main-wrap">
<div class="page-content">
  <div id="loadingState" style="text-align:center;padding:60px 20px;color:var(--text3);">Yükleniyor...</div>
  <div id="noGroupState" style="display:none;">
    <div class="section no-group">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <p>Henüz bir grup veya koroya üye değilsiniz.</p>
      <button class="btn btn-primary" onclick="showCreateGroup()">+ Yeni Grup / Koro Oluştur</button>
    </div>
  </div>

  <div class="section" id="createGroupForm" style="display:none;">
      <div class="section-title">Yeni Grup / Koro Oluştur</div>
      <div style="margin-bottom:14px;">
        <label class="fl">Koro Adı *</label>
        <input class="fi" id="newGroupName" placeholder="örn. Ensemble Bağlama Grubu">
      </div>
      <div style="margin-bottom:20px;">
        <label class="fl">Açıklama</label>
        <input class="fi" id="newGroupDesc" placeholder="Kısa bir açıklama...">
      </div>
      <div class="m-btn-row" style="display:flex;gap:10px;">
        <button class="btn btn-secondary" onclick="hideCreateGroup()">İptal</button>
        <button class="btn btn-primary" onclick="createGroup()">Koroyu Oluştur</button>
      </div>
    </div>

  <div id="groupState" style="display:none;">
    <!-- Gruplarım — çoklu grup üyeliği (2026-08-06).
         Üyelik group_members'ta tutulur; buradaki seçim yalnızca AKTİF grubu
         (profiles.group_id) değiştirir. Aktif grup, repertuvar/solist
         listelerinin hangi gruba göre çekileceğini belirler. -->
    <div class="section" id="myGroupsSection">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;">
        <div class="section-title" style="margin-bottom:0;">Gruplarım</div>
        <button class="btn btn-secondary" style="padding:5px 11px;font-size:12px;flex-shrink:0;" onclick="showCreateGroup()"><i class="ti ti-plus" style="font-size:13px;"></i> Yeni Grup</button>
      </div>
      <div id="myGroupsChips" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
      <div id="myGroupsHint" style="font-size:12px;color:var(--text3);margin-top:10px;"></div>
    </div>

    <!-- Grup Bilgisi -->
    <div class="section">
      <div class="group-header">
        <div class="group-avatar" id="groupAvatarEl">G</div>
        <div style="flex:1;min-width:0;">
          <div class="group-name" id="groupNameEl">—</div>
          <div class="group-meta" id="groupMetaEl">—</div>
        </div>
        <div id="groupEditBtns" style="display:none;flex-shrink:0;display:none;gap:6px;">
          <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px;" onclick="showEditGroup()"><i class="ti ti-pencil" style="font-size:13px;"></i> Düzenle</button>
          <button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" onclick="deleteGroup()"><i class="ti ti-trash" style="font-size:13px;"></i></button>
        </div>
      </div>
      <div id="groupDescEl" style="font-size:13px;color:var(--text2);margin-bottom:16px;"></div>

      <!-- Grup düzenleme formu -->
      <div id="editGroupForm" style="display:none;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;">
        <div style="margin-bottom:12px;">
          <label class="fl">Koro Adı</label>
          <input class="fi" id="editGroupName" placeholder="Koro adı...">
        </div>
        <div style="margin-bottom:14px;">
          <label class="fl">Açıklama</label>
          <input class="fi" id="editGroupDesc" placeholder="Açıklama...">
        </div>
        <div class="m-btn-row" style="display:flex;gap:8px;">
          <button class="btn btn-primary" style="font-size:12px;" onclick="saveGroupEdit()">Kaydet</button>
          <button class="btn btn-secondary" style="font-size:12px;" onclick="hideEditGroup()">İptal</button>
        </div>
      </div>

      <!-- Davet Linki — sadece owner/admin görür -->
      <div id="inviteSection" style="display:none;">
        <div class="section-title">Davet Linki</div>
        <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">Bu linki paylaşarak yeni üyeler davet edebilirsiniz. Link 7 gün geçerlidir.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="generateInvite()">🔗 Yeni Davet Linki Oluştur</button>
        </div>
        <div class="invite-box" id="inviteLinkBox" style="display:none;">
          <div style="font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:600;">DAVETİYE LİNKİ</div>
          <div class="invite-link" id="inviteLinkText"></div>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
            <button class="btn btn-secondary" onclick="copyInviteLink()">📋 Kopyala</button>
            <button class="btn btn-secondary" onclick="shareViaWhatsApp()">💬 WhatsApp</button>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:10px;" id="inviteExpiry"></div>
        </div>
      </div>
    </div>

    <!-- (2026-08-06) "Kullanıcı Ara & Gruba Ekle" bölümü KALDIRILDI.
         Sebep: search_users(q) RPC'si herhangi bir grup yöneticisinin sistemdeki
         kullanıcıları ad/e-posta parçasıyla taramasına izin veriyordu (kullanıcı
         keşfi / enumeration). Yeni kural: gruba katılım YALNIZCA davet linkiyle
         ve davet edilenin KABULÜYLE olur — kimse kimseyi habersiz gruba ekleyemez. -->

    <!-- Üyeler -->
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="section-title" style="margin-bottom:0;">Grup / Koro Üyeleri</div>
      </div>
      <div style="position:relative;margin-bottom:12px;">
        <i class="ti ti-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3);"></i>
        <input class="fi" id="memberSearch" style="padding-left:32px;font-size:12px;" placeholder="Mevcut üyelerde ara..." oninput="filterMembers(this.value)">
      </div>
      <div id="membersList"></div>
    </div>
  </div>
</div>
</div>

<!-- Bottom nav -->

<script>
let currentGroup = null;
let currentMembers = [];
let userRole = null;
let currentInviteLink = null;
let myGroups = [];   // group_members'tan gelen üyelik listesi (çoklu grup)

function toast(msg, type='ok') {
  const t = document.createElement('div');
  t.className = 'toast' + (type==='err' ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function showCreateGroup() { document.getElementById('createGroupForm').style.display = ''; }
function hideCreateGroup() { document.getElementById('createGroupForm').style.display = 'none'; }

async function createGroup() {
  const name = document.getElementById('newGroupName').value.trim();
  if (!name) { document.getElementById('newGroupName').focus(); return; }
  const desc = document.getElementById('newGroupDesc').value.trim();
  const uid = getUserId();

  try {
    // Grup oluştur
    const r = await fetch(SUPA_URL + '/rest/v1/groups', {
      method: 'POST',
      headers: { ...authHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify({ name, description: desc || null, owner_id: uid })
    });
    if (!r.ok) throw new Error(await r.text());
    const [group] = await r.json();

    // Owner olarak group_members'a ekle
    await fetch(SUPA_URL + '/rest/v1/group_members', {
      method: 'POST',
      headers: { ...authHeaders(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ group_id: group.id, user_id: uid, role: 'owner', status: 'active' })
    });

    // Profile'a group_id yaz
    await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + uid, {
      method: 'PATCH',
      headers: { ...authHeaders(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ group_id: group.id })
    });

    localStorage.setItem('user_group_id', group.id);
    document.getElementById('newGroupName').value = '';
    document.getElementById('newGroupDesc').value = '';
    hideCreateGroup();
    toast('Koro oluşturuldu ✓');
    await loadPage();   // loadMyGroups üyelik listesini tazeler
  } catch(e) { toast('Hata: ' + e.message, 'err'); }
}

async function loadPage() {
  // (2026-08-06) ÜYELİK LİSTESİ ÖNCE — çoklu grup üyeliğinde tek doğru kaynak
  // group_members'tır. loadMyGroups() listeyi tazeler ve profiles.group_id
  // boş ya da artık üye olmadığın bir gruba işaret ediyorsa kendini onarır.
  myGroups = await loadMyGroups();
  let gid = getGroupId();

  document.getElementById('loadingState').style.display = 'none';

  if (!gid) {
    document.getElementById('noGroupState').style.display = '';
    document.getElementById('groupState').style.display = 'none';
    return;
  }

  // Grup bilgisini yükle
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/groups?id=eq.' + gid, {
      headers: authHeaders()
    });
    const groups = await r.json();
    currentGroup = groups[0];
    if (!currentGroup) {
      document.getElementById('noGroupState').style.display = '';
      return;
    }

    // Üyeleri yükle
    const mr = await fetch(SUPA_URL + '/rest/v1/group_members?group_id=eq.' + gid + '&select=*', {
      headers: authHeaders()
    });
    const rawMembers = await mr.json();

    // Profilleri ayrı sorgula
    const userIds = rawMembers.map(m => m.user_id).join(',');
    const pr = await fetch(SUPA_URL + '/rest/v1/profiles?id=in.(' + userIds + ')&select=id,display_name,email,phone,instrument', {
      headers: authHeaders()
    });
    const profiles = await pr.json();
    const profileMap = {};
    profiles.forEach(p => profileMap[p.id] = p);

    currentMembers = rawMembers.map(m => ({
      ...m,
      display_name: profileMap[m.user_id]?.display_name || m.display_name,
      email: profileMap[m.user_id]?.email || m.email,
      phone: profileMap[m.user_id]?.phone || '',
      instrument: profileMap[m.user_id]?.instrument || ''
    }));

    // Kendi rolü
    const me = currentMembers.find(m => m.user_id === getUserId());
    userRole = me?.role || 'member';

    renderMyGroups();
    renderGroup();
  } catch(e) { toast('Hata: ' + e.message, 'err'); }
}

// Gruplarım çipleri — aktif grubu değiştirir (profiles.group_id).
function renderMyGroups() {
  const box = document.getElementById('myGroupsChips');
  const hint = document.getElementById('myGroupsHint');
  if (!box) return;
  const active = getGroupId();
  box.innerHTML = (myGroups || []).map(g => {
    const on = g.id === active;
    const roleTxt = g.role === 'owner' ? 'kurucu' : (g.role === 'admin' ? 'yönetici' : 'üye');
    return `<button class="grp-chip${on ? ' active' : ''}" ${on ? '' : `onclick="switchGroup('${g.id}')"`}>
      <span class="grp-dot${on ? ' on' : ''}" aria-hidden="true"></span>
      ${esc(g.name)} <span class="grp-role">${roleTxt}</span>
    </button>`;
  }).join('');
  if (hint) hint.textContent = (myGroups || []).length > 1
    ? 'Aktif grubu değiştirdiğinizde repertuvarlar, solistler ve üyeler o gruba göre yüklenir.'
    : '';
}

function esc(t) { return (t == null ? '' : String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function generateInvite() {
  const gid = getGroupId();
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/group_invites', {
      method: 'POST',
      headers: { ...authHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify({ group_id: gid, created_by: getUserId() })
    });
    if (!r.ok) throw new Error(await r.text());
    const [invite] = await r.json();
    // Davet linki HERKESE açık olmalı: native app'te origin 'capacitor://localhost'
    // olur ve o link paylaşılamaz. Web origin'i http ise onu kullan, değilse
    // (native app) canlı web adresine düş.
    const origin = window.location.origin;
    const shareBase = origin.startsWith('http') ? origin : 'https://app.repertuvar.app';
    const link = shareBase + '/login.html?invite=' + invite.token;
    currentInviteLink = link;
    document.getElementById('inviteLinkText').textContent = link;
    document.getElementById('inviteExpiry').textContent = '⏳ ' + new Date(invite.expires_at).toLocaleDateString('tr-TR', {day:'2-digit',month:'long',year:'numeric'}) + ' tarihine kadar geçerli';
    document.getElementById('inviteLinkBox').style.display = '';
    toast('Davet linki oluşturuldu ✓');
  } catch(e) { toast('Hata: ' + e.message, 'err'); }
}

async function deleteGroup() {
  if (!confirm('Koroyu silmek istediğinize emin misiniz? Bu işlem geri alınamaz.')) return;
  try {
    // (2026-08-01) Üç istek de yanıtsız gidiyordu: ilk ikisi RLS'te düşse bile
    // profiller boşalıyor, ekranda "Koro silindi" yazıyordu. Artık her adım
    // kontrol ediliyor ve önceki adım başarısızsa sonraki HİÇ çalışmıyor.
    // NOT: profiles PATCH'inde satır sayısı KONTROL EDİLMİYOR — profiles.group_id
    // üzerinde ON DELETE SET NULL varsa grup silinince alan zaten boşalmış olur,
    // 0 satır dönmesi hata değildir.

      method: 'PATCH', headers: { ...authHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ group_id: null })
    });
    if (!pp.ok) throw new Error('Koro silindi ama profiller güncellenemedi: ' + (await pp.text()));
    localStorage.removeItem('user_group_id');
    toast('Koro silindi');
    await loadPage();

// Üyeyi Solistler listesine ekle (2026-08-01).
// DİKKAT — `solistler.user_id` BU TABLODA "EKLEYEN KİŞİ" DEMEK, "bu solist hangi üye"
// değil (artiesten.html:211 grubu olmayan kullanıcıda listeyi user_id=eq.<uid> ile
// süzüyor, :317 insert'te user_id=getUserId() yazıyor). Anlamını değiştirmek grubu
// olmayan kullanıcıların solist listesini boşaltırdı. Bu yüzden üye bağı için AYRI bir
// kolon kullanılıyor: `member_id`. Mükerrer kontrolü de onun üzerinden — ad benzersiz
// değil (aynı grupta iki "Ahmet" olabilir), user_id ise ekleyeni gösterdiği için hiç
// uygun değil. member_id NULL kalabilir: elle eklenen misafir/dış solistler böyle.
async function addMemberAsSolist(userId) {
  const m = (currentMembers || []).find(x => x.user_id === userId);
  if (!m) { toast('Üye bulunamadı', 'err'); return; }
  const name = (m.display_name || (m.email ? m.email.split('@')[0] : '')).trim();
  if (!name) { toast('Bu üyenin adı yok — önce profilinde ad tanımlanmalı', 'err'); return; }
  const gid = (currentGroup && currentGroup.id) || null;
  if (!gid) { toast('Grup bulunamadı', 'err'); return; }
  try {
    // 1) Bu üye zaten bağlı mı?
    const chk = await fetch(SUPA_URL + '/rest/v1/solistler?group_id=eq.' + gid + '&member_id=eq.' + userId + '&select=id,name', { headers: authHeaders() });
    const rows = chk.ok ? await chk.json() : [];
    if (Array.isArray(rows) && rows.length) { toast((rows[0].name || name) + ' zaten solist listesinde'); return; }

    // 2) SAHİPLENME: aynı grupta member_id'si BOŞ, ama e-postası ya da adı tutan bir
    //    solist varsa YENİ KAYIT AÇMA — mevcut satırı üyeye bağla. Bu olmadan elle
    //    girilmiş kayıtların yanına ikinci bir "Emir Gundogdu" ekleniyordu.
    const orParts = [];
    if (m.email) orParts.push('email.eq.' + encodeURIComponent(m.email));
    orParts.push('name.eq.' + encodeURIComponent(name));
    const oq = await fetch(SUPA_URL + '/rest/v1/solistler?group_id=eq.' + gid + '&member_id=is.null&or=(' + orParts.join(',') + ')&select=id,name,email,phone', { headers: authHeaders() });
    const orphans = oq.ok ? await oq.json() : [];
    if (Array.isArray(orphans) && orphans.length) {
      const t = orphans[0];
      const patch = { member_id: userId };
      if (!t.email && m.email) patch.email = m.email;
      if (!t.phone && m.phone) patch.phone = m.phone;
      const up = await fetch(SUPA_URL + '/rest/v1/solistler?id=eq.' + t.id, {
        method: 'PATCH',
        headers: { ...authHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(patch)
      });
      if (!up.ok) throw new Error(await up.text());
      toast('🔗 ' + (t.name || name) + ' mevcut solist kaydına bağlandı');
      return;
    }

    // 3) Gerçekten yeni
    const r = await fetch(SUPA_URL + '/rest/v1/solistler', {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        name: name,
        member_id: userId,          // bağlı üye
        user_id: getUserId(),       // ekleyen (artiesten.html sözleşmesi)
        email: m.email || null,
        phone: m.phone || null,
        works: [],
        group_id: gid
      })
    });
    if (!r.ok) throw new Error(await r.text());
    toast('🎤 ' + name + ' solistlere eklendi');
  } catch(e) { toast('Hata: ' + e.message, 'err'); }
}

// Üyeyi gruptan çıkar.
// (2026-08-01) ESKİ HÂLİ İKİ HEDEFİ İKİ FARKLI KAYNAKTAN ÇÖZÜYORDU:
//   DELETE group_members?group_id=eq.<getGroupId()>&user_id=eq.<userId>   ← localStorage
//   PATCH  profiles?id=eq.<userId> {group_id:null}                        ← gid'den bağımsız
// getGroupId() boş/bayatsa DELETE hiçbir şeyi silmiyor, PATCH profili yine
// boşaltıyordu: group_members'ta 'active' üye + profiles.group_id=NULL. Uygulama
// "benim grubum"u YALNIZCA profiles.group_id'den okuduğu için (auth.js loadUserRole
// → localStorage.user_group_id) kullanıcı sessizce grubunu kaybediyordu. İki fetch'in
// de yanıtı kontrol edilmediğinden ekranda yine "Üye çıkarıldı" yazıyordu.
// YENİ SÖZLEŞME: group_id üyelik SATIRININ kendisinden gelir; önce group_members
// silinir ve gerçekten silindiği doğrulanır; profil ancak ondan sonra boşaltılır.
// Sıra önemli — tersi tam da yukarıdaki ayrışmayı üretiyor.
async function removeMember(userId) {
  if (!confirm('Bu üyeyi gruptan çıkarmak istediğinize emin misiniz?')) return;
  try {
    // 1) Üyelik satırını BUL — group_id'yi localStorage'dan değil satırdan al.
    const q = await fetch(SUPA_URL + '/rest/v1/group_members?user_id=eq.' + userId + '&select=id,group_id', {
      headers: authHeaders()
    });
    if (!q.ok) throw new Error('Üyelik okunamadı: ' + (await q.text()));
    const rows = await q.json();
    const row = (currentGroup && rows.find(m => m.group_id === currentGroup.id))
             || (rows.length === 1 ? rows[0] : null);
    if (!row) {
      toast(rows.length ? 'Birden fazla üyelik var — hangisi belirsiz' : 'Üyelik kaydı bulunamadı', 'err');
      return;
    }

    // 2) ÖNCE group_members — return=representation ile KAÇ satır silindiğini gör.
    //    0 satır = RLS engelledi ya da satır yok; profile HİÇ dokunmadan dur.
    const d = await fetch(SUPA_URL + '/rest/v1/group_members?id=eq.' + row.id, {
      method: 'DELETE',
      headers: { ...authHeaders(), 'Prefer': 'return=representation' }
    });
    if (!d.ok) throw new Error('Üyelik silinemedi: ' + (await d.text()));
    const deleted = await d.json();
    if (!deleted.length) throw new Error('Üyelik satırı silinemedi (0 satır) — profil bilerek değiştirilmedi.');

    // 3) ANCAK ŞİMDİ profiles.group_id boşaltılır — ve (2026-08-06) YALNIZCA
    //    çıkarılan grup o kişinin AKTİF grubuysa. Çoklu grup üyeliğinde koşulsuz
    //    NULL'lamak, kişinin BAŞKA bir gruptaki aktif seçimini de siliyordu.
    const p = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId + '&group_id=eq.' + row.group_id, {
      method: 'PATCH',
      headers: { ...authHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ group_id: null })
    });
    if (!p.ok) throw new Error('Üyelik silindi ama profil güncellenemedi: ' + (await p.text()));
    // 0 satır ARTIK HATA DEĞİL: kişinin aktif grubu başka bir grup olabilir,
    // o zaman bu filtre hiçbir satır tutmaz ve bu DOĞRU davranıştır.

    // 4) Başarı mesajı yalnızca İKİSİ DE geçtiyse.
    // Eğer çıkarılan kullanıcı kendisiyse localStorage'ı temizle
    const me = typeof getUser === 'function' && getUser();
    if (me && me.id === userId) localStorage.removeItem('user_group_id');
    toast('Üye çıkarıldı');
    await loadPage();
  } catch(e) { toast('Hata: ' + e.message, 'err'); }
}

// ── CANLI TAZELEME (2026-08-12) ──────────────────────────────────────────
// Bu sayfa hiçbir tazeleme olayını dinlemiyordu: bir üyenin rolü başka bir
// cihazdan değiştirildiğinde (ör. üye → yönetici) ekran eski hâlinde kalıyor,
// hem "Gruplarım" çipindeki rol etiketi hem üye listesindeki rozet
// güncellenmiyordu — Emir bunu tabletten +test1'i admin yapıp masaüstünde
// bekleyerek gördü. Rol bilgisi localStorage'da önbellekli olduğu için önce
// `loadMyGroups()` ile o önbellek tazeleniyor, sonra sayfa yeniden çiziliyor.
// Kümeleme: art arda gelen olaylarda tek tazeleme yapılsın.
(function () {
  let _t;
  function tazele() {
    clearTimeout(_t);
    _t = setTimeout(async function () {
      try { if (typeof loadUserRole === 'function') await loadUserRole(); } catch (e) {}
      try { if (typeof loadMyGroups === 'function') await loadMyGroups(); } catch (e) {}
      try { await loadPage(); } catch (e) {}
    }, 500);
  }
  window.addEventListener('remote-change', function (e) {
    const t = e.detail && e.detail.table;
    if (t === 'group_members' || t === 'groups' || t === 'profiles') tazele();
  });
  // Sekmeye geri dönüldüğünde de bir kez tazele (canlı bağlantı kopmuş olabilir).
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tazele(); });
})();
