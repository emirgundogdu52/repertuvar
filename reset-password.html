<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuvar — Şifre Sıfırla</title>
<link rel="icon" href="Repertuvar_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07071a;--surface:#12123a;--surface2:#1a1a4a;
  --border:rgba(140,120,255,0.38);--text:#f0eeff;--text2:#bbb9e0;--text3:#8886b0;
  --accent:#7c6fff;--accent2:#a78bfa;--green:#4ade80;--red:#f87171;
}
body{background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:32px;}
.logo-wrap img{height:48px;width:auto;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:400px;}
.card h2{font-size:18px;font-weight:700;margin-bottom:6px;}
.card p{font-size:13px;color:var(--text2);margin-bottom:24px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--accent);}

.btn{width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.msg{font-size:13px;text-align:center;padding:10px;border-radius:8px;margin-top:12px;display:none;}
.msg.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);}
.msg.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green);}

.back{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--text3);text-decoration:none;}
.back:hover{color:var(--accent);}
</style>
</head>
<body>

<div class="logo-wrap">
  <img src="Repertuvar_logo_slogan.png" alt="repertuvar.app" style="width:220px;height:auto;">
</div>

<div class="card">
  <h2>Yeni Şifre Belirle</h2>
  <p>Lütfen yeni şifrenizi girin.</p>

  <div id="formArea">
    <div class="field">
      <label>Yeni Şifre</label>
      <input type="password" id="newPass" placeholder="En az 6 karakter" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Şifre Tekrar</label>
      <input type="password" id="newPass2" placeholder="Şifreyi tekrar girin" autocomplete="new-password"
        onkeydown="if(event.key==='Enter') doReset()">
    </div>
    <button class="btn" id="resetBtn" onclick="doReset()">Şifreyi Güncelle</button>
  </div>

  <div class="msg" id="msg"></div>
  <a href="login.html" class="back">← Giriş sayfasına dön</a>
</div>

<script>
const SUPA_URL = 'https://ehytkzxdhjyjuubizdnl.supabase.co';
const SUPA_KEY = 'sb_publishable_f_WsYxzN06B5dGROrkGyPQ_UDxKSbtO';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg' + (type ? ' ' + type : '');
  el.textContent = text;
  el.style.display = text ? 'block' : 'none';
}

// Session kontrolü — OTP ile gelince sb_token var
(async () => {
  const hash = window.location.hash;
  // Eski link yöntemi (hash token)
  if (hash.includes('access_token')) {
    const params = new URLSearchParams(hash.substring(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (access_token) {
      const { error } = await sb.auth.setSession({ access_token, refresh_token });
      if (error) {
        showMsg('err', 'Bağlantı geçersiz veya süresi dolmuş.');
        document.getElementById('formArea').style.display = 'none';
      }
    }
    return;
  }
  // OTP yöntemi — sb_token var mı kontrol et
  const token = localStorage.getItem('sb_token');
  if (!token) {
    showMsg('err', 'Oturum bulunamadı. Lütfen tekrar şifre sıfırlama kodu isteyin.');
    document.getElementById('formArea').style.display = 'none';
  }
})();

async function doReset() {
  const pass = document.getElementById('newPass').value;
  const pass2 = document.getElementById('newPass2').value;

  if (!pass || pass.length < 6) { showMsg('err', 'Şifre en az 6 karakter olmalı.'); return; }
  if (pass !== pass2) { showMsg('err', 'Şifreler eşleşmiyor.'); return; }

  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Güncelleniyor...';

  const { error } = await sb.auth.updateUser({ password: pass });

  if (error) {
    showMsg('err', error.message);
    btn.disabled = false; btn.textContent = 'Şifreyi Güncelle';
  } else {
    showMsg('ok', 'Şifreniz başarıyla güncellendi! Yönlendiriliyorsunuz...');
    document.getElementById('formArea').style.display = 'none';
    setTimeout(() => window.location.href = 'index.html', 2000);
  }
}
</script>
</body>
</html>
