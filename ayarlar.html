/* ── Page styles ── */
.page { padding: 24px 20px; max-width: 640px; }
@media(min-width:1024px) { .page { padding: 32px; } }

.settings-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
}
.section-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.section-icon { font-size: 18px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text); }
.section-subtitle { font-size: 11px; color: var(--text3); margin-top: 1px; }

.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; gap: 16px;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 13px; font-weight: 500; color: var(--text); }
.setting-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Toggle switch */
.toggle {
  position: relative; width: 44px; height: 24px; flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; cursor: pointer;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 24px; transition: all .2s;
}
.toggle-slider::before {
  content: ''; position: absolute;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--text3); left: 2px; top: 2px;
  transition: all .2s;
}
.toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); background: #fff; }

/* Select */
.setting-select {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px;
  color: var(--text); font-size: 12px; font-family: var(--font);
  outline: none; cursor: pointer;
}
.setting-select:focus { border-color: var(--accent); }

/* Action button */
.setting-btn {
  background: none; border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 14px;
  font-size: 12px; font-weight: 600; color: var(--text2);
  cursor: pointer; font-family: var(--font); transition: all .15s;
  text-decoration: none; display: inline-block;
}
.setting-btn:hover { border-color: var(--accent2); color: var(--accent3); }
.setting-btn.danger { border-color: rgba(248,113,113,.3); color: var(--red); }
.setting-btn.danger:hover { background: rgba(248,113,113,.08); border-color: var(--red); }
.setting-btn.primary { background: linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; box-shadow:0 2px 8px rgba(124,111,255,0.3); }
.setting-btn.primary:hover { opacity:.9; }

/* Profile avatar */
.profile-avatar {
  width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
  box-shadow: 0 0 16px rgba(124,111,255,0.3);
}
.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 15px; font-weight: 700; color: var(--text); }
.profile-email { font-size: 12px; color: var(--text3); margin-top: 3px; }
.profile-role {
  display: inline-block; margin-top: 6px;
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px;
  background: rgba(124,111,255,0.15); border: 1px solid rgba(124,111,255,0.3);
  color: var(--accent3);
}

/* Version */
.version-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px;
  font-size: 11px; color: var(--text3);
}

/* Toast */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 20px;
  font-size: 13px; color: var(--text2); z-index: 999;
  animation: toastIn .2s ease; white-space: nowrap;
}
.toast.ok { border-color: rgba(74,222,128,.4); color: var(--green); }
.toast.err { border-color: rgba(248,113,113,.4); color: var(--red); }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* Password modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); z-index: 500;
  align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 16px; padding: 24px; width: min(400px, 96vw);
}
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 5px; letter-spacing:.05em; }
.field input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; color: var(--text);
  font-size: 13px; font-family: var(--font); outline: none; transition: border-color .15s;
}
.field input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
