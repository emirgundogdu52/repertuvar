    numara çıkıyor VE eserler.html'den ?work= ile girişte WL boş olunca picker'a
    düşülüyordu. r.ok + dizi kontrolü eklendi; timeout 4000→3500. Ayrıca ?work= yolu
    artık WL bir an boş olsa bile picker'a düşmeyip tek-eser sahnesine giriyor
    (ad/güfte works gelince tazeleniyor). Tek kök, üç sorunu kapatır.
  - 2026-07-17 (b): Çevrimdışı bildirimi eklendi — bağlantı GERÇEKTEN yoksa
    (navigator.onLine===false) ve veri yerelden gösteriliyorsa "📵 Çevrimdışı mod —
    yerel veriler gösteriliyor" toast'ı sayfa başına bir kez çıkar (works ve reps
    arka plan fetch'i başarısız olunca; stageToast/stageOfflineToast). repertuvarlar
    ve eserler ile aynı davranış.
  - 2026-07-17 (c): Akor rengi temaya duyarlı yapıldı. .cp-chord artık sabit mavi
    değil, var(--chord-color): karanlıkta #FFC83D (altın), açıkta #B26A00 (koyu amber).
    Güfteden (--text) net ayrışıp sahnede takibi kolaylaştırır. eserler.html'de de aynı.
  - 2026-07-17 (d): Sahne alt tabanı yeniden düzenlendi (güfteye daha çok yer).
    Menü (ayarlar) butonu küçültülüp mutlak konumla sağ alta, harf kontrolünün ÜSTÜNE
    alındı (.sb-menu/.sb-menu-btn — satır yüksekliği eklemez). Harf büyüt/küçült
    kontrolü küçültülüp "Sıradaki" kartıyla aynı alt satıra yan yana kondu. .sm ve
    .wlyrics alt padding'leri (80-100px → 20px) kısıldı; güfte alanı büyüdü.
  - 2026-07-17 (e): Alt kontrol çubuğu (.sb) artık in-flow değil, tabana YÜZEN
    overlay (position:absolute;bottom:0;pointer-events yalnız pill'lerde). Güfte alanı
    (.sm) ekranın en altına kadar uzuyor; alt boşluk yalnızca her zaman görünen harf
    kontrolünü aşacak kadar (calc(60px+safe-area)). Menü butonu/paneli güftenin üstüne
    biniyor (bazen açık). Böylece güftenin alt çizgisi menü üst hizasında kesilmiyor.
  - 2026-07-17 (f): Sahne alt menüsüne (v2StageBotNav → stageNavStage) "Ana Sayfa"
    linki eklendi (btnStageHome → index.html), Geri Dön ile Çık arasında. Menü artık:
    Geri Dön · Ana Sayfa · Çık.
  - 2026-07-18 (g): Desktop'ta (min-width:1024px) sağ alttaki "Navigasyon" (☰)
    butonu tepkisiz görünüyordu — openStageNav() çalışıyordu ama medya sorgusundaki
    #v2StageBotNav{display:none !important} menüyü tamamen gizliyordu. Eklenen kural:
    body.stage-active #v2StageBotNav:not(.stage-hidden) → display:flex !important +
    position:fixed alt şerit. Yani varsayılan gizli, butonla açılınca görünür.
  - 2026-07-18 (h): AKOR MODUNDA ± TON eklendi. Ton kaydırma ESER BAŞINA saklanır
    (personal_chords.transpose, kullanıcıya özel, cihazlar arası senkron). Motor:
    transposeChordPro/transposeChordToken/transposeNote — bemol tercihli (_CHROM_FLAT),
    slash bass (G/B) ve uzantılar (m7, sus4...) korunur. GÖRÜNÜM dönüşümüdür: kayıtlı
    akor metni asla değişmez, renderStage çizerken uygular. UI: Görünüm Ayarları (⚙)
    satırında Akor modunda − / rozet / + ; rozete basınca ton sıfırlanır. Aralık -6..+6.
  - 2026-07-18 (i): Ton kontrolünün yanına KARAR SESİ göstergesi eklendi — kaydırılmış
    güncel karar "A (La)" biçiminde yazılır (kaydırıldıysa altın renk, ipucunda orijinali).
    Solfej (La, Sib, Sol#) ve Latin (A, Bb) yazımı tanınır; perde adı gibi tanınmayan
    değerler KAYDIRILMADAN olduğu gibi gösterilir (koma sesleri 12 eşit aralığa oturmaz).
    Kaynak: repertuvar item.closingNote, yoksa WL[...].closingNote.
  - 2026-07-18 (j): Sahnede eser BAŞLIĞININ ALTINA karar sesi rozeti (.wkarar) eklendi —
    "Karar: A (La)" biçiminde, ton değiştikçe güncellenir (renderStage her ± basışında
    yeniden çizdiği için otomatik). Kaydırıldıysa altın (.shifted) + ipucunda orijinali.
    Tanınmayan yazımlar (perde adları) kaydırılmadan gösterilir, yanına "(kaydırılmadı)".
  - 2026-07-18 (k): Sahne alt menüsü (v2StageBotNav) iki düzeltme: (1) otomatik kapanma
    4sn → telefonda 8sn, masaüstü/tablette (min-width:768px) HİÇ kapanmıyor
    (scheduleStageNavHide); fare/parmak menü üzerindeyken sayaç duruyor, ayrılınca
    yeniden başlıyor. (2) Masaüstünde menü tüm sayfa genişliğine yayılıyordu — artık
    butonlar kadar geniş, ortalanmış bir kapsül (width:fit-content + margin:auto,
    .v2-bn-item flex:0 0 auto).
  - 2026-07-18 (l): Görünüm Ayarları şeridi (#stageToolsPanel) masaüstünde ekran boyu
    uzuyordu — inline stilde left:12px + right:12px vardı. @media(min-width:768px) ile
    left:auto + width:fit-content (!important, inline stili geçmek için) yapıldı:
    geniş ekranda butonlar kadar geniş, sağa yaslı; telefonda tam genişlik korunuyor.
  - 2026-07-18 (m): Görünüm Ayarları şeridi otomatik kapanma: 4sn → telefonda 8sn,
    masaüstü/tablette (min-width:768px) HİÇ kapanmıyor — kullanıcı ☰'ye veya dışarı
    basana kadar açık kalır. Fare/parmak şeridin üzerindeyken sayaç duruyor, ayrılınca
    yeniden başlıyor (scheduleStageToolsHide + panel hover/touch dinleyicileri).
  - 2026-07-18 (n): TABLET dikey + yatay düzeltmesi. (1) Kapsül menü ve "açık kalsın"
    davranışı yalnızca ≥1024px'te tanımlıydı; tablet DİKEY (768–1023) kapsam dışı
    kalıyordu — eşik @media(min-width:768px)'e indirildi, iki yönde de aynı davranış
    (JS zaten min-width:768px kullanıyor). transform:none eklendi ki stage-hidden'ın
    translateY'si açık kapsülde kalıntı bırakmasın. (2) Yatay/alçak ekranlar için
    @media(max-height:620px): #stageToolsPanel max-height + overflow-y:auto (menü
    ekran dışına taşıp "kaybolmuyor"), kapsül bottom 22→10px, başlık/karar/.sm
    boşlukları küçültüldü.
  - 2026-07-18 (o): Dört düzeltme. (1) BAŞLIK GÜFTEDEN AYRILDI — eser adı + karar
    rozeti artık kaydırılan .sm alanının dışında, sabit #smHead şeridinde; güfte
    büyüyüp kaydıkça başlık yerinden oynamıyor. Üst boşluklar küçültüldü (.sm
    padding-top 28→6px, .smhead 6/8px) — başlık ekranın üstüne yakın, alan verimli.
    (2) Karar rozeti BÜYÜTÜLDÜ: clamp(11–14px) → clamp(15–22px), font-weight 800
    (sahnede uzaktan okunabilsin). (3) ± TON artık eserde AKOR VARSA görünüyor
    (eskiden yalnızca Akor görünümündeyken gelirdi; Söz'e geçince "motor kayboldu"
    sanılıyordu) — Nota görünümünde gizli. (4) Alt menü (v2StageBotNav) HER ekran
    boyutunda 10sn sonra kapanıyor; masaüstü/tablette hiç kapanmaması kaldırıldı.
  - 2026-07-19 (r): POTPURİ (medley) desteği. repertoire_items.linked_prev=true olan
    ARDIŞIK eserler kesintisiz bir zincir sayılır. Sahnede: (1) üst barda zincir rozeti
    #medleyBadge — "🔗 Potpuri 2/3" (kaçıncı parçadasın); (2) "Sıradaki" kartı zincir
    içindeyken altın çerçeveli "🔗 POTPURİ — DEVAMI" başlığına döner (kart KALDIRILMADI
    — potpuride sıradakini bilmek daha da önemli); (3) zincirin son parçasında kart
    normale döner. Yardımcılar: stageChainInfo(items,idx) → {inChain,pos,len,nextLinked}.
    linked_prev alanı items map'inde zaten ...t ile geliyor; ilk satırda yok sayılır.
  - 2026-07-19 (p): GÖRÜNÜM SEÇİCİ (Söz/Akor/Nota) AÇILIR MENÜDEN SEKME (tab)
    STİLİNE çevrildi. Üst bardaki #viewModeBtn ikonu + #viewModeMenu açılır menüsü
    KALDIRILDI; yerine üst barda her zaman görünen segmented sekme şeridi geldi:
    #viewModeTabs (.vm-tabs / .vm-tab, data-mode="lyrics|chords|nota"). Aktif sekme
    accent dolgulu; eserde o veri yoksa sekme pasif (disabled, .32 opaklık) ama
    ŞERİT HER ZAMAN GÖRÜNÜR (yalnız güftesi olan eserlerde de) — eski "menü kayıp"
    kuralı korunuyor. Dar ekranda (<430px) sekme etiketleri gizlenir, yalnız ikon
    kalır (dokunma alanı ≥40px korunur). Fonksiyonlar: setViewMode() aynı,
    updateViewToggleUI() artık sekmeleri işaretliyor; toggleViewModeMenu()/
    closeViewModeMenu() geriye dönük uyumluluk için boş stub olarak duruyor.

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title data-i18n="sh.sayfaBaslik">Sahne Modu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--surface:#0f0f1a;--surface2:#161625;--border:#484860;--accent:#a855f7;--accent2:#c084fc;--text:#f1f0ff;--text2:#8b8aa8;--text3:#3d3d58;--green:#4a9462;--red:#c05444;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;user-select:none;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
/* Picker ve bitiş ekranlarında üst nav görünür kalıyor — bu ekranlar onun gerçek
   yüksekliğinin (66px içerik + safe-area) altından başlamalı. Sahne performans ekranında
   üst nav gizlendiği için (showScreen()) o ekran tam viewport'ta (top:0) kalmaya devam ediyor. */
#pickerScreen, #endScreen{top:calc(66px + env(safe-area-inset-top));}
.screen.hidden{display:none;}

#pickerScreen{background:var(--bg);overflow:hidden;}
.pi{width:100%;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;}
.pi-fixed-top{flex-shrink:0;padding:4px 24px 0;}
.pi-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 24px;}
.pi-fixed-bottom{flex-shrink:0;padding:16px 24px calc(32px + env(safe-area-inset-bottom));}
.plogo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center;}
.plogo small{color:var(--text2);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
.ptitle{font-weight:800;letter-spacing:-.02em;font-size:26px;color:var(--text);margin-bottom:8px;text-align:center;}
.psub{font-size:13px;color:var(--text2);margin-bottom:16px;text-align:center;}
.rsl{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;}
.rsl::-webkit-scrollbar{width:4px;}.rsl::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.rsi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;justify-content:space-between;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none;}
.rsi:hover{border-color:rgba(255,200,61,.4);background:var(--surface2);}
.rsi.sel{border-color:#FFC83D;background:linear-gradient(rgba(255,200,61,.10),rgba(255,200,61,.10)),var(--surface);}
.rsn{font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px;}
.rsm{font-size:12px;color:var(--text2);}
.rsc{font-size:12px;color:var(--text3);}
/* ── İKİ YÖNLÜ KAYDIRMA (repertuvarlardaki desenin aynısı): sağa → Değiştir, sola → Sil/Gizle ── */
.rs-wrap{position:relative;overflow:hidden;border-radius:10px;}
.rs-wrap .rsi{position:relative;z-index:2;touch-action:pan-y;}
.rs-edit-bg,.rs-delete-bg{position:absolute;top:0;bottom:0;width:84px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;z-index:1;cursor:pointer;}
.rs-edit-bg{left:0;background:#4DA3FF;}
.rs-delete-bg{right:0;background:#FF5A5F;}
.rs-delete-bg.rs-hide-bg{background:#4A90D9;}
.rs-edit-bg i,.rs-delete-bg i{font-size:18px;}
/* Swipe sırasında mavi→kırmızı gradient çerçeve — parmak ne kadar kayarsa o kadar belirginleşir */
.rs-wrap::before {
  content:''; position:absolute; inset:0; border-radius:10px; padding:2.5px;
  background:linear-gradient(90deg,#4DA3FF,#FF5A5F);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:var(--swipe-glow,0); pointer-events:none; z-index:3;
}
/* Picker ekranı: marka paleti (altın/mavi) — sahne performans ekranı kendi mor gece paletinde kalıyor */
#pickerScreen{--accent:#FFC83D;--accent2:#4DA3FF;}
.bstart{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;padding:9px;color:#0a0818;font-size:16px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .15s,transform .1s;box-shadow:0 4px 14px rgba(255,200,61,.22);}
.bstart:hover{opacity:.92;}
.bstart:active{transform:scale(.98);}
.bstart:disabled{opacity:.35;cursor:not-allowed;}
.bback{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--text3);text-decoration:none;}
.bback:hover{color:var(--text2);}
.loading{text-align:center;color:var(--text2);padding:24px;font-size:13px;}

.stb{display:flex;flex-direction:column;align-items:stretch;padding:8px 16px 7px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);gap:7px;position:relative;z-index:401;}
.stb-r1{display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 16px 6px;}
.stb-r2{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;}
#v2StageBotNav .v2-bn-exit { color: #c05444 !important; }
#v2StageBotNav .v2-bn-exit:hover { color: #e06655 !important; }
.strn{font-size:12px;color:var(--text2);font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto;}
.stp{display:flex;align-items:center;gap:10px;}
.pds{display:flex;gap:5px;align-items:center;}
.pd{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .2s,transform .2s;flex-shrink:0;}
.pd.done{background:var(--text3);}
.pd.cur{background:var(--accent);transform:scale(1.4);}
.pbar{width:96px;height:4px;border-radius:999px;background:var(--border);overflow:hidden;}
.pbar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s;}
.stc{display:inline;font-size:11px;font-weight:600;color:var(--text2);margin-left:6px;}
.bex{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text3);font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.bex:hover{color:var(--red);border-color:var(--red);}

/* ═══ Görünüm seçici: Söz / Akor / Nota — SEKME (tab) stili, üst barda ═══ */
/* 2026-07-19: açılır menü (.vm-menu/.vm-item) yerine her zaman görünen sekme şeridi. */
/* ── POTPURİ rozeti (2026-07-19) ── */
.medley-badge{display:none;align-items:center;gap:5px;background:rgba(255,200,61,.14);border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.np.medley{border-color:var(--accent);background:rgba(255,200,61,.10);}
.np.medley .nl{color:var(--accent);font-weight:800;}
.vm-tabs{display:flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:3px;flex-shrink:0;}
.vm-tab{display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;color:var(--text2);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.01em;padding:0 11px;height:34px;min-width:40px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .14s,color .14s;}
.vm-tab .ti{font-size:17px;line-height:1;}
.vm-tab:hover:not(:disabled):not(.active){color:var(--text);background:rgba(255,255,255,.05);}
.vm-tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28);}
.vm-tab.active .ti{color:#fff;}
.vm-tab:disabled{opacity:.32;cursor:not-allowed;}
/* Dar ekran: etiket gizlenir, ikon kalır — dokunma alanı korunur */
@media (max-width:430px){
  .vm-tab .vm-lbl{display:none;}
  .vm-tab{padding:0 9px;min-width:42px;}
  .stage-info-btn .vm-lbl{display:none;}
  .stage-info-btn{padding:0 9px;}
}

/* Sabit başlık şeridi — güfte alanının DIŞINDA, üstte durur. Güfte büyüyüp
   kaydıkça başlık yerinden oynamaz; alan da verimli kullanılır (üste yakın). */
.smhead{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 16px 4px;text-align:center;position:relative;z-index:5;}   /* (2026-08-06) alt boşluk 8→4 */
.smhead .wtitle{margin-bottom:2px;}
.smhead .wnum{margin-bottom:2px;}
/* (2026-08-06) DİKEY ORTALAMA KALDIRILDI. Söz bloğu ekranın ortasına
   yaslandığı için yazı büyütüldükçe metin YUKARI doğru taşıyordu ve okunan
   satırın yeri kayıyordu. Artık içerik SOL ÜSTTEN başlıyor, büyüdükçe sağa
   ve aşağı doğru genişliyor — göz aynı noktada kalıyor. Yatay hiza kullanıcı
   tercihinde (Görünüm Ayarları → sola/ortala/sağa), varsayılan artık SOL. */
.sm{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px 16px calc(58px + env(safe-area-inset-bottom));position:relative;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;}.sm::-webkit-scrollbar{display:none;}
/* (2026-08-13) SÖZ ALANI KAYDIRILAMIYORDU (fare tekerleği çalışmıyor, uzun
   eserin başına/sonuna gidilemiyor). SEBEP: .sm bir flex öğesi ve flex
   öğelerinin varsayılan min-height değeri AUTO — yani öğe içeriğinden daha
   kısa olamıyor. Bu yüzden .sm içerik kadar UZUYORDU, overflow-y:auto hiç
   devreye girmiyordu ve taşan kısım body'nin overflow:hidden'ı tarafından
   kırpılıyordu. min-height:0 öğenin küçülmesine izin verir, kaydırma
   böylece gerçekten çalışır. (Aynı düzeltme .pi-scroll'da zaten vardı.)
   FARE İLE KULLANILAN CİHAZLARDA İNCE ÇUBUK GÖSTERİLİYOR: dokunmatikte
   çubuk gereksiz ve sahnede dikkat dağıtıcı, ama masaüstünde kaydırma
   imkânının GÖRÜNÜR olması gerekiyor — yoksa kullanıcı kaydırılabileceğini
   bilmiyor (Emir bildirdi). */
@media (pointer:fine){
  .sm{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent;}
  .sm::-webkit-scrollbar{display:block;width:8px;}
  .sm::-webkit-scrollbar-track{background:transparent;}
  .sm::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:8px;}
  .sm::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.34);}
  body.day-theme .sm{scrollbar-color:rgba(0,0,0,.24) transparent;}
  body.day-theme .sm::-webkit-scrollbar-thumb{background:rgba(0,0,0,.24);}
  body.day-theme .sm::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}
}
.sm::before{content:'';position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;} .sm>*{position:relative;z-index:1;}
.wnum{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;opacity:0;animation:si .4s ease forwards;}
/* (2026-08-13) iOS SAFARI ÇİFT DOKUNUŞ YAKINLAŞTIRMASI KAPATILDI.
   Belirti (Emir, iPhone Safari): ton düğmesine arka arkaya iki kez basınca sayfa
   "zoom in" yapıyor, yazılar büyüyor. SEBEP: iOS 10'dan beri Safari
   `user-scalable=no` meta ayarını YOK SAYIYOR (erişilebilirlik gerekçesiyle);
   bir düğmeye 300 ms içinde iki kez dokunmak çift dokunuş sayılıp yakınlaştırma
   tetikliyor. ÇÖZÜM: etkileşimli öğelerde `touch-action:manipulation` — çift
   dokunuş yakınlaştırmasını kapatır, kaydırma ve PARMAKLA (pinch) yakınlaştırma
   çalışmaya devam eder. KASITLI OLARAK sahne gövdesine/nota alanına
   uygulanmıyor: notaya çift dokunup yakınlaştırmak işe yarıyor. */
button, .align-btn, .ton-btn, .ton-step, .vm-tab, .fs-step, .side-nav-btn,
.sb-menu-btn, .stage-info-btn, .nota-pager button, .bex, .st-act,
input[type="range"], #stageToolsPanel, .stage-nav a{ touch-action:manipulation; }
/* (2026-08-13) PANEL ARTIK YARI SAYDAM + BULANIK ZEMİN.
   Emir: "açılan menünün zemini eserin sözlerini tamamen kapatıyor."
   Şeffaflık tek başına okunaklılığı bozardı (arkadaki söz satırları düğme
   yazılarıyla karışır); bu yüzden backdrop-filter ile ARKASI BULANIKLAŞTIRILIYOR
   — söz "var" ama okunmuyor, panel yazısı net kalıyor. Bulanıklığı desteklemeyen
   tarayıcıda (eski Firefox vb.) zemin neredeyse opak hâle düşürülüyor.
   SAYDAMLIK ORANI ÖLÇÜLEREK SEÇİLDİ (0.78): en kötü hâlde (panel BEYAZ söz
   metninin üstüne denk gelince) etiket kontrastı 5.6:1, ikonlar 6.8:1 —
   WCAG AA (4.5) üstünde. 0.72'de etiket 4.5'in altına düşüyordu.
   Zemin/çerçeve artık inline stilde DEĞİL — inline stil sınıf kuralını ezdiği
   için tema değişimi ve saydamlık burada yönetiliyor (bkz. 2026-08-12 dersi). */
#stageToolsPanel{
  background:rgba(14,14,26,.78);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 28px rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(16px) saturate(130%);
  backdrop-filter:blur(16px) saturate(130%);
}
body.day-theme #stageToolsPanel{
  background:rgba(252,251,249,.82);
  border-color:rgba(0,0,0,.14);
  box-shadow:0 8px 28px rgba(0,0,0,.18);
}
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){
  #stageToolsPanel{ background:rgba(14,14,26,.94); }
  body.day-theme #stageToolsPanel{ background:rgba(252,251,249,.96); }
}
/* (2026-08-13) PANEL YAZILARI AÇILDI. --text3 gece temasında #3d3d58 —
   panel zemininde kontrastı ~2:1, sahnede karanlıkta okunmuyordu (Emir bildirdi).
   Yalnızca panel içinde açık ton kullanılıyor; --text3 başka yerlerde (ipucu,
   pasif metin) olduğu gibi kalıyor. */
#stageToolsPanel .st-grp-lbl{ color:#bfbdd6; }
#stageToolsPanel .align-btn:not(.active),
#stageToolsPanel .ton-step,
#stageToolsPanel .ton-btn:not(.shifted),
#stageToolsPanel .font-slider-wrap .fs-a-sm,
#stageToolsPanel .font-slider-wrap .fs-a-lg{ color:#d3d1e6; }
#stageToolsPanel .align-btn:not(.active),
#stageToolsPanel .ton-step,
#stageToolsPanel .ton-btn:not(.shifted),
#stageToolsPanel .font-slider-wrap,
#stageToolsPanel .ton-slider-wrap{ border-color:rgba(255,255,255,.22); }
#stageToolsPanel .font-slider-wrap,
#stageToolsPanel .ton-slider-wrap{ background:rgba(255,255,255,.06); }
#stageToolsPanel .st-grp + .st-grp{ border-top-color:rgba(255,255,255,.14); }
/* (2026-08-13) Sahne bloğu da aynı okunaklılık kuralına tabi: --text3 panel
   zemininde okunmuyor. Çıkış satırı KIRMIZI kalıyor (kasıtlı ayrım) ama
   karanlıkta seçilebilsin diye açık kırmızıya alındı. */
#stageToolsPanel .st-act:not(.st-act-exit){ color:#d3d1e6; border-color:rgba(255,255,255,.22); }
#stageToolsPanel .st-act-exit{ color:#f08878; border-color:rgba(240,136,120,.45); }
body.day-theme #stageToolsPanel .st-act:not(.st-act-exit){ color:#3d3a52; border-color:rgba(0,0,0,.18); }
body.day-theme #stageToolsPanel .st-act-exit{ color:#b8402c; border-color:rgba(184,64,44,.4); }
body.day-theme #stageToolsPanel .st-grp-lbl{ color:#5a5670; }
body.day-theme #stageToolsPanel .align-btn:not(.active),
body.day-theme #stageToolsPanel .ton-step,
body.day-theme #stageToolsPanel .ton-btn:not(.shifted),
body.day-theme #stageToolsPanel .font-slider-wrap .fs-a-sm,
body.day-theme #stageToolsPanel .font-slider-wrap .fs-a-lg{ color:#3d3a52; }
body.day-theme #stageToolsPanel .align-btn:not(.active),
body.day-theme #stageToolsPanel .ton-step,
body.day-theme #stageToolsPanel .ton-btn:not(.shifted),
body.day-theme #stageToolsPanel .font-slider-wrap,
body.day-theme #stageToolsPanel .ton-slider-wrap{ border-color:rgba(0,0,0,.18); }
body.day-theme #stageToolsPanel .font-slider-wrap,
body.day-theme #stageToolsPanel .ton-slider-wrap{ background:rgba(0,0,0,.04); }
body.day-theme #stageToolsPanel .st-grp + .st-grp{ border-top-color:rgba(0,0,0,.12); }
/* Görünüm Ayarları şeridi (#stageToolsPanel) inline stilde left:12px + right:12px
   olduğu için masaüstünde ekran boyu uzuyordu. Geniş ekranda butonlar kadar geniş
   olsun, sağ kenara yaslansın; telefonda tam genişlik kalsın (butonlar sarabilsin).
   Inline stili geçmek için !important şart. */
@media (min-width:768px){
  #stageToolsPanel{ left:auto !important; width:fit-content !important; max-width:calc(100vw - 24px) !important; }
}
.wtitle{font-family:'DM Sans',sans-serif;font-size:clamp(22px,3.4vw,36px);font-weight:700;color:var(--text);text-align:center;line-height:1.2;max-width:100%;margin-bottom:10px;opacity:0;animation:si .4s ease .07s forwards;}
/* Karar sesi rozeti — başlığın altında, ton değiştikçe güncellenir */
.wkarar{font-size:clamp(15px,2.1vw,22px);font-weight:800;letter-spacing:.05em;color:var(--text2,#9aa4b2);text-align:center;margin:0;opacity:0;animation:si .4s ease .12s forwards;}
.wkarar.shifted{color:var(--accent,#FFC83D);}
.wcr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;opacity:0;animation:si .4s ease .14s forwards;}
.wcr:empty{display:none;margin:0;}
.wch{padding:5px 14px;border-radius:20px;font-size:13px;border:1px solid var(--border);color:var(--text2);background:var(--surface);}
.wch.m{border-color:#3a3060;color:#9b8fd4;background:#1a1828;}
.wch.n{border-color:#3d2a1a;color:var(--accent);background:#1e1208;}
.wch.i{border-color:#1a2d1a;color:#7ab87a;background:#0f1a0f;}
.wnote{font-size:13px;color:var(--text2);text-align:center;font-style:italic;max-width:100%;line-height:1.6;opacity:0;animation:si .4s ease .2s forwards;}
/* (2026-08-21) KİŞİSEL NOT — sahnede SALT OKUNUR. Turkuaz + kilit, altın
   (--accent) marka vurgusundan ve paylaşılan alanlardan ayrılsın diye.
   Karanlıkta simge ve sol kenar çizgisi renkten hızlı okunuyor. */
.knot-sahne{display:flex;align-items:flex-start;gap:8px;margin:10px auto 0;max-width:100%;
  padding:7px 11px;border-radius:9px;text-align:left;cursor:pointer;
  border:1px solid rgba(45,212,191,.28);border-left:3px solid #2dd4bf;background:rgba(45,212,191,.07);
  opacity:0;animation:si .4s ease .25s forwards;}
.knot-sahne i{color:#5eead4;font-size:14px;line-height:1.5;flex:0 0 auto;}
.knot-sahne .kn-tx{font-size:13px;line-height:1.55;color:var(--text2);white-space:pre-wrap;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
.knot-sahne.acik .kn-tx{-webkit-line-clamp:unset;display:block;}
.knot-sahne .kn-dh{flex:0 0 auto;color:var(--text3);font-size:11px;margin-left:auto;align-self:center;}
.wlyrics{font-size:calc(clamp(18px,2.8vw,28px) * var(--lyrics-scale,1) * var(--fit-scale,1));color:var(--text);text-align:left;width:100%;max-width:100%;line-height:1.9;opacity:0;animation:si .4s ease .28s forwards;margin-top:2px;padding:0 4px 16px;box-sizing:border-box;overflow-x:hidden;overflow-wrap:break-word;-webkit-overflow-scrolling:touch;}
.wnota{display:flex;justify-content:center;align-items:center;opacity:0;animation:si .4s ease .28s forwards;margin-top:16px;padding:0 8px 40px;width:100%;}
/* ═══ 2026-07-20: ÇOK SAYFALI NOTA — sayfa göstergesi + pager ═══ */
.wnota{flex-direction:column;gap:10px;}
.wnota img{max-width:100%;max-height:70vh;border-radius:8px;}
.nota-count{position:absolute;top:10px;right:12px;z-index:40;font-size:12px;font-weight:800;letter-spacing:.04em;
  padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(6px);pointer-events:none;}
body.stage-light .nota-count{background:rgba(255,255,255,.75);color:#1a1a1a;border-color:rgba(0,0,0,.15);}
.nota-pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0 8px;}
.nota-pager button{background:none;border:1px solid var(--border);color:var(--text2);border-radius:999px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.nota-pager button:disabled{opacity:.25;pointer-events:none;}
.nota-dots{display:flex;gap:8px;align-items:center;}
.nota-dot{width:9px;height:9px;border-radius:50%;background:var(--border);border:none;padding:0;cursor:pointer;transition:all .18s;}
.nota-dot.cur{background:var(--accent);transform:scale(1.35);}
.nota-pdf{background:var(--surface2, #16161c);border:1px solid var(--border);border-radius:8px;padding:18px;text-align:center;color:var(--text2);font-size:14px;}
.wlyrics::-webkit-scrollbar{width:3px;}.wlyrics::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
/* ChordPro: akor hecenin üstünde */
/* (2026-08-10) GERİ ALINDI — bu deneme sahnede ciddi bozulma yaptı:
   `text-indent:-1.4em` ilk satırı kabın soluna taşıyıp KIRPIYOR, `nowrap`
   ise segmentleri üst üste bindiriyordu (Emir ekran görüntüsü).
   Uzun satır sorunu başka yoldan çözülecek (yazı boyutu uyarlama ya da
   kaynakta satır bölme). Aşağıdaki kurallar ESKİ, ÇALIŞAN hâline döndürüldü.
   Eski deneme notu:
   Sorun: bir `.cp-seg` (akor + onu takip eden heceler) kendi İÇİNDE de
   kırılabiliyordu; kırılma parçanın ortasına gelince akor üstte kalıyor,
   sözün devamı alta iniyor ve akor kaymış görünüyordu.
   Çözüm: segmentler `white-space:nowrap` — satır artık yalnızca AKORLAR
   ARASINDAN kırılıyor, akor hecesinden hiç ayrılmıyor.
   Ayrıca alta inen devam satırı içeri girintili (asılı girinti) ki yeni bir
   dize mi yoksa devam mı olduğu bir bakışta anlaşılsın. */
.wlyrics .cp-line{display:block;text-align:left;}
.wlyrics .cp-blank{display:block;height:.9em;}
.wlyrics .cp-comment{display:block;text-align:left;color:var(--marker-color,#8FA6FF);font-style:italic;font-size:.7em;margin:10px 0 2px;opacity:.9;}
.wlyrics .cp-seg{display:inline-block;position:relative;vertical-align:bottom;}
/* 2026-07-29: akor genişliğe katkı vermesin (width:0) — yoksa .cp-seg genişliği
   max(akor, hece) olduğu için akor heceden genişken kelime ortadan yarılıyordu
   ("varıl maz") ve akorlar yapışıyordu. Heceye bağlı olmayan akorlar (.cp-tail)
   genişliği korur ki yan yana geldiklerinde araları açık kalsın. */
.wlyrics .cp-chord{display:block;width:0;overflow:visible;font-size:.62em;font-weight:700;color:var(--chord-color,#FFC83D);line-height:1.15;min-height:1.2em;white-space:nowrap;font-family:'SF Mono',ui-monospace,monospace;letter-spacing:.02em;}
.wlyrics .cp-seg.cp-tail .cp-chord{width:auto;padding-right:.7em;}
/* (2026-08-09) Satır sonu tekrar rozeti — "2X". Akor değil, satıra ait not. */
/* (2026-08-13) RENK AYRILDI: işaretler (2X, Nakarat, Bağlantı) akorlarla aynı
   renkteydi ve sahnede karışıyordu (Emir bildirdi). Artık kendi değişkenleri var:
   --marker-color, mavi-mora yakın. Böylece üç katman üç renk oluyor —
   SÖZ beyaz (--text), AKOR altın (--chord-color), İŞARET mavi-mor. Rozet
   çerçevesi/zemini de aynı değişkenden türüyor. */
.cp-rep{display:inline-block;margin-left:10px;padding:0 7px;border-radius:10px;font-size:.62em;font-weight:800;
  letter-spacing:.04em;vertical-align:middle;color:var(--marker-color,#8FA6FF);border:1px solid var(--marker-color,#8FA6FF);
  background:color-mix(in srgb, var(--marker-color,#8FA6FF) 14%, transparent);white-space:nowrap;}
/* Akor rengi — temaya duyarlı altın/amber, güfteden ayrışsın (2026-07-17) */
:root{--chord-color:#FFC83D;}            /* karanlık: parlak altın */
body.day-theme{--chord-color:#B26A00;}   /* açık: koyu amber (beyaz zeminde kontrast) */
/* İşaret rengi (2X, Nakarat, Bağlantı…) — akordan da sözden de ayrı. Marka
   mavisine (#3522C9) yakın ama sahne karanlığında okunacak kadar açık. */
:root{--marker-color:#8FA6FF;}           /* karanlık: soğuk lavanta-mavi */
body.day-theme{--marker-color:#3F3BC0;}  /* açık: koyu indigo */
[data-theme="light"]{--marker-color:#3F3BC0;}
[data-theme="light"]{--chord-color:#B26A00;}
.wlyrics .cp-lyric{display:block;white-space:pre-wrap;}

/* (2026-08-06) Kart 10px aşağı indi: dip boşluğu 16→6px. */
.sb{padding:0 16px 6px;position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:10px;z-index:10;pointer-events:none;}
.sb > *{pointer-events:auto;}
/* (2026-08-06) ⚙ düğmesi artık alt şeridin ÜSTÜNDE değil, İÇİNDE: normal bir
   flex öğesi olduğu için .sb'nin align-items:flex-end'i sayesinde alt hizası
   "Sıradaki" kartıyla (.np) kendiliğinden aynı seviyede — her ekran boyutunda,
   safe-area dahil. Eskiden bottom:calc(100% + 6px) ile kartın üstünde duruyordu.
   Panel position:fixed olduğu için bu değişiklikten etkilenmiyor. */
.sb-menu{position:relative;order:2;margin-left:auto;z-index:11;align-self:stretch;display:flex;}
/* (2026-08-06) Düğme "Sıradaki" kartıyla ORANTILI: aynı yükseklikte
   (align-self:stretch), aynı köşe yarıçapı (10px) ve aynı sarı çerçeve —
   yan yana durdukları için ikisi tek bir şeritmiş gibi görünüyor. */
.sb-menu-btn{background:var(--surface);border:1px solid #FFC83D;border-radius:10px;width:46px;min-height:100%;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;transition:color .15s,border-color .15s;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.sb-menu-btn .ti{font-size:20px;}
.sb-menu-btn:hover{color:var(--text);border-color:var(--accent);}
.sb-menu-btn i{font-size:18px;}

#v2StageBotNav{
  position:fixed;bottom:0;left:0;right:0;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  will-change:transform;
  z-index:100;
}
#v2StageBotNav.stage-hidden{transform:translateY(100%);}
/* Sahne ekranındayken paylaşılan topnav.js header'ı ve alt navbar'ı kesin gizle

body.stage-active .r-topnav,
body.stage-active #r-topnav-container .r-topnav,
body.stage-active #r-bottom-nav{display:none !important;}

/* (2026-08-06) Kart alçaltıldı, genişlik tavanı kaldırıldı ve YATAY kuruldu:
   solda ad, ortada ayraç, sağda iki satır bilgi. ⚙ düğmesine kadar uzanıyor. */
.np{background:var(--surface);border:1px solid #FFC83D;border-radius:10px;padding:6px 14px;flex:1 1 auto;min-width:0;max-width:none;opacity:0;animation:fi .5s ease .4s forwards;display:flex;flex-direction:column;gap:2px;justify-content:center;}
.np-top{display:flex;align-items:baseline;gap:9px;min-width:0;}
.np-side{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;}
.nl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);font-weight:600;flex:0 0 auto;}
.nn{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;flex:1 1 auto;min-width:0;}
.nmv{font-size:12px;color:var(--text2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.nmx{width:1px;height:13px;background:var(--border);flex-shrink:0;display:block;}
.th{font-size:11px;color:var(--text3);text-align:right;flex-shrink:0;line-height:1.5;opacity:0;animation:fi .5s ease .5s forwards;}
.th kbd{display:inline-block;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;font-family:'DM Sans',sans-serif;color:var(--text3);}

#endScreen{background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
.ei{font-size:56px;margin-bottom:24px;animation:pls 2s ease infinite;}
.et{font-family:'Playfair Display',serif;font-size:36px;color:var(--accent);margin-bottom:12px;}
.es{font-size:15px;color:var(--text2);margin-bottom:8px;}
.ec{font-size:13px;color:var(--text3);margin-bottom:36px;}
.ea{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.be{padding:12px 24px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
.bep{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#0a0818;font-weight:500;}
.bep:hover{opacity:.92;}
.beg{background:none;border:1px solid var(--border);color:var(--text2);}
.beg:hover{border-color:#38383f;color:var(--text);}
.sf{position:fixed;inset:0;background:rgba(168,85,247,0.06);pointer-events:none;animation:ff .25s ease forwards;z-index:99;}

@keyframes si{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ff{to{opacity:0}}

/* (2026-08-06) Görünüm Ayarları paneli BLOKLARA bölündü. Eskiden tüm düğmeler
   tek bir düz sıradaydı (hiza + ton + akor yazımı + tema + liste yan yana) ve
   sahnede hangi düğmenin ne yaptığı okunmuyordu. Artık her işlev kendi
   başlıklı bloğunda; blok yoksa (ör. eserde akor yoksa) hiç çizilmiyor. */
/* Panel ekranın tamamını kaplamasın: genişlik İÇERİĞE göre (width:max-content),
   sağ kenara yaslı, dar ekranda ekranı taşmıyor (2026-08-06). */
.st-grp{display:flex;flex-direction:column;gap:5px;padding:7px 0;align-items:flex-end;}
.st-grp + .st-grp{border-top:1px solid var(--border);}
.st-grp-lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);text-align:right;}
/* Düğmeler SAĞA toplanıyor: panel sağ alttaki ⚙'nin üstünde açılıyor, başparmak
   oraya yakın duruyor (2026-08-06). */
/* Satır ekrana sığmazsa sarsın; hiçbir düğme kenardan taşıp kesilmesin
   (2026-08-06: Ton bloğunda "−" düğmesi ekran dışında kalıyordu). */
.st-grp-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:100%;}
.st-grp-row .ton-karar{flex-shrink:1;min-width:0;}
/* (2026-08-13) SAHNE BLOĞU — dikey, YAZILI eylem satırları.
   Eskiden sahneden çıkış yolu "Görünüm" bloğundaki ☰ düğmesiydi: ona dokununca
   ALTTAN ikinci bir şerit (#v2StageBotNav) açılıyor, asıl Geri Dön / Ana Sayfa /
   Çık orada duruyordu. İki adımlıydı ve ikon ne yaptığını anlatmıyordu — bunu
   bilmeyen sahneden nasıl çıkacağını bulamıyordu (Emir bildirdi). Artık üç eylem
   doğrudan panelde, YAZIYLA ve tek dokunuşla. Genişlik 144px: diğer bloklarla
   (yazı boyutu, hizalama) aynı hizada bitsin. */
.st-grp-col{flex-direction:column;align-items:stretch;gap:5px;width:144px;flex-wrap:nowrap;}
.st-act{display:flex;align-items:center;gap:9px;width:100%;height:38px;padding:0 11px;box-sizing:border-box;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text3);font-family:inherit;font-size:13px;font-weight:700;line-height:1;text-align:left;text-decoration:none;cursor:pointer;transition:all .15s;}
.st-act .ti{font-size:17px;flex-shrink:0;opacity:.85;}
.st-act:hover{border-color:var(--accent);color:var(--accent);}
.st-act:active{transform:scale(.97);}
.st-act-exit{color:#c05444;border-color:rgba(192,84,68,.45);}
.st-act-exit:hover{color:#e06655;border-color:#e06655;}
.align-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text3);width:44px;height:44px;font-size:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.align-btn:disabled{opacity:.35;cursor:not-allowed;}
.align-btn:hover{border-color:var(--accent);color:var(--accent);}
.align-btn.active{background:rgba(168,85,247,.15);border-color:var(--accent);color:var(--accent);}
/* (2026-08-06) Genişlik TON bloğuyla aynı: 3 düğme × 44px + 2 boşluk × 6px = 144px.
   Böylece paneldeki bloklar aynı hizada bitiyor. Kaydırıcı kalan yeri kaplıyor. */
.font-slider-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 10px;flex-shrink:0;width:144px;box-sizing:border-box;}
.font-slider-wrap .fs-a-sm{font-size:13px;font-weight:800;color:var(--text3);line-height:1;}
.font-slider-wrap .fs-a-lg{font-size:19px;font-weight:800;color:var(--text3);line-height:1;}
.fs-step{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:8px;font-family:inherit;transition:color .15s,background .15s;flex-shrink:0;}
.fs-step:hover{color:var(--text);background:var(--surface2);}
.fs-step:active{transform:scale(.94);}
/* (2026-08-06) Kaydırıcı BÜYÜTÜLDÜ — panele taşındıktan sonra parmakla tutup
   sürüklemesi zordu (Emir bildirdi). Ray kalınlaştı, tutamak 22→30px,
   dokunma alanı için dikey padding verildi. */
/* (2026-08-06) Dikey padding KALDIRILDI: arka plan padding alanını da boyadığı
   için kaydırıcı ince bir çizgi değil kalın bir anahtar gibi görünüyordu.
   Dokunma payı artık sarmalayıcının iç boşluğundan geliyor. */
.font-slider,.ton-slider{-webkit-appearance:none;appearance:none;flex:1;min-width:0;width:auto;height:6px;border-radius:999px;background:var(--border);outline:none;cursor:pointer;padding:0;}
.font-slider::-webkit-slider-thumb,.ton-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;border:none;}
.font-slider::-moz-range-thumb,.ton-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;border:none;}
.font-slider::-moz-range-track,.ton-slider::-moz-range-track{height:6px;border-radius:999px;background:transparent;}
/* (2026-08-13) TON KAYDIRICISI — yazı boyutu kaydırıcısıyla aynı görsel dil.
   Kapalıyken tek düğme (o anki karar sesi yazılı), dokununca bu satır açılıyor,
   seçim yapılınca kendiliğinden kapanıyor. Genişlik font bloğundan fazla (214px)
   çünkü 13 adımlı bir kaydırıcı 144px'e sığdırılırsa adım başına 9px kalıyor ve
   sahnede parmakla bir adım şaşırmak kolay — bu yüzden iki yanına tek adım
   düğmesi kondu; blok geçici olduğu için panelin dar hâlini kalıcı bozmuyor. */
.ton-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text3);height:44px;min-width:64px;padding:0 12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.ton-btn:hover{border-color:var(--accent);color:var(--accent);}
.ton-btn.shifted{color:var(--accent);border-color:var(--accent);}
.ton-btn .ti{font-size:16px;opacity:.7;}
.ton-slider-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 8px;flex-shrink:0;width:214px;max-width:100%;box-sizing:border-box;}
.ton-step{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text3);width:30px;height:30px;flex-shrink:0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ton-step:hover{border-color:var(--accent);color:var(--accent);}
.ton-step:active{transform:scale(.94);}
.ton-nota{min-width:50px;flex-shrink:0;text-align:center;font-size:14px;font-weight:800;color:var(--accent);white-space:nowrap;}
.ton-nota small{display:block;font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.04em;}
/* Telefonda DARALTMIYORUZ: kontrol artık alt şeritte değil panelde, yer var. */
@media (max-width:768px){ .font-slider-wrap .fs-a-sm{font-size:12px;} .font-slider-wrap .fs-a-lg{font-size:18px;} }
.stage-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;} .stage-nav a{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text3);font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.stage-nav a:hover{border-color:var(--accent);color:var(--accent);}

/* (2026-08-06) YAN OKLAR ARTIK YALNIZCA MASAÜSTÜNDE.
   Telefon/tablette swipe zaten çalışıyor ve oklar söz metninin üstüne biniyordu.
   Masaüstünde ise dokunmatik yok, swipe yok — klavye dışında tek gezinme yolu
   bunlar, o yüzden orada kalıyorlar (geçmiş: oklar "söze dokununca kazara eser
   atlama" sorununun çözümü olarak büyütülmüştü). */
@media (max-width:1023px), (hover:none) and (pointer:coarse) {
  .side-nav-btn { display:none !important; }
}
.side-nav-btn {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(168,85,247,0.12);
  border: 1px solid rgba(168,85,247,0.3);

  color: var(--accent);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;

}
.snb-arrow { font-size: 28px; line-height: 1; }
.snb-label { font-size: 11px; font-weight: 600; letter-spacing: .04em; opacity: .8; }
.side-nav-btn:hover { background: rgba(168,85,247,0.25); border-color: rgba(168,85,247,0.6); transform: translateY(-50%) scale(1.06); }
.side-nav-btn:active { transform: translateY(-50%) scale(0.96); }
.side-nav-btn.disabled { opacity: 0.15; pointer-events: none; }
.side-nav-left  { left: 8px; border-radius: 12px; }
.side-nav-right { right: 8px; border-radius: 12px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .stb { padding:8px 10px; padding-top:calc(8px + env(safe-area-inset-top)); height:auto; min-height:48px; }
    /* (2026-08-06) 88px tavanı KALDIRILDI: repertuvar adı artık kendi satırında
       (.stb-r2), tek satırda sıkışmıyor — telefonda da tam genişlik kullanabilir. */
    .strn { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bex, .stage-nav a { font-size:10px; padding:4px 8px; }
    .stage-nav { gap:4px; }
    .sm { padding:20px 14px calc(60px + env(safe-area-inset-bottom)); }
    .sb { padding:0 12px 6px; flex-wrap:nowrap; gap:8px; }
    .side-nav-left { left:8px; border-radius:12px; }
    .side-nav-right { right:8px; border-radius:12px; }
    .side-nav-btn { width:50px; height:120px; }
    /* Picker */
    .pi { max-width:100%; }
    .pi-fixed-top, .pi-scroll, .pi-fixed-bottom { padding-left:16px; padding-right:16px; }
    .rb { padding:14px 16px; }
    .rbn { font-size:14px; }
    .side-nav-btn { width:50px; height:120px; padding:0; }
    .snb-label { font-size:9px; }
    .snb-arrow { font-size:22px; }
    .np { max-width:none; }
  }
  @media (max-width: 480px) {
    .wtitle { font-size:clamp(18px,5vw,26px); }
    .wlyrics { font-size:calc(clamp(14px,4.2vw,20px) * var(--lyrics-scale,1) * var(--fit-scale,1)); line-height:1.8; padding:0 4px 20px; }
    .side-nav-btn { width:46px !important; height:108px !important; }
    .side-nav-left { left:6px !important; border-radius:10px !important; }
    .side-nav-right { right:6px !important; border-radius:10px !important; }
    .snb-label { display:none; }
    .sb { padding:0 8px 6px; gap:8px; flex-wrap:nowrap; }
    .th { font-size:10px; }
    .stb { padding:6px 8px; padding-top:calc(6px + env(safe-area-inset-top)); }
    .stage-nav a, .bex { font-size:10px !important; padding:3px 6px !important; }
    .sm { padding:16px 10px calc(60px + env(safe-area-inset-bottom)); }
    /* Picker screen on mobile */
    .pi-fixed-top, .pi-scroll, .pi-fixed-bottom { padding-left:16px; padding-right:16px; }
    .ptitle { font-size:20px; }
    .rb { padding:12px 14px; }
  }
  /* Picker screen mobile */
  @media (max-width: 600px) {
    .pi-fixed-top, .pi-scroll, .pi-fixed-bottom { padding-left:8px; padding-right:8px; }
    .ptitle { font-size:20px; }
    .psub { font-size:13px; }
    .rl { padding:10px 12px; }
    .rn { font-size:14px; }
  }

  /* ── MOBILE GLOBAL ── */
  @media (max-width: 768px) {
    body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button:not(.r-theme-toggle), a:not(.r-theme-toggle) { min-height: 36px; }
    input, select, textarea { font-size: 16px !important; } /* prevent iOS zoom */
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .sb { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  }


/* Stage Bottom Nav */
#v2StageBotNav { position:fixed; bottom:0; left:0; right:0; height:calc(68px + env(safe-area-inset-bottom)); box-sizing:border-box; background:rgba(7,11,24,0.97); backdrop-filter:blur(24px); border-top:1px solid rgba(255,200,61,0.18); display:none; align-items:center; z-index:400; padding-bottom:env(safe-area-inset-bottom); }
[data-theme="light"] #v2StageBotNav { background: rgba(245,244,251,0.97) !important; border-top-color: rgba(255,200,61,0.2) !important; }
[data-theme="light"] #v2StageBotNav .v2-bn-item { color: #9390b0 !important; }
[data-theme="light"] #v2StageBotNav .v2-bn-item.active { color: #E5A900 !important; }
@media(min-width:1024px){ #v2StageBotNav { position:static; width:100%; height:auto; padding:8px 0; background:rgba(7,7,26,0.6); backdrop-filter:none; } }
#v2StageBotNav .v2-bn-items { display:flex; width:100%; padding:0 4px; }
#v2StageBotNav .v2-bn-item { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:7px 2px; text-decoration:none; color:#5e5c8a; border-radius:10px; transition:color .15s; }
#v2StageBotNav .v2-bn-item.active { color:#FFC83D; }
#v2StageBotNav .v2-bn-label { font-size:9px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }

/* Desktop: picker ekranında sidebar layout */
/* ── TABLET (dikey + yatay) ──
   Kapsül menü ve "açık kalsın" davranışı önceden yalnızca ≥1024px'te tanımlıydı;
   tablet DİKEY (768–1023) bunun dışında kalıyordu. Eşik 768'e indirildi, böylece
   tablet iki yönde de aynı davranır. JS tarafı da (min-width:768px) kullanıyor. */
@media (min-width: 768px) {
  body.stage-active #v2StageBotNav:not(.stage-hidden) {
    display: flex !important;
    position: fixed; bottom: 22px; left: 0; right: 0;
    width: fit-content; margin: 0 auto;
    height: auto; padding: 6px 10px;
    background: rgba(7,11,24,0.97); backdrop-filter: blur(24px);
    border: 1px solid rgba(255,200,61,0.18); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    transform: none;            /* stage-hidden'ın translateY'si kalıntı bırakmasın */
    z-index: 450;
  }
  body.stage-active #v2StageBotNav:not(.stage-hidden) .v2-bn-items { width: auto; padding: 0; gap: 4px; }
  body.stage-active #v2StageBotNav:not(.stage-hidden) .v2-bn-item { flex: 0 0 auto; padding: 8px 18px; }
}

/* ── YATAY / ALÇAK EKRAN (tablet yatay, telefon yatay) ──
   Ekran yüksekliği azalınca şerit ve menü ekran dışına taşıp "kayboluyordu".
   Yükseklik sınırlanıp kaydırılabilir yapılıyor, boşluklar küçültülüyor. */
@media (max-height: 620px) {
  #stageToolsPanel {
    max-height: calc(100vh - 96px) !important;
    overflow-y: auto !important;
    padding: 8px !important;
  }
  body.stage-active #v2StageBotNav:not(.stage-hidden) { bottom: 10px; padding: 4px 8px; }
  body.stage-active #v2StageBotNav:not(.stage-hidden) .v2-bn-item { padding: 6px 14px; }
  #v2StageBotNav .v2-bn-label { font-size: 8px; }
  .sm { padding-top: 14px; padding-bottom: 64px; }
  .wtitle { font-size: clamp(17px, 2.6vw, 24px); margin-bottom: 6px; }
  .wkarar { margin: -2px 0 6px; }
}

@media (min-width: 1024px) {
  #pickerScreen {
    position: fixed !important;
    top: 0; left: 220px; right: 0; bottom: 0;
    overflow-y: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 48px;
  }
  #pickerScreen.hidden { display: none !important; }
  /* Alt nav desktop'ta gizle */
  #v2StageBotNav { display: none !important; }
  /* ...ama sahne modunda "Navigasyon" (☰) butonuyla BİLEREK açıldığında göster.
     Aksi halde openStageNav() çalışsa bile display:none !important yüzünden hiçbir
     şey görünmüyor ve buton tepkisiz sanılıyor. 4sn sonra stage-hidden geri gelir. */
  body.stage-active #v2StageBotNav:not(.stage-hidden) {
    display: flex !important;
    position: fixed; bottom: 22px; left: 0; right: 0;
    width: fit-content; margin: 0 auto;      /* butonlar kadar geniş, ortalanmış */
    height: auto; padding: 6px 10px;
    background: rgba(7,11,24,0.97); backdrop-filter: blur(24px);
    border: 1px solid rgba(255,200,61,0.18); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    z-index: 450;
  }
  /* İçerideki öğeler eşit paylaşıp yayılmasın — kendi genişliklerinde dursun */
  body.stage-active #v2StageBotNav:not(.stage-hidden) .v2-bn-items { width: auto; padding: 0; gap: 4px; }
  body.stage-active #v2StageBotNav:not(.stage-hidden) .v2-bn-item { flex: 0 0 auto; padding: 8px 18px; }
  /* Sahne aktifken sidebar gizle, picker tam genişlik */
  body.stage-active .sidebar { display: none !important; }
}

/* (2026-08-06) Bilgi düğmesi sekme kutusunun içinde: sekmelerle AYNI yükseklik
   ve köşe yarıçapı, ama accent zemin yok (mod seçmiyor, panel açıyor).
   Belirginlik için ikon rengi --text ve hafif bir zemin verildi. */
.vm-sep{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0;}
/* (2026-08-24) "Bilgi" etiketi eklendi: sekmeler basligin altina inince yer
   acildi, ikon tek basina ne oldugu belli olmuyordu. Sabit 38px genislik
   metni kirpardi — otomatik genislige gecildi. Dar ekranda (<=430px) etiket
   Soz/Akor/Nota ile birlikte gizlenir, ikon kalir. */

.stage-info-btn .ti{font-size:19px;line-height:1;}
.stage-info-btn:hover{background:rgba(255,255,255,.12);color:var(--accent);}
body.stage-light .stage-info-btn{background:rgba(0,0,0,.05);}
.info-sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:598;display:none;}

.info-sheet{position:fixed;left:0;right:0;bottom:0;background:#1a1a2e;border-radius:18px 18px 0 0;padding:8px 20px 24px;z-index:599;box-shadow:0 -8px 30px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .25s ease;max-height:70vh;overflow-y:auto;}
.info-sheet.open{transform:translateY(0);}
.info-sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:6px auto 14px;}

<script>
// (2026-08-19) 🐞 SAHNE SUNUCUYA ANONİM SORUYORDU — ÖZEL REPERTUVARLAR GÖRÜNMÜYORDU.
// Belirti (Emir, admin): Repertuvarlar'dan "Emir Gündoğdu Özel Repertuvarı" seçilip
// "Sahne modunda aç" denince sahnedeki listede YALNIZCA genel (herkese açık)
// repertuvarlar çıkıyordu. KÖK SEBEP: bu başlık nesnesi Authorization olarak
// kullanıcının oturum jetonunu değil ANON ANAHTARI gönderiyordu; RLS açısından
// istek "giriş yapmamış ziyaretçi" demek, dolayısıyla `repertoires_read`
// politikasından yalnız `visibility='public'` satırlar dönüyordu. Kendi özel
// repertuvarların, grup repertuvarların ve kişisel paylaşımlar sunucudan HİÇ
// gelmiyordu. Şimdiye kadar gizlenmesinin sebebi: loadReps() önce yerel
// IndexedDB önbelleğinden dönüyor ve orada doğru veri vardı — önbellek boşsa
// (özel pencere, yeni cihaz, temizlenmiş depo) sahne çıplak kalıyordu.
// Aynı dosyada zaten doğru desen vardı (kişisel akor isteğinde
// localStorage['sb_token'] kullanılıyor); burada da o kullanılıyor.
function _stageToken(){
  try { return localStorage.getItem('sb_token') || SUPA_KEY; } catch(e) { return SUPA_KEY; }
}
const H = new Proxy({}, {
  get(_, k){
    const t = {'apikey':SUPA_KEY,'Authorization':'Bearer '+_stageToken(),'Content-Type':'application/json'};
    return t[k];
  },
  ownKeys(){ return ['apikey','Authorization','Content-Type']; },
  getOwnPropertyDescriptor(){ return {enumerable:true, configurable:true}; }
});

let WL = {}, WL_loaded = false, _stageShowsPlaceholder = false; // WL_loaded: yükleme bitti mi; _stageShowsPlaceholder: sahnede şu an gerçek ad yerine placeholder/… gösteriliyor mu

// ── Çevrimdışı bildirimi (repertuvarlar/eserler ile aynı davranış) ──
// Bağlantı GERÇEKTEN yoksa (navigator offline) ve veri yerelden gösteriliyorsa,
// sayfa başına EN FAZLA bir kez "çevrimdışı" toast'ı göster. Online'ken sadece
// bir fetch timeout olduysa sessiz kal (yanıltıcı olmasın).
let _stageOfflineToastShown = false;
function stageToast(text){
  const m=document.createElement('div');
  m.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.4);';
  m.textContent=text; document.body.appendChild(m); setTimeout(()=>m.remove(),2800);
}
function stageOfflineToast(){
  if (_stageOfflineToastShown) return;
  if (navigator.onLine === false){ _stageOfflineToastShown = true; stageToast(_sCev('sh.cevrimdisi','📵 Çevrimdışı mod — yerel veriler gösteriliyor')); }
}

async function loadWL() {
  try {
    let rows = [];
    try {
      // (2026-08-19) ÖNCE OTURUM JETONU, GEREKİRSE ANON'A DÜŞ.
      // Eski hâli yalnızca ANON key kullanıyordu; gerekçesi "works paylaşılan
      // referans veri, süresi dolmuş jeton 401 verip listeyi boş bırakmasın" idi.
      // O gerekçe görünürlük modeli gelmeden önce geçerliydi: artık RLS anon
      // isteğe SADECE visibility='public' eserleri veriyor ⇒ repertuvardaki
      // gizli ya da gruba açık eserlerin GÜFTE/AKORU sahnede boş kalıyordu.
      // Doğrusu: jetonla dene, istek başarısızsa (401/süresi dolmuş) anon ile
      // tekrar dene — böylece hem yetki hem eski dayanıklılık korunuyor.
      // (2026-08-22) ANON'A DÜŞME DARALTILDI — OTURUM VARSA ARTIK DÜŞÜLMÜYOR.
      // Yukarıdaki gerekçe (jetonla dene, olmazsa anon) EKSİKTİ ve sahnede en
      // pahalı yerde patlıyordu. Emir'in yaşadığı belirti (repertuvar sayfası,
      // aynı desen): telefondan eklenen GİZLİ eser masaüstünde "#<id>" ve
      // "söz eklenmemiş" göründü; çıkış-giriş yapınca düzeldi. Sebep, jeton
      // bayatlayınca sessizce anon'a düşülmesi — anon istekte RLS yalnız
      // visibility='public' eserleri veriyor, gizli/gruba açık eserin GÜFTESİ
      // sahnede BOŞ kalıyor. Sahnede bunun bedeli çok yüksek.
      //
      // auth.js zaten doğrusunu yapıyor: istekten önce jetonu tazeliyor,
      // 401'de zorla yenileyip isteği bir kez tekrarlıyor, oturum kalıcı
      // ölüyse isteği engelleyip oturumu sonlandırıyor. Anon yedek yolu tam da
      // bu mekanizmayı etkisiz kılıyordu (anon istek yamadan muaf geçiyor).
      // Anon yolu KALDIRILMADI, daraltıldı: oturumu OLMAYAN ziyaretçi
      // (paylaşım bağlantısıyla gelen) genel eserleri görmeye devam etsin.
      const _worksUrl = SUPA_URL+'/rest/v1/works?select=*&deleted_at=is.null&order=id&limit=2000';
      const _oturumVar = !!localStorage.getItem('sb_token');
      let r = await fetch(_worksUrl, {
        headers: _oturumVar ? H : {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY},
        signal: AbortSignal.timeout(3500)
      });
      if (!r.ok && _oturumVar) {
        // Eksik güfteyle sahneye çıkmaktansa dürüst ol: WL varsa önbellekten
        // geleni kullanmaya devam ediyoruz, yalnız tazeleme atlanıyor.
        console.warn('[stage] works alınamadı ('+r.status+') — anon\'a DÜŞÜLMÜYOR, oturum var');
      }
      if (!r.ok) throw new Error('works '+r.status);
      const fetched = await r.json();
      if (!Array.isArray(fetched) || !fetched.length) throw new Error('works bos/gecersiz yanit');
      rows = fetched;
      // Online'dan geldi — IndexedDB'yi güncelle
      if (window.db) await db.works.saveAll(rows);
    } catch(fetchErr) {
      console.warn('[stage] Supabase ulaşılamadı, IndexedDB kullanılıyor');
      if (window.db) rows = await db.works.getAll();
      stageOfflineToast(); // bağlantı yoksa ve yerelden gösteriliyorsa bildir (kendi içinde offline kontrolü var)
    }
    rows.forEach(w => {
      WL[String(w.id)] = {
        name: w.name || '',
        composer: w.composer || '',
        lyricWriter: w.lyric_writer || '',
        makam: w.makam || '',
        instrument: w.instrument || '',
        closingNote: w.closing_note || '',
        tuning: w.tuning || '',
        form: w.form || '',
        measurement: w.measurement || '',
        region: w.region || '',
        lyrics: w.lyrics || '',
        chords: w.chords || '',
        notaUrl: w.nota_url || '',
        // 2026-07-20: çok sayfalı nota — nota_pages asıl kaynak, yoksa tek nota_url'e düş
        notaPages: Array.isArray(w.nota_pages) ? w.nota_pages.filter(Boolean) : (w.nota_url ? [w.nota_url] : [])
      };
    });
    // customWorks patch
    try {
      const customs = JSON.parse(localStorage.getItem('customWorks') || '[]');
      customs.forEach(w => {
        const id = String(parseInt(w.id));
        if(WL[id]) Object.assign(WL[id], {name:w.name||WL[id].name, lyrics:w.lyrics!==undefined?w.lyrics:WL[id].lyrics, composer:w.composer||WL[id].composer, notaUrl:w.notaUrl!==undefined?w.notaUrl:WL[id].notaUrl, notaPages: Array.isArray(w.notaPages)? w.notaPages.filter(Boolean) : (WL[id].notaPages||[])});
        else WL[id] = {name:w.name||'',lyrics:w.lyrics||'',composer:w.composer||'',makam:w.makam||'',instrument:w.instrument||'',closingNote:w.closingNote||'',notaUrl:w.notaUrl||''};
      });
    } catch(e) {}
    // Kişisel akor overlay — kullanıcının kendi akoru varsa sahne görünümü ondan türer
    try {
      const uid = (typeof getUserId==='function') ? getUserId() : null;
      if (uid) {
        const tok = localStorage.getItem('sb_token') || SUPA_KEY;
        const _pH = {'apikey':SUPA_KEY,'Authorization':'Bearer '+tok};
        // transpose sütunu yoksa istek 400 döner — sütunsuz tekrar dene, yoksa
        // kişisel AKORLAR da yüklenmez (sessiz yan hasar).
        let pr = await fetch(SUPA_URL+'/rest/v1/personal_chords?select=work_id,chords,transpose&user_id=eq.'+uid, {
          headers:_pH, signal: AbortSignal.timeout(4000)
        });
        if (!pr.ok) {
          console.warn('[stage] transpose sütunu yok gibi — SQL çalıştırıldı mı? Sütunsuz deneniyor.');
          pr = await fetch(SUPA_URL+'/rest/v1/personal_chords?select=work_id,chords&user_id=eq.'+uid, {
            headers:_pH, signal: AbortSignal.timeout(4000)
          });
        }
        // (2026-08-21) Kişisel NOTLAR — akorlarla aynı turda, ayrı tablodan.
        // Ayrı `try` DEĞİL, aynı blokta: yetki/ağ sorununda ikisi de sessizce
        // atlanır, sahne yine açılır. Tablo yoksa 404/400 döner, yutulur.
        try {
          const nr = await fetch(SUPA_URL+'/rest/v1/personal_work_notes?select=work_id,note&user_id=eq.'+uid, {
            headers:_pH, signal: AbortSignal.timeout(4000)
          });
          if (nr.ok) {
            (await nr.json() || []).forEach(x => {
              if (x.note) PERSONAL_NOTES[String(parseInt(x.work_id))] = x.note;
            });
          }
        } catch(e) {}
        // Sahnede notu gösterme tercihi HESAPTA saklanıyor (cihazda değil):
        // telefonda kapatınca tablette de kapalı gelsin.
        try {
          const cr = await fetch(SUPA_URL+'/rest/v1/profiles?select=sahne_kisisel_not&id=eq.'+uid, {
            headers:_pH, signal: AbortSignal.timeout(4000)
          });
          if (cr.ok) {
            const crows = await cr.json();
            if (crows && crows.length && crows[0].sahne_kisisel_not === false) KNOT_GOSTER = false;
          }
        } catch(e) {}
        if (pr.ok) {
          const prows = await pr.json();
          (prows||[]).forEach(x => {
            const id = String(parseInt(x.work_id));
            // Ton kaydırma eser başına saklanır (0 ise satır olsa bile etkisiz)
            if (x.transpose) TRANSPOSE[id] = parseInt(x.transpose) || 0;
            if (!x.chords) return;
            const lyr = x.chords.split('\n').filter(l=>!/^\s*\{.*\}\s*$/.test(l)).map(l=>l.replace(/\[[^\]]*\]/g,'')).join('\n').replace(/[ \t]+$/gm,'').trim();
            if (WL[id]) { WL[id].chords = x.chords; WL[id].lyrics = lyr; }
            else WL[id] = { name:'', lyrics: lyr, chords: x.chords, composer:'', makam:'', instrument:'', closingNote:'', notaUrl:'' };
          });
        }
      }
    } catch(e) { /* offline / yetki yok — kişisel katman atlanır */ }
  } catch(e) { console.error('WL yüklenemedi:', e); }
  finally { WL_loaded = true; } // works yükleme denemesi bitti (başarılı/başarısız)
}// (2026-08-21) KİŞİSEL ESER NOTU — sahnede SALT OKUNUR gösterim.
// Düzenleme bilerek yok: sahnede klavye açmak, yanlış dokunuşla şarkı
// ortasında düzenleme moduna düşmek demek. Yazma yeri eser detayı ve
// repertuvar listesindeki alt sayfa.
let PERSONAL_NOTES = {};        // {String(work_id): metin}
let KNOT_GOSTER = true;         // hesap tercihi; profiles.sahne_kisisel_not
let _knotAcikId = null;         // uzun not hangi eserde açık (esere özel)

function _knotEsc(t){
  return (t == null ? '' : String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// İlk satır görünür — not OLDUĞU anlaşılsın; uzunsa dokununca açılır, tekrar
// dokununca kapanır. Açıklık esere bağlı: sonraki esere geçince kapalı başlar.
function knotSahneHtml(workId){
  if (!KNOT_GOSTER) return '';
  const not = PERSONAL_NOTES[String(workId)];
  if (!not) return '';
  const cokSatir = not.indexOf('\n') !== -1 || not.length > 60;
  const acik = _knotAcikId === String(workId);
  return '<div class="knot-sahne' + (acik ? ' acik' : '') + '" onclick="knotSahneAc(event,\'' + workId + '\')"' +
         ' title="' + _sCev('sh.knotT','Kişisel notun — yalnızca sen görürsün') + '">' +
         '<i class="ti ti-lock" aria-hidden="true"></i>' +
         '<span class="kn-tx">' + _knotEsc(not) + '</span>' +
         (cokSatir ? '<span class="kn-dh">' + (acik ? _sCev('sh.knKapat','kapat') : _sCev('sh.knAc','aç')) + '</span>' : '') +
         '</div>';
}

function knotSahneAc(ev, workId){
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  _knotAcikId = (_knotAcikId === String(workId)) ? null : String(workId);
  try { renderStage(); } catch(e) {}
}

// Panelden aç/kapa. Tercih HESABA yazılıyor; yazma başarısız olsa da ekranda
// hemen uygulanıyor — sahnede "düğmeye bastım bir şey olmadı" hissi olmasın.
async function knotGosterToggle(ev){
  if (ev) ev.stopPropagation();
  KNOT_GOSTER = !KNOT_GOSTER;
  _knotAcikId = null;
  try { renderStage(); } catch(e) {}
  try { buildStageToolsRow(_tonSonMode); } catch(e) {}
  try {
    const uid = (typeof getUserId==='function') ? getUserId() : null;
    if (!uid) return;
    const tok = localStorage.getItem('sb_token') || SUPA_KEY;
    const r = await fetch(SUPA_URL+'/rest/v1/profiles?id=eq.'+uid, {
      method:'PATCH',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json','Prefer':'return=representation'},
      body: JSON.stringify({ sahne_kisisel_not: KNOT_GOSTER })
    });
    if (!r.ok) { console.warn('[not] tercih yazılamadı — sütun/RLS?', r.status); return; }
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) console.warn('[not] tercih yazılmadı: sunucu 0 satır döndürdü');
  } catch(e) { console.warn('[not] tercih yazılamadı', e); }
}

let reps=[], selId=null, curRep=null, curIdx=0;

// repertoires.html'deki "Gizle" (hiddenRepIds, sadece client-side) ile tutarlı olsun diye —
// bir repertuvarı orada gizlersen burada da (sahne modunda) görünmemeli.
function getHiddenRepIds() {
  try { return JSON.parse(localStorage.getItem('hiddenRepIds') || '[]'); }
  catch(e) { return []; }
}

function buildRepsFromRaw(r, items) {
  const uid = getUserId();
  const hiddenIds = getHiddenRepIds();
  return (r||[])
    .filter(x => {
      const isOwner = x.owner_id === uid || x.user_id === uid;
      // (2026-08-20) YENİ GÖRÜNÜRLÜK MODELİ — GÖRÜNÜRLÜK KARARI SUNUCUDA.
      // Eski süzgeç "kendi + aktif grubun (group_id) + is_public" diyordu.
      // 2. aşamada görünürlük `repertoires.visibility` + `repertoire_group_shares`
      // + `repertoire_shares` (kişisel paylaşım) modeline geçti ve `repertoires_read`
      // politikası bunların HEPSİNİ çözüyor ⇒ elimize gelen her satır tanım gereği
      // görmeye YETKİLİ olduğumuz bir satır. Eski istemci kuralı ise ikisini
      // eliyordu: (a) gruba PAYLAŞIM SATIRIYLA açılmış ama `group_id`'si boş
      // repertuvarlar, (b) `repertoire_shares` ile doğrudan bana açılanlar.
      // Bu yüzden burada artık GÖRÜNÜRLÜK süzgeci yok; yalnız kullanıcının
      // kendi elleriyle gizlediği (hiddenRepIds) başkasına ait satırlar eleniyor.
      if (isOwner) return true;
      return !hiddenIds.includes(x.id);
    })
    // (2026-08-23) `performer` de tasiniyor — eser bazli kadro sahnede
    // bilgi panelinde gosteriliyor. Eskiden bu alan sahneye hic gelmiyordu.
    .map(x=>({...x,items:(items||[]).filter(t=>t.repertoire_id===x.id).sort((a,b)=>a.seq-b.seq).map(t=>({...t,workId:String(t.work_id),closingNote:t.closing_note||'',performer:t.performer||''}))}));
}

// (2026-08-20) YENİ MODEL — YEREL ÖNBELLEK SÜZGECİ KALDIRILDI.
// Bu fonksiyon IndexedDB'deki satırları süzüyordu; ama o önbelleğe zaten yalnız
// RLS'ten geçmiş satırlar yazılıyor (hem bu dosya hem repertoires.js sunucudan
// geleni `db.repertoires.replaceAll` ile koyuyor). Eski kural owner/group_id/
// is_public'e bakıyordu ⇒ kişisel paylaşımla bana açılmış bir repertuvar
// (visibility='private', repertoire_shares satırı var) önbellekte DURUYOR ama
// bu süzgeçte eleniyordu — sahnede hiç görünmüyordu. Geçiş fonksiyonu olarak
// bırakıldı ki çağrı yerleri değişmesin ve niyet kayda geçsin.
function repVisibilityFilterFn() {
  return () => true;
}
// Sunucu sorgusundan da istemci süzgeci kalktı: görünürlüğü artık yalnız
// `repertoires_read` politikası belirliyor (public / sahip / visibility='group'
// ∩ repertoire_group_shares ∩ my_group_ids() / repertoire_shares). RLS üst
// sınır olduğu için süzgeci kaldırmak FAZLADAN satır getirmez, yalnız eski
// kuralın yanlışlıkla eledikleri geri gelir. Aynı düzeltme repertoires.js'te
// de yapıldı — iki sayfa yine AYNI kapsamı görsün diye.
function repVisibilityQuery() {
  return '';
}

async function loadReps(){
  // ── 1) ÖNCELİKLE LOCAL'DEN ANINDA DÖN (sinyal zayıf/yokken bile beklemeden) ──
  let localR = [], localItems = [];
  if (window.db) {
    try {
      const allReps = await db.repertoires.getAll();
      localR = allReps.filter(repVisibilityFilterFn());
      localItems = await db.repertoire_items.getAll();
    } catch(e) { console.warn('[stage] local repertuvar okuma hatası:', e); }
  }

  // ── 2) ARKA PLANDA SUNUCUYLA SENKRONİZE ET, sonucu güncelle ──
  refreshRepsInBackground();

  return buildRepsFromRaw(localR, localItems);
}

async function refreshRepsInBackground(){
  try {
    const [r, items] = await Promise.all([
      fetch(SUPA_URL+'/rest/v1/repertoires?order=created_at'+(repVisibilityQuery() ? '&'+repVisibilityQuery() : ''),{headers:H, signal:AbortSignal.timeout(6000)}).then(r=>r.json()),
      fetch(SUPA_URL+'/rest/v1/repertoire_items?order=seq',{headers:H, signal:AbortSignal.timeout(6000)}).then(r=>r.json())
    ]);
    if (window.db) {
      await db.repertoires.replaceAll(r||[]);
      await db.repertoire_items.replaceAll(items||[]);
    }
    reps = buildRepsFromRaw(r, items);
    // Kullanıcı hâlâ seçim ekranındaysa listeyi tazele — sahnedeyken (performans sırasında) ekranı bozma.
    // Ayrıca tam o an bir kartı kaydırıyorsa (parmak hâlâ ekranda) veya bir panel açıksa,
    // DOM'u altından çekip garip bir ara-duruma sokmamak için yeniden çizimi erteliyoruz —
    // bir sonraki etkileşimde (dokunuş bitince) zaten güncel veriyle çizilecek.
    const picker = document.getElementById('pickerScreen');
    if (picker && !picker.classList.contains('hidden') && !_rsSwipe && !_rsOpenCard) {
      renderPicker();
    }
  } catch(e) {
    console.warn('[stage] arka plan senkronizasyonu başarısız (offline/zayıf sinyal):', e);
    stageOfflineToast(); // bağlantı yoksa ve picker yerelden gösteriliyorsa bildir
  }
}

function stageRepMatchesSearch(r, q) {
  if (!q) return true;
  const norm = s => (s || '').toLocaleLowerCase('tr');
  const nq = norm(q);
  if (norm(r.name).includes(nq)) return true;
  return (r.items || []).some(it => {
    const w = WL[it.workId] || {};
    return norm(w.name).includes(nq);
  });
}

function renderPicker(){

  const filtered = reps.filter(r=>stageRepMatchesSearch(r, stageSearchQuery));
  if(stageSearchQuery && !filtered.length){el.innerHTML='<div style="padding:32px;text-align:center;color:var(--text3);">' + _sCev('sh.sonucYok','"{q}" için sonuç bulunamadı').replace('{q}', stageSearchQuery) + '</div>';return;}
  const sl={concept:_sCev('sh.dTaslak','Taslak'),confirmed:_sCev('sh.dOnaylandi','Onaylandı'),archive:_sCev('sh.dArsiv','Arşiv')};
  const uid = getUserId();
  el.innerHTML=filtered.map(r=>{
    const isOwner = r.owner_id === uid || r.user_id === uid;
    const cardHtml = `<div class="rsi${selId===r.id?' sel':''}" onclick="rsCardClick(event,'${r.id}')" ontouchstart="rsTouchStart(event)" ontouchmove="rsTouchMove(event)" ontouchend="rsTouchEnd(event)" ontouchcancel="rsTouchEnd(event)">
      <div><div class="rsn">${r.name}</div><div class="rsm">${[r.date,r.venue,sl[r.status]].filter(Boolean).join(' · ')}</div></div>
      <div class="rsc">${(r.items||[]).length} eser</div>
    </div>`;

    const rightBg = isOwner
      ? `<div class="rs-delete-bg" onclick="event.stopPropagation();rsCloseOpenCard();rsDeleteRep('${r.id}')"><i class="ti ti-trash"></i>Sil</div>`
      : `<div class="rs-delete-bg rs-hide-bg" onclick="event.stopPropagation();rsCloseOpenCard();rsHideRep('${r.id}')"><i class="ti ti-eye-off"></i>Gizle</div>`;
    return `<div class="rs-wrap">${editBg}${rightBg}${cardHtml}</div>`;
  }).join('');
}

// ── İki yönlü kaydırma (repertuvarlardaki riTouchStart/Move/End deseninin aynısı) ──
const RS_SWIPE_THRESHOLD = 44;
const RS_SWIPE_MAX = 84;
let _rsSwipe = null;
let _rsOpenCard = null;

function rsCloseOpenCard() {
  if (_rsOpenCard) {
    _rsOpenCard.style.transition = 'transform .2s ease';
    _rsOpenCard.style.transform = 'translateX(0)';
    _rsOpenCard.classList.remove('swiped-open-left', 'swiped-open-right');
    const wrap = _rsOpenCard.closest('.rs-wrap');
    if (wrap) { wrap.style.transition = 'opacity .2s ease'; wrap.style.setProperty('--swipe-glow', 0); }
    _rsOpenCard = null;
  }
}

function rsTouchStart(e) {
  if (_rsOpenCard && _rsOpenCard !== e.currentTarget) rsCloseOpenCard();
  const t = e.touches[0];
  _rsSwipe = { card: e.currentTarget, startX: t.clientX, startY: t.clientY, dx: 0, dir: null };
}

function rsTouchMove(e) {
  if (!_rsSwipe || _rsSwipe.card !== e.currentTarget) return;
  const t = e.touches[0];
  const dx = t.clientX - _rsSwipe.startX;
  const dy = t.clientY - _rsSwipe.startY;
  if (_rsSwipe.dir === null) {
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
      _rsSwipe.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
  }
  if (_rsSwipe.dir === 'v') { _rsSwipe = null; return; }
  if (_rsSwipe.dir === 'h') {
    e.preventDefault();
    let base = 0;
    if (_rsSwipe.card.classList.contains('swiped-open-right')) base = -RS_SWIPE_MAX;
    else if (_rsSwipe.card.classList.contains('swiped-open-left')) base = RS_SWIPE_MAX;
    const clamped = Math.min(RS_SWIPE_MAX, Math.max(base + dx, -RS_SWIPE_MAX));
    _rsSwipe.dx = clamped;
    _rsSwipe.card.style.transition = 'none';
    _rsSwipe.card.style.transform = `translateX(${clamped}px)`;
    const wrap = _rsSwipe.card.closest('.rs-wrap');
    if (wrap) wrap.style.setProperty('--swipe-glow', Math.min(1, Math.abs(clamped) / RS_SWIPE_MAX));
  }
}

function rsTouchEnd(e) {
  if (!_rsSwipe) return;
  // Yatay swipe değilse (merkeze tıklama / dikey / belirsiz hareket): kartı
  // yarı-kaymış bırakma — açıksa açık konumuna, değilse translateX(0)'a çek.
  if (_rsSwipe.dir !== 'h') {
    const c = _rsSwipe.card;
    c.style.transition = 'transform .2s ease';
    if (c.classList.contains('swiped-open-left')) {
      c.style.transform = `translateX(${RS_SWIPE_MAX}px)`;
    } else if (c.classList.contains('swiped-open-right')) {
      c.style.transform = `translateX(${-RS_SWIPE_MAX}px)`;
    } else {
      c.style.transform = 'translateX(0)';
      const w = c.closest('.rs-wrap');
      if (w) w.style.setProperty('--swipe-glow', 0);
    }
    _rsSwipe = null;
    return;
  }
  const card = _rsSwipe.card;
  card.style.transition = 'transform .2s ease';
  if (Math.abs(_rsSwipe.dx) > 5) card.dataset.justSwiped = '1';
  card.classList.remove('swiped-open-left', 'swiped-open-right');
  const wrap = card.closest('.rs-wrap');
  if (_rsSwipe.dx <= -RS_SWIPE_THRESHOLD) {
    card.style.transform = `translateX(${-RS_SWIPE_MAX}px)`;
    card.classList.add('swiped-open-right');
    if (wrap) wrap.style.setProperty('--swipe-glow', 1);
    _rsOpenCard = card;
  } else if (_rsSwipe.dx >= RS_SWIPE_THRESHOLD) {
    card.style.transform = `translateX(${RS_SWIPE_MAX}px)`;
    card.classList.add('swiped-open-left');
    if (wrap) wrap.style.setProperty('--swipe-glow', 1);
    _rsOpenCard = card;
  } else {
    card.style.transform = 'translateX(0)';
    if (wrap) { wrap.style.transition = 'opacity .2s ease'; wrap.style.setProperty('--swipe-glow', 0); }
    if (_rsOpenCard === card) _rsOpenCard = null;
  }
  _rsSwipe = null;
}

function rsCardClick(e, id) {
  const card = e.currentTarget;
  if (card.classList.contains('swiped-open-left') || card.classList.contains('swiped-open-right')) {
    rsCloseOpenCard();
    return;
  }
  if (card.dataset.justSwiped === '1') {
    delete card.dataset.justSwiped;
    return;
  }
  pickRep(id);
}

window.addEventListener('pageshow', () => {
  document.querySelectorAll('.rsi.swiped-open-left, .rsi.swiped-open-right').forEach(card => {
    card.classList.remove('swiped-open-left', 'swiped-open-right');
    card.style.transition = 'none';
    card.style.transform = 'translateX(0)';
    delete card.dataset.justSwiped;
    const wrap = card.closest('.rs-wrap');
    if (wrap) wrap.style.setProperty('--swipe-glow', 0);
  });
  _rsOpenCard = null;
  _rsSwipe = null;
});

// repertoires.js ve eserler.html'de bu satır vardı, stage.html'de eksikti — kartın

// Silme/gizleme, repertoires.js'deki delRep/hideRepFromView ile aynı davranışta —
// ama gerçek kullanıcı token'ı gerektiriyor (stage.html'in salt-okunur H'si SUPA_KEY
// kullanıyor, RLS altında silme için yetmez), o yüzden ayrı bir authenticated header.
const RS_AUTH_H = {
  get apikey() { return SUPA_KEY; },
  get Authorization() { return 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY); },
  'Content-Type': 'application/json'
};

async function rsDeleteRep(id) {
  if (!confirm(_sCev('sh.silOnay','Bu repertuvarı silmek istiyor musunuz?'))) return;
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/repertoires?id=eq.' + id, { method: 'DELETE', headers: RS_AUTH_H });
    if (!r.ok) throw new Error(await r.text());
    if (selId === id) { selId = null; const b = document.getElementById('bstart'); if (b) b.disabled = true; }
    reps = reps.filter(x => x.id !== id);
    if (window.db) db.repertoires.delete(id).catch(()=>{});
    renderPicker();
  } catch (e) {
    alert(_sCev('sh.silHata','Silinirken bir hata oluştu: ') + e.message);
  }
}

function rsHideRep(id) {
  const hiddenIds = getHiddenRepIds();
  if (!hiddenIds.includes(id)) {
    hiddenIds.push(id);
    localStorage.setItem('hiddenRepIds', JSON.stringify(hiddenIds));
  }
  reps = reps.filter(x => x.id !== id);
  renderPicker();
}

function pickRep(id){selId=id;document.getElementById('bstart').disabled=false;renderPicker();}

function setLyricsAlign(align) {
  localStorage.setItem('stageLyricsAlign', align);
