/* ── SAHNE SIĞDIRMA (2026-09-05) ────────────────────────────────────────
   Sorun: .wlyrics'te overflow-x:auto vardı. Sahnede yatay kaydırma işe
   yaramaz — müzisyen çalarken yana kaydıramaz, taşan akor görünmez kalır.
   Amaç TAŞMAYI ÖNLEMEK, boşluğu doldurmak değil: ölçek yalnızca küçültür,
   asla büyütmez.
   Kullanıcının sürgüsü ÜSTTE kalır: --fit-scale onun seçtiği --lyrics-scale'i
   çarpar, ezmez. Sürgüyü kısınca sığdırma da gevşer.
   Ölçek ESER BAŞINA hesaplanır (her renderStage'de sıfırlanır), satır başına
   değil — satır başına olsaydı aynı sayfada farklı puntolar olurdu.
   TABAN 14px: bunun altına inmek yerine yatay kaydırma geri açılır; okunmaz
   bir sayfa, kaydırılabilir bir sayfadan kötüdür. */
const FIT_MIN_PX = 14;
let _fitRaf = null;
function fitLyrics() {
  const el = document.querySelector('#stageScreen .wlyrics') || document.querySelector('.wlyrics');
  if (!el) return;
  const root = document.documentElement;
  root.style.setProperty('--fit-scale', 1);
  el.style.overflowX = 'hidden';
  // Taşma yoksa iş bitti — yaygın durum, tek ölçüm.
  if (el.scrollWidth <= el.clientWidth + 1) return;
  const basePx = parseFloat(getComputedStyle(el).fontSize) || 18;
  const minFit = Math.min(1, FIT_MIN_PX / basePx);
  let lo = minFit, hi = 1, best = minFit;
  for (let i = 0; i < 6; i++) {
    const mid = (lo + hi) / 2;
    root.style.setProperty('--fit-scale', mid);
    if (el.scrollWidth <= el.clientWidth + 1) { best = mid; lo = mid; }
    else { hi = mid; }
  }
  root.style.setProperty('--fit-scale', best);
  // Tabana rağmen sığmıyorsa kaydırmayı geri aç (uzun tek kelime, geniş akor).
  if (el.scrollWidth > el.clientWidth + 1) el.style.overflowX = 'auto';
}
function fitLyricsSoon() {
  if (_fitRaf) cancelAnimationFrame(_fitRaf);
  _fitRaf = requestAnimationFrame(() => { _fitRaf = null; fitLyrics(); });
}
window.addEventListener('resize', fitLyricsSoon);
window.addEventListener('orientationchange', fitLyricsSoon);

const LYRICS_SCALE_MIN = 0.75, LYRICS_SCALE_MAX = 1.6;
function setLyricsFontScale(scale) {
  scale = Math.min(LYRICS_SCALE_MAX, Math.max(LYRICS_SCALE_MIN, +parseFloat(scale).toFixed(2)));
  localStorage.setItem('stageLyricsScale', scale);
  document.documentElement.style.setProperty('--lyrics-scale', scale);
  updateFontSliderUI(scale);
  fitLyrics();   // (2026-09-05) sürgü kullanıcının; sığdırma onun üstünde çalışır
}
function updateFontSliderUI(scale) {
  const slider = document.getElementById('lyricsFontSlider');
  if (!slider) return;
  slider.value = scale;
  const pct = ((scale - LYRICS_SCALE_MIN) / (LYRICS_SCALE_MAX - LYRICS_SCALE_MIN)) * 100;
  slider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, var(--border) ${pct}%, var(--border) 100%)`;
}
// A− / A+ butonları: kaydırıcıyla aynı ölçeği adım adım değiştirir (0.1'lik adım).
function stepLyricsFont(delta) {
  const cur = parseFloat(localStorage.getItem('stageLyricsScale')) || 1;
  setLyricsFontScale(cur + delta);
}

// ChordPro render: akorlar sözlerin içinde [Am] köşeli parantezle, ait olduğu
// hecenin önünde durur; ekranda o hecenin ÜSTÜNE yazılır. Standart ChordPro formatı.
// ── TON KAYDIRMA (± yarım ton) ──
// Eser başına saklanır (personal_chords.transpose). GÖRÜNÜM dönüşümüdür:
// kayıtlı akor metni ASLA değiştirilmez, sadece ekranda kaydırılmış gösterilir.
let TRANSPOSE = {}; // {work_id: yarım ton (+/-)}
const _CHROM_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const _NOTE_INDEX  = {'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,'E#':5,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11};
function transposeNote(note, n) {
  const i = _NOTE_INDEX[note];
  if (i === undefined) return note;              // tanımadığımız kökü olduğu gibi bırak
  return _CHROM_FLAT[((i + n) % 12 + 12) % 12];  // Türk müziği yazımında bemol tercih edilir
}
// Tek bir akor jetonunu kaydır: kök + son ek + (varsa) /bas
function transposeChordToken(tok, n) {
  return tok.split('/').map(part => {
    const m = part.match(/^([A-G](?:#|b)?)(.*)$/);
    return m ? transposeNote(m[1], n) + m[2] : part;
  }).join('/');
}
// ChordPro metnindeki TÜM [akor] etiketlerini kaydır; sözlere dokunma
function transposeChordPro(text, n) {
  if (!text || !n) return text || '';
  return text.replace(/\[([^\]]+)\]/g, (full, inner) => '[' + transposeChordToken(inner.trim(), n) + ']');
}
function getTranspose(workId) { return TRANSPOSE[String(workId)] || 0; }

// ── KARAR SESİ (kaydırılmış) — eserler.html ile AYNI mantık ──
// Solfej ("La", "Sib") ve Latin ("A", "Bb") yazımını tanır; perde adı gibi
// tanımadıklarını kaydırmadan olduğu gibi bırakır (koma sesleri 12'liye oturmaz).
const _KARAR_LATIN = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const _KARAR_TR    = ['Do','Reb','Re','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'];
const _KARAR_IN = {
  'do':0,'do#':1,'reb':1,'re':2,'re#':3,'mib':3,'mi':4,'fa':5,'fa#':6,'solb':6,
  'sol':7,'sol#':8,'lab':8,'la':9,'la#':10,'sib':10,'si':11,
  'c':0,'c#':1,'db':1,'d':2,'d#':3,'eb':3,'e':4,'f':5,'f#':6,'gb':6,
  'g':7,'g#':8,'ab':8,'a':9,'a#':10,'bb':10,'b':11
};
// (2026-08-13) Eşleşen HAM jetonu döndürür ('f#', 'solb'...). Hem indeks hem de
// kullanıcının diyez/bemol tercihi buradan türetiliyor — aynı ayrıştırma iki
// yerde tekrar edilmesin.
function _kararJeton(s){
  let t = (s||'').toString().toLowerCase().replace('♭','b').replace('♯','#');
  const k = t.trim().replace(/\s+/g,'');
  if (k in _KARAR_IN) return k;
  // Çift yazımı da tanı: "La (A)", "A (La)", "Sol / G", "Re - Neva".
  // Eskiden bunlar tanınmadığı için ses adı üretilemiyor, Ton kontrolü rakamsal
  // ± hâline düşüyordu. Parantez içi atılır, ilk anlamlı jetona bakılır.
  t = t.replace(/\([^)]*\)/g, ' ');
  for (const tok of t.split(/[^a-z#b]+/)) {
    if (tok && (tok in _KARAR_IN)) return tok;
  }
  return null;
}
function parseKararNote(s){
  const k = _kararJeton(s);
  return (k === null) ? null : _KARAR_IN[k];
}
// (2026-08-13) Kullanıcı karar sesini DİYEZLE mi yazmış? ("F#", "Fa#")
function _kararDiyezMi(s){
  const k = _kararJeton(s);
  return !!(k && k.charAt(k.length - 1) === '#');
}
// (2026-08-13) TON KAYDIRILMAMIŞKEN KULLANICININ YAZIMINA SADIK KAL.
// Belirti (Emir): karar sesi F# girilmiş, akorlar da F#m/Bm/E görünüyor ama
// rozette "Gb (Solb)" yazıyordu — aynı ekranda iki farklı yazım.
// Sebep: _KARAR_LATIN/_KARAR_TR yalnızca BEMOL tablosu; indeks 6 her hâlükârda
// Gb'ye çevriliyordu. Akor motoru ise n=0 iken metne HİÇ dokunmuyor
// (transposeChordPro'da `if(!text||!n) return text`), yazım olduğu gibi kalıyor.
// Artık karar rozeti de aynı kurala uyuyor: kaydırma yokken kullanıcının
// diyez/bemol tercihi korunur, KAYDIRILDIĞINDA bemol tablosuna dönülür —
// çünkü kaydırılmış akorlar da bemolle yazılıyor, ikisi tutarlı kalsın.
const _KARAR_LATIN_D = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const _KARAR_TR_D    = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
function kararLabel(closingNote, n){
  const i = parseKararNote(closingNote);
  if (i === null) return null;
  const j = ((i + (n||0)) % 12 + 12) % 12;
  const d = !n && _kararDiyezMi(closingNote);
  return (d ? _KARAR_LATIN_D : _KARAR_LATIN)[j] + ' (' + (d ? _KARAR_TR_D : _KARAR_TR)[j] + ')';
}

// ± butonları: tonu kaydır, ekranı hemen tazele, sonra arka planda kaydet
function stepTranspose(delta) {
  const item = (curRep && (curRep.items||[])[curIdx]) || null;
  if (!item) return;
  const id = String(item.workId);
  let v = (getTranspose(id) + delta) % 12;      // bir oktavdan fazlası anlamsız
  if (v > 6) v -= 12; else if (v < -6) v += 12; // en yakın yazımda tut (-6..+6)
  TRANSPOSE[id] = v;
  renderStage();
  savePersonalTranspose(id, v);
}
function resetTranspose() {
  const item = (curRep && (curRep.items||[])[curIdx]) || null;
  if (!item) return;
  const id = String(item.workId);
  if (!getTranspose(id)) return;
  TRANSPOSE[id] = 0;
  renderStage();
  savePersonalTranspose(id, 0);
}
// ── (2026-08-13) TON KAYDIRICISI: rakam değil SES ADI ──────────────────────
// Sahnede "−3" hiçbir şey söylemiyor, "La" söylüyor. Kaydırıcı kromatik
// (−6…+6 yarım ton, ortası eserin ÖZGÜN tonu); ekranda görünen ise varılan
// karar sesinin ADI. Yazım biçimi kullanıcının ortak tercihine bağlı
// (akorYazim:<uid> → ABC ya da Do Re Mi), yani akorlarla hep aynı dilde.
// Karar sesi girilmemiş / tanınmayan (koma sesleri) eserlerde ad hesaplanamaz;
// orada eski ± adımlayıcıya düşülür — bkz. buildStageToolsRow.

const TON_MIN = -6, TON_MAX = 6;
// Varılan sesin adı: 'solfej' tercihinde "La", değilse "A". Bilinmiyorsa null.
function tonSesAdi(closingNote, n) {
  const i = parseKararNote(closingNote);
  if (i === null) return null;
  const j = ((i + (n||0)) % 12 + 12) % 12;
  const yazim = (typeof getAkorYazim === 'function') ? getAkorYazim() : 'abc';
  // Kaydırma yokken kullanıcının diyez yazımı korunur (bkz. kararLabel notu).
  const d = !n && _kararDiyezMi(closingNote);
  if (yazim === 'solfej') return (d ? _KARAR_TR_D : _KARAR_TR)[j];
  return (d ? _KARAR_LATIN_D : _KARAR_LATIN)[j];
}

function renderStageChords(text) { return renderChordPro(text); }

function renderChordPro(text) {
  if (!text) return '';
  const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return text.split('\n').map(line => {
    // Direktif satırı {comment: ...} / {c: ...} → bölüm etiketi
    const dir = line.match(/^\s*\{\s*(?:c|comment|comment_italic|ci)?\s*:?\s*([^}]*)\}\s*$/i);
    if (dir) { const l = esc((dir[1]||'').trim()); return l ? `<div class="cp-comment">${l}</div>` : ''; }
    if (line.trim() === '') return '<div class="cp-blank"></div>';
    // (2026-08-09) SATIR SONU TEKRAR İŞARETİ — "2X", "3X", "(2X)", "x2".
    // Emir'in gerçek kullanımı bu: satırı zaten okuyorsun, sonuna 2X koyunca
    // "bir kez daha" demiş oluyorsun. Bölüm başlığı DEĞİL, satıra ait bir not;
    // o yüzden satırın UCUNDA küçük bir rozet olarak çiziliyor ve akor
    // hizalamasına karışmıyor (metinden ayrılıp sona ekleniyor).
    let _rep = '';
    const _rm = line.match(/\s*[\(\[]?\s*(?:([0-9]{1,2})\s*[xX]|[xX]\s*([0-9]{1,2}))\s*[\)\]]?\s*$/);
    if (_rm && line.trim().length > (_rm[0].trim().length)) {
      _rep = (_rm[1] || _rm[2]) + 'X';
      line = line.slice(0, line.length - _rm[0].length);
    }
    const _repHtml = _rep ? `<span class="cp-rep">${_rep}</span>` : '';
    // (2026-08-09) ÇIPLAK YAZILMIŞ İŞARETLER de bölüm başlığı sayılır.
    // Kullanıcı `{Nakarat}` yerine sadece "Nakarat" ya da "2X" yazmış olabilir
    // (söz alanında öyle yazıyordu, kopyala-yapıştırla akora da öyle geliyor).
    // Liste bilerek DAR tutuldu: yalnızca akor içermeyen ve tam eşleşen kısa
    // satırlar; bir söz dizesinin yanlışlıkla başlığa dönüşmesini istemiyoruz.
    const _m = line.trim().replace(/[:：]\s*$/, '');
    if (/^(nakarat|bağlantı|baglanti|kıta|kita|ara saz|ara|giriş|giris|coda|final|intro)$/i.test(_m)
        || /^[0-9]{1,2}\s*[xX]$/.test(_m) || /^[xX]\s*[0-9]{1,2}$/.test(_m)) {
      return `<div class="cp-comment">${esc(_m)}</div>`;
    }
    if (line.indexOf('[') === -1) {
      return `<div class="cp-line"><span class="cp-seg"><span class="cp-chord"></span><span class="cp-lyric">${esc(line)}</span></span>${_repHtml}</div>`;
    }
    let html = '<div class="cp-line">';
    const first = line.indexOf('[');
    if (first > 0) html += `<span class="cp-seg"><span class="cp-chord"></span><span class="cp-lyric">${esc(line.slice(0, first))}</span></span>`;
    const re = /\[([^\]]*)\]([^\[]*)/g; let m;
    const scan = line.slice(first);
    while ((m = re.exec(scan)) !== null) {
      const chord = esc(m[1].trim());
      const lyric = esc(m[2]);
      const tail = lyric.trim() === '';
      html += `<span class="cp-seg${tail ? ' cp-tail' : ''}"><span class="cp-chord">${chord}</span><span class="cp-lyric">${lyric === '' ? '&nbsp;' : lyric}</span></span>`;
    }
    html += _repHtml + '</div>';
    return html;
  }).join('');
}

/* ── 2026-07-29 (3): AKOR ÇAKIŞMA KORUYUCUSU ──────────────────────────────────
   .cp-chord width:0 olduğu için akor metni segmentten TAŞAR; tarayıcı bu taşan
   metni layout'ta görmediğinden iki akor görsel olarak üst üste binebiliyor
   ("CmDb", "Bbm"+"Cm"). CSS ile çözülemez: akora genişlik verirsek güfte
   ortadan yarılıyor (eski hata). Çözüm: render'dan sonra akorların GERÇEK metin
   genişliğini Range ile ölçüp çakışanları sağa kaydırmak (transform:translateX).
   transform layout'u değiştirmediği için güfte hiç etkilenmez ve ResizeObserver
   döngüsü oluşmaz. Akor kendi hecesinden en fazla birkaç piksel kayar; kelime
   bütünlüğü korunur. Satır kaydığında (mobilde sarma) üst koordinat değişir,
   o yüzden her görsel satır için sayaç sıfırlanır. */
(function(){
  if (window.__cpOverlapGuard) return; window.__cpOverlapGuard = true;
  var scheduled = false, ro = null, seen = null;
  function textRect(el){
    var r = document.createRange();
    r.selectNodeContents(el);
    var rect = r.getBoundingClientRect();
    if (r.detach) r.detach();
    return rect;
  }
  function fixLine(line){
    if (!line.getClientRects().length) return;   // görünmeyen (display:none) satırı ölçme
    var all = line.querySelectorAll('.cp-chord'), chords = [], i;
    for (i = 0; i < all.length; i++) if (all[i].textContent.trim()) chords.push(all[i]);
    for (i = 0; i < chords.length; i++) chords[i].style.transform = '';
    if (chords.length < 2) return;
    var rects = [];
    for (i = 0; i < chords.length; i++) rects.push(textRect(chords[i]));
    var prevRight = -1e9, prevTop = null, shifts = [], gap, s, r;
    for (i = 0; i < chords.length; i++) {
      r = rects[i];
      if (prevTop === null || Math.abs(r.top - prevTop) > 2) prevRight = -1e9; // yeni görsel satır
      gap = Math.max(4, r.height * 0.35);
      s = prevRight + gap - r.left;
      if (s < 0) s = 0;
      shifts.push(s);
      prevRight = r.left + s + r.width;
      prevTop = r.top;
    }
    for (i = 0; i < chords.length; i++)
      if (shifts[i] > 0.5) chords[i].style.transform = 'translateX(' + shifts[i].toFixed(1) + 'px)';
  }
  function run(){
    scheduled = false;
    var lines = document.querySelectorAll('.cp-line'), i, p;
    if (!lines.length) return;
    if (!ro && window.ResizeObserver && window.WeakSet) { ro = new ResizeObserver(schedule); seen = new WeakSet(); }
    for (i = 0; i < lines.length; i++) {
      fixLine(lines[i]);
      if (ro) { p = lines[i].parentElement; if (p && !seen.has(p)) { seen.add(p); ro.observe(p); } }
    }
  }
  function schedule(){
    if (scheduled) return;
    scheduled = true;
    if (window.requestAnimationFrame) window.requestAnimationFrame(run); else setTimeout(run, 0);
  }
  window.cpFixChordOverlaps = schedule;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedule); else schedule();
  if (window.MutationObserver) {
    new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++) if (muts[i].addedNodes && muts[i].addedNodes.length) { schedule(); return; }
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', schedule);
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) document.fonts.ready.then(schedule);
})();


let _stageToolsAutoHide = null;
// Telefonda şerit güfteyi kapattığı için kapanır (8sn), masaüstü/tablette yer sorunu

function scheduleStageToolsHide() {

function toggleStageTools(e) {
  if (e) e.stopPropagation();
  const panel = document.getElementById('stageToolsPanel');
  const isOpen = panel.style.display === 'flex';
  if (!isOpen) {
    // "Sıradaki" kartıyla çakışmasın diye alt bar'ın (.sb) gerçek yüksekliğine göre konumlan
    const sb = document.querySelector('.sb');
    const sbHeight = sb ? sb.getBoundingClientRect().height : 80;
    panel.style.bottom = (sbHeight + 8) + 'px';
    // Fare/parmak şeridin üzerindeyken kapanmasın; ayrılınca sayaç yeniden başlasın

      panel.dataset.hoverBound = '1';

      panel.addEventListener('touchstart', stay, {passive:true});
      panel.addEventListener('mouseleave', scheduleStageToolsHide);
    }
  }
  panel.style.display = isOpen ? 'none' : 'flex';

function toggleStageTheme(){

function applyStageTheme(screen){
  const t = localStorage.getItem('stageTheme') || 'night';
  const isStageDay   = screen === 'stage' && t === 'day';
  const isStageNight = screen === 'stage' && t === 'night';
  document.body.classList.toggle('day-theme', isStageDay);

  function applyVars(){
    const el = document.documentElement;
    if(screen === 'stage') el.removeAttribute('data-theme');
    if(isStageNight){
      el.style.setProperty('--bg',      '#080810');
      el.style.setProperty('--surface', '#0f0f1a');
      el.style.setProperty('--surface2','#161625');
      el.style.setProperty('--border',  '#484860');
      el.style.setProperty('--text',    '#f1f0ff');

      el.style.setProperty('--text',    '#1a1825');
      el.style.setProperty('--text2',   '#5a5670');
      el.style.setProperty('--text3',   '#9d9aae');

  setTimeout(applyVars, 100);

  const btn = document.getElementById('stageThemeBtn2');

function startStage(){

function renderStage(){

// ── POTPURİ yardımcısı ──
// items[idx] hangi zincirde? {inChain, pos (1-tabanlı), len, nextLinked}
// Zincir = linked_prev=true olan ARDIŞIK satırlar; ilk satırda bayrak yok sayılır.
function stageChainInfo(items, idx){
  const lp = i => i > 0 && !!(items[i] && items[i].linked_prev);
  let a = idx, b = idx;
  while (a > 0 && lp(a)) a--;
  while (b + 1 < items.length && lp(b+1)) b++;
  const len = b - a + 1;
  return { inChain: len > 1, pos: idx - a + 1, len, nextLinked: lp(idx+1) };
}

// ── 2026-07-20: ÇOK SAYFALI NOTA — sayfa gezinmesi ────────────────────────
// Nota görünümündeyken ileri/geri ÖNCE sayfa çevirir; son sayfadan sonra bir
// SONRAKİ ESERE geçer (ilk sayfadan geriye giderken önceki esere). Swipe,
// klavye/pedal ve yan oklar aynı yoldan geçer — davranış her yerde aynı.
let _notaPage = 0, _notaWorkKey = null, _notaEnterFromEnd = false;

function stageNotaPages(w) {
  if (!w) return [];
  const p = Array.isArray(w.notaPages) ? w.notaPages.filter(Boolean) : [];
  if (p.length) return p;
  return w.notaUrl ? [w.notaUrl] : [];
}
function isStageNotaImage(u){ return /\.(jpe?g|png|gif|webp|heic|tiff?)(\?|$)/i.test(u||''); }

// Şu an nota görünümünde miyiz? (öyleyse aktif eserin sayfa listesini döner)
function currentNotaPages() {
  const item = curRep && curRep.items ? curRep.items[curIdx] : null;
  if (!item) return [];
  const w = WL[String(item.workId)] || {};
  if (getStageViewMode(w) !== 'nota') return [];
  return stageNotaPages(w);
}

function notaViewHtml(pages, i) {
  const u = pages[i];
  const body = isStageNotaImage(u)
    ? `<img id="notaImg" src="${u}" alt="Nota sayfa ${i+1}">`
    : `<div class="nota-pdf">📄 PDF nota — sayfa geçişi için sayfaları ayrı görsel olarak yükle.<br>
         <a href="${u}" target="_blank" style="color:var(--accent);">↗ Aç</a></div>`;
  const counter = pages.length > 1 ? `<div class="nota-count" id="notaCount">${i+1} / ${pages.length}</div>` : '';
  const pager = pages.length > 1 ? `
    <div class="nota-pager" id="notaPager">
      <button onclick="event.stopPropagation();notaGoPage(${i-1})" ${i===0?'disabled':''} aria-label="${_sCev('sh.oncekiSayfa','Önceki sayfa')}">‹</button>
      <div class="nota-dots">${pages.map((_,k)=>`<button class="nota-dot${k===i?' cur':''}" onclick="event.stopPropagation();notaGoPage(${k})" aria-label="Sayfa ${k+1}"></button>`).join('')}</div>
      <button onclick="event.stopPropagation();notaGoPage(${i+1})" ${i===pages.length-1?'disabled':''} aria-label="${_sCev('sh.sonrakiSayfa','Sonraki sayfa')}">›</button>
    </div>` : '';
  return counter + `<div class="wnota">${body}${pager}</div>`;
}

// Sonraki sayfayı önden yükle — sahnede sayfa çevirince bekleme olmasın
function notaPreloadNext(pages, i) {
  const nxt = pages[i+1];
  if (nxt && isStageNotaImage(nxt)) { const im = new Image(); im.src = nxt; }
}

// Sayfaya git (pager/dot). Aralık dışına taşarsa eser değiştirir.
function notaGoPage(i) {
  const pages = currentNotaPages();
  if (!pages.length) return;
  if (i < 0) { sideNavPrev(); return; }
  if (i > pages.length - 1) { sideNavNext(); return; }
  _notaPage = i;
  const sm = document.getElementById('sm');
  if (!sm) return;
  sm.innerHTML = notaViewHtml(pages, i);
  notaPreloadNext(pages, i);
}

// true dönerse "sayfa çevrildi, eser değiştirme"
function notaStepPage(dir) {
  const pages = currentNotaPages();
  if (pages.length < 2) return false;
  const t = _notaPage + dir;
  if (t < 0 || t > pages.length - 1) return false;   // sınırda → eser değişsin
  notaGoPage(t);
  return true;
}

function nextWork(){
  if (notaStepPage(1)) return;   // önce nota sayfası
  sideNavNext();
}

function prevWork(){
  if (notaStepPage(-1)) return;
  _notaEnterFromEnd = currentNotaPages().length > 0;   // önceki eserin son sayfasında aç
  sideNavPrev();
}

function viewModeStorageKey(){

function getStageViewMode(w) {
  let mode = localStorage.getItem(viewModeStorageKey()) || 'lyrics';

        <button onclick="event.stopPropagation();tonNudge(1)" class="ton-step" title="${_sCev('sh.yarimTonTiz','Yarım ton tiz')}"><i class="ti ti-plus"></i></button>
        <span class="ton-nota" id="tonNota">${_tonKutuIcerik(tVal)}</span>
      </div>`;
    }
  }
  // Akor yazımı: A B C / Do Re Mi. Yalnızca AKOR görünümünde gösterilir —
  // başka görünümde etkisi olmadığı için orada durması kafa karıştırırdı.
  // Tercih auth.js'teki ortak anahtarda (kullanıcı bazlı); eser düzenleme
  // ekranındaki radyoyla AYNI ayardır.
  const _yazim = (typeof getAkorYazim === 'function') ? getAkorYazim() : 'abc';
  const yazimBtns = (mode === 'chords') ? `
      <button onclick="event.stopPropagation();setAkorYazimi('abc')" title="${_sCev('sh.akorABC','Akorları A B C yaz')}" class="align-btn${_yazim==='abc'?' active':''}" style="width:auto;padding:0 10px;font-size:12px;font-weight:800;">ABC</button>
      <button onclick="event.stopPropagation();setAkorYazimi('solfej')" title="${_sCev('sh.akorSolfej','Akorları Do Re Mi yaz')}" class="align-btn${_yazim==='solfej'?' active':''}" style="width:auto;padding:0 10px;font-size:12px;font-weight:800;">Do Re Mi</button>` : '';

  // Başlıklı blok; içi boşsa hiç çizilmez (ör. akoru olmayan eserde Ton bloğu).
  // (2026-08-13) Üçüncü parametre: blok DİKEY dizilsin mi (Sahne bloğu gibi
  // yazılı eylem satırları için; ikon düğmeleri yatay kalıyor).
  const grup = (baslik, icerik, dikey) => icerik
    ? `<div class="st-grp"><div class="st-grp-lbl">${baslik}</div><div class="st-grp-row${dikey ? ' st-grp-col' : ''}">${icerik}</div></div>`
    : '';

  // Yazı boyutu: tek kaydırıcı. Panel her açılışta yeniden kurulduğu için
  // değer kayıtlı ölçekten okunuyor (setLyricsFontScale zaten saklıyor).
  const _olcek = parseFloat(localStorage.getItem('stageLyricsScale') || '1') || 1;
  const fontBlok = `
      <div class="font-slider-wrap" title="${_sCev('sh.yaziBoyutu','Yazı Boyutu')}">
        <span class="fs-a-sm">A</span>
        <input type="range" id="lyricsFontSlider" class="font-slider" min="0.75" max="1.6" step="0.05" value="${_olcek}"
          onclick="event.stopPropagation()" oninput="setLyricsFontScale(this.value)">
        <span class="fs-a-lg">A</span>
      </div>`;

  if (mode === 'nota') {
    row.innerHTML = grup(_sCev('sh.gorunum','Görünüm'), themeBtn) + grup(_sCev('sh.grupSahne','Sahne'), sahneBtns, true);
  } else {
    // lyrics ve chords aynı .wlyrics kutusunu kullandığı için hizalama ikisinde de geçerli
    const alignBtns = `
      <button onclick="event.stopPropagation();setLyricsAlign('left')" id="alignLeft" title="${_sCev('sh.solaYasla','Sola Yasla')}" class="align-btn"><i class="ti ti-align-left"></i></button>
      <button onclick="event.stopPropagation();setLyricsAlign('center')" id="alignCenter" title="${_sCev('sh.ortala','Ortala')}" class="align-btn"><i class="ti ti-align-center"></i></button>
      <button onclick="event.stopPropagation();setLyricsAlign('right')" id="alignRight" title="${_sCev('sh.sagaYasla','Sağa Yasla')}" class="align-btn"><i class="ti ti-align-right"></i></button>`;
    // (2026-08-21) Kişisel not aç/kapa — YALNIZCA o eserde not varsa çizilir.
    // Notu olmayan eserde düğme göstermek "neyi kapatıyorum?" sorusu doğurur.
    const _knotVar = !!(item && PERSONAL_NOTES[String(item.workId)]);
    const knotBtn = _knotVar ? `
      <button onclick="knotGosterToggle(event)" title="${_sCev('sh.knotToggleT','Kişisel notu göster/gizle')}" class="align-btn${KNOT_GOSTER?' active':''}" style="width:auto;padding:0 10px;font-size:12px;font-weight:700;"><i class="ti ti-lock"></i> ${KNOT_GOSTER?_sCev('sh.acik','Açık'):_sCev('sh.kapali','Kapalı')}</button>` : '';
    row.innerHTML = grup(_sCev('sh.hizalama','Hizalama'), alignBtns)
                  + grup(_sCev('sh.yaziBoyutu','Yazı Boyutu'), fontBlok)
                  + grup(_sCev('sh.ton','Ton'), tonBtns)
                  + grup(_sCev('sh.akorYazimi','Akor Yazımı'), yazimBtns)
                  + grup(_sCev('sh.kisiselNot','Kişisel Not'), knotBtn)
                  + grup(_sCev('sh.gorunum','Görünüm'), themeBtn)
                  + grup(_sCev('sh.grupSahne','Sahne'), sahneBtns, true);
    // Panel her yeniden kurulduğunda kaydırıcının dolgu rengi ve hiza
    // düğmelerinin aktif hâli sıfırlanır — kayıtlı değerlerden geri yazılır.
    updateFontSliderUI(_olcek);
    if (_tonAcik) updateTonSliderUI(tVal);   // ray dolgusu da her kurulumda geri yazılır
    const _hiza = localStorage.getItem('stageLyricsAlign') || 'left';
    ['left','center','right'].forEach(a => {
      const b = document.getElementById('align' + a.charAt(0).toUpperCase() + a.slice(1));
      if (b) b.classList.toggle('active', a === _hiza);
    });
  }
}

// Akor yazımını değiştir ve sahneyi yeniden çiz (gösterim değişikliği; veri aynı).
// ── "LİSTE DEĞİŞTİ" ŞERİDİ (2026-08-06) ──────────────────────────────
// Sahnede veri KENDİLİĞİNDEN değişmez: konser sırasında listenin altından
// kayması kötü sürpriz olur. Canlı güncelleme geldiğinde yalnızca haber
// veriyoruz; tazeleme kararı icracıda.
function showStageChangeBar() {
  if (document.getElementById('stChangeBar')) return;
  const bar = document.createElement('button');
  bar.id = 'stChangeBar';
  bar.type = 'button';
  bar.onclick = async function () {
    bar.disabled = true;
    bar.textContent = 'Yenileniyor...';
    try { if (typeof syncOfflineData === 'function') await syncOfflineData(); } catch (e) {}
    bar.remove();
    try { renderStage(); } catch (e) { location.reload(); }
  };
  bar.textContent = _sCev('sh.repGuncellendi','Repertuvar güncellendi — yenilemek için dokun');
  bar.style.cssText =
    'position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));' +
    'z-index:9999;background:var(--accent);color:#1a1200;border:none;border-radius:20px;' +
    'padding:8px 16px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;' +
    'box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:calc(100vw - 24px);';
  document.body.appendChild(bar);
}

function showScreen(id){
  // (2026-08-19 DÜZELTME) ODAĞI BIRAKMAK DEĞİL, SAHNEYE VERMEK GEREKİYOR.
  // İlk hâli `blur()` çağırıyordu; masaüstünde zararsızdı ama iPad'de ters
  // tepti: iOS'ta sayfada odaklanmış bir öğe yoksa donanım klavyesinin
  // (Bluetooth pedal) tuşları sayfaya HİÇ düşmüyor — Notlar'da pedal imleci
  // oynatıyor ama tarayıcıda `?pedaltest=1` şeridi sessiz kalıyordu.
  // Çözüm: seçicideki arama kutusundan odağı almak ama boşta bırakmamak —
  // odak sahne kabına veriliyor (stageScreen'e tabindex="-1" eklendi).
  if (id === 'stageScreen') {
    // (2026-08-23) tabindex'li DIV ODAK YETMIYOR. Emir'in olcumu: pedal
    // mod 4/5/6'da (PageUp/PageDown, ok tuslari) ?pedaltest=1 seridinde HICBIR
    // olay uretmiyor; mod 7'de (fare) olay geliyor. Yani tus WKWebView'e hic
    // dusmuyor. iOS'ta bir <div>'e tabindex verip odaklamak, donanim klavyesi
    // olaylarini almak icin YETERLI DEGIL — gercek bir metin alani gerekiyor.
    //
    // EKRAN KLAVYESI RISKI: normalde input'a odaklanmak klavyeyi acar, sahnede
    // felaket olur. Iki koruma var: (1) inputmode="none" iOS'a yazi klavyesi
    // gosterme diyor; (2) harici klavye (pedal) bagliyken iOS zaten ekran
    // klavyesini bastiriyor. Klavye yine de cikarsa bu blok geri alinmali.
    try {
      // (2026-08-23 DUZELTME-4) stageScreen'in tabindex'i KALDIRILDI.
      // Olcum: odak once INPUT#_pedalOdak'a geldi, sonra ekrana dokununca
      // DIV#stageScreen'e kaydi ve orada kaldi. Sebep 08-19'da eklenen
      // tabindex="-1": <div>'i odaklanabilir yapiyor ve her dokunusta odagi
      // tuzaktan caliyor. Artik gereksiz — odagi gercek bir metin alani
      // tutuyor. Kalirsa pedal tuslari yine kaybolur.
      const sc = document.getElementById('stageScreen');
      if (sc && sc.getAttribute('tabindex') === '-1') sc.removeAttribute('tabindex');
      let tuz = document.getElementById('_pedalOdak');
      if (!tuz) {
        tuz = document.createElement('input');
        tuz.id = '_pedalOdak';
        tuz.type = 'text';
        tuz.setAttribute('inputmode', 'none');       // yazi klavyesi acma
        tuz.setAttribute('autocomplete', 'off');
        tuz.setAttribute('autocorrect', 'off');
        tuz.setAttribute('autocapitalize', 'off');
        tuz.setAttribute('spellcheck', 'false');
        tuz.setAttribute('aria-hidden', 'true');
        // Gorunmez ama ODAKLANABILIR olmali: display:none ya da
        // visibility:hidden odagi engeller. 1px, saydam, dokunulamaz.
        // (2026-08-23 DUZELTME-3) GORUNMEZ ALAN ODAK ALMIYOR. Onceki hali
        // opacity:0 + pointer-events:none + z-index:-1 idi; WebKit gercekten
        // gorunur/dokunulabilir olmayan bir metin alanina odaklanmayi reddediyor
        // olabilir. Artik alan sahiden ekranda ve dokunulabilir — sadece goze
        // carpmayacak kadar kucuk ve saydama yakin.
        tuz.style.cssText = 'position:fixed;bottom:2px;right:2px;width:24px;height:24px;' +
          'opacity:.01;border:0;padding:0;margin:0;background:transparent;' +
          'color:transparent;caret-color:transparent;font-size:16px;z-index:5;';
        (document.body || document.documentElement).appendChild(tuz);
        // Pedal disinda bir sey yazarsa (ekran klavyesi acildiysa) alani bosalt.
        tuz.addEventListener('input', function(){ tuz.value = ''; });
        // Odak baska bir yere kayarsa hemen geri al. focusout, dokunma
        // zincirinin ICINDE tetiklenir; bu yuzden focus() burada kabul edilir.
        tuz.addEventListener('focusout', function () {
          setTimeout(function () {
            try {
              if (document.getElementById('stageScreen').classList.contains('hidden')) return;
              const ae = document.activeElement;
              if (ae === tuz) return;
              // Gercek bir yazi kutusuna gectiyse (sahne notu) dokunma.
              if (ae) {
                const t = (ae.tagName || '').toUpperCase();
                if (t === 'INPUT' || t === 'TEXTAREA' || ae.isContentEditable) {
                  if (ae.id !== '_pedalOdak') return;
                }
              }
              tuz.focus({ preventScroll: true });
            } catch (e) {}
          }, 0);
        });
      }
      window._pedalOdakVer = function () {
        try {
          if (document.getElementById('stageScreen').classList.contains('hidden')) return;
          if (document.activeElement === tuz) return;
          // Kullanici gercek bir kutuya yaziyorsa (sahne notu/arama) elinden alma.
          const ae = document.activeElement;
          if (ae && ae !== document.body && ae !== tuz) {
            const t = (ae.tagName || '').toUpperCase();
            if (t === 'INPUT' || t === 'TEXTAREA' || ae.isContentEditable) return;
          }
          tuz.focus({ preventScroll: true });
        } catch (e) {}
      };
      // (2026-08-23 DUZELTME-2) EŞZAMANLI CAGIRMAK SART. Ilk halim setTimeout
      // kullaniyordu; olcum `odak=BODY` cikti, yani focus() sessizce reddedildi.
      // iOS Safari bir metin alanina PROGRAMLA odaklanmayi yalnizca kullanici
      // hareketinin (dokunma) is parcaciginda kabul ediyor; setTimeout o zinciri
      // kirar ve istek yok sayilir. showScreen zaten dokunma isleyicisinden
      // cagriliyor, bu yuzden burada HEMEN odakliyoruz.
      window._pedalOdakVer();
      // Ipucu (varsa) sahne cizildikten sonra gosterilsin.
      setTimeout(function(){ try { if (window._pedalIpucuGoster) window._pedalIpucuGoster(); } catch(e){} }, 500);

      // (2026-08-23) "Pedali etkinlestir" DUGMESI KALDIRILDI.
      // Kisa omurluydu ama sorunu cozen olcumu o verdi: dugmeyle gelen odak
      // calisiyor, kodla verilen odak calismiyordu. Cikarim su: iOS'ta
      // activeElement alani gosterse bile WKWebView klavye odagini yalnizca
      // GERCEK bir kullanici hareketiyle devrediyor.
      // Artik ayni isi sahnedeki HERHANGI bir dokunus yapiyor (asagidaki
      // `zorlaOdakla`), kullanici zaten repertuvari acarken ekrana dokunuyor —
      // yani ayri bir dugmeye gerek kalmadi.
      // Yedek deneme: gecis animasyonu bir seyi ezdiyse. Bu gecikmeli cagri
      // iOS'ta muhtemelen ise yaramaz ama masaustunde/Android'de zarari yok.
      setTimeout(window._pedalOdakVer, 300);
    } catch(e) {}
  }
  if (id !== 'stageScreen') { try { if (window._pedalIpucuGizle) window._pedalIpucuGizle(); } catch(e){} }
  ['pickerScreen','stageScreen','endScreen'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));
  const tnav=document.getElementById('v2StageTopnav');if(tnav)tnav.classList.toggle('hidden',id!=='pickerScreen');
  // topnav.js header'ını sahne modunda gizle
  const rTopnav=document.querySelector('.r-topnav');
  if(rTopnav)rTopnav.style.display=id==='stageScreen'?'none':'';
  const bnav=document.getElementById('v2StageBotNav');
  const stageNav=document.getElementById('stageNavStage');
  if(bnav){
    if(id==='stageScreen'){
      bnav.style.display='flex';
      bnav.classList.add('stage-hidden'); // sahne modunda başta gizli
      if(stageNav)stageNav.style.display='flex';
    } else {
      // picker/bitiş ekranlarında kendi nav'ımızı göstermiyoruz —
      // paylaşılan topnav.js alt nav'ı (#r-bottom-nav) zaten burada görünür durumda.
      // İki ayrı nav'ın üst üste binmesi (ve ikonların tutarsız kalması) bu yüzden
      // kaldırıldı — bkz. Eserler/Repertuvarlar ikon karışıklığı bug'ı.
      bnav.style.display='none';
    }
  }
  // Paylaşılan topnav.js header/alt-navbar'ını sahne ekranında CSS ile kesin gizle —
  // giriş yoluna (eserler ?work= vs repertuvar) ve topnav.js'in geç yüklenmesine
  // bakmaksızın çalışır; stageEnter olayının yakalanmasına bağlı kalmaz.
  document.body.classList.toggle('stage-active', id==='stageScreen');
}

// ── 2026-08-19: PEDAL DESTEĞİ GENİŞLETİLDİ ────────────────────────────────
// Belirti (Emir): "iPad üzerinde pedal çalışmıyor." Sahne kodunun geri kalanı
// sağlamdı (swipe ve ok tuşları çalışıyordu); eksik olan TUŞ LİSTESİYDİ.
// Bluetooth nota çevirme pedallarının çoğu (AirTurn, PageFlip, Donner,
// iRig BlueTurn, Coda) varsayılan modda PageDown/PageUp gönderir; bazı modlar
// Enter, Backspace ya da nokta/virgül/a-b kullanır. Eski liste yalnızca ok
// tuşları ve boşluktu — pedalın tuşu geliyordu ama yok sayılıyordu.
// Üç incelik daha eklendi:
//  (1) DEBOUNCE — bazı pedallar tek basışta iki sinyal üretiyor; 250 ms
//      içindeki ikinci sinyal yok sayılıyor, yoksa tek dokunuşta iki eser
//      atlanıyordu.
//  (2) e.repeat yok sayılıyor — klavyede tuşu basılı tutunca repertuvarın
//      sonuna uçuluyordu.
//  (3) ODAK KONTROLÜ — imleç bir metin kutusundaysa tuş oraya aittir, sahne
//      gezinmesi devreye girmez.
// (2026-08-19) PEDAL TEŞHİS MODU — `?pedaltest=1` ile açılır.
// Geniş tuş listesine rağmen pedal çalışmıyorsa soru şudur: pedal iPad'e HANGİ
// tuşu gönderiyor, hatta bir şey gönderiyor mu? iPad'de konsol açmak zor
// olduğu için ekrana basıyoruz. Açıkken her keydown/keyup olayını üstte
// gösterir; pedala basınca bir şey yazmıyorsa sorun tuş listesinde DEĞİL,
// pedalın klavye olarak eşleşmemesinde ya da odakta demektir.
(function(){
  try {
    if (new URLSearchParams(location.search).get('pedaltest') !== '1') return;
    const kutu = document.createElement('div');
    kutu.style.cssText = 'position:fixed;top:8px;left:8px;right:8px;z-index:99999;'+
      'background:rgba(0,0,0,.85);color:#0f0;font:12px/1.5 monospace;padding:8px 10px;'+
      'border-radius:8px;white-space:pre-wrap;pointer-events:none;';
    kutu.textContent = _sCev('sh.pedalTeshis','PEDAL TEŞHİS — pedala bas (son 8 olay listelenir)');
    // (2026-08-19 düzeltme) Şerit ÜZERİNE YAZIYORDU, son olay öncekini siliyordu.
    // Pedal bir KOMBİNASYON gönderiyorsa (ör. Cmd+ArrowDown) sırayla dört olay
    // doğar (Meta ↓, Arrow ↓, Arrow ↑, Meta ↑) ve ekranda yalnız sonuncusu
    // kalırdı — nitekim ilk ölçümde sadece `key="Meta"` görüldü. Artık son 8
    // olay listeleniyor, dizinin tamamı görülebiliyor.
    const kayitlar = [];
    const yaz = (satir) => {
      kayitlar.push(satir);
      while (kayitlar.length > 8) kayitlar.shift();
      kutu.textContent = kayitlar.join('\n');
    };
    // (2026-08-23) Odaktaki ogeyi de yaziyoruz: pedal sorununun kaynagi odak
    // oldugu icin "tus geldi mi" kadar "odak nerede" de kritik.
    setInterval(function(){
      try {
        const ae = document.activeElement;
        const ad = ae ? ((ae.tagName||'?') + (ae.id ? '#' + ae.id : '')) : 'yok';
        const sat = 'odak=' + ad;
        if (kayitlar[kayitlar.length-1] !== sat) yaz(sat);
      } catch(e){}
    }, 2000);
    const yazTus = (e, tur) => {
      yaz(tur + ' key=' + JSON.stringify(e.key) +
          ' code=' + JSON.stringify(e.code) +
          ' keyCode=' + e.keyCode +
          (e.metaKey ? ' META' : '') + (e.ctrlKey ? ' CTRL' : '') +
          (e.altKey ? ' ALT' : '') + (e.shiftKey ? ' SHIFT' : '') +
          (e.repeat ? ' repeat' : ''));
    };
    document.addEventListener('keydown', e => yazTus(e,'↓'), true);
    document.addEventListener('keyup',   e => yazTus(e,'↑'), true);
    // (2026-08-19 genişletme) Emir'in ölçümü: pedal SAYFAYI KAYDIRIYOR ama
    // şeritte hiçbir tuş görünmüyor ⇒ olay klavye olayı OLMAYABİLİR. Bazı
    // pedallar (Lekato dâhil) belirli modlarda klavye yerine FARE TEKERLEĞİ /
    // işaretçi taklidi yapar; o zaman keydown hiç doğmaz ama `wheel` doğar ve
    // sayfa kayar — gözlenen tablo tam olarak bu. Bu yüzden tekerlek ve
    // işaretçi olayları da kaydediliyor.
    let _wn = 0;
    document.addEventListener('wheel', e => {
      _wn++;
      yaz('wheel #' + _wn + ' deltaY=' + Math.round(e.deltaY) + ' deltaX=' + Math.round(e.deltaX));
    }, true);
    document.addEventListener('pointerdown', e => {
      yaz('pointerdown type=' + e.pointerType + ' button=' + e.button);
    }, true);
    // Pedal isleyicisi buradan serite yazabilsin.
    window._pedalTeshis = yaz;
    if (document.body) document.body.appendChild(kutu);
    else document.addEventListener('DOMContentLoaded', () => document.body.appendChild(kutu));
  } catch(e) {}
})();

// (2026-08-23) ODAK KAYBOLURSA GERI AL. Sahnede ekrana dokunmak, arka plandan
// donmek ya da bir dugmeye basmak odagi tasiyabilir; odak gidince pedal tuslari
// yine sayfaya dusmez. Bu yuzden birkac noktada geri aliyoruz.
(function(){
  function geriAl(){ try { if (window._pedalOdakVer) window._pedalOdakVer(); } catch(e){} }

  // (2026-08-23 DUZELTME-6) EKRANA DOKUNMAK DA PEDALI ETKINLESTIRSIN.
  // Emir hakli olarak sordu: repertuvari acarken zaten ekrana dokunuyoruz,
  // neden yetmiyor? Sebep `_pedalOdakVer` icindeki `activeElement === tuz`
  // erken cikisi: kod odagi coktan vermis oldugu icin activeElement zaten
  // alani gosteriyor, dolayisiyla GERCEK kullanici hareketiyle odak devri
  // hic denenmiyordu. Klavye odagi ise ancak o gercek harekette devrediliyor.
  // Cozum: ilk pedal tusu gelene kadar, dokunma aninda odagi ZORLA yenile
  // (blur + focus). Tus geldikten sonra bu blok devre disi kalir.
  // (2026-08-23) PEDAL IPUCU. Sahnede ekrana bir kez dokunmak, klavye odagini
  // gizli alana devredip pedali calisir hale getiriyor (bkz. DUZELTME-6).
  // Kullanici bunu bilemez; pedal sessiz kalirsa neyin eksik oldugunu anlamaz.
  // Ama HERKESE gostermek de yanlis olurdu — cogu kullanicinin pedali yok ve
  // anlamsiz bir uyari gorurdu. Bu yuzden ipucu YALNIZCA daha once bu cihazda
  // pedal tusu gormussek cikiyor.
  function _pedalIpucuGizle(){
    var el = document.getElementById('_pedalIpucu');
    if (el) el.remove();
  }
  window._pedalIpucuGizle = _pedalIpucuGizle;

  function _pedalIpucuGoster(){
    try {
      if (window._pedalTusGeldi) return;
      if (localStorage.getItem('pedalVar') !== '1') return;   // pedalsiz kullanici gormesin
      if (document.getElementById('_pedalIpucu')) return;
      var sahne = document.getElementById('stageScreen');
      if (!sahne || sahne.classList.contains('hidden')) return;
      // (2026-08-23) IPUCU YERINE GERCEK BIR DUGME.
      // Ikon KLAVYE ya da PIYANO degil — kullanici klavye arardi. index.html'de
      // kullanilan pedal cizimi (iki dikdortgen + baglanti) burada da gecerli.
      var el = document.createElement('button');
      el.id = '_pedalIpucu';
      el.type = 'button';
      el.innerHTML =
        '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
        'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="2.5" y="6" width="7" height="12" rx="2"/>' +
        '<rect x="14.5" y="6" width="7" height="12" rx="2"/>' +
        '<path d="M9.5 9h5M9.5 15h5"/><circle cx="12" cy="12" r="1.4"/></svg>' +
        '<span>' + _sCev('sh.pedaliBagla','Pedalı bağla') + '</span>';
      // (2026-08-23) KONUM: sag alttaki ayar dugmesinin HEMEN USTUNDE, saga
      // hizali. Onceki hali ekranin ortasindaydi ve eser sozlerinin uzerine
      // biniyordu — yari saydam oldugu icin metin arkasindan gecince
      // okunamiyordu. Artik dolgun bir zemin var (saydam degil) ve soz
      // alaninin disinda duruyor.
      el.style.cssText = 'position:fixed;bottom:calc(150px + env(safe-area-inset-bottom,0px));' +
        'right:14px;z-index:9996;' +
        'display:flex;align-items:center;gap:7px;' +
        'background:#2A2410;border:1px solid rgba(255,200,61,.75);' +
        'color:#FFC83D;padding:9px 16px;border-radius:20px;font-size:13px;' +
        'font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;' +
        'box-shadow:0 6px 18px rgba(0,0,0,.5);' +
        '-webkit-tap-highlight-color:transparent;';
      // pointerdown: dokunmanin EN ERKEN aninda odakla. `click` cok gec kaliyor —
      // iOS klavye odagini yalnizca dokunusun bu asamasinda devrediyor.
      el.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();              // dugme odagi kendine almasin
        try {
          var t = _odakAlani();
          t.focus({ preventScroll: true });
        } catch (e) {}
        _pedalIpucuGizle();
      });
      (document.body || document.documentElement).appendChild(el);
      // Pedalsiz calisilan bir gun olabilir — dokunulmazsa kendi kaybolsun.
      setTimeout(_pedalIpucuGizle, 15000);
    } catch (e) {}
  }
  window._pedalIpucuGoster = _pedalIpucuGoster;

  // (2026-08-23 DUZELTME-7) ODAK ARTIK SAHNEYE GIRMEDEN ONCE ALINIYOR.
  // Emir hakli olarak israr etti: "ekrana bir kez dokunun" bir yara bandi.
  // Inceleme: startStage() zaten ESZAMANLI (bekleme yok), yani dokunma zinciri
  // kopmuyordu. Gercek fark faz: calisan yol pointerdown/touchstart uzerinde,
  // sahneye giris ise CLICK uzerinde. iOS klavye odagini dokunmanin ERKEN
  // aninda devrediyor; click cok gec kaliyor.
  // Cozum: secici ekraninda repertuvara/butona dokunuldugu ANDA odagi ver.
  // O dokunus zaten yapiliyor — kullanicidan fazladan hicbir sey istemiyoruz.
  function _odakAlani(){
    let t = document.getElementById('_pedalOdak');
    if (t) return t;
    // Sahneye hic girilmemis olabilir; alani burada da olusturabilmeliyiz.
    t = document.createElement('input');
    t.id = '_pedalOdak';
    t.type = 'text';
    t.setAttribute('inputmode', 'none');
    t.setAttribute('autocomplete', 'off');
    t.setAttribute('autocorrect', 'off');
    t.setAttribute('autocapitalize', 'off');
    t.setAttribute('spellcheck', 'false');
    t.setAttribute('aria-hidden', 'true');
    t.style.cssText = 'position:fixed;bottom:2px;right:2px;width:24px;height:24px;' +
      'opacity:.01;border:0;padding:0;margin:0;background:transparent;' +
      'color:transparent;caret-color:transparent;font-size:16px;z-index:5;';
    t.addEventListener('input', function(){ t.value = ''; });
    (document.body || document.documentElement).appendChild(t);
    return t;
  }

  function zorlaOdakla(ev){
    try {
      if (window._pedalTusGeldi) return;                 // is bitti, karisma
      const sahne = document.getElementById('stageScreen');
      if (!sahne || sahne.classList.contains('hidden')) return;
      const tuz = document.getElementById('_pedalOdak');
      if (!tuz) return;
      // Gercek bir form ogesine dokunuluyorsa elini surme.
      const h = ev && ev.target;
      if (h && h.closest && h.closest('input,textarea,select,button,a,[contenteditable]')) return;
      // blur+focus: activeElement zaten alan olsa bile klavye odagini
      // kullanici hareketiyle yeniden devret.
      try { tuz.blur(); } catch(e){}
      tuz.focus({ preventScroll: true });
    } catch (e) {}
  }
  // (2026-08-23 DUZELTME-10) ERKEN OLUSTURMA GERI ALINDI.
  // DUZELTME-8/9'da alani sayfa acilisinda kuruyorduk. Sonuc: hem dokunmadan
  // calismadi, hem de DAHA ONCE CALISAN "ekrana dokun" yolu bozuldu (Emir
  // bildirdi). Calisan yapiya donuyoruz: alan sahneye girilirken olusturuluyor
  // ve odak yalnizca SAHNE ACIKKEN aliniyor.
  document.addEventListener('pointerdown', zorlaOdakla, true);
  document.addEventListener('touchstart', zorlaOdakla, true);

  // Dokunma isleyicisinin ICINDE, eszamanli — gecikme kullanici hareketi
  // zincirini kirar ve iOS odak istegini reddeder.
  document.addEventListener('pointerup', geriAl, true);
  document.addEventListener('touchend', geriAl, true);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') setTimeout(geriAl, 120);
  });
  window.addEventListener('focus', function(){ setTimeout(geriAl, 120); });
  window.addEventListener('pageshow', function(){ setTimeout(geriAl, 120); });
})();

// ── 2026-08-23: PEDAL ONCE SAYFA CEVIRIR, SONRA ESER GECER ───────────────
// Emir sordu: uzun sozlu bir eserde alt kisim ekrana sigmiyor, icra sirasinda
// nasil okunacak? Parmakla kaydirilabiliyor ama sahnede iki el de dolu.
// Sayfa cevirici pedallarin varlik sebebi tam olarak bu: once EKRANI cevirir,
// icerik bitince ESERE gecer. Kisa eserlerde kaydirilacak sey olmadigi icin
// davranis degismez — dogrudan sonraki esere gecilir.
// (2026-08-23 DUZELTME) KAYDIRILAN OGE SABIT DEGIL. Ilk hali dogrudan #sm'i
// kullaniyordu ve calismadi (Emir: "sayfanin altina gitmiyor, sonraki esere
// geciyor"). Icerik duzenine gore tasan oge #sm degil, ic kapsayici ya da
// belgenin kendisi olabiliyor. Bu yuzden adaylari sirayla deneyip GERCEKTEN
// tasani seciyoruz.
function _sozAlani(){
  const adaylar = [
    document.getElementById('sm'),
    document.querySelector('#stageScreen .wlyrics'),
    document.querySelector('#stageScreen .sm'),
    document.getElementById('stageScreen'),
    document.scrollingElement,
    document.documentElement,
    document.body
  ];
  for (const el of adaylar) {
    if (!el) continue;
    if (el.scrollHeight > el.clientHeight + 8) return el;
  }
  return null;
}

// Bir "sayfa" = gorunur yuksekligin %85'i. Kalan %15 baglam icin: okuyucu
// nerede kaldigini kaybetmesin diye son satirlar ustte tekrar goruntulenir.
function _sayfaCevir(yon){
  const k = _sozAlani();
  if (!k) return false;
  const gorunur = k.clientHeight;
  const toplam  = k.scrollHeight;
  if (toplam <= gorunur + 8) return false;          // kaydirilacak sey yok
  const adim = Math.max(gorunur * 0.85, 120);
  if (yon === 'ileri') {
    // Dibe 4px kala "bitti" say — kesirli piksel yuzunden asla tam esitlenmiyor.
    if (k.scrollTop + gorunur >= toplam - 4) return false;
    k.scrollTo({ top: Math.min(k.scrollTop + adim, toplam - gorunur), behavior: 'smooth' });
    return true;
  } else {
    if (k.scrollTop <= 4) return false;
    k.scrollTo({ top: Math.max(k.scrollTop - adim, 0), behavior: 'smooth' });
    return true;
  }
}

// Pedalin tek giris noktasi: once sayfa, olmazsa eser.
function _pedalHareket(yon){
  if (typeof window._pedalTeshis === 'function') {
    const k = _sozAlani();
    window._pedalTeshis(k
      ? ('kaydir? ' + k.tagName + (k.id ? '#' + k.id : '') +
         ' top=' + Math.round(k.scrollTop) +
         ' h=' + k.clientHeight + '/' + k.scrollHeight)
      : 'kaydirilacak oge YOK');
  }
  if (_sayfaCevir(yon)) return;
  if (yon === 'geri') prevWork(); else nextWork();
}

// ── 2026-08-23: NATIVE PEDAL KOPRUSU (yalnizca yuklu uygulamada) ─────────
// iOS'ta WKWebView, pedalin gonderdigi PageUp/PageDown tuslarini web icerigine
// iletmiyor — klavye odagi ancak GERCEK bir kullanici hareketiyle devrediliyor.
// Tarayicida caresi "sahnede bir kez ekrana dokunmak"; native tarafta ise
// GCKeyboard tuslari odaktan BAGIMSIZ yakaliyor (bkz. PedalKoprusu.swift) ve
// buraya ozel bir olay olarak gonderiyor. Boylece dokunma ihtiyaci kalkiyor.
(function(){
  // Native ile web ayni basisi iki kez tetikleyebilir (odak varsa keydown de
  // dogar). Ortak zaman damgasi `_sonPedal` uzerinden paylasiliyor.
  window.addEventListener('nativePedal', function (e) {
    try {
      const sahne = document.getElementById('stageScreen');
      if (!sahne || sahne.classList.contains('hidden')) return;
      if (typeof _yaziAlanindaMi === 'function' && _yaziAlanindaMi()) return;
      const simdi = Date.now();
      if (simdi - _sonPedal < 250) return;      // cift tetikleme korumasi
      _sonPedal = simdi;
      const yon = (e && e.detail && e.detail.yon) || 'ileri';
      if (typeof window._pedalTeshis === 'function') {
        window._pedalTeshis('>> NATIVE: ' + yon);
      }
      _pedalHareket(yon);
    } catch (err) {}
  });

  // Pedal bagli oldugunu native taraf bildirdi: artik odak numaralarina ve
  // "Pedali bagla" dugmesine gerek yok.
  window.addEventListener('nativePedalDurum', function (e) {
    try {
      const bagli = !!(e && e.detail && e.detail.bagli);
      if (!bagli) return;
      window._pedalTusGeldi = true;             // odak zorlamasini sustur
      try { localStorage.setItem('pedalVar', '1'); } catch (err) {}
      if (window._pedalIpucuGizle) window._pedalIpucuGizle();
      if (typeof window._pedalTeshis === 'function') {
        window._pedalTeshis('>> NATIVE: pedal bagli');
      }
    } catch (err) {}
  });
})();

const _PEDAL_ILERI = ['ArrowRight',' ','Spacebar','ArrowDown','PageDown','Enter','.',',','b','B'];
const _PEDAL_GERI  = ['ArrowLeft','ArrowUp','PageUp','Backspace','a','A'];
let _sonPedal = 0;

// (2026-08-19 düzeltme) ODAK KONTROLÜ PEDALI YUTUYORDU.
// Emir: pedal (Lekato WT-6) DAHA ÖNCE ÇALIŞIYORDU, bu turdan sonra durdu.
// Sebep bu fonksiyonun ilk hâliydi: seçici ekranındaki ARAMA KUTUSU odakta
// kalınca — sahneye geçilse bile odak orada kalabiliyor — pedalın gönderdiği
// ok tuşları "metin kutusuna ait" sayılıp yok sayılıyordu. Artık yalnızca
// GÖRÜNÜR bir metin kutusu tuşu sahiplenebiliyor: gizli ekranda kalmış bir
// input'un `offsetParent`'ı null olur, o durumda tuş sahneye gider.
function _yaziAlanindaMi(){
  const el = document.activeElement;
  if (!el || el === document.body) return false;
  // (2026-08-23) Pedal odak tuzagi bir <input>, ama KULLANICININ yazdigi bir
  // kutu degil — tam tersine tuslari sahneye getirmek icin var. Muaf tutulmali,
  // yoksa her tus "metin kutusuna ait" sayilip yok sayilirdi.
  if (el.id === '_pedalOdak') return false;
  const t = (el.tagName||'').toUpperCase();
  const yaziKutusu = (t === 'INPUT' || t === 'TEXTAREA' || el.isContentEditable);
  if (!yaziKutusu) return false;
  // Gizli/ekran dışı öğe odakta kalmış olabilir — o zaman tuş sahnenindir.
  const gorunur = !!(el.offsetParent || el.getClientRects().length);
  if (!gorunur) return false;
  // Sahne ekranı açıkken yalnızca SAHNE İÇİNDEKİ bir kutu tuşu sahiplenir.
  const sahne = document.getElementById('stageScreen');
  if (sahne && !sahne.classList.contains('hidden')) return sahne.contains(el);
  return true;
}

// (2026-08-23) YAKALAMA FAZINA ALINDI + ADIM ADIM TESHIS.
// Bagimsiz test sayfasi (pedaltest.html) kanitladi: iOS Safari pedalin
// PageUp/PageDown tuslarini sayfaya VERIYOR. Demek ki tusu yutan sey bu
// dosyanin icinde. Iki degisiklik:
//   (a) Dinleyici artik YAKALAMA fazinda (ucuncu arguman true). Kabarma
//       fazindayken aradaki bir ogenin stopPropagation() cagirmasi olayi
//       tamamen kesebiliyordu; yakalama fazi hedefe inmeden once calisir.
//   (b) ?pedaltest=1 acikken her erken cikis serite yaziliyor — bes ayri
//       `return` vardi ve hangisinde takildigimizi goremiyorduk.
document.addEventListener('keydown',e=>{
  const _tt = (typeof window._pedalTeshis === 'function') ? window._pedalTeshis : null;
  // Ilk gercek tus: klavye odagi devredilmis demektir. Bayrak `zorlaOdakla`
  // blogunu susturur — her dokunusta blur+focus yapmaya gerek kalmaz.
  if (!window._pedalTusGeldi) {
    window._pedalTusGeldi = true;
    // (2026-08-23) CIHAZ "PEDALLI" OLARAK ISARETLENIYOR. Amac: pedali OLMAYAN
    // kullaniciya asla pedal ipucu gostermemek. Bir kez gercek pedal tusu
    // geldiyse bu cihazda pedal var demektir; ipucu ancak o zaman anlamli.
    try { localStorage.setItem('pedalVar', '1'); } catch (e) {}
    _pedalIpucuGizle();
  }
  if(document.getElementById('stageScreen').classList.contains('hidden')){
    if(_tt) _tt('atlandi: sahne kapali (' + e.key + ')');
    return;
  }
  if(e.key==='Escape'){exitStage({stopPropagation:()=>{}});return;}
  if(_yaziAlanindaMi()){
    const ae=document.activeElement;
    if(_tt) _tt('atlandi: yazi alani=' + ((ae&&ae.tagName)||'?') + ((ae&&ae.id)?'#'+ae.id:''));
    return;
  }
  if(e.repeat){ if(_tt) _tt('atlandi: repeat'); return; }
  const ileri = _PEDAL_ILERI.includes(e.key);
  const geri  = _PEDAL_GERI.includes(e.key);
  if(!ileri && !geri){ if(_tt) _tt('atlandi: liste disi key=' + JSON.stringify(e.key)); return; }
  const simdi = Date.now();
  if(simdi - _sonPedal < 250){
    if(_tt) _tt('atlandi: debounce (' + (simdi-_sonPedal) + 'ms)');
    e.preventDefault(); return;
  }
  if(_tt) _tt('>> GECERLI: ' + (ileri ? 'ileri' : 'geri'));
  _sonPedal = simdi;
  e.preventDefault();
  _pedalHareket(ileri ? 'ileri' : 'geri');
}, true);

// Yatay swipe → eser geçişi | Swipe up → bottom nav aç (4sn sonra kapan)
let txStart=0, tyStart=0;
let _navTimer=null;
function openStageNav(){
  const bnav=document.getElementById('v2StageBotNav');
  if(!bnav)return;
  bnav.classList.remove('stage-hidden');
  scheduleStageNavHide();
  // Fare/parmak menünün üzerindeyken kapanmasın; ayrılınca sayaç yeniden başlasın
  if(!bnav.dataset.hoverBound){
    bnav.dataset.hoverBound='1';
    const stay=()=>{ if(_navTimer)clearTimeout(_navTimer); };
    bnav.addEventListener('mouseenter',stay);
    bnav.addEventListener('touchstart',stay,{passive:true});
    bnav.addEventListener('mouseleave',scheduleStageNavHide);
  }
}
// Otomatik kapanma süresi: telefonda güfteyi kapattığı için kapanır (8sn),
// masaüstü/tabletde yer sorunu yok — hiç kapanmaz, kullanıcı seçene kadar durur.
function scheduleStageNavHide(){
  const bnav=document.getElementById('v2StageBotNav');
  if(!bnav)return;
  if(_navTimer)clearTimeout(_navTimer);
  // Her ekran boyutunda kapanır (10sn). Eskiden masaüstü/tablette hiç kapanmıyordu
  // ve menü sürekli ekranda kalıyordu. Fare/parmak üzerindeyken sayaç durur.
  _navTimer=setTimeout(()=>bnav.classList.add('stage-hidden'),10000);
}
// (2026-08-13) Görünüm Ayarları panelinde başlayan dokunuşlar swipe SAYILMAZ.
// Sebep: paneldeki kaydırıcıları (yazı boyutu, ton) yatayda 60px'den fazla
// sürüklemek bu dinleyiciyi tetikliyor ve ayar yaparken ESER ATLIYORDU.
// Panelin mevcut 'stay' dinleyicisi yalnızca otomatik gizlemeyi durduruyor,
// olayı durdurmuyordu.
let _swipeYoksay=false;
document.addEventListener('touchstart',e=>{
  if(document.getElementById('stageScreen').classList.contains('hidden'))return;
  _swipeYoksay = !!(e.target && e.target.closest && e.target.closest('#stageToolsPanel, input[type="range"]'));
  txStart=e.touches[0].clientX;
  tyStart=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(document.getElementById('stageScreen').classList.contains('hidden'))return;
  if(_swipeYoksay){ _swipeYoksay=false; return; }
  const dx=e.changedTouches[0].clientX-txStart;
  const dy=e.changedTouches[0].clientY-tyStart;
  // Yalnızca yatay swipe → eser geçişi. Yukarı swipe ile alt navbar AÇMA kaldırıldı:
  // sahne modunda navbar istenmiyor, güfteyi kaydırırken kazara açılıp alt barı
  // (yazı boyutu kontrolünü) örtüyordu. Çıkış için Görünüm Ayarları (⚙) menüsündeki
  // liste butonu kullanılabilir.
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){
    dx<0?nextWork():prevWork();
  }
},{passive:true});

// ── NAVİGASYON ──
let sideList = [];
let sideIdx  = -1;

function sideNavInit(workId) {
  const stored = localStorage.getItem('stageWorkList');
  if (stored) {
    try { sideList = JSON.parse(stored); } catch(e) { sideList = []; }
    sideIdx = sideList.indexOf(String(workId));
  }
  updateSideButtons();
}

function updateSideButtons() {
  const l = document.getElementById('sideLeft');
  const r = document.getElementById('sideRight');
  if (!l || !r) return;
  const isRepMode = curRep && curRep.items && curRep.items.length > 1;
  const total = isRepMode ? curRep.items.length : sideList.length;
  const cur   = isRepMode ? curIdx : sideIdx;
  l.style.display = r.style.display = total > 1 ? 'flex' : 'none';
  l.classList.toggle('disabled', cur <= 0);
  r.classList.toggle('disabled', cur >= total - 1);
}

function sideNavPrev() {
  if (curRep && curRep.items && curRep.items.length > 1) {
    if (curIdx <= 0) return;
    curIdx--;
    renderStage();
    updateSideButtons();
    return;
  }
  if (sideIdx <= 0) return;
  sideIdx--;
  loadSideWork(sideList[sideIdx]);
}

function sideNavNext() {
  console.log('sideNavNext called, curIdx='+curIdx+', items='+(curRep&&curRep.items?curRep.items.length:0));
  if (curRep && curRep.items && curRep.items.length > 1) {
    if (curIdx >= curRep.items.length - 1) { showEndScreen(); return; }
    curIdx++;
    renderStage();
    updateSideButtons();
    return;
  }
  if (sideIdx >= sideList.length - 1) return;
  sideIdx++;
  loadSideWork(sideList[sideIdx]);
}

function loadSideWork(id) {
  const w = WL[id];
  if (!w) return;
  curRep = { id: 'single', name: w.name||'', items: [{ workId: id, closingNote: w.closingNote||'' }] };
  curIdx = 0;
  sideIdx = sideList.indexOf(String(id));
  document.getElementById('strn').textContent = w.name || '';
  renderStage();
  updateSideButtons();
}
// Init
(async()=>{
  const urlParams = new URLSearchParams(window.location.search);
  const _shareToken = urlParams.get('share');

  // Paylaşım modu: login gerekmez
  if (!_shareToken) {
    if (typeof requireAuth === 'function') {
      const ok = await requireAuth();
      if (!ok) return;
    }
  }

  // Arka planda sync yap (online ise IndexedDB'yi güncelle)
  if (window.syncOfflineData) setTimeout(() => syncOfflineData(), 800);

  // WL (works) yüklemesi: tek-eser (?work=) ve paylaşım (?share=) linkleri WL'ye
  // bağımlı olduğundan onlar için BEKLE; normal picker açılışında ise BEKLEME —
  // picker repertuvarları works olmadan da listelenir, eser adları sonra dolar.
  const _needsWL = urlParams.get('work') || urlParams.get('share');
  if (_needsWL) {
    await loadWL();
  } else {
    loadWL().then(() => {
      // works geldi: picker VE (açıksa) sahne ekranını tazele — sahnede
      // eser_id (örn. 37) yerine gerçek ad+güfte gelsin.
      if (window._rsRefreshAfterWorks) window._rsRefreshAfterWorks();
    });
  }

  // Paylaşım linki: ?share=token → token'dan rep ID çöz, Supabase'den yükle
  const shareToken = urlParams.get('share');
  if (shareToken) {
    try {
      const repId = atob(shareToken + '=='.slice(0, (4 - shareToken.length % 4) % 4));
      // (2026-08-19) Paylaşım bağlantısı da OTURUM JETONUYLA açılıyor (H).
      // Jeton yoksa H zaten anon anahtara düşüyor, yani giriş yapmamış ziyaretçi
      // için davranış aynı. Ama GİRİŞ YAPMIŞ biri bağlantıyı açtığında kendi
      // yetkisiyle okuyor: kişisel paylaşımla kendisine açılmış ya da grubuna
      // paylaşılmış bir repertuvar artık açılabiliyor — anon istekte RLS yalnız
      // visibility='public' verdiği için bunlar boş dönüyordu.
      const [rRes, iRes] = await Promise.all([
        fetch(SUPA_URL+'/rest/v1/repertoires?id=eq.'+repId, { headers: H }),
        fetch(SUPA_URL+'/rest/v1/repertoire_items?repertoire_id=eq.'+repId+'&order=seq', { headers: H })
      ]);
      const reps = await rRes.json();
      const items = await iRes.json();
      if (reps && reps[0]) {
        curRep = {
          ...reps[0],
          items: (items||[]).map(t => ({
            ...t, workId: String(t.work_id), closingNote: t.closing_note||'', performer: t.performer||''
          }))
        };
        curIdx = 0;
        showScreen('stageScreen');
        document.getElementById('strn').textContent = curRep.name || '';
        renderStage();
        // Tüm eserleri sideList'e yükle - önceki/sonraki geçiş için
        // Paylaşım modunda sideList boş bırak - sadece curRep/curIdx kullan
        sideList = [];
        sideIdx = -1;
        updateSideButtons();
        initBackBtn();
        return;
      }
    } catch(e) { console.error('Share token error:', e); }
  }

  const workParam = urlParams.get('work');
  if (workParam && !isNaN(parseInt(workParam))) {
    const normalizedId = String(parseInt(workParam));
    // WL bir an boş olsa bile picker'a DÜŞME — tek-eser sahnesine gir, ad/güfte
    // works gelince _rsRefreshAfterWorks() ile kendini tazeler. (Eskiden if(w)
    // koşulu WL boşken bu yolu atlayıp picker'a düşürüyordu.)
    const w = WL[normalizedId] || WL[workParam] || {};
    {
      curRep = {
        id: 'single',
        name: w.name || _sCev('sh.adsizEser','Eser'),
        items: [{ workId: normalizedId, closingNote: w.closingNote || '' }]
      };
      curIdx = 0;
      // Repertuvar yolundaki startStage() ile AYNI giriş dizisi — eksik olması,
      // eserler.html'den tek eserle girildiğinde topnav.js'in paylaşılan alt
      // navbar'ı (#r-bottom-nav) gizlememesine yol açıyordu (stageEnter olayı hiç
      // atılmıyordu). Repertuvardan girişte çalışıp buradan çalışmamasının sebebi buydu.
      window._stageActive = true;
      window.dispatchEvent(new Event('stageEnter'));
      applyStageTheme('stage');
      showScreen('stageScreen');
      document.getElementById('strn').textContent = w.name || '';
      renderStage();
      sideNavInit(normalizedId);
      initBackBtn();
      return;
    }
  }

  reps=await loadReps();
  setTheme(localStorage.getItem('stageTheme')||'night');

  // (2026-08-19) SEÇİCİ EKRANI BİR AN GÖRÜNÜP KAPANIYORDU. Emir: "repertuvarı
  // seçip 'Sahne modunda aç' dediğimde bir an stage'in repertuvar listesi
  // görünüp kapanıyor, kirli bir durum." Sebep sıralamaydı: seçici KOŞULSUZ
  // gösterilip çizildikten SONRA localStorage'daki stageRepId okunuyor ve
  // 100 ms'lik bir zamanlayıcıyla sahneye geçiliyordu. Artık önce hedef
  // repertuvar var mı diye bakılıyor; varsa seçici HİÇ gösterilmiyor ve
  // gecikme de gerekmiyor (pickRep/startStage aynı karede çalışıyor).
  const autoId = localStorage.getItem('stageRepId');
  const _hedef = autoId ? reps.find(r => r.id === autoId) : null;
  if (autoId) localStorage.removeItem('stageRepId');

  if (_hedef) {
    renderPicker();          // seçim mantığı listeye dayandığı için çizilmeli
    pickRep(autoId);         // ama ekran gösterilmiyor — doğrudan sahneye
    startStage();
    initBackBtn();
    return;
  }

  showScreen('pickerScreen');
  renderPicker();
  initBackBtn();
})();

// swipe kodundan bağımsız olarak sideNavNext/sideNavPrev çağırıyordu.
// Sonuç: tek bir parmak hareketinde İKİ dinleyici birden tetikleniyor ve

// --- SYNC/ONLINE OTOMATİK TAZELEME (stage) ---
// Ağ değişince veya sync bitince picker açıksa listeyi tazele. Sadece picker
// görünürken ve kullanıcı kaydırma yapmıyorken çiz (açık swipe'ı bozmamak için).
(function() {
  let _rt;
  function _refreshAfterWorks() {
    clearTimeout(_rt);
    _rt = setTimeout(function() {
      var swipeOk = (typeof _rsSwipe === 'undefined' || !_rsSwipe) &&
                    (typeof _rsOpenCard === 'undefined' || !_rsOpenCard);
      if (!swipeOk) return; // açık swipe'ı bozma
      var picker = document.getElementById('pickerScreen');
      var stage  = document.getElementById('stageScreen');
      // Picker açıksa listeyi tazele
      if (picker && !picker.classList.contains('hidden') &&
          typeof renderPicker === 'function') {
        renderPicker();
      }
      // Sahne açıksa: SADECE ekranda şu an placeholder duruyorsa VE ad artık
      // geldiyse bir kez yeniden çiz. Ad zaten doğru görünüyorsa dokunma —
      // gereksiz re-render titreme (flicker) yapar.
      if (stage && !stage.classList.contains('hidden') &&
          typeof curRep !== 'undefined' && curRep &&
          typeof renderStage === 'function' && _stageShowsPlaceholder) {
        var _it = (curRep.items || [])[curIdx];
        var _nowResolved = _it && WL[_it.workId] && WL[_it.workId].name;
        if (_nowResolved) renderStage();
      }
    }, 150);
  }
  // loadWL().then() de bunu çağırıyor (init'te)
  window._rsRefreshAfterWorks = _refreshAfterWorks;
  window.addEventListener('data-synced', _refreshAfterWorks);
  window.addEventListener('online', _refreshAfterWorks);
})();

// ── 2026-08-22: EKRAN UYANIK TUTMA (Screen Wake Lock) ─────────────────────
// Sahnede telefonun kendiliginden kilitlenmesi, uygulamanin guvenilirligini
// dogrudan vuruyordu. Bu blok, SADECE sahne ekrani acikken ekrani uyanik tutar.
//
// NEDEN body SINIFINI IZLIYORUZ: showScreen() zaten her geciste
// `document.body.classList.toggle('stage-active', ...)` yapiyor. Fonksiyonu
// duzenlemek yerine bu sinifi dinlemek, ileride yeni bir gecis yolu eklense
// bile kilidin dogru davranmasini saglar (tek dogruluk noktasi).
//
// iOS TUZAGI: Web Wake Lock API'de uygulama arka plana gecince kilit SESSIZCE
// birakilir ve one donunce KENDILIGINDEN GERI ALINMAZ. Bu yuzden
// visibilitychange / pageshow / focus uzerinden yeniden istiyoruz. Gorunur
// degilken istek zaten reddedilir, o yuzden sadece 'visible' halinde deniyoruz.
(function(){
  var _wl = null;        // aktif WakeLockSentinel
  var _istendi = false;  // sahne acik mi — kilidin OLMASI GEREKEN hali
  var _destek = !!(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');

  function _sahneAcik(){
    return !!(document.body && document.body.classList.contains('stage-active'));
  }

  function _al(){
    if(!_destek || !_istendi) return;
    if(_wl) return;                                   // zaten elimizde
    if(document.visibilityState !== 'visible') return; // gorunmezken reddedilir
    navigator.wakeLock.request('screen').then(function(s){
      _wl = s;
      s.addEventListener('release', function(){ _wl = null; });
    }).catch(function(e){
      _wl = null;
      console.warn('wakeLock alinamadi:', e && e.name, e && e.message);
    });
  }

  function _birak(){
    _istendi = false;
    if(_wl){ try{ _wl.release(); }catch(e){} _wl = null; }
  }

  function _senkron(){
    if(_sahneAcik()){ _istendi = true; _al(); }
    else { _birak(); }
  }

  try{
    new MutationObserver(_senkron).observe(document.body,
      { attributes:true, attributeFilter:['class'] });
  }catch(e){}

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') _al();
  });
  window.addEventListener('pageshow', _al);
  window.addEventListener('focus', _al);

  // Test icin: sahnedeyken konsola window._wlDurum() yaz.
  window._wlDurum = function(){
    return { destek:_destek, sahneAcik:_sahneAcik(), istendi:_istendi,
             kilitAktif: !!_wl, gorunur: document.visibilityState };
  };

  _senkron();
})();

</script>
