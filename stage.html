<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sahne Modu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--surface:#0f0f1a;--surface2:#161625;--border:#484860;--accent:#a855f7;--accent2:#c084fc;--text:#f1f0ff;--text2:#8b8aa8;--text3:#3d3d58;--green:#4a9462;--red:#c05444;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;user-select:none;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
/* Picker ve bitiş ekranlarında üst nav görünür kalıyor — bu ekranlar onun gerçek
   yüksekliğinin (66px içerik + safe-area) altından başlamalı. Sahne performans ekranında
   üst nav gizlendiği için (showScreen()) o ekran tam viewport'ta (top:0) kalmaya devam ediyor. */
#pickerScreen, #endScreen{top:calc(66px + env(safe-area-inset-top));}
.screen.hidden{display:none;}

#pickerScreen{background:var(--bg);overflow:hidden;}
.pi{width:100%;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;}
.pi-fixed-top{flex-shrink:0;padding:4px 24px 0;}
.pi-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px;}
.pi-fixed-bottom{flex-shrink:0;padding:16px 24px calc(16px + env(safe-area-inset-bottom));}
.plogo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center;}
.plogo small{color:var(--text2);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
.ptitle{font-weight:800;letter-spacing:-.02em;font-size:26px;color:var(--text);margin-bottom:8px;text-align:center;}
.psub{font-size:13px;color:var(--text2);margin-bottom:16px;text-align:center;}
.rsl{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;}
.rsl::-webkit-scrollbar{width:4px;}.rsl::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.rsi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;justify-content:space-between;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none;}
.rsi:hover{border-color:rgba(255,200,61,.4);background:var(--surface2);}
.rsi.sel{border-color:#FFC83D;background:rgba(255,200,61,.08);}
.rsn{font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px;}
.rsm{font-size:12px;color:var(--text2);}
.rsc{font-size:12px;color:var(--text3);}
/* Picker ekranı: marka paleti (altın/mavi) — sahne performans ekranı kendi mor gece paletinde kalıyor */
#pickerScreen{--accent:#FFC83D;--accent2:#4DA3FF;}
.bstart{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;padding:16px;color:#0a0818;font-size:16px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .15s,transform .1s;box-shadow:0 4px 14px rgba(255,200,61,.22);}
.bstart:hover{opacity:.92;}
.bstart:active{transform:scale(.98);}
.bstart:disabled{opacity:.35;cursor:not-allowed;}
.bback{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--text3);text-decoration:none;}
.bback:hover{color:var(--text2);}
.loading{text-align:center;color:var(--text2);padding:24px;font-size:13px;}

.stb{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);gap:8px;position:relative;z-index:401;}
#v2StageBotNav .v2-bn-exit { color: #c05444 !important; }
#v2StageBotNav .v2-bn-exit:hover { color: #e06655 !important; }
.strn{font-size:12px;color:var(--text2);font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;}
.stp{display:flex;align-items:center;gap:10px;}
.pds{display:flex;gap:5px;align-items:center;}
.pd{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .2s,transform .2s;flex-shrink:0;}
.pd.done{background:var(--text3);}
.pd.cur{background:var(--accent);transform:scale(1.4);}
.stc{display:inline;font-size:11px;font-weight:600;color:var(--text2);margin-left:6px;}
.bex{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text3);font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.bex:hover{color:var(--red);border-color:var(--red);}

/* ═══ Görünüm değiştirici: Söz / Akor / Nota (segmented control) ═══ */
.view-switch-wrap{display:flex;justify-content:center;padding:6px 12px 2px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);}
.view-switch{display:inline-flex;gap:2px;padding:3px;background:rgba(120,100,255,0.08);border:1px solid var(--border);border-radius:20px;}
.vs-btn{background:none;border:none;padding:6px 14px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;border-radius:16px;display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:'DM Sans',sans-serif;}
.vs-btn .ti{font-size:15px;line-height:1;}
.vs-btn:hover:not(:disabled):not(.active){color:var(--text);}
.vs-btn.active{background:var(--accent);color:#1a0f2e;}
.vs-btn:disabled{opacity:.32;cursor:not-allowed;}
.view-switch-wrap.single-mode{display:none;}

.sm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 56px 80px;position:relative;overflow-y:auto;cursor:pointer;scrollbar-width:none;}.sm::-webkit-scrollbar{display:none;}
.sm::before{content:'';position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;} .sm>*{position:relative;z-index:1;}
.wnum{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;opacity:0;animation:si .4s ease forwards;}
.wtitle{font-family:'DM Sans',sans-serif;font-size:clamp(22px,3.4vw,36px);font-weight:700;color:var(--text);text-align:center;line-height:1.2;max-width:700px;margin-bottom:10px;opacity:0;animation:si .4s ease .07s forwards;}
.wcr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;opacity:0;animation:si .4s ease .14s forwards;}
.wcr:empty{display:none;margin:0;}
.wch{padding:5px 14px;border-radius:20px;font-size:13px;border:1px solid var(--border);color:var(--text2);background:var(--surface);}
.wch.m{border-color:#3a3060;color:#9b8fd4;background:#1a1828;}
.wch.n{border-color:#3d2a1a;color:var(--accent);background:#1e1208;}
.wch.i{border-color:#1a2d1a;color:#7ab87a;background:#0f1a0f;}
.wnote{font-size:13px;color:var(--text2);text-align:center;font-style:italic;max-width:600px;line-height:1.6;opacity:0;animation:si .4s ease .2s forwards;}
.wlyrics{font-size:calc(clamp(18px,2.8vw,28px) * var(--lyrics-scale,1));color:var(--text);text-align:center;width:100%;max-width:700px;line-height:1.9;opacity:0;animation:si .4s ease .28s forwards;margin-top:16px;padding:0 8px 40px;box-sizing:border-box;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.wnota{display:flex;justify-content:center;align-items:center;opacity:0;animation:si .4s ease .28s forwards;margin-top:16px;padding:0 8px 40px;width:100%;}
.wlyrics::-webkit-scrollbar{width:3px;}.wlyrics::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.sb{padding:0 24px 24px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;position:relative;z-index:10;}

#v2StageBotNav{
  position:fixed;bottom:0;left:0;right:0;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  will-change:transform;
  z-index:100;
}
#v2StageBotNav.stage-hidden{transform:translateY(100%);}

.np{background:var(--surface);border:1px solid #FFC83D;border-radius:10px;padding:6px 16px;flex:1;max-width:400px;opacity:0;animation:fi .5s ease .4s forwards;}
.nl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-bottom:4px;font-weight:600;}
.nn{font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;}
.nm{font-size:12px;color:var(--text2);margin-top:3px;font-weight:500;}
.th{font-size:11px;color:var(--text3);text-align:right;flex-shrink:0;line-height:1.5;opacity:0;animation:fi .5s ease .5s forwards;}
.th kbd{display:inline-block;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;font-family:'DM Sans',sans-serif;color:var(--text3);}

#endScreen{background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
.ei{font-size:56px;margin-bottom:24px;animation:pls 2s ease infinite;}
.et{font-family:'Playfair Display',serif;font-size:36px;color:var(--accent);margin-bottom:12px;}
.es{font-size:15px;color:var(--text2);margin-bottom:8px;}
.ec{font-size:13px;color:var(--text3);margin-bottom:36px;}
.ea{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.be{padding:12px 24px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
.bep{background:var(--accent);border:none;color:#0a0818;font-weight:500;}
.bep:hover{background:var(--accent2);}
.beg{background:none;border:1px solid var(--border);color:var(--text2);}
.beg:hover{border-color:#38383f;color:var(--text);}
.sf{position:fixed;inset:0;background:rgba(168,85,247,0.06);pointer-events:none;animation:ff .25s ease forwards;z-index:99;}

@keyframes si{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ff{to{opacity:0}}

.align-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text3);width:44px;height:44px;font-size:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.align-btn:disabled{opacity:.35;cursor:not-allowed;}
.align-btn:hover{border-color:var(--accent);color:var(--accent);}
.align-btn.active{background:rgba(168,85,247,.15);border-color:var(--accent);color:var(--accent);}
.stage-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;} .stage-nav a{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text3);font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.stage-nav a:hover{border-color:var(--accent);color:var(--accent);}

.side-nav-btn {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(168,85,247,0.12);
  border: 1px solid rgba(168,85,247,0.3);
  border-radius: 12px;
  color: var(--accent);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  padding: 14px 8px;
  width: 48px;
  transition: all .2s;
  z-index: 50;
  user-select: none;
  font-family: 'DM Sans', sans-serif;
}
.snb-arrow { font-size: 28px; line-height: 1; }
.snb-label { font-size: 11px; font-weight: 600; letter-spacing: .04em; opacity: .8; }
.side-nav-btn:hover { background: rgba(168,85,247,0.25); border-color: rgba(168,85,247,0.6); transform: translateY(-50%) scale(1.06); }
.side-nav-btn:active { transform: translateY(-50%) scale(0.96); }
.side-nav-btn.disabled { opacity: 0.15; pointer-events: none; }
.side-nav-left  { left: 8px; border-radius: 12px; }
.side-nav-right { right: 8px; border-radius: 12px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .stb { padding:8px 10px; padding-top:calc(8px + env(safe-area-inset-top)); height:auto; min-height:48px; }
    .strn { font-size:12px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bex, .stage-nav a { font-size:10px; padding:4px 8px; }
    .stage-nav { gap:4px; }
    .sm { padding:20px 60px 100px; }
    .sb { padding:0 12px 16px; flex-wrap:wrap; gap:8px; }
    .side-nav-left { left:8px; border-radius:12px; }
    .side-nav-right { right:8px; border-radius:12px; }
    .side-nav-btn { width:44px; height:44px; }
    /* Picker */
    .pi { max-width:100%; }
    .pi-fixed-top, .pi-scroll, .pi-fixed-bottom { padding-left:16px; padding-right:16px; }
    .rb { padding:14px 16px; }
    .rbn { font-size:14px; }
    .side-nav-btn { width:40px; padding:10px 6px; }
    .snb-label { font-size:9px; }
    .snb-arrow { font-size:22px; }
    .np { max-width:160px; }
  }
  @media (max-width: 480px) {
    .wtitle { font-size:clamp(18px,5vw,26px); }
    .wlyrics { font-size:calc(clamp(14px,4.2vw,20px) * var(--lyrics-scale,1)); line-height:1.8; padding:0 4px 80px; }
    .side-nav-btn { width:40px !important; height:40px !important; }
    .side-nav-left { left:6px !important; border-radius:10px !important; }
    .side-nav-right { right:6px !important; border-radius:10px !important; }
    .snb-label { display:none; }
    .sb { padding:0 8px 12px; gap:8px; flex-wrap:wrap; }
    .th { font-size:10px; }
    .stb { padding:6px 8px; padding-top:calc(6px + env(safe-area-inset-top)); }
    .stage-nav a, .bex { font-size:10px !important; padding:3px 6px !important; }
    .sm { padding:16px 52px 80px; }
    /* Picker screen on mobile */
    .pi-fixed-top, .pi-scroll, .pi-fixed-bottom { padding-left:16px; padding-right:16px; }
    .ptitle { font-size:20px; }
    .rb { padding:12px 14px; }
  }
  /* Picker screen mobile */
  @media (max-width: 600px) {
    .pi-fixed-top, .pi-scroll, .pi-fixed-bottom { padding-left:8px; padding-right:8px; }
    .ptitle { font-size:20px; }
    .psub { font-size:13px; }
    .rl { padding:10px 12px; }
    .rn { font-size:14px; }
  }

  /* ── MOBILE GLOBAL ── */
  @media (max-width: 768px) {
    body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button:not(.r-theme-toggle), a:not(.r-theme-toggle) { min-height: 36px; }
    input, select, textarea { font-size: 16px !important; } /* prevent iOS zoom */
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .sb { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }


/* Stage Bottom Nav */
#v2StageBotNav { position:fixed; bottom:0; left:0; right:0; height:calc(68px + env(safe-area-inset-bottom)); box-sizing:border-box; background:rgba(7,11,24,0.97); backdrop-filter:blur(24px); border-top:1px solid rgba(255,200,61,0.18); display:none; align-items:center; z-index:400; padding-bottom:env(safe-area-inset-bottom); }
[data-theme="light"] #v2StageBotNav { background: rgba(245,244,251,0.97) !important; border-top-color: rgba(255,200,61,0.2) !important; }
[data-theme="light"] #v2StageBotNav .v2-bn-item { color: #9390b0 !important; }
[data-theme="light"] #v2StageBotNav .v2-bn-item.active { color: #E5A900 !important; }
@media(min-width:1024px){ #v2StageBotNav { position:static; width:100%; height:auto; padding:8px 0; background:rgba(7,7,26,0.6); backdrop-filter:none; } }
#v2StageBotNav .v2-bn-items { display:flex; width:100%; padding:0 4px; }
#v2StageBotNav .v2-bn-item { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:7px 2px; text-decoration:none; color:#5e5c8a; border-radius:10px; transition:color .15s; }
#v2StageBotNav .v2-bn-item.active { color:#FFC83D; }
#v2StageBotNav .v2-bn-label { font-size:9px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }

/* Desktop: picker ekranında sidebar layout */
@media (min-width: 1024px) {
  #pickerScreen {
    position: fixed !important;
    top: 0; left: 220px; right: 0; bottom: 0;
    overflow-y: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 48px;
  }
  #pickerScreen.hidden { display: none !important; }
  /* Alt nav desktop'ta gizle */
  #v2StageBotNav { display: none !important; }
  /* Sahne aktifken sidebar gizle, picker tam genişlik */
  body.stage-active .sidebar { display: none !important; }
}

.stage-info-btn{background:none;border:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;transition:all .15s;flex-shrink:0;}
.stage-info-btn:hover{color:var(--text);}
.info-sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:598;display:none;}
.info-sheet-backdrop.open{display:block;}
.info-sheet{position:fixed;left:0;right:0;bottom:0;background:#1a1a2e;border-radius:18px 18px 0 0;padding:8px 20px 24px;z-index:599;box-shadow:0 -8px 30px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .25s ease;max-height:70vh;overflow-y:auto;}
.info-sheet.open{transform:translateY(0);}
.info-sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:6px auto 14px;}
.info-sheet-header{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:#fff;margin-bottom:12px;}
.info-sheet-close{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;padding:4px;display:flex;}
.info-sheet-close:hover{color:#fff;}
.info-sheet-body{display:flex;flex-direction:column;gap:10px;}
.sip-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.sip-label{color:rgba(255,255,255,0.5);font-size:11px;min-width:80px;}
.sip-val{color:#fff;font-weight:600;}
</style>
<script src="auth.js"></script>
<style id="v2-stage-nav">
/* Gündüz teması (sahne performans ekranındaki okuma teması — ayrı bir sistem) */
body.day-theme{--bg:#f5f4f0;--surface:#fff;--surface2:#f0eeea;--border:#d8d4cc;--accent:#7c6fff;--accent2:#a78bfa;--text:#1a1825;--text2:#5a5670;--text3:#9d9aae;}
</style>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/fonts/tabler-icons.woff2?v3.44.0" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link rel="manifest" href="manifest.json">
  <script src="db.js"></script>
</head>
<body>
<div id="r-topnav-container"></div>
<script src="topnav.js"></script>


<div class="screen" id="pickerScreen">
  <button onclick="openStageNav()" title="Menü" style="position:fixed;bottom:20px;right:16px;z-index:500;width:44px;height:44px;border-radius:50%;background:rgba(124,111,255,0.15);border:1px solid rgba(124,111,255,0.35);color:#7c6fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);display:none;"><i class="ti ti-layout-navbar" style="font-size:20px;"></i></button>
  <div class="pi">
    <div class="pi-fixed-top">
      <h1 class="ptitle">Sahne Moduna Hoş Geldiniz</h1>
      <p class="psub">Sahne performansınız için bir repertuvar seçiniz</p>
      <input type="text" id="stageSearchInput" placeholder="Repertuvar veya eser adı ara..." oninput="onStageSearchInput(this.value)"
        style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:16px;transition:border-color .15s;box-sizing:border-box;"
        onfocus="this.style.borderColor='#FFC83D'" onblur="this.style.borderColor='var(--border)'">
    </div>
    <div class="pi-scroll">
      <div class="rsl" id="rsl"><div class="loading">Yükleniyor...</div></div>
    </div>
    <div class="pi-fixed-bottom">
      <button class="bstart" id="bstart" disabled onclick="startStage()">Sahneye Çık →</button>

<script>
const H = {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};

let WL = {}; // Supabase'den yüklenecek

async function loadWL() {
  try {
    let rows = [];
    try {
      const r = await fetch(SUPA_URL+'/rest/v1/works?select=*&order=id&limit=2000', {
        headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+(localStorage.getItem('sb_token')||SUPA_KEY)},
        signal: AbortSignal.timeout(4000)
      });
      rows = await r.json();
      // Online'dan geldi — IndexedDB'yi güncelle
      if (window.db) await db.works.saveAll(rows);
    } catch(fetchErr) {
      console.warn('[stage] Supabase ulaşılamadı, IndexedDB kullanılıyor');
      if (window.db) rows = await db.works.getAll();
    }
    rows.forEach(w => {
      WL[String(w.id)] = {
        name: w.name || '',
        composer: w.composer || '',
        lyricWriter: w.lyric_writer || '',
        makam: w.makam || '',
        instrument: w.instrument || '',
        closingNote: w.closing_note || '',
        tuning: w.tuning || '',
        form: w.form || '',
        measurement: w.measurement || '',
        region: w.region || '',
        lyrics: w.lyrics || '',
        chords: w.chords || '',
        notaUrl: w.nota_url || ''
      };
    });
    // customWorks patch
    try {
      const customs = JSON.parse(localStorage.getItem('customWorks') || '[]');
      customs.forEach(w => {
        const id = String(parseInt(w.id));
        if(WL[id]) Object.assign(WL[id], {name:w.name||WL[id].name, lyrics:w.lyrics!==undefined?w.lyrics:WL[id].lyrics, composer:w.composer||WL[id].composer, notaUrl:w.notaUrl!==undefined?w.notaUrl:WL[id].notaUrl});
        else WL[id] = {name:w.name||'',lyrics:w.lyrics||'',composer:w.composer||'',makam:w.makam||'',instrument:w.instrument||'',closingNote:w.closingNote||'',notaUrl:w.notaUrl||''};
      });
    } catch(e) {}
  } catch(e) { console.error('WL yüklenemedi:', e); }
}let reps=[], selId=null, curRep=null, curIdx=0;

async function loadReps(){
  try{
    let r, items;
    try {
      [r, items] = await Promise.all([
        fetch(SUPA_URL+'/rest/v1/repertoires?order=created_at&or=(owner_id.eq.'+getUserId()+',is_public.eq.true)',{headers:H, signal:AbortSignal.timeout(4000)}).then(r=>r.json()),
        fetch(SUPA_URL+'/rest/v1/repertoire_items?order=seq',{headers:H, signal:AbortSignal.timeout(4000)}).then(r=>r.json())
      ]);
      if (window.db) {
        await db.repertoires.saveAll(r||[]);
        await db.repertoire_items.saveAll(items||[]);
      }
    } catch(fetchErr) {
      console.warn('[stage] loadReps offline, IndexedDB kullanılıyor');
      if (window.db) {
        const uid = getUserId();
        const allReps = await db.repertoires.getAll();
        r = allReps.filter(x => x.owner_id === uid || x.user_id === uid || x.is_public === true);
        items = await db.repertoire_items.getAll();
      } else { r=[]; items=[]; }
    }
    return (r||[]).map(x=>({...x,items:(items||[]).filter(t=>t.repertoire_id===x.id).sort((a,b)=>a.seq-b.seq).map(t=>({...t,workId:String(t.work_id),closingNote:t.closing_note||''}))}));
  }catch(e){console.error(e);return [];}
}

let stageSearchQuery = '';

function onStageSearchInput(val) {
  stageSearchQuery = val || '';
  renderPicker();
}

function stageRepMatchesSearch(r, q) {
  if (!q) return true;
  const norm = s => (s || '').toLocaleLowerCase('tr');
  const nq = norm(q);
  if (norm(r.name).includes(nq)) return true;
  return (r.items || []).some(it => {
    const w = WL[it.workId] || {};
    return norm(w.name).includes(nq);
  });
}

function renderPicker(){
  const el=document.getElementById('rsl');
  if(!reps.length){el.innerHTML='<div style="padding:32px;text-align:center;color:var(--text3);line-height:1.8;">Henüz repertuvar yok.<br><a href=\"repertoires.html\" style=\"color:var(--accent)\">Repertuvar sayfasında</a> repertuvar oluşturun.</div>';return;}
  const filtered = reps.filter(r=>stageRepMatchesSearch(r, stageSearchQuery));
  if(stageSearchQuery && !filtered.length){el.innerHTML='<div style="padding:32px;text-align:center;color:var(--text3);">"'+stageSearchQuery+'" için sonuç bulunamadı</div>';return;}
  const sl={concept:'Taslak',confirmed:'Onaylandı',archive:'Arşiv'};
  el.innerHTML=filtered.map(r=>`<div class="rsi${selId===r.id?' sel':''}" onclick="pickRep('${r.id}')">
    <div><div class="rsn">${r.name}</div><div class="rsm">${[r.date,r.venue,sl[r.status]].filter(Boolean).join(' · ')}</div></div>
    <div class="rsc">${(r.items||[]).length} eser</div>
  </div>`).join('');
}

function pickRep(id){selId=id;document.getElementById('bstart').disabled=false;renderPicker();}

function setLyricsAlign(align) {
  localStorage.setItem('stageLyricsAlign', align);
  const el = document.querySelector('.wlyrics');
  if (el) el.style.textAlign = align;
  ['left','center','right'].forEach(a => {
    const btn = document.getElementById('align' + a.charAt(0).toUpperCase() + a.slice(1));
    if (!btn) return;
    btn.classList.toggle('active', a === align);
  });
}

const LYRICS_SCALE_MIN = 0.75, LYRICS_SCALE_MAX = 1.6, LYRICS_SCALE_STEP = 0.1;
function adjustLyricsFontSize(delta) {
  let scale = parseFloat(localStorage.getItem('stageLyricsScale')) || 1;
  scale = Math.min(LYRICS_SCALE_MAX, Math.max(LYRICS_SCALE_MIN, +(scale + delta).toFixed(2)));
  localStorage.setItem('stageLyricsScale', scale);
  document.documentElement.style.setProperty('--lyrics-scale', scale);
  updateFontSizeButtons(scale);
}
function updateFontSizeButtons(scale) {
  const minusBtn = document.getElementById('fontSizeMinus');
  const plusBtn = document.getElementById('fontSizePlus');
  if (minusBtn) minusBtn.disabled = scale <= LYRICS_SCALE_MIN;
  if (plusBtn) plusBtn.disabled = scale >= LYRICS_SCALE_MAX;
}

// Bir satırın tamamen akor isimlerinden oluşup oluşmadığını denetler (Cm, Fm, D#, G#m7, A/C# vb.)
// "%%" öneki olmadan girilmiş akor satırlarını da otomatik tanımak için kullanılıyor.
const CHORD_TOKEN_RE = /^[A-G](#|b)?(maj|min|dim|aug|sus|add)?[0-9]*m?[0-9]*(\/[A-G](#|b)?)?$/i;
function looksLikeChordLine(line) {
  const t = line.trim();
  if (!t) return false;
  const tokens = t.split(/\s+/);
  return tokens.every(tok => CHORD_TOKEN_RE.test(tok));
}

function renderStageChords(text) {
  if (!text) return '';
  return text.trim().split('\n').map(line => {
    const isExplicitChordLine = line.startsWith('%%');
    const rawChordContent = isExplicitChordLine ? line.slice(2) : line;
    if (isExplicitChordLine || looksLikeChordLine(line)) {
      return rawChordContent.trim()
        ? `<span style="color:#58A6FF;font-size:0.85em;letter-spacing:.08em;font-family:monospace;display:block;margin-top:8px;white-space:pre;text-align:left;">${rawChordContent.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`
        : '';
    } else if (line.trim() === '') {
      return '<br>';
    } else {
      return `<span style="display:block;text-align:left;">${line.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`;
    }
  }).join('');
}


let _stageToolsAutoHide = null;
function scheduleStageToolsHide() {
  clearTimeout(_stageToolsAutoHide);
  _stageToolsAutoHide = setTimeout(() => {
    const panel = document.getElementById('stageToolsPanel');
    if (panel) panel.style.display = 'none';
  }, 4000);
}
function toggleStageTools(e) {
  if (e) e.stopPropagation();
  const panel = document.getElementById('stageToolsPanel');
  const isOpen = panel.style.display === 'flex';
  if (!isOpen) {
    // "Sıradaki" kartıyla çakışmasın diye alt bar'ın (.sb) gerçek yüksekliğine göre konumlan
    const sb = document.querySelector('.sb');
    const sbHeight = sb ? sb.getBoundingClientRect().height : 80;
    panel.style.bottom = (sbHeight + 8) + 'px';
  }
  panel.style.display = isOpen ? 'none' : 'flex';
  panel.style.flexDirection = 'column';
  clearTimeout(_stageToolsAutoHide);
  if (!isOpen) scheduleStageToolsHide(); // az önce açıldıysa geri sayımı başlat
}
document.addEventListener('click', function(e) {
  const toggle = document.getElementById('stageToolsToggle');
  const panel = document.getElementById('stageToolsPanel');
  if (panel && toggle && !toggle.contains(e.target) && !panel.contains(e.target)) {
    panel.style.display = 'none';
    clearTimeout(_stageToolsAutoHide);
  } else if (panel && panel.contains(e.target) && panel.style.display === 'flex') {
    scheduleStageToolsHide(); // panel içinde bir butona basıldıysa süreyi yenile
  }
});
function toggleStageTheme(){
  const t = localStorage.getItem('stageTheme')||'night';
  const next = t==='night' ? 'day' : 'night';
  localStorage.setItem('stageTheme', next);
  applyStageTheme('stage');
}

function applyStageTheme(screen){
  const t = localStorage.getItem('stageTheme') || 'night';
  const isStageDay   = screen === 'stage' && t === 'day';
  const isStageNight = screen === 'stage' && t === 'night';
  document.body.classList.toggle('day-theme', isStageDay);

  function applyVars(){
    const el = document.documentElement;
    if(screen === 'stage') el.removeAttribute('data-theme');
    if(isStageNight){
      el.style.setProperty('--bg',      '#080810');
      el.style.setProperty('--surface', '#0f0f1a');
      el.style.setProperty('--surface2','#161625');
      el.style.setProperty('--border',  '#484860');
      el.style.setProperty('--text',    '#f1f0ff');
      el.style.setProperty('--text2',   '#8b8aa8');
      el.style.setProperty('--text3',   '#3d3d58');
    } else if(isStageDay){
      el.style.setProperty('--bg',      '#f5f4f0');
      el.style.setProperty('--surface', '#fff');
      el.style.setProperty('--surface2','#f0eeea');
      el.style.setProperty('--border',  '#d8d4cc');
      el.style.setProperty('--text',    '#1a1825');
      el.style.setProperty('--text2',   '#5a5670');
      el.style.setProperty('--text3',   '#9d9aae');
    }
  }
  applyVars();
  setTimeout(applyVars, 100);
  setTimeout(applyVars, 500);

  const btn = document.getElementById('stageThemeBtn2');
  if(btn){
    const icon = btn.querySelector('i');
    if(icon) icon.className = t === 'day' ? 'ti ti-moon' : 'ti ti-sun';
    btn.classList.toggle('active', t === 'day');
  }
}
function setTheme(t){
  localStorage.setItem('stageTheme',t);
  const active={background:'rgba(255,200,61,0.12)',borderColor:'rgba(255,200,61,0.4)',color:'#E5A900'};
  const inactive={background:'',borderColor:'rgba(148,148,168,0.18)',color:'#8b8aa8'};
  ['day','night'].forEach(k=>{
    const el=document.getElementById('tc-'+k); if(!el)return;
    const s=k===t?active:inactive;
    el.style.background=s.background; el.style.borderColor=s.borderColor; el.style.color=s.color;
  });
}
function startStage(){
  curRep=reps.find(r=>r.id===selId);
  if(!curRep||(curRep.items||[]).length===0)return;
  curIdx=0;
  if(!localStorage.getItem('stageTheme')) localStorage.setItem('stageTheme','night');
  window._stageActive = true;
  window.dispatchEvent(new Event('stageEnter'));
  applyStageTheme('stage');
  showScreen('stageScreen');
  document.getElementById('strn').textContent=curRep.name;
  // Avatar doldur
  if(typeof getUser==='function'){const u=getUser();if(u){const name=u?.user_metadata?.full_name||u?.email?.split('@')[0]||'—';const av=document.getElementById('stnAvatar');if(av)av.textContent=name.charAt(0).toUpperCase();}}
  renderStage();
}

function renderStage(){
  const items=curRep.items||[];
  const item=items[curIdx];
  if(!item)return;
  const w=WL[item.workId]||{};
  const total=items.length;
  document.getElementById('stc').textContent=(curIdx+1)+'/'+total;
  const pds=document.getElementById('pds');
  if(total<=20){pds.innerHTML=items.map((_,i)=>`<div class="pd ${i<curIdx?'done':i===curIdx?'cur':''}"></div>`).join('');}
  else pds.innerHTML='';
  // Info paneli güncelle
  const panel = document.getElementById('stageInfoPanel');
  if (panel) {
    const rows = [
      w.makam ? `<div class="sip-row"><span class="sip-label">Makam</span><span class="sip-val">${w.makam}</span></div>` : '',
      (item.closingNote||w.closingNote) ? `<div class="sip-row"><span class="sip-label">Kapanış</span><span class="sip-val">${item.closingNote||w.closingNote}</span></div>` : '',
      w.tuning ? `<div class="sip-row"><span class="sip-label">Akort</span><span class="sip-val">${w.tuning}</span></div>` : '',
      w.form ? `<div class="sip-row"><span class="sip-label">Form</span><span class="sip-val">${w.form}</span></div>` : '',
      w.measurement ? `<div class="sip-row"><span class="sip-label">Usul</span><span class="sip-val">${w.measurement}</span></div>` : '',
      w.region ? `<div class="sip-row"><span class="sip-label">Bölge</span><span class="sip-val">${w.region}</span></div>` : '',
      w.composer ? `<div class="sip-row"><span class="sip-label">Besteci</span><span class="sip-val">${w.composer}</span></div>` : '',
      w.lyricWriter ? `<div class="sip-row"><span class="sip-label">Güfte</span><span class="sip-val">${w.lyricWriter}</span></div>` : '',
      w.instrument ? `<div class="sip-row"><span class="sip-label">Enstrüman</span><span class="sip-val">${w.instrument}</span></div>` : '',
      item.note ? `<div class="sip-row"><span class="sip-label">Not</span><span class="sip-val">${item.note}</span></div>` : '',
    ].filter(Boolean).join('');
    panel.innerHTML = rows || '<div style="color:var(--text3);font-size:12px;">Bilgi yok</div>';
    const infoBtn = document.querySelector('.stage-info-btn');
    if (infoBtn) infoBtn.style.display = rows ? 'flex' : 'none';
  }
  const viewMode = getStageViewMode(w);
  let bodyHtml = '';
  if (viewMode === 'nota' && w.notaUrl) {
    bodyHtml = `<div class="wnota"><img src="${w.notaUrl}" alt="Nota" style="max-width:100%;max-height:70vh;border-radius:8px;"></div>`;
  } else if (viewMode === 'chords' && w.chords) {
    bodyHtml = `<div class="wlyrics">${renderStageChords(w.chords)}</div>`;
  } else {
    bodyHtml = w.lyrics ? `<div class="wlyrics">${w.lyrics.replace(/\n/g,'<br>')}</div>` : '';
  }
  document.getElementById('sm').innerHTML=`
    <div class="wnum"></div>
    <div class="wtitle">${w.name||item.workId}</div>
    ${bodyHtml}`;
  updateViewToggleUI(w);
  // Kaydedilmiş hizalamayı uygula
  const savedAlign = localStorage.getItem('stageLyricsAlign') || 'center';
  requestAnimationFrame(() => setLyricsAlign(savedAlign));
  const savedScale = parseFloat(localStorage.getItem('stageLyricsScale')) || 1;
  document.documentElement.style.setProperty('--lyrics-scale', savedScale);
  updateFontSizeButtons(savedScale);
  const next=items[curIdx+1];
  const np=document.getElementById('np');
  if(next){const nw=WL[next.workId]||{};document.getElementById('nn').textContent=nw.name||next.workId;document.getElementById('nm').textContent=[nw.makam,nw.measurement,next.closingNote||nw.closingNote].filter(Boolean).join(' · ');np.style.display='block';}
  else np.style.display='none';
}

function nextWork(){
  console.log('nextWork called');
  sideNavNext();
}

function prevWork(){
  sideNavPrev();
}



function initBackBtn() {
  const src = localStorage.getItem('stageSource');
  const backBtn = document.getElementById('btnGoBack');
  if (backBtn && src) {
    const labels = { eserler: 'Eserler', repertoires: 'Repertuvarlar', index: 'Ana Sayfa', artiesten: 'Solistler', uyeler: 'Üyeler', ayarlar: 'Ayarlar' };
    const lbl = backBtn.querySelector('.v2-bn-label');
    if (lbl) lbl.textContent = labels[src] || 'Geri Dön';
  }
  // Not: görünüm etiketi artık her renderStage() çağrısında updateViewToggleUI() ile güncelleniyor
}

// ── Görünüm modu: Söz / Akor / Nota — segmented control ile, repertuvar bazında hatırlanır ──
// Not: eser (work) bazında ayrı bir "varsayılan görünüm" alanı henüz veritabanında yok;
// o katman eklenmek istenirse work_parts/works şemasına bir alan gerekir.
function viewModeStorageKey(){
  const repId = curRep && curRep.id ? curRep.id : 'default';
  return 'stageViewMode_' + repId;
}
function getStageViewMode(w) {
  let mode = localStorage.getItem(viewModeStorageKey()) || 'lyrics';
  // Eserde o modun verisi yoksa güvenli şekilde söze düş
  if (mode === 'chords' && !w.chords) mode = 'lyrics';
  if (mode === 'nota' && !w.notaUrl) mode = 'lyrics';
  return mode;
}

function setViewMode(mode) {
  const item = curRep && curRep.items ? curRep.items[curIdx] : null;
  const w = item ? (WL[item.workId] || {}) : null;
  if (!w) return;
  if (mode === 'chords' && !w.chords) return;
  if (mode === 'nota' && !w.notaUrl) return;
  localStorage.setItem(viewModeStorageKey(), mode);
  renderStage();
}

function updateViewToggleUI(w) {
  const wrap = document.getElementById('viewSwitchWrap');
  if (!wrap) return;
  const mode = getStageViewMode(w);
  const available = { lyrics: true, chords: !!w.chords, nota: !!w.notaUrl };
  wrap.querySelectorAll('.vs-btn').forEach(btn => {
    const m = btn.dataset.mode;
    btn.classList.toggle('active', m === mode);
    btn.disabled = !available[m];
  });
  // Tek mod varsa (geçecek bir şey yoksa) kontrolü tamamen gizle
  const modeCount = Object.values(available).filter(Boolean).length;
  wrap.classList.toggle('single-mode', modeCount <= 1);
  buildStageToolsRow(mode);
}

// Alt "Görünüm Ayarları" paneli, o an açık olan görünüme göre yeniden kurulur.
// Not: Akor modunda ton değiştirme (± Ton) ve Nota modunda sayfaya/genişliğe sığdırma
// henüz ayrı bir özellik olarak yok — bunlar ileride eklenebilir.
function buildStageToolsRow(mode) {
  const row = document.getElementById('stageToolsRow');
  if (!row) return;
  const themeBtn = `<button onclick="event.stopPropagation();toggleStageTheme()" id="stageThemeBtn2" title="Gece/Gündüz" class="align-btn"><i class="ti ti-sun"></i></button>`;
  const navBtn = `<button onclick="event.stopPropagation();openStageNav()" title="Navigasyon" class="align-btn" style="color:var(--accent);border-color:var(--accent);"><i class="ti ti-list"></i></button>`;
  if (mode === 'nota') {
    row.innerHTML = themeBtn + navBtn;
  } else {
    // lyrics ve chords aynı .wlyrics kutusunu kullandığı için hizalama ve yazı boyutu ikisinde de geçerli
    const fontBtns = `
      <button onclick="event.stopPropagation();adjustLyricsFontSize(-0.1)" id="fontSizeMinus" title="Yazıyı Küçült" class="align-btn"><span style="font-size:11px;font-weight:700;">A−</span></button>
      <button onclick="event.stopPropagation();adjustLyricsFontSize(0.1)" id="fontSizePlus" title="Yazıyı Büyüt" class="align-btn"><span style="font-size:15px;font-weight:700;">A+</span></button>`;
    const alignBtns = `
      <button onclick="event.stopPropagation();setLyricsAlign('left')" id="alignLeft" title="Sola Yasla" class="align-btn"><i class="ti ti-align-left"></i></button>
      <button onclick="event.stopPropagation();setLyricsAlign('center')" id="alignCenter" title="Ortala" class="align-btn"><i class="ti ti-align-center"></i></button>
      <button onclick="event.stopPropagation();setLyricsAlign('right')" id="alignRight" title="Sağa Yasla" class="align-btn"><i class="ti ti-align-right"></i></button>`;
    row.innerHTML = fontBtns + alignBtns + themeBtn + navBtn;
    updateFontSizeButtons(parseFloat(localStorage.getItem('stageLyricsScale')) || 1);
  }
}

function goBack(e) {
  if (e) e.preventDefault();
  const src = localStorage.getItem('stageSource');
  if (src === 'eserler') window.location.href = 'eserler.html';
  else if (src === 'repertoires') window.location.href = 'repertoires.html';
  else if (src === 'index') window.location.href = 'index.html';
  else window.location.href = 'index.html';
}

function openInfoSheet(){
  const sheet = document.getElementById('infoSheet');
  const backdrop = document.getElementById('infoSheetBackdrop');
  if (sheet) sheet.classList.add('open');
  if (backdrop) backdrop.classList.add('open');
}
function closeInfoSheet(){
  const sheet = document.getElementById('infoSheet');
  const backdrop = document.getElementById('infoSheetBackdrop');
  if (sheet) sheet.classList.remove('open');
  if (backdrop) backdrop.classList.remove('open');
}

function exitStage(e){e.stopPropagation();if(confirm('Sahne modundan çıkmak istiyor musunuz?')){window._stageActive=false;window.dispatchEvent(new Event('stageExit'));applyStageTheme('picker');backToPicker();}}
function showEndScreen(){
  applyStageTheme('picker');
  showScreen('endScreen');
  document.getElementById('ern').textContent = curRep.name || '';
  document.getElementById('erc').textContent = (curRep.items||[]).length + ' eser seslendirdiniz';
  // Paylaşım modunda Ana Sayfa ve Repertuvar Seç butonlarını gizle
  const isShared = !!new URLSearchParams(window.location.search).get('share');
  const btnRep = document.getElementById('btnRepertuvarSec');
  const btnAna = document.getElementById('btnAnaSayfa');
  if(btnRep) btnRep.style.display = isShared ? 'none' : '';
  if(btnAna) btnAna.style.display = isShared ? 'none' : '';
}
function restartStage(){curIdx=0;showScreen('stageScreen');renderStage();}
function backToPicker(){
  // Paylaşım modunda: sadece paylaşılan repertuvarı göster
  const shareToken = new URLSearchParams(window.location.search).get('share');
  if (shareToken && curRep && curRep.id !== 'single') {
    // Paylaşılan repertuvarı picker'da göster
    showScreen('pickerScreen');
    const pi = document.getElementById('pi');
    if (pi) {
      pi.innerHTML = `
        <div class="plogo"><img src="logo_dark.png" alt="repertuvar.app" data-logo="true" style="width:180px;display:block;"></div>
        <h1 class="ptitle">Paylaşılan Repertuvar</h1>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;cursor:pointer;margin-top:16px;"
          onclick="startSharedRep()">
          <div style="font-size:15px;font-weight:600;color:var(--text);">${curRep.name||'Repertuvar'}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px;">${(curRep.items||[]).length} eser</div>
        </div>`;
    }
    return;
  }
  selId=null;document.getElementById('bstart').disabled=true;showScreen('pickerScreen');renderPicker();
}

function startSharedRep() {
  curIdx = 0;
  sideIdx = 0;
  showScreen('stageScreen');
  document.getElementById('strn').textContent = curRep.name || '';
  renderStage();
  updateSideButtons();
}
function showScreen(id){
  ['pickerScreen','stageScreen','endScreen'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));
  const tnav=document.getElementById('v2StageTopnav');if(tnav)tnav.classList.toggle('hidden',id!=='pickerScreen');
  // topnav.js header'ını sahne modunda gizle
  const rTopnav=document.querySelector('.r-topnav');
  if(rTopnav)rTopnav.style.display=id==='stageScreen'?'none':'';
  const bnav=document.getElementById('v2StageBotNav');
  const stageNav=document.getElementById('stageNavStage');
  if(bnav){
    if(id==='stageScreen'){
      bnav.style.display='flex';
      bnav.classList.add('stage-hidden'); // sahne modunda başta gizli
      if(stageNav)stageNav.style.display='flex';
    } else {
      // picker/bitiş ekranlarında kendi nav'ımızı göstermiyoruz —
      // paylaşılan topnav.js alt nav'ı (#r-bottom-nav) zaten burada görünür durumda.
      // İki ayrı nav'ın üst üste binmesi (ve ikonların tutarsız kalması) bu yüzden
      // kaldırıldı — bkz. Eserler/Repertuvarlar ikon karışıklığı bug'ı.
      bnav.style.display='none';
    }
  }
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('stageScreen').classList.contains('hidden'))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();nextWork();}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();prevWork();}
  if(e.key==='Escape')exitStage({stopPropagation:()=>{}});
});

// Yatay swipe → eser geçişi | Swipe up → bottom nav aç (4sn sonra kapan)
let txStart=0, tyStart=0;
let _navTimer=null;
function openStageNav(){
  const bnav=document.getElementById('v2StageBotNav');
  if(!bnav)return;
  bnav.classList.remove('stage-hidden');
  if(_navTimer)clearTimeout(_navTimer);
  _navTimer=setTimeout(()=>bnav.classList.add('stage-hidden'),4000);
}
document.addEventListener('touchstart',e=>{
  if(document.getElementById('stageScreen').classList.contains('hidden'))return;
  txStart=e.touches[0].clientX;
  tyStart=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(document.getElementById('stageScreen').classList.contains('hidden'))return;
  const dx=e.changedTouches[0].clientX-txStart;
  const dy=e.changedTouches[0].clientY-tyStart;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>50){
    if(dy<0) openStageNav(); // swipe up → aç
  } else if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){
    dx<0?nextWork():prevWork();
  }
},{passive:true});

// ── NAVİGASYON ──
let sideList = [];
let sideIdx  = -1;

function sideNavInit(workId) {
  const stored = localStorage.getItem('stageWorkList');
  if (stored) {
    try { sideList = JSON.parse(stored); } catch(e) { sideList = []; }
    sideIdx = sideList.indexOf(String(workId));
  }
  updateSideButtons();
}

function updateSideButtons() {
  const l = document.getElementById('sideLeft');
  const r = document.getElementById('sideRight');
  if (!l || !r) return;
  const isRepMode = curRep && curRep.items && curRep.items.length > 1;
  const total = isRepMode ? curRep.items.length : sideList.length;
  const cur   = isRepMode ? curIdx : sideIdx;
  l.style.display = r.style.display = total > 1 ? 'flex' : 'none';
  l.classList.toggle('disabled', cur <= 0);
  r.classList.toggle('disabled', cur >= total - 1);
}

function sideNavPrev() {
  if (curRep && curRep.items && curRep.items.length > 1) {
    if (curIdx <= 0) return;
    curIdx--;
    renderStage();
    updateSideButtons();
    return;
  }
  if (sideIdx <= 0) return;
  sideIdx--;
  loadSideWork(sideList[sideIdx]);
}

function sideNavNext() {
  console.log('sideNavNext called, curIdx='+curIdx+', items='+(curRep&&curRep.items?curRep.items.length:0));
  if (curRep && curRep.items && curRep.items.length > 1) {
    if (curIdx >= curRep.items.length - 1) { showEndScreen(); return; }
    curIdx++;
    renderStage();
    updateSideButtons();
    return;
  }
  if (sideIdx >= sideList.length - 1) return;
  sideIdx++;
  loadSideWork(sideList[sideIdx]);
}

function loadSideWork(id) {
  const w = WL[id];
  if (!w) return;
  curRep = { id: 'single', name: w.name||'', items: [{ workId: id, closingNote: w.closingNote||'' }] };
  curIdx = 0;
  sideIdx = sideList.indexOf(String(id));
  document.getElementById('strn').textContent = w.name || '';
  renderStage();
  updateSideButtons();
}
// Init
(async()=>{
  const urlParams = new URLSearchParams(window.location.search);
  const _shareToken = urlParams.get('share');

  // Paylaşım modu: login gerekmez
  if (!_shareToken) {
    if (typeof requireAuth === 'function') {
      const ok = await requireAuth();
      if (!ok) return;
    }
  }

  // Arka planda sync yap (online ise IndexedDB'yi güncelle)
  if (window.syncOfflineData) syncOfflineData();

  // Önce Supabase'den WL'yi yükle
  await loadWL();

  // Paylaşım linki: ?share=token → token'dan rep ID çöz, Supabase'den yükle
  const shareToken = urlParams.get('share');
  if (shareToken) {
    try {
      const repId = atob(shareToken + '=='.slice(0, (4 - shareToken.length % 4) % 4));
      // Supabase'den bu repertuvarı çek (public erişim)
      const [rRes, iRes] = await Promise.all([
        fetch(SUPA_URL+'/rest/v1/repertoires?id=eq.'+repId, {
          headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY}
        }),
        fetch(SUPA_URL+'/rest/v1/repertoire_items?repertoire_id=eq.'+repId+'&order=seq', {
          headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY}
        })
      ]);
      const reps = await rRes.json();
      const items = await iRes.json();
      if (reps && reps[0]) {
        curRep = {
          ...reps[0],
          items: (items||[]).map(t => ({
            ...t, workId: String(t.work_id), closingNote: t.closing_note||'', performer: t.performer||''
          }))
        };
        curIdx = 0;
        showScreen('stageScreen');
        document.getElementById('strn').textContent = curRep.name || '';
        renderStage();
        // Tüm eserleri sideList'e yükle - önceki/sonraki geçiş için
        // Paylaşım modunda sideList boş bırak - sadece curRep/curIdx kullan
        sideList = [];
        sideIdx = -1;
        updateSideButtons();
        initBackBtn();
        return;
      }
    } catch(e) { console.error('Share token error:', e); }
  }

  const workParam = urlParams.get('work');
  if (workParam) {
    const normalizedId = String(parseInt(workParam));
    const w = WL[normalizedId] || WL[workParam];
    if (w) {
      curRep = {
        id: 'single',
        name: w.name || 'Eser',
        items: [{ workId: normalizedId, closingNote: w.closingNote || '' }]
      };
      curIdx = 0;
      showScreen('stageScreen');
      document.getElementById('strn').textContent = w.name || '';
      renderStage();
      sideNavInit(normalizedId);
      initBackBtn();
      return;
    }
  }

  reps=await loadReps();
  showScreen('pickerScreen');
  renderPicker();
  setTheme(localStorage.getItem('stageTheme')||'night');
  initBackBtn();

  const autoId=localStorage.getItem('stageRepId');
  if(autoId){localStorage.removeItem('stageRepId');const f=reps.find(r=>r.id===autoId);if(f){pickRep(autoId);setTimeout(()=>{startStage();initBackBtn();},100);}}
})();

// ── MOBİL SWIPE DESTEĞİ ──
(function() {
  let touchStartX = 0, touchStartY = 0;
  const sm = document.getElementById('sm') || document.body;
  
  document.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive: true});

  document.addEventListener('touchend', function(e) {
    if (!document.getElementById('stageScreen') || 
        document.getElementById('stageScreen').classList.contains('hidden')) return;
    
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    
    // Yalnızca yatay swipe (dikey scroll değil)
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) sideNavNext(); // sola swipe → sonraki
      else sideNavPrev();         // sağa swipe → önceki
    }
  }, {passive: true});
})();

</script>

  <!-- Stage screen: sahneye özel nav — picker/bitiş ekranlarında paylaşılan topnav.js alt nav'ı (#r-bottom-nav) kullanılıyor -->
