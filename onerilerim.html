<!--
  DEĞİŞİKLİK GÜNLÜĞÜ (en üstte):
  - 2026-08-15 (3): 🗑 SİLİNENLER BÖLÜMÜ (çöp kutusu). Silme yumuşak hâle
    getirildi (bkz. eserler.html günlüğü) ama geri alma yalnız 8 saniyelik
    bildirimdeydi; onu kaçıran kullanıcı, kayıt 30 gün durduğu hâlde arayüzden
    ulaşamıyordu. Bu sayfaya dördüncü bölüm eklendi: silinmiş eserler, kalıcı
    kaldırılmaya kaç gün kaldığı ve "↩︎ Geri Al" düğmesi. Silinmiş kartta
    Düzenle YOK — önce geri alınmalı. Geri alma PATCH {deleted_at:null} ve
    dönen satır sayısı denetleniyor.
  - 2026-08-15 (2): "204 BAŞARI DEĞİLDİR". Geri çekme isteği artık
    return=representation ile atılıyor ve dönen satır sayısı kontrol ediliyor;
    sıfırsa kullanıcıya "öneri geri çekilmedi" deniyor. Gerekçe: yetki yoksa
    PostgREST sıfır satır güncelleyip yine 204 döner (bugün works_update
    politikası yüzünden tam olarak bu yaşandı, bkz. eserler.html günlüğü).
  - 2026-08-15: 🐞 "GERİ ÇEK" ESERİ SİLİYORDU — VERİ KAYBINA YOL AÇAN HATA.
    Emir test1 ile yeniden üretti: bir eseri önerdikten sonra "Geri Çek"e
    basınca eser TAMAMEN SİLİNİYORDU (retractWork -> DELETE /works?id=eq.N).
    Bir eser bu şekilde kalıcı olarak kaybedildi (id 539 "Gülpembe").
    Kod, "öneri = katalog başvurusu" varsayımıyla yazılmıştı: geri çekmek
    başvuruyu iptal etmek, yani kaydı silmek demekti. 2026-08-15'te getirilen
    modelde ise eser ÖNCE kullanıcının kendi kaydıdır (gizli taslak), sonra
    isteğe bağlı olarak öneri olur. Dolayısıyla geri çekmek eseri yok etmemeli,
    yalnızca paylaşımı geri almalı.
    YENİ DAVRANIŞ: "Öneriyi Geri Çek" artık DELETE atmıyor; PATCH ile
    visibility='private' + status='approved' yazıyor ⇒ eser sahibinde gizli
    taslak olarak KALIYOR, onay kuyruğundan düşüyor. status'un 'approved'
    yapılması bilinçli: gizli eserler bu modelde onay akışına girmez
    (bkz. eserler.html 2026-08-15 günlüğü), 'pending' kalsaydı Önerilerim
    rozeti hayalet sayı gösterirdi.
  - 2026-08-15: GİZLİ TASLAKLAR ÖNERİ SANILIYORDU. Sayfa kullanıcının TÜM
    eserlerini tek liste hâlinde gösteriyordu; gizli taslaklar da "Önerilerim /
    Gönderdiğiniz eser önerileri" başlığı altında görünüyordu (Emir: "Private
    kaydettiğimde Önerilerim'de görünüyor, aslında önermedim"). Artık üç ayrı
    bölüm var: Onay Bekleyen Önerilerim · Taslaklarım (yalnız siz) ·
    Yayımlanan Eserlerim. Sayfa adı "Eserlerim" oldu.
    Not: gizli taslakta "Geri Çek" düğmesi artık HİÇ gösterilmiyor — eser zaten
    gizli, geri çekilecek bir paylaşım yok. Düzenleme için eserler.html'e
    ?edit=<id>&back= ile gidiliyor.
    Not 2: taslağı kalıcı silme düğmesi bilinçli olarak EKLENMEDİ — yumuşak
    silme (works.deleted_at + "Geri al") kararı beklemede; ikinci bir kalıcı
    silme yolu açmak bugünkü kaybın tekrarını davet eder. Silme eserler.html'de.
-->

<style>
.page{padding:24px;max-width:800px;margin:0;}
.page-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
.sec{margin-bottom:28px;}

.sec-title{font-size:14px;font-weight:700;color:var(--text);}
.sec-count{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;}
.sec-desc{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.5;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none;}

.btn-retract:hover{background:rgba(249,160,74,.2);}

.btn-add:hover{background:rgba(124,111,255,.2);}

.btn-restore:hover{background:rgba(63,185,80,.22);}

<body>

<div id="r-topnav-container"></div>

<div class="main-wrap">
<div class="page">
  <div class="page-title" data-i18n="on.baslik">📋 Eserlerim</div>
  <div class="page-sub" data-i18n="on.altBaslik">Gizli taslaklarınız, onay bekleyen önerileriniz, yayımlanan eserleriniz ve silinenler</div>
  <div id="listPanel"><div class="empty" data-i18n="ortak.yukleniyor">Yükleniyor...</div></div>
</div>
</div>


<script>
// (2026-09-03) JS'ten yazilan metinler icin ceviri yardimcisi.
function _onCev(anahtar, tr) {
  try { return (window.i18n && window.i18n.t) ? window.i18n.t(anahtar, tr) : tr; }
  catch (e) { return tr; }
}

// [B] Bu sayfanin iki cagrisi da kullaniciya ozel: kendi eserlerini listeleme
// (works?submitted_by=eq.<uid>) ve kendi onerisini geri cekme (works PATCH).
// Anon anahtarla RLS 0 satir donduruyor, kullanici hata yerine "Henuz bir eser
// onermediniz" goruyordu. Yerel H() kaldirildi; auth.js'in authHeaders()'i
// kullaniliyor (token yoksa Authorization hic konmuyor, kapi devrede).

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr);
  const m = Math.floor(diff / 60000);
  if (m < 1) return _onCev('ortak.azOnce','Az önce');
  // (2026-09-03) Sozluk anahtarlari '{n} dk once' bicimindeydi ama burada
  // sayi + metin olarak birlestiriliyordu; sonuc "3{n} d ago" oluyordu.
  if (m < 60) return _onCev('ortak.dkOnce','{n} dk önce').replace('{n}', m);
  const h = Math.floor(m / 60);
  if (h < 24) return _onCev('ortak.saOnce','{n} sa önce').replace('{n}', h);
  return _onCev('ortak.gunOnce','{n} gün önce').replace('{n}', Math.floor(h / 24));
}

function esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Düzenleme her zaman eserler.html'deki tek modalda yapılır — görünürlük
// kuralları (onaya düşme, varsayılan seçim, açıklama metni) orada tek yerde
// duruyor; burada ikinci bir kopya tutmuyoruz.
function editUrl(id) {
  return 'eserler.html?edit=' + encodeURIComponent(id)
       + '&back=' + encodeURIComponent('onerilerim.html');
}

// Kalıcı silinmeye kaç gün kaldığını söyler — "30 gün" yazmak yetmez,
// kullanıcı ne zaman sildiğini hatırlamayabilir.
function kalanGun(silinme) {
  if (!silinme) return '';
  const gecen = (Date.now() - new Date(silinme)) / 86400000;
  const kalan = Math.max(0, Math.ceil(30 - gecen));
  return kalan > 0 ? ' · ' + kalan + _onCev('on.gunKaldi',' gün kaldı') : _onCev('on.bugunKaldirilacak',' · bugün kaldırılacak');
}

// (2026-08-15) Yumuşak silmeyi geri alır. Toast 8 saniye duruyor; onu kaçıran
// kullanıcının eserine ulaşabileceği TEK yer burasıydı, o yüzden bu bölüm eklendi.
async function restoreWork(id) {
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/works?id=eq.' + id, {
      method: 'PATCH',
      headers: { ...authHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ deleted_at: null })
    });
    if (!r.ok && r.status !== 204) { alert(_onCev('mod.hata','Hata: ') + await r.text()); return; }
    let rows = []; try { rows = await r.json(); } catch(e) {}
    if (!Array.isArray(rows) || !rows.length) {
      alert(_onCev('on.geriAlYetki','Sunucu isteği kabul etti ama hiçbir kayıt değişmedi — bu eseri geri alma yetkiniz olmayabilir.'));
      return;
    }
    loadSuggestions();
  } catch(e) { alert(_onCev('mod.hata','Hata: ') + e.message); }
}

function cardHtml(w, kind) {
  const badge = (kind === 'deleted')
    ? '<span class="badge deleted">🗑 Silindi' + kalanGun(w.deleted_at) + '</span>'
    : (kind === 'draft')
      ? '<span class="badge private">🔒 Gizli taslak</span>'
      : (kind === 'pending'
          ? '<span class="badge pending">⏳ Onay bekliyor</span>'
          : '<span class="badge approved">✓ Yayımlandı</span>');
  // Silinmiş eser DÜZENLENMEZ — önce geri alınması gerekir; yoksa kullanıcı
  // silinmiş bir kaydı düzenleyip kaybolmasına şaşırırdı.
  let actions = (kind === 'deleted')
    ? '<button class="btn-restore" onclick="restoreWork(' + w.id + ')">↩︎ Geri Al</button>'
    : '<a href="' + editUrl(w.id) + '" class="btn-edit">' + _onCev('rep.duzenle','Düzenle') + '</a>'
      + '<button class="btn-soz" onclick="sozAcKapa(this, ' + w.id + ')">' + _onCev('on.sozleriAc','🎵 Sözleri Aç') + '</button>';
  if (kind === 'pending') {
    actions += '<a href="repertoires.html?add_work=' + w.id + '" class="btn-add">' + _onCev('es.repertuvaraEkle','Repertuvara Ekle') + '</a>'
             + '<button class="btn-retract" onclick="retractSuggestion(' + w.id + ')">Öneriyi Geri Çek</button>';
  }
  return '<div class="card">'
    + '<div class="card-header"><div class="card-name">' + esc(w.name || '—') + '</div>' + badge + '</div>'
    + '<div class="card-meta">'
    +   (w.composer ? '<span>🎼 ' + esc(w.composer) + '</span>' : '')
    +   (w.makam ? '<span>🎵 ' + esc(w.makam) + '</span>' : '')
    +   (w.submitted_at ? '<span>🕐 ' + timeAgo(w.submitted_at) + '</span>' : '')
    + '</div>'
    + '<div class="card-actions">' + actions + '</div>'
    + (kind === 'deleted' ? '' : '<div class="card-lyrics" id="soz-' + w.id + '"></div>')
    + '</div>';
}

const _sozOnbellek = {};

async function sozAcKapa(btn, id) {
  const kutu = document.getElementById('soz-' + id);
  if (!kutu) return;
  if (kutu.classList.contains('acik')) {
    kutu.classList.remove('acik');
    btn.textContent = _onCev('on.sozleriAc','🎵 Sözleri Aç');
    return;
  }
  kutu.classList.add('acik');
  btn.textContent = _onCev('on.sozleriKapat','🎵 Sözleri Kapat');
  if (id in _sozOnbellek) { sozYaz(kutu, _sozOnbellek[id]); return; }
  kutu.innerHTML = '<span class="soz-bos">' + esc(_onCev('on.sozYukleniyor','Sözler yükleniyor…')) + '</span>';
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/works?id=eq.' + encodeURIComponent(id) + '&select=lyrics',
                          { headers: authHeaders() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    const soz = (Array.isArray(rows) && rows.length) ? (rows[0].lyrics || '') : '';
    _sozOnbellek[id] = soz;
    sozYaz(kutu, soz);
  } catch (e) {
    kutu.innerHTML = '<span class="soz-bos">' + esc(_onCev('on.sozYuklenemedi','Sözler yüklenemedi: ') + e.message) + '</span>';
  }
}

// Soz kullanicidan geliyor: HAM BASILMAZ, esc()'ten gecer.
function sozYaz(kutu, soz) {
  kutu.innerHTML = (soz && soz.trim())
    ? esc(soz)
    : '<span class="soz-bos">' + esc(_onCev('on.sozYok','Bu eserde söz kayıtlı değil.')) + '</span>';
}

function section(title, desc, items, kind, emptyText) {
  let body;
  if (items.length) body = items.map(w => cardHtml(w, kind)).join('');
  else if (emptyText) body = '<div class="sec-empty">' + emptyText + '</div>';
  else return '';
  return '<div class="sec">'
    + '<div class="sec-head"><span class="sec-title">' + title + '</span>'
    + (items.length ? '<span class="sec-count">' + items.length + '</span>' : '')
    + '</div>'
    + '<div class="sec-desc">' + desc + '</div>'
    + body + '</div>';
}

async function loadSuggestions() {
  const panel = document.getElementById('listPanel');
  const uid = getUserId();
  if (!uid) { panel.innerHTML = '<div class="empty">Giriş yapılmamış.</div>'; return; }
  try {
    const r = await fetch(
      SUPA_URL + '/rest/v1/works?submitted_by=eq.' + uid + '&order=id.desc&select=id,name,composer,makam,status,visibility,submitted_at,deleted_at',
      { headers: authHeaders() }
    );
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) {
      panel.innerHTML = '<div class="empty">Henüz eser eklemediniz.<br><a href="eserler.html">Eserler sayfasından ekleyebilirsiniz →</a></div>';
      return;
    }
    // Gizli taslaklar öneri DEĞİLDİR — ayrı bölümde. Bir eser hem gizli hem
    // "onay bekliyor" olamaz (gizliye geçince status 'approved' yazılıyor),
    // ama eski kayıtlarda öyle satırlar olabilir: gizlilik önce gelir.
    // (2026-08-15) Silinmişler AYRI: veritabanı politikası silinmiş satırı
    // yalnızca sahibine ve editöre gösteriyor, 30 gün sonra pg_cron kalıcı
    // siliyor. Toast'ı kaçıran kullanıcının geri alabileceği tek yer burası.
    const deleted  = data.filter(w => w.deleted_at);
    const canli    = data.filter(w => !w.deleted_at);
    const drafts   = canli.filter(w => w.visibility === 'private');
    const pending  = canli.filter(w => w.visibility !== 'private' && w.status === 'pending');
    const approved = canli.filter(w => w.visibility !== 'private' && w.status !== 'pending');

    panel.innerHTML =
        section(_onCev('on.onayBekleyen','⏳ Onay Bekleyen Önerilerim'),
                _onCev('on.onayBekleyenAlt','Herkese açık olarak paylaştığınız, yöneticinin onayını bekleyen eserler. Geri çekerseniz eser silinmez — gizli taslağınıza döner.'),
                pending, 'pending', '')
      + section(_onCev('on.taslaklarim','🔒 Taslaklarım'),
                _onCev('on.taslakAlt','Yalnızca siz görürsünüz. Onay gerekmez; hazır olduğunuzda Düzenle’den herkese açabilirsiniz.'),
                drafts, 'draft', '')
      + section(_onCev('on.yayimlanan','✓ Yayımlanan Eserlerim'),
                _onCev('on.yayimlananAlt','Kataloğa girmiş, herkesin görebildiği eserleriniz.'),
                approved, 'approved', '')
      + section('🗑 Silinenler',
                _onCev('on.copAlt','Silinen eserler 30 gün burada bekler, sonra kalıcı olarak kaldırılır. Bu süre içinde geri alabilirsiniz.'),
                deleted, 'deleted', '');
  } catch(e) {
    panel.innerHTML = '<div class="empty">Yüklenemedi: ' + esc(e.message) + '</div>';
  }
}

// (2026-08-15) ÖNERİYİ GERİ ÇEKMEK ESERİ SİLMEZ. Eskiden burada
// DELETE /works?id=eq.N vardı ve kullanıcının eseri kalıcı olarak yok oluyordu
// (bkz. dosya başındaki günlük). Artık yalnızca paylaşım geri alınıyor: eser
// gizli taslak olarak sahibinde kalır, onay kuyruğundan düşer.
async function retractSuggestion(id) {
  if (!confirm(_onCev('on.geriCekOnay','Öneri geri çekilsin mi?\n\nEser SİLİNMEZ — yalnızca size görünen gizli taslağınıza döner. İstediğiniz zaman yeniden paylaşabilirsiniz.'))) return;
  try {
    // (2026-08-15) 204 BAŞARI DEĞİLDİR — dönen satır sayısı kontrol ediliyor.
    // Yetki yoksa PostgREST sıfır satır günceller ve yine 204 döner; eskiden
    // kullanıcı "geri çekildi" sanıp yanılıyordu (bkz. eserler.html günlüğü).
    const r = await fetch(SUPA_URL + '/rest/v1/works?id=eq.' + id, {
      method: 'PATCH',
      headers: { ...authHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ visibility: 'private', status: 'approved' })
    });
    if (!r.ok && r.status !== 204) { alert(_onCev('mod.hata','Hata: ') + await r.text()); return; }
    let rows = []; try { rows = await r.json(); } catch(e) {}
    if (!Array.isArray(rows) || !rows.length) {
      alert(_onCev('on.degistirYetki','Sunucu isteği kabul etti ama hiçbir kayıt değişmedi — bu eseri değiştirme yetkiniz olmayabilir. Öneri GERİ ÇEKİLMEDİ.'));
      return;
    }
    loadSuggestions();
  } catch(e) { alert(_onCev('mod.hata','Hata: ') + e.message); }
}

window.toggleSbDropdown = function() {
  var dd = document.getElementById('sbUserDropdown');
  if (dd) dd.classList.toggle('open');
};
document.addEventListener('click', function(e) {
  var btn = document.getElementById('sbUserBtn');
  var dd = document.getElementById('sbUserDropdown');
  if (dd && btn && !btn.contains(e.target)) dd.classList.remove('open');
});

(async function() {
  const ok = await requireAuth();
  if (!ok) return;
  const u = getUser();
  const name = u?.user_metadata?.full_name || u?.email?.split('@')[0] || '—';
  const ini = name.charAt(0).toUpperCase();
  const av = document.getElementById('sbAvatar'); if(av) av.textContent = ini;
  const un = document.getElementById('sbUserName'); if(un) un.textContent = name;
  const ur = document.getElementById('sbUserRole');
  if (ur) ur.textContent = isAdmin() ? 'Admin' : (getUserRole() === 'editor' ? _onCev('ortak.editor','Editör') : _onCev('ortak.uye','Üye'));
  if (isAdmin() || isEditor()) {
    document.querySelectorAll('.admin-only').forEach(el => { el.style.display = ''; });
  }
  loadSuggestions();
})();
</script>
</div><!-- /main-wrap -->
</body>
</html>
