<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuvar — Önerilerim</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#07071a;--bg2:#0f0f2e;--surface:#12123a;--surface2:#1a1a4a;--border:rgba(140,120,255,0.38);--accent:#7c6fff;--accent2:#a78bfa;--accent3:#c4b5fd;--text:#e2e0ff;--text2:#9d9bc4;--text3:#5e5c8a;--green:#4ade80;--red:#f87171;--sidebar-w:220px;--bottom-h:68px;--font:'Plus Jakarta Sans',sans-serif;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
@media(min-width:1024px){
  body{display:flex;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:300;padding-bottom:20px;}
  .sb-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .sb-brand img{height:38px;width:auto;display:block;}
  .sb-nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:2px;}
  .sb-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px 4px;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;transition:all .15s;}
  .sb-item:hover{background:var(--surface);color:var(--text);}
  .sb-item.active{background:rgba(124,111,255,0.12);color:var(--accent3);border:1px solid rgba(124,111,255,0.2);}
  .sb-divider{height:1px;background:var(--border);margin:8px 10px;}
  .sb-user-x{position:relative;margin:10px 10px 0;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .sb-user-dropdown{display:none;position:fixed;bottom:20px;left:10px;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;z-index:9999;box-shadow:0 -4px 20px rgba(0,0,0,.5);}
  .sb-user-dropdown.open{display:block;}
  .sb-dd-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text2);text-decoration:none;cursor:pointer;transition:all .15s;background:none;border:none;width:100%;font-family:inherit;}
  .sb-dd-item:hover{background:rgba(124,111,255,0.12);color:var(--text);}
  .sb-dd-item.danger{color:var(--red);}
  .sb-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
  .sb-uname{font-size:12px;font-weight:600;color:var(--text);}
  .sb-urole{font-size:10px;color:var(--text3);}
  .main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;}
  .desktop-topbar{display:flex;align-items:center;padding:14px 32px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;}
  .dt-crumb{font-size:13px;color:var(--text2);}
  .dt-crumb span{color:var(--text);font-weight:600;}
  .v2-topnav,.v2-bottom-nav{display:none!important;}
}
@media(max-width:1023px){
  .sidebar{display:none;}
  .desktop-topbar{display:none;}
  body{padding-bottom:var(--bottom-h);}
  .main-wrap{display:contents;}
  .v2-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--bottom-h);background:var(--bg);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:center;}
  .v2-bn-items{display:flex;width:100%;padding:0 4px;}
  .v2-bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;text-decoration:none;color:var(--text3);border-radius:10px;transition:all .15s;position:relative;}
  .v2-bn-item.active{color:var(--accent);}
  .v2-bn-label{font-size:9px;font-weight:600;}
}
.page{padding:24px;max-width:800px;margin:0 auto;}
.page-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.card-name{font-size:15px;font-weight:600;color:var(--text);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.pending{background:rgba(249,160,74,.15);border:1px solid rgba(249,160,74,.4);color:#F9A04A;}
.badge.approved{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);color:#3FB950;}
.badge.private{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);color:#58A6FF;}
.card-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text3);}
.card-actions{display:flex;gap:8px;margin-top:12px;}
.btn-delete{padding:5px 14px;border-radius:7px;background:rgba(192,84,68,.1);border:1px solid rgba(192,84,68,.3);color:#e07060;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-delete:hover{background:rgba(192,84,68,.2);}
.empty{text-align:center;color:var(--text3);padding:48px 16px;font-size:13px;}
.empty a{color:var(--accent);text-decoration:none;}
.admin-only{display:none;}
</style>
</head>
<body>

<div id="r-topnav-container"></div>
<script src="topnav.js"></script>

<aside class="sidebar">
  <div class="sb-brand">
    <img src="logo_dark.png" alt="repertuvar.app" id="sidebarLogo">
  </div>
  <nav class="sb-nav">
    <div class="sb-label">Menü</div>
    <a href="index.html" class="sb-item"><i class="ti ti-home" style="font-size:16px;width:20px;text-align:center;"></i>Ana Sayfa</a>
    <a href="eserler.html" class="sb-item"><i class="ti ti-book" style="font-size:16px;width:20px;text-align:center;"></i>Eserler</a>
    <a href="repertoires.html" class="sb-item"><i class="ti ti-playlist" style="font-size:16px;width:20px;text-align:center;"></i>Repertuvarlar</a>
    <a href="artiesten.html" class="sb-item"><i class="ti ti-microphone" style="font-size:16px;width:20px;text-align:center;"></i>Solistler</a>
    <div class="sb-divider"></div>
    <div class="sb-label">Araçlar</div>
    <a href="mesajlar.html" class="sb-item"><i class="ti ti-message" style="font-size:16px;width:20px;text-align:center;"></i>Mesajlar</a>
    <a href="uyeler.html" class="sb-item admin-only"><i class="ti ti-users-group" style="font-size:16px;width:20px;text-align:center;"></i>Üyeler</a>
    <a href="onerilerim.html" class="sb-item active"><i class="ti ti-bulb" style="font-size:16px;width:20px;text-align:center;"></i>Önerilerim</a>
  </nav>
  <div style="flex:1"></div>
  <div class="sb-user-x" id="sbUserBtn" onclick="toggleSbDropdown()">
    <div class="sb-user-dropdown" id="sbUserDropdown">
      <a href="ayarlar.html" class="sb-dd-item"><i class="ti ti-settings" style="font-size:14px;"></i>Ayarlar</a>
      <button class="sb-dd-item danger" onclick="logout()"><i class="ti ti-logout" style="font-size:14px;"></i>Çıkış Yap</button>
    </div>
    <div class="sb-avatar" id="sbAvatar">—</div>
    <div style="flex:1;min-width:0;">
      <div class="sb-uname" id="sbUserName">—</div>
      <div class="sb-urole" id="sbUserRole">Üye</div>
    </div>
    <i class="ti ti-chevron-up" style="font-size:12px;color:var(--text3);"></i>
  </div>
</aside>

<div class="main-wrap">
<div class="desktop-topbar">
  <div class="dt-crumb">repertuvar / <span>Önerilerim</span></div>
</div>

<div class="page">
  <div class="page-title">📋 Önerilerim</div>
  <div class="page-sub">Gönderdiğiniz eser önerileri ve onay durumları</div>
  <div id="listPanel"><div class="empty">Yükleniyor...</div></div>
</div>
</div>

<nav class="v2-bottom-nav">
  <div class="v2-bn-items">
    <a href="index.html" class="v2-bn-item"><i class="ti ti-home" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Ana Sayfa</span></a>
    <a href="eserler.html" class="v2-bn-item"><i class="ti ti-playlist" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Eserler</span></a>
    <a href="repertoires.html" class="v2-bn-item"><i class="ti ti-book" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Repertuvarlar</span></a>
    <a href="stage.html" class="v2-bn-item"><i class="ti ti-music" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Sahne Modu</span></a>
    <a href="mesajlar.html" class="v2-bn-item"><i class="ti ti-message" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Mesajlar</span></a>
  </div>
</nav>

<script>
function H() {
  return {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY),
    'Content-Type': 'application/json'
  };
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr);
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Az önce';
  if (m < 60) return m + ' dk önce';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' sa önce';
  return Math.floor(h / 24) + ' gün önce';
}

async function loadSuggestions() {
  const panel = document.getElementById('listPanel');
  const uid = getUserId();
  if (!uid) { panel.innerHTML = '<div class="empty">Giriş yapılmamış.</div>'; return; }
  try {
    const r = await fetch(
      SUPA_URL + '/rest/v1/works?submitted_by=eq.' + uid + '&order=id.desc&select=id,name,composer,makam,status,visibility,submitted_at',
      { headers: H() }
    );
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) {
      panel.innerHTML = '<div class="empty">Henüz bir eser önermediniz.<br><a href="eserler.html">Eserler sayfasından öneri gönderebilirsiniz →</a></div>';
      return;
    }
    panel.innerHTML = data.map(w => `
      <div class="card">
        <div class="card-header">
          <div class="card-name">${w.name || '—'}</div>
          <span class="badge ${w.visibility === 'private' ? 'private' : (w.status === 'approved' ? 'approved' : 'pending')}">
            ${w.visibility === 'private' ? '🔒 Gizli' : (w.status === 'approved' ? '✓ Onaylandı' : '⏳ Bekliyor')}
          </span>
        </div>
        <div class="card-meta">
          ${w.composer ? '<span>🎼 ' + w.composer + '</span>' : ''}
          ${w.makam ? '<span>🎵 ' + w.makam + '</span>' : ''}
          ${w.submitted_at ? '<span>🕐 ' + timeAgo(w.submitted_at) + '</span>' : ''}
        </div>
        ${w.status === 'pending' || w.visibility === 'private' ? `
        <div class="card-actions">
          <button class="btn-delete" onclick="retractWork(${w.id})">Geri Çek</button>
        </div>` : ''}
      </div>`).join('');
  } catch(e) {
    panel.innerHTML = '<div class="empty">Yüklenemedi: ' + e.message + '</div>';
  }
}

async function retractWork(id) {
  if (!confirm('Bu öneriyi geri çekmek istiyor musunuz?')) return;
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/works?id=eq.' + id, {
      method: 'DELETE', headers: H()
    });
    if (r.ok || r.status === 204) {
      loadSuggestions();
    } else {
      alert('Hata: ' + await r.text());
    }
  } catch(e) { alert('Hata: ' + e.message); }
}

window.toggleSbDropdown = function() {
  var dd = document.getElementById('sbUserDropdown');
  if (dd) dd.classList.toggle('open');
};
document.addEventListener('click', function(e) {
  var btn = document.getElementById('sbUserBtn');
  var dd = document.getElementById('sbUserDropdown');
  if (dd && btn && !btn.contains(e.target)) dd.classList.remove('open');
});

(async function() {
  const ok = await requireAuth();
  if (!ok) return;
  const u = getUser();
  const name = u?.user_metadata?.full_name || u?.email?.split('@')[0] || '—';
  const ini = name.charAt(0).toUpperCase();
  const av = document.getElementById('sbAvatar'); if(av) av.textContent = ini;
  const un = document.getElementById('sbUserName'); if(un) un.textContent = name;
  const ur = document.getElementById('sbUserRole');
  if (ur) ur.textContent = isAdmin() ? 'Admin' : (getUserRole() === 'editor' ? 'Editör' : 'Üye');
  if (isAdmin() || isEditor()) {
    document.querySelectorAll('.admin-only').forEach(el => { el.style.display = ''; });
  }
  loadSuggestions();
})();
</script>
</body>
</html>
