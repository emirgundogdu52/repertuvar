<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veri Temizleme</title>
<style>
  :root{--bg:#0b0b0c;--surface:#131315;--border:#252528;--accent:#c9963a;--red:#c05444;--green:#4a9462;--text:#f0ede6;--text2:#9b9890;--text3:#4a4845;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;padding:40px 32px;min-height:100vh;}
  h1{font-size:22px;margin-bottom:6px;color:var(--accent);}
  p{font-size:13px;color:var(--text2);margin-bottom:28px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;}
  .card h2{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;}
  .btn{padding:10px 20px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;}
  .btn-scan{background:var(--accent);color:#1a1000;}
  .btn-scan:hover{filter:brightness(1.1);}
  .btn-delete{background:var(--red);color:#fff;}
  .btn-delete:hover{filter:brightness(1.1);}
  .btn-delete:disabled{opacity:.35;cursor:not-allowed;}
  .btn-back{background:none;border:1px solid var(--border);color:var(--text2);}
  .btn-back:hover{border-color:var(--text3);color:var(--text);}
  .log{margin-top:16px;font-size:12px;line-height:1.8;color:var(--text2);max-height:400px;overflow-y:auto;}
  .log .ok{color:var(--green);}
  .log .err{color:var(--red);}
  .log .warn{color:var(--accent);}
  .count{font-size:28px;font-weight:500;color:var(--accent);margin-bottom:4px;}
  .count small{font-size:13px;color:var(--text2);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  hr{border:none;border-top:1px solid var(--border);margin:20px 0;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style id="v2-t-css">
:root{--bg:#07071a;--surface:#12123a;--surface2:#1a1a4a;--border:rgba(120,100,255,0.18);--accent:#7c6fff;--accent2:#a78bfa;--text:#e2e0ff;--text2:#9d9bc4;--text3:#5e5c8a;--red:#f87171;--green:#4ade80;--font:'Plus Jakarta Sans',sans-serif;}
body{font-family:var(--font)!important;background:var(--bg)!important;color:var(--text)!important;}
h1{color:var(--accent2)!important;}
p{color:var(--text2)!important;}
.card{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:16px!important;}
.card h2{color:var(--text2)!important;}
.btn{font-family:var(--font)!important;border-radius:10px!important;}
.btn-scan{background:linear-gradient(135deg,var(--accent),var(--accent2))!important;color:#fff!important;}
.btn-delete{background:rgba(248,113,113,.15)!important;border:1px solid rgba(248,113,113,.4)!important;color:var(--red)!important;}
.btn-back{background:var(--surface2)!important;border:1px solid var(--border)!important;color:var(--text2)!important;}
.log{color:var(--text2)!important;}
.log .ok{color:var(--green)!important;}
.log .err{color:var(--red)!important;}
.log .warn{color:var(--accent2)!important;}
.count{color:var(--accent2)!important;}
/* Slim topbar */
.v2-admin-topnav{display:flex;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid var(--border);background:rgba(7,7,26,0.8);backdrop-filter:blur(12px);margin-bottom:32px;}
.v2-atn-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.v2-atn-name{font-size:14px;font-weight:700;color:var(--text);}
.v2-atn-back{margin-left:auto;background:none;border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font);text-decoration:none;transition:all .15s;}
.v2-atn-back:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div class="v2-admin-topnav">
  <div class="v2-atn-logo">R</div>
  <span class="v2-atn-name">repertuvar — Yönetim</span>
  <a href="eserler.html" class="v2-atn-back">← Eserler</a>
</div>

<h1>🧹 Veri Temizleme Aracı</h1>
<p>İsmi boş veya eksik olan eserleri bulup siler.</p>

<div class="card">
  <h2>1 — Tarama</h2>
  <div class="row">
    <button class="btn btn-scan" onclick="scanEmpty()">🔍 Boş Kayıtları Tara</button>
  </div>
  <div class="log" id="scanLog"></div>
</div>

<div class="card" id="deleteCard" style="display:none">
  <h2>2 — Silme</h2>
  <div class="count" id="countDisplay">0 <small>boş kayıt bulundu</small></div>
  <div class="log" id="previewLog"></div>
  <hr>
  <div class="row">
    <button class="btn btn-delete" id="btnDelete" onclick="deleteEmpty()" disabled>🗑 Hepsini Sil</button>
    <span style="font-size:12px;color:var(--text3);">Bu işlem geri alınamaz</span>
  </div>
  <div class="log" id="deleteLog"></div>
</div>



<script>
const SUPA_URL = 'https://ehytkzxdhjyjuubizdnl.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoeXRrenhkaGp5anV1Yml6ZG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI3NzIsImV4cCI6MjA5NTgyODc3Mn0.Vzi75p3fSTTYcvkZsoc1VOxfqtwnrQoGYw39JZJfOdU';
const H = {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};

let emptyIds = [];

function log(elId, msg, cls=''){
  const el = document.getElementById(elId);
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function scanEmpty(){
  emptyIds = [];
  document.getElementById('scanLog').innerHTML = '';
  document.getElementById('deleteCard').style.display = 'none';

  log('scanLog', '⏳ Tüm eserler çekiliyor...');

  try {
    // Tüm works'ü çek (isim boş olanlar dahil)
    let all = [];
    let from = 0;
    const step = 1000;
    while(true){
      const res = await fetch(`${SUPA_URL}/rest/v1/works?select=id,name,composer&order=id&offset=${from}&limit=${step}`, {headers:H});
      const data = await res.json();
      if(!Array.isArray(data) || data.length === 0) break;
      all = all.concat(data);
      if(data.length < step) break;
      from += step;
    }

    log('scanLog', `<span class="ok">✓ Toplam ${all.length} eser çekildi.</span>`);

    // Boşları filtrele: isim yok, null, boş string veya sadece boşluk
    const empty = all.filter(w => !w.name || w.name.trim() === '' || w.name.trim() === '(isimsiz)');
    emptyIds = empty.map(w => w.id);

    log('scanLog', `<span class="${empty.length > 0 ? 'warn' : 'ok'}">${empty.length > 0 ? '⚠' : '✓'} ${empty.length} boş/isimsiz kayıt bulundu.</span>`);

    if(empty.length > 0){
      document.getElementById('deleteCard').style.display = 'block';
      document.getElementById('countDisplay').innerHTML = `${empty.length} <small>boş kayıt bulundu</small>`;
      const prev = document.getElementById('previewLog');
      prev.innerHTML = '';
      empty.slice(0,20).forEach(w => {
        prev.innerHTML += `<div>ID: ${w.id} — isim: "${w.name||''}" — besteci: "${w.composer||''}"</div>`;
      });
      if(empty.length > 20) prev.innerHTML += `<div class="warn">... ve ${empty.length-20} tane daha</div>`;
      document.getElementById('btnDelete').disabled = false;
    } else {
      log('scanLog', '<span class="ok">🎉 Veri tabanı temiz, silinecek kayıt yok.</span>');
    }
  } catch(e){
    log('scanLog', `<span class="err">Hata: ${e.message}</span>`);
  }
}

async function deleteEmpty(){
  if(!emptyIds.length) return;
  document.getElementById('btnDelete').disabled = true;
  document.getElementById('deleteLog').innerHTML = '';
  log('deleteLog', `⏳ ${emptyIds.length} kayıt siliniyor...`);

  let deleted = 0, errors = 0;
  // Gruplar halinde sil (max 100'er)
  const chunks = [];
  for(let i=0; i<emptyIds.length; i+=100) chunks.push(emptyIds.slice(i,i+100));

  for(const chunk of chunks){
    const ids = chunk.join(',');
    try {
      // Önce repertoire_items'tan bağlı kayıtları sil
      await fetch(`${SUPA_URL}/rest/v1/repertoire_items?work_id=in.(${ids})`, {
        method:'DELETE', headers:H
      });

      // Sonra work'ü sil
      const res = await fetch(`${SUPA_URL}/rest/v1/works?id=in.(${ids})`, {
        method:'DELETE', headers:H
      });
      if(res.ok){
        deleted += chunk.length;
        log('deleteLog', `<span class="ok">✓ ${chunk.length} kayıt silindi.</span>`);
      } else {
        const err = await res.text();
        errors++;
        log('deleteLog', `<span class="err">Hata: ${err}</span>`);
      }
    } catch(e){
      errors++;
      log('deleteLog', `<span class="err">Hata: ${e.message}</span>`);
    }
  }

  log('deleteLog', `<br><span class="${errors===0?'ok':'warn'}">İşlem tamamlandı: ${deleted} silindi, ${errors} hata.</span>`);
  if(errors === 0){
    log('deleteLog', '🎉 Veri tabanı temizlendi!');
    emptyIds = [];
    document.getElementById('countDisplay').innerHTML = `0 <small>boş kayıt kaldı</small>`;
  }
}
</script>
</body>
</html>
