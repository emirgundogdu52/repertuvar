<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Repertuvar — Üyeler</title>
<script src="topnav.js" defer></script>
<script src="auth.js"></script>
<!-- (2026-08-03) HATA DÜZELTMESİ: showToast bu blokta src="auth.js" ile AYNI
     script etiketinin içinde tanımlıydı. Bir script etiketinde src varsa
     tarayıcı gövdesini TAMAMEN yok sayar — yani showToast hiç tanımlanmıyordu
     ve editName() içindeki çağrısı ReferenceError veriyordu. Ayrı etikete
     alındı; sayfanın kendi toast() fonksiyonu da zaten var. -->
<script>
function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(124,111,255,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2000);
}
</script>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/fonts/tabler-icons.woff2?v3.44.0" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
<style>
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none;}
.member-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--accent);flex-shrink:0;}
.member-info{flex:1;min-width:0;}
.member-email{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}.member-email:hover{color:var(--accent);}.name-input{background:var(--surface2);border:1px solid var(--accent);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:500;color:var(--text);font-family:var(--font);width:180px;outline:none;}
.member-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.role-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.role-badge.admin{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:#F85149;}
.role-badge.editor{background:rgba(188,140,255,.12);border:1px solid rgba(188,140,255,.3);color:#BC8CFF;}
.role-badge.member{background:rgba(120,100,255,.1);border:1px solid rgba(120,100,255,.2);color:var(--text2);}
.member-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-sm{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:none;color:var(--text2);white-space:nowrap;}
.btn-sm:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm.danger:hover{border-color:var(--red);color:var(--red);}
.btn-sm.promote{border-color:rgba(188,140,255,.4);color:#BC8CFF;background:rgba(188,140,255,.08);}
.search-bar{margin-bottom:16px;position:relative;}
.search-bar input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 36px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;}
.search-bar input:focus{border-color:var(--accent);}
.search-bar input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);}
.page-content{padding:24px 32px;}
@media(max-width:767px){.page-content{padding:16px;}}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:nowrap;gap:12px;}
.page-title{font-size:18px;font-weight:600;color:var(--text);}
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;}
.stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text2);}
.stat-chip span{color:var(--text);font-weight:600;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text2);z-index:999;animation:toastIn .2s ease;}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.er{border-color:var(--red);color:var(--red);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#confirmModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center;padding:16px;}
.confirm-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:min(400px,96vw);}
.confirm-title{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text);}
.confirm-text{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-confirm-danger{padding:7px 16px;border-radius:7px;background:rgba(192,84,68,.15);border:1px solid rgba(192,84,68,.4);color:#e07060;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-confirm-cancel{padding:7px 16px;border-radius:7px;background:none;border:1px solid var(--border);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;}
@media(max-width:600px){.member-card{gap:8px;}.member-actions{width:100%;justify-content:flex-end;}}
</style>
</head>
<body>
<div id="r-topnav-container"></div>

<div class="main-wrap">
<div class="page-content">
  <div class="page-header" style="display:flex;align-items:left
  ;gap:12px;flex-wrap:nowrap;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
      <div class="page-title">Üyeler</div>
      <div class="stat-chips">
        <div class="stat-chip">Toplam: <span id="totalCount">—</span></div>
        <div class="stat-chip">Editör: <span id="editorCount">—</span></div>
      </div>
    </div>
    <div style="position:relative;width:340px;flex-shrink:0;">
      <i class="ti ti-search" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;"></i>
      <input type="text" id="searchInput" placeholder="İsim, e-posta veya rol ile ara..." oninput="filterMembers()"
        style="width: 85%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 36px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;">
    </div>
  </div>
  <!-- Silme Talepleri -->
  <div id="deletionRequests" style="display:none;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <i class="ti ti-trash" style="font-size:16px;color:var(--red);"></i>
      <span style="font-size:13px;font-weight:700;color:var(--red);">Hesap Silme Talepleri</span>
      <span id="deletionCount" style="background:rgba(248,113,113,.2);border:1px solid rgba(248,113,113,.4);color:var(--red);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;"></span>
    </div>
    <div id="deletionList"></div>
  </div>
  <div id="memberList"><div style="text-align:center;color:var(--text3);padding:32px;">Yükleniyor...</div></div>
</div>
</div>
<div id="confirmModal">
  <div class="confirm-card">
    <div class="confirm-title" id="confirmTitle">Emin misin?</div>
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-actions">
      <button class="btn-confirm-cancel" onclick="closeConfirm()">İptal</button>
      <button class="btn-confirm-danger" onclick="confirmAction()">Onayla</button>
    </div>
  </div>
</div>
<script>
var allMembers = [];

document.addEventListener('click', function(e) {
  console.log('click on:', e.target.tagName, e.target.className);
  var btn = e.target.closest('button[data-uid]');
  console.log('btn found:', btn);
  if (!btn) return;
  var uid = btn.dataset.uid;
  var email = btn.dataset.email;
  var role = btn.dataset.role;
  if (btn.classList.contains('danger')) {
    removeMember(uid, email);
  } else if (btn.classList.contains('promote')) {
    var newRole = role === 'editor' ? 'member' : 'editor';
    changeRole(uid, newRole, email);
  }
});

var confirmCallback = null;

function toast(m, t) {
  t = t || 'ok';
  var e = document.createElement('div');
  e.className = 'toast ' + t;
  e.textContent = m;
  document.body.appendChild(e);
  setTimeout(function(){ e.remove(); }, 2500);
}

function openConfirm(title, text, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  confirmCallback = cb;
  document.getElementById('confirmModal').style.display = 'flex';
}

function closeConfirm() {
  document.getElementById('confirmModal').style.display = 'none';
  confirmCallback = null;
}

function confirmAction() {
  var cb = confirmCallback;
  closeConfirm();
  if (cb) cb();
}

function initials(email) {
  return (email || '?').charAt(0).toUpperCase();
}

function roleBadge(role) {
  var labels = { admin: 'Admin', editor: 'Editör', member: 'Üye' };
  return '<span class="role-badge ' + role + '">' + (labels[role] || role) + '</span>';
}

function renderMembers(list) {
  var el = document.getElementById('memberList');
  if (!list.length) { el.innerHTML = '<div style="text-align:center;color:var(--text3);padding:48px;">Üye bulunamadı</div>'; return; }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    var uid = m.id || '';
    var email = m.email || '—';
    var name = m.display_name || '';
    var date = m.created_at ? new Date(m.created_at).toLocaleDateString('tr-TR') : '';
    var roleBtn = m.role !== 'admin' ? '<button class="btn-sm promote" data-uid="' + uid + '" data-role="' + m.role + '" data-email="' + email + '">' + (m.role === 'editor' ? '↓ Üye Yap' : '↑ Editör Yap') + '</button>' : '';
    var delBtn = m.role !== 'admin' ? '<button class="btn-sm danger" data-uid="' + uid + '" data-email="' + email + '">Kaldır</button>' : '';
    html += '<div class="member-card">' +
      '<div class="member-avatar">' + (name || email).charAt(0).toUpperCase() + '</div>' +
      '<div class="member-info"><div class="member-email" onclick="editName(this,\'' + uid + '\')" title="İsim düzenle">' + (name || email) + '</div>' +
      '<div class="member-meta">' + (name ? email + ' · ' : '') + date + '</div></div>' +
      roleBadge(m.role) +
      '<div class="member-actions">' + roleBtn + delBtn + '</div></div>';
  }
  el.innerHTML = html;
}

function editName(el, uid) {
  var current = el.textContent.trim();
  var input = document.createElement('input');
  input.className = 'name-input';
  input.value = current;
  el.replaceWith(input);
  input.focus();
  input.select();
  async function save() {
    var newName = input.value.trim();
    if (!newName || newName === current) { location.reload(); return; }
    var r = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + uid, {
      method: 'PATCH',
      headers: Object.assign(authHeaders(), { Prefer: 'return=minimal' }),
      body: JSON.stringify({ display_name: newName })
    });
    if (r.ok) {
      var span = document.createElement('div');
      span.className = 'member-email';
      span.textContent = newName;
      span.onclick = function(){ editName(span, uid); };
      span.title = 'İsim düzenle';
      input.replaceWith(span);
      showToast('✓ İsim güncellendi');
    } else { alert('Hata!'); location.reload(); }
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') input.blur(); if(e.key==='Escape') location.reload(); });
}

function handleRoleChange(btn) {
  changeRole(btn.dataset.uid, btn.dataset.role === 'editor' ? 'member' : 'editor', btn.dataset.email);
}

function handleRemove(btn) {
  removeMember(btn.dataset.uid, btn.dataset.email);
}

function filterMembers() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  // (2026-08-05) Eskiden yalnızca e-posta ve rol aranıyordu; isimle arama çalışmıyordu.
  var filtered = q ? allMembers.filter(function(m){
    var hay = ((m.display_name || '') + ' ' + (m.email || '') + ' ' + (m.role || '')).toLowerCase();
    return hay.indexOf(q) > -1;
  }) : allMembers;
  renderMembers(filtered);
}


function renderDeletionRequests(members) {
  var pending = members.filter(function(m) { return m.deletion_requested_at; });
  var wrap = document.getElementById('deletionRequests');
  var list = document.getElementById('deletionList');
  var count = document.getElementById('deletionCount');
  if (!pending.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  count.textContent = pending.length + ' talep';
  list.innerHTML = pending.map(function(m) {
    var gun = Math.floor((Date.now() - new Date(m.deletion_requested_at)) / 86400000);
    var kalan = 30 - gun;
    var isSuspended = m.status === 'suspended';
    var suspendBtn = isSuspended
      ? '<button class="btn-sm" style="border-color:rgba(250,180,50,.4);color:#facc15;background:rgba(250,180,50,.08);" onclick="hesabiAktifYap(&quot;' + m.id + '&quot;,&quot;' + (m.email||'') + '&quot;)"><i class="ti ti-lock-open"></i> Askıyı Kaldır</button>'
      : '<button class="btn-sm" style="border-color:rgba(250,180,50,.4);color:#facc15;background:rgba(250,180,50,.08);" onclick="hesabiAskiyaAl(&quot;' + m.id + '&quot;,&quot;' + (m.email||'') + '&quot;)"><i class="ti ti-lock"></i> Askıya Al</button>';
    var suspendedBadge = isSuspended ? ' <span style="background:rgba(250,180,50,.15);border:1px solid rgba(250,180,50,.35);color:#facc15;border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;">Askıda</span>' : '';
    return '<div class="member-card" style="border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.04);">' +
      '<div class="member-avatar" style="background:rgba(248,113,113,.3);">' + (m.email||'?').charAt(0).toUpperCase() + '</div>' +
      '<div class="member-info">' +
        '<div class="member-email">' + (m.email||'—') + suspendedBadge + '</div>' +
        '<div class="member-meta">Talep: ' + new Date(m.deletion_requested_at).toLocaleDateString('tr-TR') + ' · ' + (kalan > 0 ? kalan + ' gün kaldı' : 'Süre doldu!') + '</div>' +
      '</div>' +
      '<div class="member-actions">' +
        suspendBtn +
        '<button class="btn-sm danger" onclick="hesabiSil(&quot;' + m.id + '&quot;,&quot;' + (m.email||'') + '&quot;)"><i class="ti ti-trash"></i> Hesabı Sil</button>' +
        '<button class="btn-sm" onclick="silmeyiIptal(&quot;' + m.id + '&quot;,&quot;' + (m.email||'') + '&quot;)">İptal Et</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function hesabiAskiyaAl(userId, email) {
  openConfirm('Hesabı Askıya Al', email + ' hesabı askıya alınacak ve giriş yapamayacak.', async function() {
    try {
      var r = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'PATCH',
        headers: Object.assign(authHeaders(), { Prefer: 'return=minimal' }),
        body: JSON.stringify({ status: 'suspended' })
      });
      if (!r.ok) throw new Error(await r.text());
      toast('Hesap askıya alındı ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

async function hesabiAktifYap(userId, email) {
  openConfirm('Askıyı Kaldır', email + ' hesabı yeniden aktif edilecek.', async function() {
    try {
      var r = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'PATCH',
        headers: Object.assign(authHeaders(), { Prefer: 'return=minimal' }),
        body: JSON.stringify({ status: 'active' })
      });
      if (!r.ok) throw new Error(await r.text());
      toast('Hesap yeniden aktif edildi ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

async function hesabiSil(userId, email) {
  openConfirm('Hesabı Kalıcı Sil', email + ' hesabı ve tüm repertuvarları kalıcı olarak silinecek.', async function() {
    try {
      // Repertuvarları sil
      await fetch(SUPA_URL + '/rest/v1/repertoires?user_id=eq.' + userId, {
        method: 'DELETE',
        headers: authHeaders()
      });
      // Profiles sil
      await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'DELETE',
        headers: authHeaders()
      });
      // Auth sil (Edge Function ile)
      var delRes = await fetch(SUPA_URL + '/functions/v1/clever-handler', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ user_id: userId })
      });
      if (!delRes.ok) { var err = await delRes.json(); throw new Error(err.error || 'Auth silme hatası'); }
      toast('Hesap kalıcı olarak silindi ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

async function silmeyiIptal(userId, email) {
  openConfirm('Silme Talebini İptal Et', email + ' için silme talebi iptal edilecek.', async function() {
    try {
      await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'PATCH',
        headers: Object.assign(authHeaders(), { Prefer: 'return=minimal' }),
        body: JSON.stringify({ deletion_requested_at: null, status: 'active' })
      });
      toast('Silme talebi iptal edildi ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

async function loadMembers() {
  try {
    var r = await fetch(SUPA_URL + '/rest/v1/profiles?select=id,role,email,display_name,created_at,deletion_requested_at,status&order=created_at.desc', {
      headers: authHeaders()
    });
    if (!r.ok) throw new Error(await r.text());
    allMembers = await r.json();
    document.getElementById('totalCount').textContent = allMembers.length;
    document.getElementById('editorCount').textContent = allMembers.filter(function(m){ return m.role === 'editor'; }).length;
    renderMembers(allMembers);
    renderDeletionRequests(allMembers);
  } catch(e) { toast('Yüklenemedi: ' + e.message, 'er'); }
}

async function changeRole(userId, newRole, email) {
  openConfirm('Rol Değiştir', email + ' rolü ' + (newRole === 'editor' ? 'Editör' : 'Üye') + ' olacak.', async function() {
    try {
      var r = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'PATCH',
        headers: Object.assign(authHeaders(), { Prefer: 'return=representation' }),
        body: JSON.stringify({ role: newRole })
      });
      if (!r.ok) throw new Error(await r.text());
      toast('Rol güncellendi ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

async function removeMember(userId, email) {
  openConfirm('Üyeyi Kaldır', email + ' sistemden tamamen kaldırılacak. Bu işlem geri alınamaz.', async function() {
    try {
      // 1. profiles tablosundan sil
      var r1 = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'DELETE',
        headers: authHeaders()
      });
      if (!r1.ok) throw new Error(await r1.text());
      // 2. auth.users tablosundan sil (admin endpoint)
      var r2 = await fetch(SUPA_URL + '/auth/v1/admin/users/' + userId, {
        method: 'DELETE',
        headers: authHeaders()
      });
      if (!r2.ok) {
        var errBody = await r2.text();
        console.warn('auth.users silinemedi:', errBody);
      }
      toast('Üye kaldırıldı ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

(async function() {
  var ok = await requireAuth();
  if (!ok) return;
  if (!isAdmin()) {
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);text-align:center;padding:24px;"><div><div style="font-size:48px">🔒</div><h2>Bu sayfa yalnızca yöneticiye açık</h2><a href="index.html" style="color:var(--accent2);">Ana Sayfa</a></div></div>';
    return;
  }
  var u = getUser();
  if (u) {
    var name = u.user_metadata && u.user_metadata.full_name ? u.user_metadata.full_name : (u.email ? u.email.split('@')[0] : '—');
    var ini = name.charAt(0).toUpperCase();
    ['sbUserName','tnUserName'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=name; });
    ['sbAvatar','tnAvatar'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=ini; });
    var roleEl = document.getElementById('sbUserRole');
    if (roleEl) roleEl.textContent = isAdmin() ? 'Admin' : isEditor() ? 'Editör' : 'Üye';
    setTimeout(function(){ if(isAdmin()||isEditor()) document.querySelectorAll('.admin-only').forEach(function(el){ el.classList.remove('admin-only'); }); }, 300);
  }
  await loadMembers();
})();
</script>
<script>
window.toggleSbDropdown = function() {
  const dd = document.getElementById('sbUserDropdown');
  if (dd) dd.classList.toggle('open');
};
document.addEventListener('click', function(e) {
  const btn = document.getElementById('sbUserBtn');
  const dd = document.getElementById('sbUserDropdown');
  if (dd && btn && !btn.contains(e.target)) dd.classList.remove('open');
});
</script>

</body>
</html>
