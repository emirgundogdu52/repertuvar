.stat-chip span{color:var(--text);font-weight:600;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text2);z-index:999;animation:toastIn .2s ease;}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.er{border-color:var(--red);color:var(--red);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#confirmModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center;padding:16px;}

@media(max-width:600px){.member-card{gap:8px;}.member-actions{width:100%;justify-content:flex-end;}}

<script>
var allMembers = [];

document.addEventListener('click', function(e) {
  console.log('click on:', e.target.tagName, e.target.className);
  var btn = e.target.closest('button[data-uid]');
  console.log('btn found:', btn);
  if (!btn) return;
  var uid = btn.dataset.uid;
  var email = btn.dataset.email;
  var role = btn.dataset.role;
  if (btn.classList.contains('danger')) {
    removeMember(uid, email);
  } else if (btn.classList.contains('promote')) {
    var newRole = role === 'editor' ? 'member' : 'editor';
    changeRole(uid, newRole, email);
  }
});

var confirmCallback = null;

function toast(m, t) {
  t = t || 'ok';
  var e = document.createElement('div');
  e.className = 'toast ' + t;
  e.textContent = m;
  document.body.appendChild(e);
  setTimeout(function(){ e.remove(); }, 2500);
}

function openConfirm(title, text, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  confirmCallback = cb;
  document.getElementById('confirmModal').style.display = 'flex';
}

function closeConfirm() {
  document.getElementById('confirmModal').style.display = 'none';
  confirmCallback = null;
}

function confirmAction() {
  var cb = confirmCallback;
  closeConfirm();
  if (cb) cb();
}

function initials(email) {
  return (email || '?').charAt(0).toUpperCase();
}

function roleBadge(role) {
  var labels = { admin: 'Admin', editor: 'Editör', member: 'Üye' };
  return '<span class="role-badge ' + role + '">' + (labels[role] || role) + '</span>';
}

function renderMembers(list) {
  var el = document.getElementById('memberList');
  if (!list.length) { el.innerHTML = '<div style="text-align:center;color:var(--text3);padding:48px;">Üye bulunamadı</div>'; return; }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    var uid = m.id || '';
    var email = m.email || '—';
    var date = m.created_at ? new Date(m.created_at).toLocaleDateString('tr-TR') : '';
    var roleBtn = m.role !== 'admin' ? '<button class="btn-sm promote" data-uid="' + uid + '" data-role="' + m.role + '" data-email="' + email + '">' + (m.role === 'editor' ? '↓ Üye Yap' : '↑ Editör Yap') + '</button>' : '';
    var delBtn = m.role !== 'admin' ? '<button class="btn-sm danger" data-uid="' + uid + '" data-email="' + email + '">Kaldır</button>' : '';
    html += '<div class="member-card">' +
      '<div class="member-avatar">' + initials(email) + '</div>' +
      '<div class="member-info"><div class="member-email">' + email + '</div>' +
      '<div class="member-meta">' + uid.slice(0,8) + ' · ' + date + '</div></div>' +
      roleBadge(m.role) +
      '<div class="member-actions">' + roleBtn + delBtn + '</div></div>';
  }
  el.innerHTML = html;
}

function handleRoleChange(btn) {
  changeRole(btn.dataset.uid, btn.dataset.role === 'editor' ? 'member' : 'editor', btn.dataset.email);
}

function handleRemove(btn) {
  removeMember(btn.dataset.uid, btn.dataset.email);
}

function filterMembers() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  var filtered = q ? allMembers.filter(function(m){ return (m.email||'').toLowerCase().indexOf(q) > -1 || (m.role||'').indexOf(q) > -1; }) : allMembers;
  renderMembers(filtered);
}

async function loadMembers() {
  try {
    var token = localStorage.getItem('sb_token') || SUPA_KEY;
    var r = await fetch(SUPA_URL + '/rest/v1/profiles?select=id,role,email,display_name,created_at&order=role', {
      headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + token }
    });
    if (!r.ok) throw new Error(await r.text());
    allMembers = await r.json();
    document.getElementById('totalCount').textContent = allMembers.length;
    document.getElementById('editorCount').textContent = allMembers.filter(function(m){ return m.role === 'editor'; }).length;
    renderMembers(allMembers);
  } catch(e) { toast('Yüklenemedi: ' + e.message, 'er'); }
}

async function changeRole(userId, newRole, email) {
  openConfirm('Rol Değiştir', email + ' rolü ' + (newRole === 'editor' ? 'Editör' : 'Üye') + ' olacak.', async function() {
    try {
      var token = localStorage.getItem('sb_token') || SUPA_KEY;
      var r = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'PATCH',
        headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: JSON.stringify({ role: newRole })
      });
      if (!r.ok) throw new Error(await r.text());
      toast('Rol güncellendi ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

async function removeMember(userId, email) {
  openConfirm('Üyeyi Kaldır', email + ' sistemden tamamen kaldırılacak. Bu işlem geri alınamaz.', async function() {
    try {
      var token = localStorage.getItem('sb_token') || SUPA_KEY;
      // 1. profiles tablosundan sil
      var r1 = await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + userId, {
        method: 'DELETE',
        headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + token }
      });
      if (!r1.ok) throw new Error(await r1.text());
      // 2. auth.users tablosundan sil (admin endpoint)
      var r2 = await fetch(SUPA_URL + '/auth/v1/admin/users/' + userId, {
        method: 'DELETE',
        headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + token }
      });
      if (!r2.ok) {
        var errBody = await r2.text();
        console.warn('auth.users silinemedi:', errBody);
      }
      toast('Üye kaldırıldı ✓');
      await loadMembers();
    } catch(e) { toast('Hata: ' + e.message, 'er'); }
  });
}

(async function() {
  var ok = await requireAuth();
  if (!ok) return;
  if (!isAdmin()) {
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);text-align:center;padding:24px;"><div><div style="font-size:48px">🔒</div><h2>Bu sayfa yalnızca yöneticiye açık</h2><a href="index.html" style="color:var(--accent2);">Ana Sayfa</a></div></div>';
    return;
  }
  var u = getUser();
  if (u) {
    var name = u.user_metadata && u.user_metadata.full_name ? u.user_metadata.full_name : (u.email ? u.email.split('@')[0] : '—');
    var ini = name.charAt(0).toUpperCase();
    ['sbUserName','tnUserName'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=name; });
    ['sbAvatar','tnAvatar'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=ini; });
    var roleEl = document.getElementById('sbUserRole');
    if (roleEl) roleEl.textContent = isAdmin() ? 'Admin' : isEditor() ? 'Editör' : 'Üye';
    setTimeout(function(){ if(isAdmin()||isEditor()) document.querySelectorAll('.admin-only').forEach(function(el){ el.classList.remove('admin-only'); }); }, 300);
  }
  await loadMembers();
})();
</script>
