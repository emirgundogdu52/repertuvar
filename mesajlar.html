<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuvar — Mesajlar</title>
<link rel="icon" type="image/png" href="Repertuvar_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#07071a;--bg2:#0f0f2e;--surface:#12123a;--surface2:#1a1a4a;--border:rgba(140,120,255,0.38);--border2:rgba(140,120,255,0.58);--accent:#7c6fff;--accent2:#a78bfa;--accent3:#c4b5fd;--text:#e2e0ff;--text2:#9d9bc4;--text3:#5e5c8a;--green:#4ade80;--red:#f87171;--sidebar-w:220px;--bottom-h:68px;--font:'Plus Jakarta Sans',sans-serif;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Sidebar ── */
@media(min-width:1024px){
  body{display:flex;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--bg);backdrop-filter:blur(24px);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:300;padding-bottom:20px;}
  .sb-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .sb-brand img{width:100%;max-width:188px;display:block;}
  .sb-nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:2px;}
  .sb-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px 4px;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;transition:all .15s;}
  .sb-item:hover{background:var(--surface);color:var(--text);}
  .sb-item.active{background:rgba(124,111,255,0.12);color:var(--accent3);border:1px solid rgba(124,111,255,0.2);}
  /* v2-sb alias */
  .v2-sb-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px 4px;}
  .v2-sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;transition:all .15s;}
  .v2-sb-item:hover{background:var(--surface);color:var(--text);}
  .v2-sb-item.active{background:rgba(124,111,255,0.12);color:var(--accent3);border:1px solid rgba(124,111,255,0.2);}
  .v2-sb-divider{height:1px;background:var(--border);margin:8px 10px;}
  .sb-divider{height:1px;background:var(--border);margin:8px 10px;}
  .sb-user{margin:10px 10px 0;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:10px;}
  .sb-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
  .sb-uname{font-size:12px;font-weight:600;color:var(--text);}
  .sb-urole{font-size:10px;color:var(--text3);}
  .sb-logout{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:4px;}
  .main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;}
  .desktop-topbar{display:flex;align-items:center;padding:14px 32px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;}
  .dt-crumb{font-size:13px;color:var(--text2);}
  .dt-crumb span{color:var(--text);font-weight:600;}
  .v2-topnav,.v2-bottom-nav{display:none!important;}
}
@media(max-width:1023px){
  .sidebar{display:none;}
  .desktop-topbar{display:none;}
  body{padding-bottom:var(--bottom-h);}
  .main-wrap{display:contents;}
  .v2-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--bottom-h);background:var(--bg);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:center;}
  .v2-bn-items{display:flex;width:100%;padding:0 4px;}
  .v2-bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;text-decoration:none;color:var(--text3);border-radius:10px;transition:all .15s;}
  .v2-bn-item.active{color:var(--accent);}
  .v2-bn-icon{font-size:19px;line-height:1;}
  .v2-bn-label{font-size:9px;font-weight:600;}
}

/* ── Page ── */
.page{padding:24px;max-width:800px;margin:0 auto;}

/* ── Tabs ── */
.tabs{display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:0;}
.tab-btn{padding:10px 20px;border:none;background:none;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── Message card ── */
.msg-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.msg-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.msg-from{font-size:13px;font-weight:600;color:var(--accent2);}
.msg-date{font-size:11px;color:var(--text3);}
.msg-content{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:10px;}
.msg-reply{background:var(--bg2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:6px;font-size:12px;color:var(--text2);margin-top:8px;}
.msg-reply-label{font-size:10px;font-weight:700;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* ── Compose ── */
.compose-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;}
.compose-box h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text);}
.compose-box textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;resize:vertical;min-height:100px;transition:border-color .15s;}
.compose-box textarea:focus{border-color:var(--accent);}
.compose-box input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;margin-bottom:10px;transition:border-color .15s;}
.compose-box input:focus{border-color:var(--accent);}
.btn-send{padding:10px 24px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:10px;transition:opacity .15s;}
.btn-send:hover{opacity:.85;}
.btn-send:disabled{opacity:.5;cursor:not-allowed;}

/* ── Reply ── */
.btn-reply{padding:6px 14px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;}
.btn-reply:hover{border-color:var(--accent);color:var(--accent);}
.reply-form{margin-top:12px;display:none;}
.reply-form textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:12px;font-family:var(--font);outline:none;resize:vertical;min-height:70px;}
.reply-form textarea:focus{border-color:var(--accent);}

/* ── Announcement ── */
.ann-card{background:rgba(124,111,255,0.08);border:1px solid rgba(124,111,255,0.25);border-radius:12px;padding:16px;margin-bottom:12px;}
.ann-title{font-size:14px;font-weight:700;color:var(--accent3);margin-bottom:6px;}
.ann-content{font-size:13px;color:var(--text);line-height:1.6;}
.ann-date{font-size:11px;color:var(--text3);margin-top:8px;}

/* ── Empty ── */
.empty{text-align:center;padding:48px 16px;color:var(--text3);font-size:13px;}

/* ── Toast ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--text);z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.ok{border-color:rgba(74,222,128,.4);color:var(--green);}
.toast.er{border-color:rgba(248,113,113,.4);color:var(--red);}

.admin-only{display:none;}
/* ── Conversation list (admin) ── */
.conv-list { display:flex; flex-direction:column; gap:8px; }
.conv-item { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:all .15s; }
.conv-item:hover { border-color:var(--accent); }
.conv-item.unread { border-color:rgba(124,111,255,0.5); }
.conv-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; flex-shrink:0; }
.conv-info { flex:1; min-width:0; }
.conv-email { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-preview { font-size:12px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.conv-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.conv-date { font-size:11px; color:var(--text3); }
.conv-badge { background:var(--accent); color:#fff; font-size:10px; font-weight:700; border-radius:10px; padding:2px 7px; }

/* ── Thread view ── */
.thread-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.btn-back { padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:none; color:var(--text2); font-size:12px; cursor:pointer; font-family:var(--font); transition:all .15s; }
.btn-back:hover { border-color:var(--accent); color:var(--accent); }
.thread-email { font-size:14px; font-weight:600; color:var(--text); }
.thread-msg { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.thread-msg.mine { background:rgba(124,111,255,0.08); border-color:rgba(124,111,255,0.25); }
.thread-msg-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.thread-msg-from { font-size:12px; font-weight:600; color:var(--accent2); }
.thread-msg-date { font-size:11px; color:var(--text3); }
.thread-msg-content { font-size:13px; color:var(--text); line-height:1.6; }
.thread-reply-box { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-top:8px; font-size:12px; color:var(--text2); border-left:3px solid var(--accent); }
.thread-reply-label { font-size:10px; font-weight:700; color:var(--accent); margin-bottom:3px; text-transform:uppercase; }
.thread-actions { display:flex; gap:6px; margin-top:8px; }
.btn-delete-msg { padding:5px 12px; border-radius:7px; border:1px solid rgba(248,113,113,.3); background:rgba(248,113,113,.08); color:var(--red); font-size:11px; cursor:pointer; font-family:var(--font); transition:all .15s; }
.btn-delete-msg:hover { background:rgba(248,113,113,.18); }
/* ── Yeni Mesaj Modal ── */
.nm-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:2000; align-items:center; justify-content:center; padding:20px; }
.nm-modal.open { display:flex; }
.nm-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:min(480px,96vw); padding:24px; }
.nm-title { font-size:15px; font-weight:700; margin-bottom:16px; color:var(--text); }
.nm-field { margin-bottom:12px; }
.nm-field label { display:block; font-size:11px; font-weight:700; color:var(--text3); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em; }
.nm-select { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-size:13px; font-family:var(--font); outline:none; }
.nm-select:focus { border-color:var(--accent); }
.nm-textarea { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-size:13px; font-family:var(--font); outline:none; resize:vertical; min-height:100px; }
.nm-textarea:focus { border-color:var(--accent); }
.nm-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.btn-nm-send { padding:8px 20px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--font); }
.btn-nm-cancel { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:none; color:var(--text2); font-size:13px; cursor:pointer; font-family:var(--font); }
.nm-member-item { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:7px; cursor:pointer; transition:background .12s; }
.nm-member-item:hover { background:rgba(124,111,255,0.1); }
.nm-member-item input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; flex-shrink:0; cursor:pointer; }
.nm-member-item label { font-size:13px; color:var(--text); cursor:pointer; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.btn-new-msg { display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; font-family:var(--font); margin-left:auto; transition:all .15s; }
.btn-new-msg:hover { border-color:var(--accent); background:rgba(124,111,255,0.08); }


  .sb-user-x { position:relative; }
  .sb-user-dropdown { display:none; position:fixed; bottom:90px; left:10px; right:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:4px; z-index:9999; box-shadow:0 -4px 20px rgba(0,0,0,.5); }
  .sb-user-dropdown.open { display:block; }
  .sb-dd-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:7px;
    font-size:12px; font-weight:600; color:var(--text2); text-decoration:none; cursor:pointer;
    transition:all .15s; background:none; border:none; width:100%; font-family:inherit; }
  .sb-dd-item:hover { background:rgba(124,111,255,0.12); color:var(--text); }
  .sb-dd-item.danger { color:var(--red); }
  .sb-dd-item.danger:hover { background:rgba(248,113,113,0.1); }
</style>
</head>

<div class="main-wrap">

</div>

  <!-- Üye: Mesaj gönder -->

</div><!-- /page -->

<!-- Yeni Mesaj Modal -->
<div class="nm-modal" id="newMsgModal">
  <div class="nm-card">
    <div class="nm-title">✉️ Üyeye Mesaj Gönder</div>
    <div class="nm-field">
      <label>Üye Seç <span id="nmSelectedCount" style="color:var(--accent);font-weight:700;"></span></label>

        <input type="text" id="nmSearch" class="nm-textarea" style="min-height:unset;padding:8px 12px;font-size:12px;" placeholder="Ara...">
        <button onclick="toggleSelectAll()" id="nmSelectAllBtn" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;">Tümü</button>
      </div>
      <div id="nmMemberList" style="max-height:200px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:4px;">
        <div style="padding:12px;color:var(--text3);font-size:12px;text-align:center;">Yükleniyor...</div>
      </div>
    </div>
    <div class="nm-field">
      <label>Mesaj</label>
      <textarea class="nm-textarea" id="nmText" placeholder="Mesajınızı yazın..."></textarea>
    </div>
    <div class="nm-actions">
      <button class="btn-nm-cancel" onclick="closeNewMsgModal()">İptal</button>
      <button class="btn-nm-send" onclick="sendNewMessage()" id="nmSendBtn">Gönder</button>
    </div>
  </div>

    <a href="index.html" class="v2-bn-item"><i class="ti ti-home" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Ana Sayfa</span></a>
    <a href="eserler.html" class="v2-bn-item"><i class="ti ti-playlist" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Eserler</span></a>
    <a href="repertoires.html" class="v2-bn-item"><i class="ti ti-book" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Repertuvarlar</span></a>
    <a href="stage.html" class="v2-bn-item"><i class="ti ti-music" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Sahne Modu</span></a>
    <a href="mesajlar.html" class="v2-bn-item active"><i class="ti ti-message" style="font-size:19px;line-height:1;"></i><span class="v2-bn-label">Mesajlar</span></a>
  </div>
</nav>

<script>
function H() {
  return {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY),
    'Content-Type': 'application/json'
  };
}

function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr);
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Az önce';
  if (m < 60) return m + ' dk önce';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' sa önce';
  return Math.floor(h / 24) + ' gün önce';
}

function switchTab(tab) {
  document.getElementById('tabMessages').classList.toggle('active', tab === 'messages');
  document.getElementById('tabAnnouncements').classList.toggle('active', tab === 'announcements');
  document.getElementById('messagesPanel').style.display = tab === 'messages' ? '' : 'none';
  document.getElementById('announcementsPanel').style.display = tab === 'announcements' ? '' : 'none';
}

// ── Mesaj gönder (üye) ──
async function sendMessage() {
  const content = document.getElementById('composeText').value.trim();
  if (!content) { toast('Mesaj boş olamaz', 'er'); return; }
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Gönderiliyor...';
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/messages', {
      method: 'POST',
      headers: { ...H(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        from_id: getUserId(),
        from_email: getUser()?.email || '',
        content
      })
    });
    if (!r.ok) throw new Error(await r.text());
    document.getElementById('composeText').value = '';
    toast('Mesajınız gönderildi ✓');
    loadMessages();
  } catch(e) { toast('Hata: ' + e.message, 'er'); }
  btn.disabled = false; btn.textContent = 'Gönder';
}

// ── Mesajları yükle ──
async function markRead(ids) {
  if (!ids || !ids.length) return;
  // Her mesajı read_at ile güncelle
  await Promise.all(ids.map(id =>
    fetch(SUPA_URL + '/rest/v1/messages?id=eq.' + id, {
      method: 'PATCH',
      headers: { ...H(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ read_at: new Date().toISOString() })
    })
  ));
  if (window._loadUnreadBadge) window._loadUnreadBadge();
}

async function loadMessages() {
  const panel = document.getElementById('messagesPanel');
  try {
    let url = SUPA_URL + '/rest/v1/messages?order=created_at.desc';
    if (!isAdmin()) url += '&from_id=eq.' + getUserId();
    const r = await fetch(url, { headers: H() });
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) {
      panel.innerHTML = '<div class="empty">Henüz mesaj yok.<br>Admin\'e mesaj göndererek başlayabilirsiniz.</div>';
      return;
    }
    const ADMIN_ID = '4f965624-e524-4cb0-a351-3368f1297d28';
    if (isAdmin()) {
      const groups = {};
      data.forEach(m => {
        const key = m.from_id || m.from_email;
        if (!groups[key]) groups[key] = { email: m.from_email || 'Bilinmiyor', messages: [], unread: 0 };
        groups[key].messages.push(m);
        if (!m.read_at) groups[key].unread++;
      });
      panel.innerHTML = '<div class="conv-list">' +
        Object.entries(groups).map(([key, g]) => {
          const last = g.messages[0];
          const ini = (g.email || '?')[0].toUpperCase();
          return `<div class="conv-item ${g.unread ? 'unread' : ''}" onclick="openThread('${key}', '${g.email.replace(/'/g,"\\'")}')">
            <div class="conv-avatar">${ini}</div>
            <div class="conv-info">
              <div class="conv-email">${g.email}</div>
              <div class="conv-preview">${last.content.substring(0,60)}${last.content.length>60?'...':''}</div>
            </div>
            <div class="conv-meta">
              <div class="conv-date">${timeAgo(last.created_at)}</div>
              ${g.unread ? `<div class="conv-badge">${g.unread}</div>` : ''}
            </div>
          </div>`;
        }).join('') + '</div>';
    } else {
      const unread = data.filter(m => !m.read_at && m.admin_reply).map(m => m.id);
      if (unread.length) setTimeout(() => markRead(unread), 1000);
      panel.innerHTML = data.map(m => `
        <div class="thread-msg" id="msg-${m.id}">
          <div class="thread-msg-header">
            <span class="thread-msg-from">Siz</span>
            <span class="thread-msg-date">${timeAgo(m.created_at)}</span>
          </div>
          <div class="thread-msg-content">${m.content}</div>
          ${m.admin_reply ? `<div class="thread-reply-box"><div class="thread-reply-label">Admin Yanıtı · ${timeAgo(m.replied_at)}</div>${m.admin_reply}</div>` : ''}
          <div class="thread-actions">
            <button class="btn-delete-msg" onclick="deleteMessage('${m.id}')"><i class="ti ti-trash" style="font-size:11px;"></i> Sil</button>
          </div>
        </div>`).join('');
    }
  } catch(e) {
    panel.innerHTML = '<div class="empty">Mesajlar yüklenemedi.</div>';
  }
}

function openThread(fromId, email) {
  const panel = document.getElementById('messagesPanel');
  fetch(SUPA_URL + '/rest/v1/messages?from_id=eq.' + fromId + '&order=created_at.asc', { headers: H() })
    .then(r => r.json())
    .then(data => {
      const unread = data.filter(m => !m.read_at).map(m => m.id);
      if (unread.length) markRead(unread);
      panel.innerHTML = `<div class="thread-header">
          <button class="btn-back" onclick="loadMessages()"><i class="ti ti-arrow-left"></i> Geri</button>
          <div class="thread-email">${email}</div>
        </div>` +
        data.map(m => `
          <div class="thread-msg" id="msg-${m.id}">
            <div class="thread-msg-header">
              <span class="thread-msg-from">${email.split('@')[0]}</span>
              <span class="thread-msg-date">${timeAgo(m.created_at)}</span>
            </div>
            <div class="thread-msg-content">${m.content}</div>
            ${m.admin_reply ? `<div class="thread-reply-box"><div class="thread-reply-label">Admin Yanıtı · ${timeAgo(m.replied_at)}</div>${m.admin_reply}</div>` : ''}
            <div class="thread-actions">
              ${!m.admin_reply ? `<button class="btn-reply" onclick="toggleReplyThread('${m.id}')"><i class="ti ti-reply"></i> Yanıtla</button>` : ''}
              <button class="btn-delete-msg" onclick="deleteMessage('${m.id}')"><i class="ti ti-trash" style="font-size:11px;"></i> Sil</button>
            </div>
            <div class="reply-form" id="reply-${m.id}" style="display:none;">
              <textarea placeholder="Yanıtınızı yazın..." id="replyText-${m.id}" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;resize:vertical;min-height:70px;margin-top:8px;"></textarea>
              <button class="btn-send" style="margin-top:8px;padding:7px 16px;font-size:12px;" onclick="sendReply('${m.id}','${fromId}','${email.replace(/'/g,"\\'")}')">Gönder</button>
            </div>
          </div>`).join('');
    });
}

function toggleReplyThread(id) {
  const form = document.getElementById('reply-' + id);
  if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function deleteMessage(id) {
  if (!confirm('Bu mesajı silmek istiyor musunuz?')) return;
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/messages?id=eq.' + id, {
      method: 'DELETE', headers: H()
    });
    if (r.ok || r.status === 204) {
      const el = document.getElementById('msg-' + id);
      if (el) el.remove();
      if (window._loadUnreadBadge) window._loadUnreadBadge();
      toast('Mesaj silindi ✓');
    } else {
      toast('Hata: ' + await r.text(), 'er');
    }
  } catch(e) { toast('Hata: ' + e.message, 'er'); }
}


let nmAllMembers = [];

async function openNewMsgModal() {
  document.getElementById('newMsgModal').classList.add('open');
  document.getElementById('nmText').value = '';
  document.getElementById('nmSearch').value = '';
  updateNmCount();
  const list = document.getElementById('nmMemberList');
  if (nmAllMembers.length) { renderNmList(nmAllMembers); return; }
  list.innerHTML = '<div style="padding:12px;color:var(--text3);font-size:12px;text-align:center;">Yükleniyor...</div>';
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/profiles?select=id,email,display_name&order=email', { headers: H() });
    nmAllMembers = await r.json();
    renderNmList(nmAllMembers);
  } catch(e) {
    list.innerHTML = '<div style="padding:12px;color:var(--red);font-size:12px;">Yüklenemedi</div>';
  }
}

function renderNmList(members) {
  const q = (document.getElementById('nmSearch').value || '').toLowerCase();
  const filtered = q ? members.filter(p => (p.email || p.display_name || '').toLowerCase().includes(q)) : members;
  const list = document.getElementById('nmMemberList');
  if (!filtered.length) { list.innerHTML = '<div style="padding:12px;color:var(--text3);font-size:12px;text-align:center;">Sonuç yok</div>'; return; }
  list.innerHTML = filtered.map(p => {
    const label = p.email || p.display_name || p.id;
    return `<div class="nm-member-item" onclick="toggleNmCheck('${p.id}')">
      <input type="checkbox" id="nmchk-${p.id}" value="${p.id}" data-email="${label}" onclick="event.stopPropagation();updateNmCount()">
      <label for="nmchk-${p.id}">${label}</label>
    </div>`;
  }).join('');
}

document.addEventListener('input', function(e) {
  if (e.target.id === 'nmSearch') renderNmList(nmAllMembers);
});

function toggleNmCheck(id) {
  const chk = document.getElementById('nmchk-' + id);
  if (chk) { chk.checked = !chk.checked; updateNmCount(); }
}

function updateNmCount() {
  const checked = document.querySelectorAll('#nmMemberList input[type=checkbox]:checked');
  const el = document.getElementById('nmSelectedCount');
  if (el) el.textContent = checked.length ? '(' + checked.length + ' seçili)' : '';
}

function toggleSelectAll() {
  const boxes = document.querySelectorAll('#nmMemberList input[type=checkbox]');
  const allChecked = Array.from(boxes).every(b => b.checked);
  boxes.forEach(b => b.checked = !allChecked);
  updateNmCount();
}

function closeNewMsgModal() {
  document.getElementById('newMsgModal').classList.remove('open');
}

async function sendNewMessage() {
  const checked = Array.from(document.querySelectorAll('#nmMemberList input[type=checkbox]:checked'));
  const text = document.getElementById('nmText').value.trim();
  if (!checked.length) { toast('En az bir üye seçin', 'er'); return; }
  if (!text) { toast('Mesaj boş olamaz', 'er'); return; }
  const btn = document.getElementById('nmSendBtn');
  btn.disabled = true; btn.textContent = 'Gönderiliyor...';
  try {
    await Promise.all(checked.map(chk =>
      fetch(SUPA_URL + '/rest/v1/messages', {
        method: 'POST',
        headers: { ...H(), 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          from_id: chk.value,
          from_email: chk.dataset.email || '',
          content: '(Admin tarafından başlatılan konuşma)',
          admin_reply: text,
          replied_at: new Date().toISOString(),
          read_at: new Date().toISOString()
        })
      })
    ));
    toast(checked.length + ' üyeye mesaj gönderildi ✓');
    closeNewMsgModal();
    loadMessages();
  } catch(e) { toast('Hata: ' + e.message, 'er'); }
  btn.disabled = false; btn.textContent = 'Gönder';
}

function toggleReply(id) {
  const form = document.getElementById('reply-' + id);
  if (form) form.style.display = form.style.display === 'none' || !form.style.display ? 'block' : 'none';
}

async function sendReply(msgId, fromId, email) {
  const text = document.getElementById('replyText-' + msgId).value.trim();
  if (!text) return;
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/messages?id=eq.' + msgId, {
      method: 'PATCH',
      headers: { ...H(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ admin_reply: text, replied_at: new Date().toISOString() })
    });
    if (!r.ok) throw new Error(await r.text());
    toast('Yanıt gönderildi ✓');
    if (fromId) openThread(fromId, email);
    else loadMessages();
  } catch(e) { toast('Hata: ' + e.message, 'er'); }
}

// ── Duyuru gönder (admin) ──
async function sendAnnouncement() {
  const title = document.getElementById('annTitle').value.trim();
  const content = document.getElementById('annContent').value.trim();
  if (!title || !content) { toast('Başlık ve içerik gerekli', 'er'); return; }
  const btn = document.getElementById('annBtn');
  btn.disabled = true; btn.textContent = 'Yayınlanıyor...';
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/announcements', {
      method: 'POST',
      headers: { ...H(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ admin_id: getUserId(), title, content })
    });
    if (!r.ok) throw new Error(await r.text());
    document.getElementById('annTitle').value = '';
    document.getElementById('annContent').value = '';
    toast('Duyuru yayınlandı ✓');
    loadAnnouncements();
  } catch(e) { toast('Hata: ' + e.message, 'er'); }
  btn.disabled = false; btn.textContent = 'Duyuruyu Yayınla';
}

// ── Duyuruları yükle ──
async function loadAnnouncements() {
  const panel = document.getElementById('announcementsPanel');
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/announcements?order=created_at.desc', { headers: H() });
    const data = await r.json();
    if (!data.length) {
      panel.innerHTML = '<div class="empty">Henüz duyuru yok.</div>';
      return;
    }
    panel.innerHTML = data.map(a => `
      <div class="ann-card">
        <div class="ann-title">📢 ${a.title}</div>
        <div class="ann-content">${a.content}</div>
        <div class="ann-date">${timeAgo(a.created_at)}</div>
      </div>`).join('');
  } catch(e) {
    panel.innerHTML = '<div class="empty">Duyurular yüklenemedi.</div>';
  }
}

// ── Init ──
(async function() {
  const ok = await requireAuth(); if (!ok) return;
  const u = getUser();
  const name = u?.user_metadata?.full_name || u?.email?.split('@')[0] || '—';
  const ini = name.charAt(0).toUpperCase();
  const av = document.getElementById('sbAvatar'); if(av) av.textContent = ini;
  const un = document.getElementById('sbUserName'); if(un) un.textContent = name;

  if (isAdmin()) {
    document.querySelectorAll('.admin-only').forEach(el => { el.classList.remove('admin-only'); el.style.display = ''; });
    document.getElementById('announceSection').style.display = 'block';
    document.getElementById('newMsgBtnWrap').style.display = 'block';
    document.getElementById('sbUserRole').textContent = 'Admin';
  } else {
    document.getElementById('composeSection').style.display = 'block';
    document.getElementById('sbUserRole').textContent = getUserRole() === 'editor' ? 'Editör' : 'Üye';
  }

  loadMessages();
  loadAnnouncements();
})();
</script>

<script>
window.toggleSbDropdown = function() {
  const dd = document.getElementById('sbUserDropdown');
  if (dd) dd.classList.toggle('open');
};
document.addEventListener('click', function(e) {
  const btn = document.getElementById('sbUserBtn');
  const dd = document.getElementById('sbUserDropdown');
  if (dd && btn && !btn.contains(e.target)) dd.classList.remove('open');
});
</script>
</body>
