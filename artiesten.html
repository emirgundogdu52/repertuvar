<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solistler</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#0D1117;--surface:#161B22;--surface2:#21262D;--surface3:#2a2a3e;
    --border:#30363D;--border2:#38383f;
    --accent:#58A6FF;--accent2:#BC8CFF;
    --text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;
    --red:#c05444;--green:#4a9462;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
  nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:80px;display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:200;}
  .nav-btn{padding:5px 14px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;background:none;transition:all .15s;text-decoration:none;display:inline-block;}
  .nav-btn:hover{background:var(--surface2);color:var(--text);}
  .nav-btn.active{background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.3);color:var(--accent);}
  .sync-status{margin-left:auto;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;}
  .sync-dot.ok{background:var(--green);}
  .sync-dot.err{background:var(--red);}
  .sync-dot.loading{background:var(--accent);animation:pulse .8s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .layout{display:flex;height:calc(100vh - 60px);}
  .artist-list-panel{width:280px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-header h2{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;}
  .btn-new{background:var(--accent);border:none;border-radius:6px;padding:5px 12px;color:#0a0818;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;}
  .list-scroll{overflow-y:auto;flex:1;}
  .artist-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:12px;}
  .artist-item:hover{background:var(--surface2);}
  .artist-item.active{background:var(--surface2);border-left:3px solid var(--accent);padding-left:13px;}
  .artist-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--accent);flex-shrink:0;font-family:'Playfair Display',serif;}
  .artist-info{min-width:0;}
  .artist-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .artist-sub{font-size:11px;color:var(--text3);margin-top:2px;}
  .detail-panel{flex:1;overflow-y:auto;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:12px;}
  .detail-inner{max-width:680px;padding:32px;}
  .detail-top{display:flex;align-items:flex-start;gap:20px;margin-bottom:28px;}
  .detail-avatar{width:72px;height:72px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:var(--accent);flex-shrink:0;font-family:'Playfair Display',serif;}
  .detail-name{font-family:'Playfair Display',serif;font-size:26px;color:var(--text);margin-bottom:4px;}
  .detail-actions{display:flex;gap:6px;}
  .btn-icon{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
  .btn-icon:hover{border-color:var(--border2);color:var(--text);}
  .btn-danger{border-color:rgba(192,84,68,.3);color:var(--red);}
  .btn-danger:hover{background:rgba(192,84,68,.1);border-color:var(--red);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .info-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
  .info-card.full{grid-column:1/-1;}
  .info-card-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
  .info-card-value{font-size:14px;color:var(--text);}
  .info-card-value a{color:var(--accent);text-decoration:none;}
  .notes-box{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:12px 14px;font-size:13px;color:var(--text2);line-height:1.7;white-space:pre-wrap;}
  .section-title{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}
  .works-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .work-chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;}
  .work-chip span{color:var(--text3);font-size:10px;}
  .btn-add-work-chip{background:none;border:1px dashed var(--border2);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
  .btn-add-work-chip:hover{border-color:var(--accent);color:var(--accent);}
  .work-chip-remove{color:var(--text3);cursor:pointer;font-size:11px;margin-left:2px;}
  .work-chip-remove:hover{color:var(--red);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:460px;max-width:92vw;max-height:85vh;overflow-y:auto;}
  .modal h2{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:18px;color:var(--text);}
  .form-row{margin-bottom:14px;}
  .form-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:block;}
  .form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
  .form-input:focus{border-color:var(--accent);}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
  .btn-cancel{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 18px;color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;}
  .btn-save{background:var(--accent);border:none;border-radius:7px;padding:8px 18px;color:#0a0818;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;}
  .work-picker-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:7px;margin-top:8px;}
  .work-pick-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
  .work-pick-item:last-child{border-bottom:none;}
  .work-pick-item:hover{background:var(--surface2);}
  .work-pick-item.selected{background:rgba(88,166,255,.12);}
  .work-pick-name{font-size:13px;color:var(--text);}
  .work-pick-sub{font-size:11px;color:var(--text3);margin-top:1px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text2);z-index:999;animation:toastIn .2s ease;}
  .toast.ok{border-color:var(--green);color:var(--green);}
  .toast.err{border-color:var(--red);color:var(--red);}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    nav { padding:0 10px; gap:4px; overflow-x:auto; }
    .nav-btn { font-size:11px; padding:4px 8px; white-space:nowrap; }
    .layout { flex-direction:column; height:auto; min-height:calc(100vh - 56px); }
    .artist-list-panel { width:100%; min-width:unset; max-height:200px; border-right:none; border-bottom:1px solid var(--border); }
    .artist-detail-panel { padding:16px; }
  }
  @media (max-width: 480px) {
    .nav-btn[href="repertoires.html"], .nav-btn[href="eserler.html"] { display:none; }
    .nav-btn[href="index.html"] img { height:28px !important; }
    nav { height:52px; }
    .layout { min-height:calc(100vh - 52px); }
    .artist-list-panel { max-height:160px; }
  }

  /* ── MOBILE GLOBAL ── */
  @media (max-width: 768px) {
    body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button, a { min-height: 36px; }
    input, select, textarea { font-size: 16px !important; } /* prevent iOS zoom */
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .sb { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }

</style>
<script src="auth.js"></script>
</head>
<body>
<nav style="background:var(--bg);border-bottom:1px solid var(--border);padding:0 40px;height:60px;display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:200;">
  <img src="Repertuvar_logo.png" alt="" style="height:36px;margin-right:8px;">
  <a href="index.html" style="padding:6px 12px;border-radius:6px;font-size:13px;color:var(--text2);">🏠 Ana Sayfa</a>
  <a href="eserler.html" style="padding:6px 12px;border-radius:6px;font-size:13px;color:var(--text2);">Eserler</a>
  <a href="repertoires.html" style="padding:6px 12px;border-radius:6px;font-size:13px;color:var(--text2);">Repertuvar</a>
  <a href="artiesten.html" style="padding:6px 12px;border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);font-weight:500;">Solistler</a>
  <a href="stage.html" style="padding:6px 12px;border-radius:6px;font-size:13px;color:var(--text2);">🎭 Sahne</a>
  <div id="userBadge" style="margin-left:auto;display:flex;align-items:center;gap:8px;"></div>
</nav>

<div class="layout">
  <aside class="artist-list-panel">
    <div class="panel-header">
      <h2>Solistler</h2>
      <button class="btn-new" onclick="openNewModal()">+ Yeni</button>
    </div>
    <div class="list-scroll" id="artistListScroll"></div>
  </aside>
  <div class="detail-panel" id="detailPanel">
    <div class="empty-state" id="emptyState">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <p>Bir solist seçin</p>
    </div>
    <div id="detailContent" style="display:none;padding:0 0 40px;"></div>
  </div>
</div>

<!-- MODAL: Artist -->
<div class="modal-overlay" id="artistModal" style="display:none;">
  <div class="modal">
    <h2 id="modalTitle">Yeni Solist</h2>
    <div class="form-row"><label class="form-label">Ad Soyad *</label><input class="form-input" id="fName" placeholder="Solist adı"></div>
    <div class="form-row"><label class="form-label">Telefon</label><input class="form-input" id="fPhone" type="tel" placeholder="+31 6 ..."></div>
    <div class="form-row"><label class="form-label">E-posta</label><input class="form-input" id="fEmail" type="email" placeholder="email@adres.com"></div>
    <div class="form-row"><label class="form-label">Notlar</label><textarea class="form-input" id="fNotes" rows="3" placeholder="Örn. Genelde Si ve Do karar okur..."></textarea></div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal()">İptal</button>
      <button class="btn-save" onclick="saveArtist()">Kaydet</button>
    </div>
  </div>
</div>

<!-- MODAL: Add Work -->
<div class="modal-overlay" id="workModal" style="display:none;">
  <div class="modal">
    <h2>Eser Ekle</h2>
    <input class="form-input" id="workSearch" placeholder="Eser adı veya besteci ara..." oninput="filterWorks()" autocomplete="off">
    <div class="work-picker-list" id="workPickerList"></div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeWorkModal()">İptal</button>
      <button class="btn-save" onclick="addWorkToArtist()">Ekle</button>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient('https://ehytkzxdhjyjuubizdnl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoeXRrenhkaGp5anV1Yml6ZG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTI3NzIsImV4cCI6MjA5NTgyODc3Mn0.Vzi75p3fSTTYcvkZsoc1VOxfqtwnrQoGYw39JZJfOdU');

let WORKS_LIST = [];
let artists = [];
let selectedId = null;
let editingId = null;
let selectedWorkId = null;
let addingToArtistId = null;

function setSyncStatus(state, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}
function showToast(msg, type='ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
function initials(name) {
  return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

async function loadAll() {
  setSyncStatus('loading', 'Yükleniyor...');
  try {
    const { data, error } = await sb.from('solistler').select('*').order('name');
    if (error) throw error;
    artists = data;
    setSyncStatus('ok', 'Senkronize');
    renderList();
    if (selectedId) renderDetail();
    else if (artists.length) { selectedId = artists[0].id; renderList(); renderDetail(); }

    // Load works
    try {
      const raw = localStorage.getItem('worksListCache');
      if (raw) WORKS_LIST = JSON.parse(raw);
    } catch {}
  } catch(e) {
    setSyncStatus('err', 'Bağlantı hatası');
    showToast('Hata: ' + e.message, 'err');
  }
}

function renderList() {
  const el = document.getElementById('artistListScroll');
  if (!artists.length) { el.innerHTML = '<div style="padding:30px 16px;text-align:center;color:var(--text3);font-size:13px;">Henüz solist yok</div>'; return; }
  el.innerHTML = artists.map(a => `
    <div class="artist-item${selectedId===a.id?' active':''}" onclick="selectArtist('${a.id}')">
      <div class="artist-avatar">${initials(a.name)}</div>
      <div class="artist-info">
        <div class="artist-name">${a.name}</div>
        <div class="artist-sub">${a.phone || a.email || ((a.works||[]).length+' eser')}</div>
      </div>
    </div>`).join('');
}

function selectArtist(id) { selectedId = id; renderList(); renderDetail(); }
function getArtist(id) { return artists.find(a => a.id === id); }

function renderDetail() {
  const a = getArtist(selectedId);
  document.getElementById('emptyState').style.display = a ? 'none' : 'flex';
  const dc = document.getElementById('detailContent');
  dc.style.display = a ? 'block' : 'none';
  if (!a) return;
  const works = a.works || [];
  const workChips = works.map((w, idx) => `
    <div class="work-chip">${w.name}${w.makam?`<span>${w.makam}</span>`:''}
      <span class="work-chip-remove" onclick="removeWork('${a.id}',${idx})">✕</span>
    </div>`).join('');
  dc.innerHTML = `
    <div class="detail-inner">
      <div class="detail-top">
        <div class="detail-avatar">${initials(a.name)}</div>
        <div style="flex:1;">
          <div class="detail-name">${a.name}</div>
          <div style="font-size:11px;color:var(--text3);">#${a.id.slice(0,8).toUpperCase()}</div>
        </div>
        <div class="detail-actions">
          <button class="btn-icon" onclick="openEditModal('${a.id}')">✏️ Düzenle</button>
          <button class="btn-icon btn-danger" onclick="deleteArtist('${a.id}')">Sil</button>
        </div>
      </div>
      <div class="info-grid">
        ${a.phone?`<div class="info-card"><div class="info-card-label">Telefon</div><div class="info-card-value"><a href="tel:${a.phone}">${a.phone}</a></div></div>`:''}
        ${a.email?`<div class="info-card"><div class="info-card-label">E-posta</div><div class="info-card-value"><a href="mailto:${a.email}">${a.email}</a></div></div>`:''}
        ${a.notes?`<div class="info-card full"><div class="info-card-label">Notlar</div><div class="notes-box">${a.notes}</div></div>`:''}
      </div>
      <div class="section-title">Eser Detayları</div>
      <div class="works-chips">
        ${workChips}
        <button class="btn-add-work-chip" onclick="openWorkModal('${a.id}')">+ Eser Ekle</button>
      </div>
    </div>`;
}

function openNewModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Yeni Solist';
  ['fName','fPhone','fEmail','fNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('artistModal').style.display = 'flex';
  setTimeout(() => document.getElementById('fName').focus(), 50);
}
function openEditModal(id) {
  const a = getArtist(id);
  if (!a) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Solist Düzenle';
  document.getElementById('fName').value = a.name;
  document.getElementById('fPhone').value = a.phone || '';
  document.getElementById('fEmail').value = a.email || '';
  document.getElementById('fNotes').value = a.notes || '';
  document.getElementById('artistModal').style.display = 'flex';
}
function closeModal() { document.getElementById('artistModal').style.display = 'none'; }

async function saveArtist() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { document.getElementById('fName').focus(); return; }
  const data = {
    name,
    phone: document.getElementById('fPhone').value.trim() || null,
    email: document.getElementById('fEmail').value.trim() || null,
    notes: document.getElementById('fNotes').value.trim() || null,
  };
  setSyncStatus('loading', 'Kaydediliyor...');
  try {
    if (editingId) {
      const { error } = await sb.from('solistler').update(data).eq('id', editingId);
      if (error) throw error;
    } else {
      const { data: newA, error } = await sb.from('solistler').insert({...data, works:[]}).select().single();
      if (error) throw error;
      selectedId = newA.id;
    }
    closeModal();
    showToast('Kaydedildi ✓');
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

async function deleteArtist(id) {
  if (!confirm('Bu solist silinsin mi?')) return;
  try {
    const { error } = await sb.from('solistler').delete().eq('id', id);
    if (error) throw error;
    if (selectedId === id) selectedId = null;
    showToast('Silindi');
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

function openWorkModal(artistId) {
  addingToArtistId = artistId;
  selectedWorkId = null;
  document.getElementById('workSearch').value = '';
  renderWorkPicker('');
  document.getElementById('workModal').style.display = 'flex';
  setTimeout(() => document.getElementById('workSearch').focus(), 50);
}
function closeWorkModal() { document.getElementById('workModal').style.display = 'none'; }
function filterWorks() { renderWorkPicker(document.getElementById('workSearch').value.toLowerCase().trim()); }
function renderWorkPicker(q) {
  const list = q ? WORKS_LIST.filter(w => (w.name+w.composer+w.makam).toLowerCase().includes(q)) : WORKS_LIST;
  const el = document.getElementById('workPickerList');
  el.innerHTML = list.slice(0,80).map(w =>
    `<div class="work-pick-item${selectedWorkId===w.id?' selected':''}" onclick="selectedWorkId='${w.id}';renderWorkPicker(document.getElementById('workSearch').value.toLowerCase())">
      <div class="work-pick-name">${w.name}</div>
      <div class="work-pick-sub">${[w.composer,w.makam].filter(Boolean).join(' · ')}</div>
    </div>`
  ).join('') || '<div style="padding:16px;text-align:center;color:var(--text3);">Bulunamadı — Önce Eserler sayfasını ziyaret edin</div>';
}

async function addWorkToArtist() {
  if (!selectedWorkId) { alert('Lütfen bir eser seçin.'); return; }
  const a = getArtist(addingToArtistId);
  if (!a) return;
  const w = WORKS_LIST.find(x => x.id === selectedWorkId);
  if (!w) return;
  const works = [...(a.works||[])];
  if (works.find(x => x.id === selectedWorkId)) { closeWorkModal(); return; }
  works.push({id: w.id, name: w.name, makam: w.makam, composer: w.composer});
  try {
    const { error } = await sb.from('solistler').update({ works }).eq('id', addingToArtistId);
    if (error) throw error;
    closeWorkModal();
    showToast('Eser eklendi ✓');
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

async function removeWork(artistId, idx) {
  const a = getArtist(artistId);
  if (!a) return;
  const works = [...(a.works||[])];
  works.splice(idx, 1);
  try {
    const { error } = await sb.from('solistler').update({ works }).eq('id', artistId);
    if (error) throw error;
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeModal(); closeWorkModal(); } });
document.getElementById('artistModal').addEventListener('click', e => { if(e.target.id==='artistModal') closeModal(); });
document.getElementById('workModal').addEventListener('click', e => { if(e.target.id==='workModal') closeWorkModal(); });

loadAll();
</script>
