<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solistler — Repertuvar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #07071a;
  --bg2:        #0f0f2e;
  --surface:    #12123a;
  --surface2:   #1a1a4a;
  --border:     rgba(120,100,255,0.18);
  --border2:    rgba(120,100,255,0.32);
  --accent:     #7c6fff;
  --accent2:    #a78bfa;
  --accent3:    #c4b5fd;
  --text:       #e2e0ff;
  --text2:      #9d9bc4;
  --text3:      #5e5c8a;
  --green:      #4ade80;
  --sidebar-w:  220px;
  --topnav-h:   56px;
  --tabnav-h:   52px;
  --bottom-h:   68px;
}

body {
  background: var(--bg);
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
}

/* ── Background glow ── */
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.bg-glow::before {
  content: ''; position: absolute; top: -15%; left: 25%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(124,111,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}
.bg-glow::after {
  content: ''; position: absolute; bottom: 10%; right: 5%;
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(167,139,250,0.07) 0%, transparent 70%);
  border-radius: 50%;
}

/* ════════════════════════════
   DESKTOP ≥ 1024px  →  Sol Sidebar
════════════════════════════ */
@media (min-width: 1024px) {
  body { display: flex; }

  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: rgba(9,9,28,0.96);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    z-index: 300; padding-bottom: 20px;
  }
  .sb-brand {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border); margin-bottom: 10px;
  }
  .sb-logo {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #fff;
    box-shadow: 0 0 16px rgba(124,111,255,0.35);
  }
  .sb-appname { font-size: 15px; font-weight: 700; color: var(--text); }
  .sb-domain  { font-size: 10px; color: var(--text3); margin-top: 1px; }
  .sb-nav { flex: 1; padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
  .sb-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 12px 4px;
  }
  .sb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    font-size: 13px; font-weight: 600; color: var(--text2);
    text-decoration: none; transition: all .15s; position: relative;
  }
  .sb-item:hover { background: var(--surface); color: var(--text); }
  .sb-item.active {
    background: rgba(124,111,255,0.12); color: var(--accent3);
    border: 1px solid rgba(124,111,255,0.2);
  }
  .sb-item.active::before {
    content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
    width: 3px; border-radius: 0 3px 3px 0;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
  }
  .sb-icon { font-size: 16px; width: 20px; text-align: center; }
  .sb-count {
    margin-left: auto; font-size: 10px; font-weight: 700;
    background: rgba(124,111,255,0.15); border: 1px solid rgba(124,111,255,0.25);
    color: var(--accent2); border-radius: 10px; padding: 1px 7px;
  }
  .sb-divider { height: 1px; background: var(--border); margin: 8px 10px; }
  .sb-stage {
    margin: 6px 10px 0;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 12px;
    font-size: 13px; font-weight: 700; color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 4px 16px rgba(124,111,255,0.3);
    transition: opacity .15s;
  }
  .sb-stage:hover { opacity: .9; }
  .sb-user {
    margin: 10px 10px 0;
    padding: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; display: flex; align-items: center; gap: 10px;
  }
  .sb-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  .sb-uname { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-urole { font-size: 10px; color: var(--text3); }
  .sb-logout {
    background: none; border: none; color: var(--text3);
    cursor: pointer; font-size: 14px; padding: 4px; transition: color .15s;
  }
  .sb-logout:hover { color: var(--accent); }

  .main-wrap { margin-left: var(--sidebar-w); flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* slim topbar inside main */
  .desktop-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px; border-bottom: 1px solid var(--border);
    background: rgba(7,7,26,0.6); backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }
  .dt-crumb { font-size: 13px; color: var(--text2); }
  .dt-crumb span { color: var(--text); font-weight: 600; }
  .dt-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px;
    font-size: 12px; color: var(--text3); cursor: pointer; transition: border-color .15s;
  }
  .dt-search:hover { border-color: var(--accent2); }

  /* hide mobile/tablet elements */
  .topnav, .tabnav, .bottom-nav { display: none !important; }

  .page { padding: 28px 32px; }
  .quick-bar { padding: 0 0 4px; }
  .section { padding: 24px 0 0; }
  .stage-banner { margin: 24px 0 0; }
}

/* ════════════════════════════
   TABLET  768px – 1023px  →  Üst Tab Bar + Alt Bar
════════════════════════════ */
@media (min-width: 768px) and (max-width: 1023px) {
  body { padding-bottom: var(--bottom-h); }
  .sidebar { display: none; }
  .desktop-topbar { display: none; }
  .main-wrap { display: contents; }

  /* Üst: logo + alan adı */
  .topnav {
    position: sticky; top: 0; z-index: 200;
    height: var(--topnav-h);
    background: rgba(7,7,26,0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 12px;
  }
  .tn-logo {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #fff;
    box-shadow: 0 0 14px rgba(124,111,255,0.3);
  }
  .tn-name { font-size: 16px; font-weight: 700; color: var(--text); }
  .tn-domain {
    font-size: 11px; color: var(--text3); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
  }
  .tn-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .tn-user {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px 4px 6px;
  }
  .tn-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .tn-uname { font-size: 12px; font-weight: 500; color: var(--text2); }
  .tn-logout {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 11px; color: var(--text3);
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .tn-logout:hover { border-color: var(--accent); color: var(--accent); }

  .tabnav { display: none; }

  /* Alt Bar */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    height: var(--bottom-h);
    background: rgba(7,7,26,0.95);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
  }
  .bn-items { display: flex; width: 100%; padding: 0 8px; }
  .bn-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px; padding: 7px 4px;
    text-decoration: none; color: var(--text3);
    border-radius: 10px; transition: all .15s; position: relative;
  }
  .bn-item.active { color: var(--accent); }
  .bn-icon { font-size: 20px; line-height: 1; }
  .bn-label { font-size: 10px; font-weight: 600; }
  .bn-dot { position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .bn-stage {
    background: linear-gradient(135deg, rgba(124,111,255,0.18), rgba(167,139,250,0.08));
    border: 1px solid rgba(124,111,255,0.25);
    color: var(--accent2) !important;
    margin: 4px 2px; border-radius: 12px;
  }

  .page { padding: 0; }
  .quick-bar { padding: 16px 16px 0; }
  .section { padding: 20px 16px 0; }
  .stage-banner { margin: 20px 16px 0; }
  .page-bottom { height: 16px; }
}

/* ════════════════════════════
   MOBİL  < 768px  →  Üst Bar + Alt Bar
════════════════════════════ */
@media (max-width: 767px) {
  body { padding-bottom: var(--bottom-h); }
  .sidebar { display: none; }
  .desktop-topbar { display: none; }
  .tabnav { display: none; }
  .main-wrap { display: contents; }

  /* Üst bar (logo + kullanıcı) */
  .topnav {
    position: sticky; top: 0; z-index: 200;
    height: var(--topnav-h);
    background: rgba(7,7,26,0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 10px;
  }
  .tn-logo {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff;
  }
  .tn-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .tn-domain { display: none; }
  .tn-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .tn-user { display: flex; align-items: center; gap: 5px; }
  .tn-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .tn-uname { display: none; }
  .tn-logout {
    background: none; border: none; color: var(--text3);
    font-size: 16px; cursor: pointer; padding: 4px;
  }

  /* Alt bar */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    height: var(--bottom-h);
    background: rgba(7,7,26,0.95);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
  }
  .bn-items { display: flex; width: 100%; padding: 0 4px; }
  .bn-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; padding: 7px 2px;
    text-decoration: none; color: var(--text3);
    border-radius: 10px; transition: all .15s; position: relative;
  }
  .bn-item.active { color: var(--accent); }
  .bn-icon { font-size: 19px; line-height: 1; }
  .bn-label { font-size: 9px; font-weight: 600; }
  .bn-dot { position: absolute; bottom: 2px; width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
  .bn-stage {
    background: linear-gradient(135deg, rgba(124,111,255,0.18), rgba(167,139,250,0.08));
    border: 1px solid rgba(124,111,255,0.25);
    color: var(--accent2) !important;
    margin: 5px 2px; border-radius: 11px;
  }

  .page { padding: 0; }
  .quick-bar { padding: 14px 14px 0; }
  .section { padding: 18px 14px 0; }
  .stage-banner { margin: 18px 14px 0; }
  .page-bottom { height: 16px; }
}

/* ════════════════════
   ORTAK BILEŞENLER
════════════════════ */
.quick-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.quick-bar::-webkit-scrollbar { display: none; }
.qb-item {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  min-width: 62px; padding: 0 4px; cursor: pointer; text-decoration: none;
}
.qb-icon {
  width: 54px; height: 54px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; transition: all .15s;
}
.qb-item:hover .qb-icon { border-color: var(--accent); background: var(--surface2); box-shadow: 0 0 12px rgba(124,111,255,0.2); }
.qb-label { font-size: 10px; color: var(--text2); text-align: center; white-space: nowrap; }
.qb-stage .qb-icon {
  background: linear-gradient(135deg, rgba(124,111,255,0.22), rgba(167,139,250,0.12));
  border-color: var(--accent); box-shadow: 0 0 14px rgba(124,111,255,0.18);
}
.qb-stage .qb-label { color: var(--accent3); font-weight: 600; }

.section { position: relative; z-index: 1; }
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sec-title { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
.sec-action { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 500; }

.active-card {
  background: linear-gradient(135deg, var(--surface) 0%, rgba(22,20,60,0.9) 100%);
  border: 1px solid var(--border2); border-radius: 16px;
  padding: 16px; display: flex; align-items: center; gap: 14px;
  text-decoration: none; color: var(--text); transition: all .2s;
  position: relative; overflow: hidden;
}
.active-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(to bottom, var(--accent), var(--accent2));
  border-radius: 3px 0 0 3px;
}
.active-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.active-thumb {
  width: 50px; height: 50px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--surface2), var(--bg2));
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.active-info { flex: 1; min-width: 0; }
.active-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.active-meta { font-size: 11px; color: var(--text2); margin-top: 3px; display: flex; gap: 8px; }
.meta-badge {
  background: rgba(124,111,255,0.12); border: 1px solid rgba(124,111,255,0.2);
  border-radius: 5px; padding: 1px 7px; font-size: 10px; color: var(--accent3); font-weight: 600;
}
.active-sub { font-size: 11px; color: var(--text3); margin-top: 5px; }
.active-arrow { font-size: 18px; color: var(--text3); transition: color .15s; }
.active-card:hover .active-arrow { color: var(--accent); }

.work-list { display: flex; flex-direction: column; gap: 1px; }
.work-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  text-decoration: none; color: var(--text); transition: background .15s; cursor: pointer;
}
.work-row:hover { background: var(--surface); }
.work-num { width: 18px; font-size: 11px; color: var(--text3); font-weight: 600; flex-shrink: 0; text-align: right; }
.work-thumb {
  width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.work-info { flex: 1; min-width: 0; }
.work-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
.work-badges { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
.wb { font-size: 10px; color: var(--text3); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; }
.wb-key { color: var(--accent2); border-color: rgba(124,111,255,0.2); background: rgba(124,111,255,0.08); }
.wc-play {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  background: rgba(124,111,255,0.1); border: 1px solid rgba(124,111,255,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--accent2); cursor: pointer; transition: all .15s;
}
.wc-play:hover { background: rgba(124,111,255,0.2); }

.stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
@media (max-width: 480px) { .stats-row { grid-template-columns: repeat(2,1fr); } }
.stat-pill {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 10px; text-align: center;
}
.sp-n { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.sp-l { font-size: 10px; color: var(--text3); margin-top: 3px; }
.sp-t { font-size: 10px; color: var(--green); margin-top: 5px; font-weight: 500; }

.stage-banner {
  background: linear-gradient(135deg, rgba(124,111,255,0.13) 0%, rgba(167,139,250,0.06) 100%);
  border: 1px solid var(--accent); border-radius: 16px;
  padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  position: relative; overflow: hidden;
}
.stage-banner::before {
  content: '🎭'; position: absolute; right: -8px; top: -8px;
  font-size: 70px; opacity: 0.055; pointer-events: none;
}
.sb-left { flex: 1; }
.sb-title { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.sb-title span { color: var(--accent3); }
.sb-sub { font-size: 12px; color: var(--text2); margin-top: 5px; line-height: 1.55; }
.sb-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.stage-go-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border: none; border-radius: 10px; padding: 10px 18px;
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
  text-decoration: none; display: block;
  box-shadow: 0 4px 14px rgba(124,111,255,0.3);
  transition: opacity .15s; white-space: nowrap;
}
.stage-go-btn:hover { opacity: .88; }
.theme-chips { display: flex; gap: 5px; }
.tc {
  padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 600;
  border: 1px solid var(--border); color: var(--text3); cursor: pointer; transition: all .15s;
}
.tc.active { border-color: var(--accent2); color: var(--accent3); background: rgba(167,139,250,0.1); }

.admin-only { display: none; }
</style>

</head>

      <button class="btn-new" onclick="openNewModal()">+ Yeni</button>
    </div>

  </aside>
  <div class="detail-panel" id="detailPanel">

        <circle cx="12" cy="7" r="4"/>

<!-- MODAL: Artist -->
<div class="modal-overlay" id="artistModal" style="display:none;">
  <div class="modal">
    <h2 id="modalTitle">Yeni Solist</h2>
    <div class="form-row"><label class="form-label">Ad Soyad *</label><input class="form-input" id="fName" placeholder="Solist adı"></div>
    <div class="form-row"><label class="form-label">Telefon</label><input class="form-input" id="fPhone" type="tel" placeholder="+31 6 ..."></div>
    <div class="form-row"><label class="form-label">E-posta</label><input class="form-input" id="fEmail" type="email" placeholder="email@adres.com"></div>
    <div class="form-row"><label class="form-label">Notlar</label><textarea class="form-input" id="fNotes" rows="3" placeholder="Örn. Genelde Si ve Do karar okur..."></textarea></div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal()">İptal</button>
      <button class="btn-save" onclick="saveArtist()">Kaydet</button>
    </div>
  </div>
</div>

<!-- MODAL: Add Work -->
<div class="modal-overlay" id="workModal" style="display:none;">
  <div class="modal">
    <h2>Eser Ekle</h2>
    <input class="form-input" id="workSearch" placeholder="Eser adı veya besteci ara..." oninput="filterWorks()" autocomplete="off">
    <div class="work-picker-list" id="workPickerList"></div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeWorkModal()">İptal</button>
      <button class="btn-save" onclick="addWorkToArtist()">Ekle</button>
    </div>
  </div>
</div>

<script>
if (typeof sb === 'undefined') { var sb = supabase.createClient(SUPA_URL, SUPA_KEY); }
let WORKS_LIST = [];
let artists = [];
let selectedId = null;
let editingId = null;
let selectedWorkId = null;
let addingToArtistId = null;

function setSyncStatus(state, label) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  if (dot) dot.className = 'sync-dot ' + state;
  if (lbl) lbl.textContent = label;
}
function showToast(msg, type='ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
function initials(name) {
  return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

async function loadAll() {
  setSyncStatus('loading', 'Yükleniyor...');
  try {
    const { data, error } = await sb.from('solistler').select('*').order('name');
    if (error) throw error;
    artists = data;
    setSyncStatus('ok', 'Senkronize');
    renderList();
    if (selectedId) renderDetail();
    else if (artists.length) { selectedId = artists[0].id; renderList(); renderDetail(); }

    // Load works
    try {
      const raw = localStorage.getItem('worksListCache');
      if (raw) WORKS_LIST = JSON.parse(raw);
    } catch {}
  } catch(e) {
    setSyncStatus('err', 'Bağlantı hatası');
    showToast('Hata: ' + e.message, 'err');
  }
}

function renderList() {
  const el = document.getElementById('artistListScroll');
  if (!artists.length) { el.innerHTML = '<div style="padding:30px 16px;text-align:center;color:var(--text3);font-size:13px;">Henüz solist yok</div>'; return; }
  el.innerHTML = artists.map(a => `
    <div class="artist-item${selectedId===a.id?' active':''}" onclick="selectArtist('${a.id}')">
      <div class="artist-avatar">${initials(a.name)}</div>
      <div class="artist-info">
        <div class="artist-name">${a.name}</div>
        <div class="artist-sub">${a.phone || a.email || ((a.works||[]).length+' eser')}</div>
      </div>
    </div>`).join('');
}

function selectArtist(id) { selectedId = id; renderList(); renderDetail(); }
function getArtist(id) { return artists.find(a => a.id === id); }

function renderDetail() {
  const a = getArtist(selectedId);
  document.getElementById('emptyState').style.display = a ? 'none' : 'flex';
  const dc = document.getElementById('detailContent');
  dc.style.display = a ? 'block' : 'none';
  if (!a) return;
  const works = a.works || [];
  const workChips = works.map((w, idx) => `
    <div class="work-chip">${w.name}${w.makam?`<span>${w.makam}</span>`:''}
      <span class="work-chip-remove" onclick="removeWork('${a.id}',${idx})">✕</span>
    </div>`).join('');
  dc.innerHTML = `
    <div class="detail-inner">
      <div class="detail-top">
        <div class="detail-avatar">${initials(a.name)}</div>
        <div style="flex:1;">
          <div class="detail-name">${a.name}</div>
          <div style="font-size:11px;color:var(--text3);">#${a.id.slice(0,8).toUpperCase()}</div>
        </div>
        <div class="detail-actions">
          <button class="btn-icon" onclick="openEditModal('${a.id}')">✏️ Düzenle</button>
          <button class="btn-icon btn-danger" onclick="deleteArtist('${a.id}')">Sil</button>
        </div>
      </div>
      <div class="info-grid">
        ${a.phone?`<div class="info-card"><div class="info-card-label">Telefon</div><div class="info-card-value"><a href="tel:${a.phone}">${a.phone}</a></div></div>`:''}
        ${a.email?`<div class="info-card"><div class="info-card-label">E-posta</div><div class="info-card-value"><a href="mailto:${a.email}">${a.email}</a></div></div>`:''}
        ${a.notes?`<div class="info-card full"><div class="info-card-label">Notlar</div><div class="notes-box">${a.notes}</div></div>`:''}
      </div>
      <div class="section-title">Eser Detayları</div>
      <div class="works-chips">
        ${workChips}
        <button class="btn-add-work-chip" onclick="openWorkModal('${a.id}')">+ Eser Ekle</button>
      </div>
    </div>`;
}

function openNewModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Yeni Solist';
  ['fName','fPhone','fEmail','fNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('artistModal').style.display = 'flex';
  setTimeout(() => document.getElementById('fName').focus(), 50);
}
function openEditModal(id) {
  const a = getArtist(id);
  if (!a) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Solist Düzenle';
  document.getElementById('fName').value = a.name;
  document.getElementById('fPhone').value = a.phone || '';
  document.getElementById('fEmail').value = a.email || '';
  document.getElementById('fNotes').value = a.notes || '';
  document.getElementById('artistModal').style.display = 'flex';
}
function closeModal() { document.getElementById('artistModal').style.display = 'none'; }

async function saveArtist() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { document.getElementById('fName').focus(); return; }
  const data = {
    name,
    phone: document.getElementById('fPhone').value.trim() || null,
    email: document.getElementById('fEmail').value.trim() || null,
    notes: document.getElementById('fNotes').value.trim() || null,
  };
  setSyncStatus('loading', 'Kaydediliyor...');
  try {
    if (editingId) {
      const { error } = await sb.from('solistler').update(data).eq('id', editingId);
      if (error) throw error;
    } else {
      const { data: newA, error } = await sb.from('solistler').insert({...data, works:[]}).select().single();
      if (error) throw error;
      selectedId = newA.id;
    }
    closeModal();
    showToast('Kaydedildi ✓');
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

async function deleteArtist(id) {
  if (!confirm('Bu solist silinsin mi?')) return;
  try {
    const { error } = await sb.from('solistler').delete().eq('id', id);
    if (error) throw error;
    if (selectedId === id) selectedId = null;
    showToast('Silindi');
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

function openWorkModal(artistId) {
  addingToArtistId = artistId;
  selectedWorkId = null;
  document.getElementById('workSearch').value = '';
  renderWorkPicker('');
  document.getElementById('workModal').style.display = 'flex';
  setTimeout(() => document.getElementById('workSearch').focus(), 50);
}
function closeWorkModal() { document.getElementById('workModal').style.display = 'none'; }
function filterWorks() { renderWorkPicker(document.getElementById('workSearch').value.toLowerCase().trim()); }
function renderWorkPicker(q) {
  const list = q ? WORKS_LIST.filter(w => (w.name+w.composer+w.makam).toLowerCase().includes(q)) : WORKS_LIST;
  const el = document.getElementById('workPickerList');
  el.innerHTML = list.slice(0,80).map(w =>
    `<div class="work-pick-item${selectedWorkId===w.id?' selected':''}" onclick="selectedWorkId='${w.id}';renderWorkPicker(document.getElementById('workSearch').value.toLowerCase())">
      <div class="work-pick-name">${w.name}</div>
      <div class="work-pick-sub">${[w.composer,w.makam].filter(Boolean).join(' · ')}</div>
    </div>`
  ).join('') || '<div style="padding:16px;text-align:center;color:var(--text3);">Bulunamadı — Önce Eserler sayfasını ziyaret edin</div>';
}

async function addWorkToArtist() {
  if (!selectedWorkId) { alert('Lütfen bir eser seçin.'); return; }
  const a = getArtist(addingToArtistId);
  if (!a) return;
  const w = WORKS_LIST.find(x => x.id === selectedWorkId);
  if (!w) return;
  const works = [...(a.works||[])];
  if (works.find(x => x.id === selectedWorkId)) { closeWorkModal(); return; }
  works.push({id: w.id, name: w.name, makam: w.makam, composer: w.composer});
  try {
    const { error } = await sb.from('solistler').update({ works }).eq('id', addingToArtistId);
    if (error) throw error;
    closeWorkModal();
    showToast('Eser eklendi ✓');
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

async function removeWork(artistId, idx) {
  const a = getArtist(artistId);
  if (!a) return;
  const works = [...(a.works||[])];
  works.splice(idx, 1);
  try {
    const { error } = await sb.from('solistler').update({ works }).eq('id', artistId);
    if (error) throw error;
    await loadAll();
  } catch(e) { showToast('Hata: ' + e.message, 'err'); }
}

document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeModal(); closeWorkModal(); } });
document.getElementById('artistModal').addEventListener('click', e => { if(e.target.id==='artistModal') closeModal(); });
document.getElementById('workModal').addEventListener('click', e => { if(e.target.id==='workModal') closeWorkModal(); });

loadAll();
</script>
