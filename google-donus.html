<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Repertuvar</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #070A0F; color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { display: inline-block; margin-top: 18px; padding: 12px 24px; border-radius: 200px;
      background: #FFC83D; color: #1A1305; font-weight: 600; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div>
  <p id="mesaj"></p>
  <a id="don" href="#" hidden></a>
</div>
<script>
// (2026-10-04) NATIVE GOOGLE GİRİŞİ DÖNÜŞ KÖPRÜSÜ.
// Uygulama Google'ı doğrudan açar (redirect_uri = bu sayfa) ki Google penceresinde
// Supabase'in proje adresi değil app.repertuvar.app görünsün. Google id_token'ı bu
// sayfanın # kısmına koyar; # sunucuya hiç gönderilmez, sayfa onu yalnız uygulamaya
// (com.repertuvar.app://giris) aktarır. Belirteç tek başına işe yaramaz: Supabase
// uygulamanın sakladığı nonce'u da ister (login.html → _googleIdTokenIle).
(function () {
  // (2026-10-30) 10 dil. Bu sayfa i18n.js yüklemez (sistem tarayıcısında açılır); dil: kayıtlı tercih → tarayıcı dili →
  // listede yoksa İngilizce (i18n.js ile aynı kural). Metinler sayfanın kendi sözlüğünde.
  var DILLER = ['tr', 'en', 'de', 'nl', 'fr', 'es', 'it', 'pt', 'az', 'ar'];
  var dil = 'en';
  try {
    var k = localStorage.getItem('uiLang') || localStorage.getItem('uiLangSunucu');
    var n = (navigator.language || '').slice(0, 2).toLowerCase();
    dil = DILLER.indexOf(k) !== -1 ? k : (DILLER.indexOf(n) !== -1 ? n : 'en');
  } catch (e) {}
  var METIN = {
    tr: { gecersiz: 'Geçersiz bağlantı.', donuluyor: 'Repertuvar\'a dönülüyor…', don: 'Repertuvar\'a dön' },
    en: { gecersiz: 'Invalid link.', donuluyor: 'Returning to Repertuvar…', don: 'Return to Repertuvar' },
    de: { gecersiz: 'Ungültiger Link.', donuluyor: 'Zurück zu Repertuvar…', don: 'Zurück zu Repertuvar' },
    nl: { gecersiz: 'Ongeldige link.', donuluyor: 'Terug naar Repertuvar…', don: 'Terug naar Repertuvar' },
    fr: { gecersiz: 'Lien non valide.', donuluyor: 'Retour à Repertuvar…', don: 'Revenir à Repertuvar' },
    es: { gecersiz: 'Enlace no válido.', donuluyor: 'Volviendo a Repertuvar…', don: 'Volver a Repertuvar' },
    it: { gecersiz: 'Link non valido.', donuluyor: 'Ritorno a Repertuvar…', don: 'Torna a Repertuvar' },
    pt: { gecersiz: 'Link inválido.', donuluyor: 'Voltando ao Repertuvar…', don: 'Voltar ao Repertuvar' },
    az: { gecersiz: 'Keçid etibarsızdır.', donuluyor: 'Repertuvar tətbiqinə qayıdılır…', don: 'Repertuvar tətbiqinə qayıt' },
    ar: { gecersiz: 'رابط غير صالح.', donuluyor: 'جارٍ الرجوع إلى Repertuvar…', don: 'الرجوع إلى Repertuvar' }
  };
  var T = METIN[dil];
  try { document.documentElement.lang = dil; document.documentElement.dir = dil === 'ar' ? 'rtl' : 'ltr'; } catch (e) {}
  var mesaj = document.getElementById('mesaj'), don = document.getElementById('don');
  var h = location.hash || '';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var p = new URLSearchParams(h.replace(/^#/, ''));
  if (!p.get('id_token') && !p.get('error')) {
    mesaj.textContent = T.gecersiz;
    return;
  }
  var hedef = 'com.repertuvar.app://giris' + h;
  mesaj.textContent = T.donuluyor;
  don.textContent = T.don;
  don.href = hedef;
  location.replace(hedef);
  // Android Chrome sekmesi kullanıcı dokunuşu olmadan uygulamayı açmayı reddedebilir
  setTimeout(function () { don.hidden = false; }, 1200);
})();
</script>
</body>
</html>
