<!DOCTYPE html>
<!-- design-test v1 -->

<html lang="tr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuar — Eserler</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Sora:wght@300;400;500;600;700:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface2: #21262D;
    --border: #30363D;
    --border2: #38384f;
    --accent: #58A6FF;
    --accent2: #BC8CFF;
    --text: #E6EDF3;
    --text2: #8B949E;
    --text3: #6E7681;
    --red: #c05444;
    --green: #4a9462;
    --tag-bg: #2a2a3e;
    --tag-text: #b8b4ac;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Sora', sans-serif; font-size:14px; min-height:100vh; }

  /* HEADER */
  header { background:var(--surface); border-bottom:1px solid var(--border); padding:0 12px; display:flex; align-items:center; gap:8px; height:56px; position:sticky; top:0; z-index:100; flex-wrap:nowrap; overflow-x:auto; }
  .logo { font-family:'Playfair Display', serif; font-size:20px; color:var(--accent); letter-spacing:0.02em; white-space:nowrap; }
  .logo span { color:var(--text2); font-size:13px; font-family:'Sora', sans-serif; margin-left:8px; font-weight:300; }
  .search-wrap { flex:1; max-width:480px; position:relative; }
  .search-wrap input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px 8px 36px; color:var(--text); font-size:14px; font-family:'Sora', sans-serif; outline:none; transition:border-color .2s; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-wrap input::placeholder { color:var(--text3); }
  .search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:15px; pointer-events:none; }
  .count-badge { margin-left:auto; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:12px; color:var(--text2); white-space:nowrap; }

  /* LAYOUT */
  .layout { display:flex; height:calc(100vh - 56px); }

  /* SIDEBAR FILTERS */
  .sidebar { display:none; }
  .sidebar::-webkit-scrollbar { width:4px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .filter-section { padding:0 16px 16px; border-bottom:1px solid var(--border); margin-bottom:0; }
  .filter-section:last-child { border-bottom:none; }
  .filter-label { font-size:10px; font-weight:500; letter-spacing:0.1em; color:var(--text3); text-transform:uppercase; margin-bottom:8px; padding-top:16px; display:block; }
  .filter-btn { display:block; width:100%; text-align:left; background:none; border:none; padding:5px 8px; border-radius:6px; color:var(--text2); font-size:13px; font-family:'Sora', sans-serif; cursor:pointer; transition:all .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .filter-btn:hover { background:var(--surface2); color:var(--text); }
  .filter-btn.active { background:rgba(88,166,255,0.15); color:var(--accent); }
  .filter-btn .badge { float:right; background:var(--surface2); border-radius:10px; padding:0 6px; font-size:10px; color:var(--text3); }
  .filter-btn.active .badge { background:rgba(88,166,255,0.2); color:var(--accent); }

  /* WORK LIST */
  .list-panel { flex:1; overflow-y:auto; }
  .list-panel::-webkit-scrollbar { width:5px; }
  .list-panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .work-item { display:flex; align-items:flex-start; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  .work-item:hover { background:var(--surface); }
  .work-item.selected { background:var(--surface2); border-left:3px solid var(--accent); padding-left:17px; }
  .work-num { display:none; }
  .work-info { flex:1; min-width:0; }
  .work-name { font-size:14px; font-weight:500; color:var(--text); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .work-sub { font-size:12px; color:var(--text2); display:flex; gap:8px; flex-wrap:wrap; }
  .work-sub span { display:flex; align-items:center; gap:3px; }
  .work-tags { display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .tag { background:var(--tag-bg); color:var(--tag-text); border-radius:4px; padding:1px 6px; font-size:11px; border:1px solid var(--border); }
  .tag.makam { border-color:#3a3060; color:#9b8fd4; background:#1e1b2e; }
  .tag.form { border-color:#2a3d2a; color:#7ab87a; background:#1a271a; }
  .tag.tuning { border-color:#3d2a1a; color:#c8904a; background:#271a0d; }

  /* DETAIL PANEL */
  .detail { width:380px; min-width:380px; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; }
  .detail::-webkit-scrollbar { width:4px; }
  .detail::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .detail-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text3); gap:12px; }
  .detail-empty svg { opacity:.3; }
  .detail-header { padding:20px 20px 16px; border-bottom:1px solid var(--border); }
  .detail-id { font-size:11px; color:var(--text3); letter-spacing:.05em; margin-bottom:6px; }
  .detail-title { font-family:'Playfair Display', serif; font-size:20px; color:var(--text); line-height:1.3; margin-bottom:12px; }
  .detail-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:3px 10px; border-radius:20px; font-size:12px; font-weight:500; }
  .chip.makam { background:#1e1b2e; color:#9b8fd4; border:1px solid #3a3060; }
  .chip.form  { background:#1a271a; color:#7ab87a; border:1px solid #2a3d2a; }
  .chip.tuning{ background:#271a0d; color:#c8904a; border:1px solid #3d2a1a; }
  .chip.meas  { background:#1a1e27; color:#6a9fd4; border:1px solid #1f3050; }
  .detail-body { padding:16px 20px; }
  .detail-row { margin-bottom:14px; }
  .detail-row-label { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:4px; }
  .detail-row-value { font-size:13px; color:var(--text2); line-height:1.5; }
  .detail-divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
  .lyrics-box { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:14px; font-size:13px; color:var(--text2); line-height:1.8; max-height:none; text-align:left;white-space:pre-wrap; word-break:break-word; }
  .lyrics-box::-webkit-scrollbar { width:3px; }
  .lyrics-box::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .video-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; background:rgba(88,166,255,.1); border:1px solid rgba(88,166,255,.3); border-radius:6px; color:var(--accent); font-size:13px; text-decoration:none; transition:all .15s; }
  .video-btn:hover { background:rgba(88,166,255,.2); }

  /* TOOLBAR */
  .toolbar { padding:10px 20px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border); background:var(--bg); }
  .sort-btn { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--text2); font-size:12px; font-family:'Sora', sans-serif; cursor:pointer; transition:all .15s; }
  .sort-btn:hover { border-color:var(--border2); color:var(--text); }
  .sort-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(88,166,255,.08); }
  .clear-btn { margin-left:auto; background:none; border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--text3); font-size:12px; font-family:'Sora', sans-serif; cursor:pointer; transition:all .15s; }
  .clear-btn:hover { color:var(--text2); border-color:var(--border2); }

  /* EMPTY STATE */
  .empty-list { padding:60px 20px; text-align:center; color:var(--text3); }

  @media (max-width: 768px) {
    .sidebar { display:none; }
    .detail { display:none; }
    .detail.mobile-visible { display:block; position:fixed; top:80px; left:0; right:0; bottom:0; z-index:200; width:100%; overflow-y:auto; }
    .back-btn { display:flex; align-items:center; gap:6px; padding:12px 20px; color:var(--accent); font-size:14px; cursor:pointer; border-bottom:1px solid var(--border); }
    header a { font-size:11px; padding:3px 6px; }
    header a[href="index.html"] img { height:36px !important; }
    header .count-badge { display:none; }
    header button[onclick="openNewEserModal()"] { font-size:11px; padding:4px 10px; }
    .sort-bar { padding:8px 12px; gap:6px; }
    .sort-btn { font-size:11px; padding:4px 10px; }
  }
  @media (max-width: 480px) {
    header { gap:4px; padding:0 8px; }
    header a[href="repertoires.html"], header a[href="artiesten.html"] { display:none; }
    header a[href="index.html"] img { height:30px !important; }
    header a[href="stage.html"] { display:none; }
    header { gap:3px; padding:0 6px; height:56px; }
    .layout { height:calc(100vh - 56px); }
    .detail.mobile-visible { top:56px; }
  }
  @media (min-width: 769px) {
    .back-btn { display:none; }
  }

  /* ── SİL BUTONU & ONAY ── */
  .delete-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    background: rgba(192,84,68,0.1); border: 1px solid rgba(192,84,68,0.35);
    color: #e07060; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; font-family: inherit;
  }
  .delete-btn:hover { background: rgba(192,84,68,0.22); border-color: rgba(192,84,68,0.6); }

  .stage-open-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.35);
    color: var(--accent); font-size: 13px; font-weight: 500;
    text-decoration: none; transition: all .15s;
  }
  .stage-open-btn:hover { background: rgba(88,166,255,0.2); border-color: rgba(88,166,255,0.6); }

  .confirm-bar {
    display: none; margin-top: 10px; padding: 12px 14px;
    background: rgba(192,84,68,0.08); border: 1px solid rgba(192,84,68,0.3);
    border-radius: 8px; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .confirm-bar.open { display: flex; }
  .confirm-bar span { font-size: 13px; color: var(--text); flex: 1; min-width: 160px; }
  .confirm-yes {
    padding: 6px 14px; border-radius: 7px; border: none;
    background: #c05444; color: #fff; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .confirm-yes:hover { filter: brightness(1.2); }
  .confirm-no {
    padding: 6px 14px; border-radius: 7px;
    background: none; border: 1px solid var(--border);
    color: var(--text2); font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .confirm-no:hover { border-color: var(--border2); color: var(--text); }


  .edit-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.35);
    color: #60a5fa; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .edit-btn:hover { background: rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.6); }

  #ne_lyrics_editor:empty:before {
    content: attr(placeholder);
    color: var(--text3);
    pointer-events: none;
  }
  #ne_lyrics_editor:focus { outline: none; }

  /* ── MOBILE GLOBAL ── */
  @media (max-width: 768px) {
    body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button, a { min-height: 36px; }
    input, select, textarea { font-size: 16px !important; } /* prevent iOS zoom */
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .sb { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }


  @media (max-width: 600px) {
    #newEserModal > div {
      width: 96vw !important;
      max-height: 90vh !important;
      padding: 16px !important;
      border-radius: 12px !important;
    }
    #newEserModal > div > div[style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
    }
    #ne_lyrics_editor { min-height: 120px !important; max-height: 200px !important; }
  }


  /* Yetki sistemi */
  .admin-only { display: none; }
  .pending-badge {
    display: inline-block;
    background: rgba(249,160,74,.15);
    border: 1px solid rgba(249,160,74,.4);
    color: #F9A04A;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .pending-row { opacity: 0.75; }

  /* PENDING MODAL */
  #pendingModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:2000; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
  .pm-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:min(680px,96vw); padding:28px; }
  .pm-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .pm-title { font-size:16px; font-weight:600; color:var(--text); }
  .pm-close { background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; }
  .pm-item { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px; }
  .pm-item-name { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .pm-item-meta { font-size:12px; color:var(--text2); margin-bottom:10px; display:flex; gap:12px; flex-wrap:wrap; }
  .pm-item-lyrics { font-size:12px; color:var(--text3); background:var(--bg); border-radius:6px; padding:10px; max-height:100px; overflow-y:auto; white-space:pre-wrap; margin-bottom:12px; line-height:1.6; }
  .pm-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .pm-approve { padding:6px 16px; border-radius:7px; background:#3FB950; border:none; color:#fff; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .pm-approve:hover { filter:brightness(1.15); }
  .pm-edit { padding:6px 16px; border-radius:7px; background:rgba(88,166,255,.15); border:1px solid rgba(88,166,255,.4); color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .pm-edit:hover { background:rgba(88,166,255,.25); }
  .pm-reject { padding:6px 16px; border-radius:7px; background:rgba(192,84,68,.12); border:1px solid rgba(192,84,68,.4); color:#e07060; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .pm-reject:hover { background:rgba(192,84,68,.25); }
  .pm-empty { text-align:center; color:var(--text3); padding:32px; font-size:14px; }
</style>
<script src="auth.js"></script>
</head>
<body>

<header>
  <a href="index.html" style="padding:4px 12px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;text-decoration:none;margin-right:2px;">🏠 Ana Sayfa</a>
  <a href="eserler.html" style="padding:4px 12px;border-radius:6px;border:1px solid rgba(88,166,255,.3);background:rgba(88,166,255,.12);color:var(--accent);font-size:13px;text-decoration:none;margin-right:2px;">Eserler</a>
  <a href="repertoires.html" class="admin-only" style="display:none;padding:4px 12px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;text-decoration:none;margin-right:2px;">Repertuvar</a>
  <a href="stage.html" style="padding:4px 12px;border-radius:6px;border:1px solid rgba(88,166,255,.4);background:rgba(88,166,255,.12);color:var(--accent);font-size:13px;text-decoration:none;margin-right:2px;">🎭 Sahne Modu</a>
  <a href="artiesten.html" class="admin-only" style="display:none;padding:4px 12px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;text-decoration:none;">Solistler</a>
  <div class="search-wrap" style="display:none;">
    <span class="search-icon">&#9906;</span>
    <input type="text" id="searchInput" placeholder="Eser adı, besteci, güftekâr, makam, güfte..." autocomplete="off">
  </div>
  <button id="btnAdminNewEser" onclick="openNewEserModal()" class="admin-only" style="padding:5px 14px;border-radius:7px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;">+ Yeni Eser</button>
  <button id="btnUserSuggest" onclick="openSuggestModal()" style="display:none;padding:5px 14px;border-radius:7px;background:rgba(249,160,74,.15);border:1px solid rgba(249,160,74,.4);color:#F9A04A;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;">+ Eser Öner</button>
  <button id="btnOnerilerim" onclick="window.location.href='onerilerim.html'" style="display:none;padding:5px 14px;border-radius:7px;background:rgba(249,160,74,.08);border:1px solid rgba(249,160,74,.3);color:#F9A04A;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;">📋 Önerilerim</button>
  <button id="btnPendingReview" class="admin-only" onclick="showPendingWorks()" style="display:none;padding:5px 12px;border-radius:7px;background:rgba(249,160,74,.15);border:1px solid rgba(249,160,74,.4);color:#F9A04A;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">⏳ Bekleyen: <span id="pendingCount">0</span></button>
  <button class="admin-only" onclick="showEditorManager()" style="padding:5px 12px;border-radius:7px;background:rgba(188,140,255,.15);border:1px solid rgba(188,140,255,.4);color:#BC8CFF;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">👥 Editörler</button>
  <a href="uyeler.html" class="admin-only" style="display:none;padding:5px 12px;border-radius:7px;background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.3);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;">👤 Üyeler</a>
  <div class="count-badge" id="countBadge">411 eser</div>
<div id="userBadge"></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="filter-section">
      <span class="filter-label">Tür / Form</span>
      <div id="formFilters"></div>
    </div>
    <div class="filter-section">
      <span class="filter-label">Akort</span>
      <div id="tuningFilters"></div>
    </div>
    <div class="filter-section">
      <span class="filter-label">Bölge</span>
      <div id="regionFilters"></div>
    </div>
    <div class="filter-section">
      <span class="filter-label">Makam</span>
      <div id="makamFilters"></div>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <div style="padding:10px 16px 0;background:var(--bg);">
      <div style="position:relative;">
        <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none;">&#9906;</span>
        <input type="text" id="searchInput2" placeholder="Eser adı, besteci, güftekâr, makam, güfte..." autocomplete="off"
          style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 36px;color:var(--text);font-size:14px;font-family:'Sora',sans-serif;outline:none;transition:border-color .2s;"
          oninput="document.getElementById('searchInput').value=this.value;applyFilters();">
      </div>
    </div>
    <div class="toolbar">
      <span style="font-size:12px;color:var(--text3);margin-right:4px;">Sırala:</span>
      <button class="sort-btn active" id="sortName" onclick="setSort('name')">Ada Göre</button>
      <button class="sort-btn" id="sortId" onclick="setSort('id')">Numaraya Göre</button>
      <button class="sort-btn" id="sortComposer" onclick="setSort('composer')">Besteciye Göre</button>
      <button class="clear-btn" onclick="clearFilters()">Filtreleri Temizle</button>
    </div>
    <div class="list-panel" id="listPanel"></div>
  </div>

  <aside class="detail" id="detailPanel">
    <div class="detail-empty" id="detailEmpty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      <p>Bir eser seçin</p>
    </div>
    <div id="detailContent" style="display:none;"></div>
  </aside>
</div>

<script>
let DATA = []; // Supabase'den yüklenecek

async function loadWorksFromSupabase() {
  try {
    const r = await fetch(SUPA_URL+'/rest/v1/works?order=name&limit=2000&status=eq.approved', {
      headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY}
    });
    if (!r.ok) { console.error('Supabase HTTP error:', r.status, await r.text()); return false; }
    const rows = await r.json();
    if (!Array.isArray(rows)) { console.error('Supabase unexpected response:', rows); return false; }
    DATA = rows.map(w => ({
      id: w.id,
      name: w.name || '',
      composer: w.composer || '',
      lyricWriter: w.lyric_writer || '',
      makam: w.makam || '',
      form: w.form || '',
      measurement: w.measurement || '',
      metronom: '',
      genre: '',
      instrument: w.instrument || '',
      tuning: w.tuning || '',
      closingNote: w.closing_note || '',
      area: '',
      region: w.region || '',
      sourcePerson: w.source_person || '',
      videoLink: w.video_link || '',
      lyrics: w.lyrics || '',
      status: w.status || 'approved',
      submitted_by: w.submitted_by || '',
      submitter_email: w.submitter_email || '',
      submitted_at: w.submitted_at || ''
    }));
    return true;
  } catch(e) {
    console.error('Supabase yüklenemedi:', e);
    return false;
  }
}
let filteredData = [...DATA];
let selectedId = null;
let sortMode = 'name';
let activeFilters = { form: null, tuning: null, region: null, makam: null };

function getUnique(field) {
  const counts = {};
  DATA.forEach(w => { const v = w[field]; if(v) counts[v] = (counts[v]||0)+1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], 'tr'));
}

function buildFilters() {
  function makeSection(id, field) {
    const el = document.getElementById(id);
    const items = getUnique(field);
    el.innerHTML = items.map(([val, cnt]) =>
      `<button class="filter-btn" data-field="${field}" data-val="${val.replace(/"/g,'&quot;')}" onclick="toggleFilter('${field}','${val.replace(/'/g,"\'")}')">
        ${val} <span class="badge">${cnt}</span>
      </button>`
    ).join('');
  }
  makeSection('formFilters', 'form');
  makeSection('tuningFilters', 'tuning');
  makeSection('regionFilters', 'region');
  makeSection('makamFilters', 'makam');
}

function toggleFilter(field, val) {
  activeFilters[field] = activeFilters[field] === val ? null : val;
  updateFilterButtons();
  applyFilters();
}

function updateFilterButtons() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const f = btn.dataset.field, v = btn.dataset.val;
    btn.classList.toggle('active', activeFilters[f] === v);
  });
}

function clearFilters() {
  activeFilters = { form: null, tuning: null, region: null, makam: null };
  document.getElementById('searchInput').value = '';
  updateFilterButtons();
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filteredData = DATA.filter(w => {
    if (activeFilters.form && w.form !== activeFilters.form) return false;
    if (activeFilters.tuning && w.tuning !== activeFilters.tuning) return false;
    if (activeFilters.region && w.region !== activeFilters.region) return false;
    if (activeFilters.makam && w.makam !== activeFilters.makam) return false;
    if (q) {
      const search = (w.name+w.composer+w.lyricWriter+w.makam+w.region+w.sourcePerson+w.lyrics).toLowerCase();
      if (!search.includes(q)) return false;
    }
    return true;
  });
  sortData();
  renderList();
  document.getElementById('countBadge').textContent = filteredData.length + ' eser';
}

function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  sortData();
  renderList();
}

function sortData() {
  if (sortMode === 'name') filteredData.sort((a,b) => (a.name||'').localeCompare(b.name||'','tr'));
  else if (sortMode === 'id') filteredData.sort((a,b) => (a.id||9999)-(b.id||9999));
  else if (sortMode === 'composer') filteredData.sort((a,b) => (a.composer||'zzz').localeCompare(b.composer||'zzz','tr'));
}

function renderList() {
  const panel = document.getElementById('listPanel');
  if (!filteredData.length) {
    panel.innerHTML = '<div class="empty-list">Eser bulunamadı</div>';
    return;
  }
  panel.innerHTML = filteredData.map(w => {
    const tags = [
      w.makam ? `<span class="tag makam">Makam: ${w.makam}</span>` : '',
      w.form ? `<span class="tag form">Form: ${w.form}</span>` : '',
      w.tuning ? `<span class="tag tuning">Akort: ${w.tuning}</span>` : '',
      w.measurement ? `<span class="tag" style="border-color:#1f3050;color:#6a9fd4;background:#1a1e27;">Usul: ${w.measurement}</span>` : '',
    ].filter(Boolean).join('');
    const sub = [
      w.composer ? `<span>🎼 ${w.composer}</span>` : '',
      w.region ? `<span>📍 Bölge: ${w.region}</span>` : '',
    ].filter(Boolean).join('');
    return `<div class="work-item${selectedId===w.id?' selected':''}" onclick="selectWork(${w.id})" data-id="${w.id}">
      <div class="work-num">${w.id||'—'}</div>
      <div class="work-info">
        <div class="work-name">${w.name||'(isimsiz)'}</div>
        <div class="work-sub">${sub}</div>
        ${tags ? `<div class="work-tags">${tags}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function lyricsCmd(cmd) {
  document.getElementById('ne_lyrics_editor').focus();
  document.execCommand(cmd, false, null);
}
function lyricsAlign(align) {
  const ed = document.getElementById('ne_lyrics_editor');
  ed.focus();
  document.execCommand('justify' + align.charAt(0).toUpperCase() + align.slice(1), false, null);
}
function lyricsFontSize(size) {
  if (!size) return;
  const ed = document.getElementById('ne_lyrics_editor');
  ed.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
    document.execCommand('fontSize', false, '7');
    ed.querySelectorAll('font[size="7"]').forEach(el => {
      el.removeAttribute('size');
      el.style.fontSize = size;
    });
  } else {
    ed.style.fontSize = size;
  }
}
function lyricsClear() {
  const ed = document.getElementById('ne_lyrics_editor');
  ed.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
    document.execCommand('removeFormat', false, null);
  } else {
    ed.style.fontSize = '';
    ed.style.textAlign = '';
  }
}
function getLyricsValue() {
  const ed = document.getElementById('ne_lyrics_editor');
  if (!ed) return '';
  // innerHTML'i düz metne çevir (satır sonları koru)
  return ed.innerText || ed.textContent || '';
}
function setLyricsValue(text) {
  const ed = document.getElementById('ne_lyrics_editor');
  if (!ed) return;
  ed.innerText = text || '';
}

function lyricsInsert(text) {
  const ed = document.getElementById('ne_lyrics_editor');
  ed.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    ed.innerText += text;
  }
}

function saveNewEser() {
  const name = document.getElementById('ne_name').value.trim();
  if (!name) { alert('Eser adı zorunludur.'); return; }

  const fields = {
    name,
    composer:     document.getElementById('ne_composer').value.trim(),
    lyricWriter:  document.getElementById('ne_lyricWriter').value.trim(),
    makam:        document.getElementById('ne_makam').value.trim(),
    measurement:  document.getElementById('ne_measurement').value.trim(),
    form:         document.getElementById('ne_form').value.trim(),
    tuning:       document.getElementById('ne_tuning').value.trim(),
    instrument:   document.getElementById('ne_instrument').value.trim(),
    region:       document.getElementById('ne_region').value.trim(),
    sourcePerson: document.getElementById('ne_sourcePerson').value.trim(),
    videoLink:    document.getElementById('ne_videoLink').value.trim(),
    lyrics:       getLyricsValue().trim(),
    metronom: '', area: '', closingNote: '', genre: '', _custom: true
  };

  if (editingWorkId !== null) {
    // Düzenleme modu — Supabase'e PATCH at
    const patchFields = {
      name: fields.name,
      composer: fields.composer,
      lyric_writer: fields.lyricWriter,
      makam: fields.makam,
      measurement: fields.measurement,
      form: fields.form,
      tuning: fields.tuning,
      instrument: fields.instrument,
      region: fields.region,
      source_person: fields.sourcePerson,
      video_link: fields.videoLink,
      lyrics: fields.lyrics
    };
    const token = localStorage.getItem('sb_token') || SUPA_KEY;
    fetch(SUPA_URL + '/rest/v1/works?id=eq.' + editingWorkId, {
      method: 'PATCH',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(patchFields)
    })
    .then(r => {
      if (r.ok || r.status === 204) {
        // DATA'yı güncelle
        const idx = DATA.findIndex(x => x.id === editingWorkId);
        if (idx > -1) Object.assign(DATA[idx], fields);
        closeNewEserModal();
        buildFilters();
        applyFilters();
        setTimeout(() => {
          const item = document.querySelector('[data-id="' + editingWorkId + '"]');
          if (item) { item.click(); item.scrollIntoView({behavior:'smooth',block:'center'}); }
        }, 100);
      } else {
        r.text().then(t => alert('Kayıt hatası: ' + t));
      }
    })
    .catch(err => alert('Bağlantı hatası: ' + err.message));
  } else {
    // Yeni eser - Supabase'e kaydet
    const status = (isAdmin() || isEditor()) ? 'approved' : 'pending';
    const saveFields = {
      name: fields.name,
      composer: fields.composer,
      lyric_writer: fields.lyricWriter,
      makam: fields.makam,
      measurement: fields.measurement,
      form: fields.form,
      tuning: fields.tuning,
      instrument: fields.instrument,
      region: fields.region,
      source_person: fields.sourcePerson,
      video_link: fields.videoLink,
      lyrics: fields.lyrics,
      status,
      submitted_by: getUserId(),
      submitter_email: getUser()?.email || '',
      submitted_at: new Date().toISOString()
    };

    fetch(SUPA_URL + '/rest/v1/works', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY),
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(saveFields)
    })
    .then(r => r.json())
    .then(data => {
      const newWork = { ...saveFields, id: data[0]?.id || Date.now() };
      DATA.push(newWork);
      closeNewEserModal();
      buildFilters();
      applyFilters();
      if (status === 'pending') {
        alert('Eser öneriniz iletildi! Admin onayından sonra yayınlanacak.');
      } else {
        alert('Eser kaydedildi.');
        setTimeout(() => {
          const item = document.querySelector('[data-id="' + newWork.id + '"]');
          if (item) { item.click(); item.scrollIntoView({behavior:'smooth',block:'center'}); }
        }, 100);
      }
    })
    .catch(err => {
      alert('Kayıt hatası: ' + err.message);
    });
  }
}

function showDeleteConfirm(id) {

function deleteWork(id) {
  const customs = getCustomWorks().filter(w => w.id !== id);
  saveCustomWorks(customs);
  const deleted = JSON.parse(localStorage.getItem('deletedWorks') || '[]');
  if (!deleted.includes(id)) { deleted.push(id); localStorage.setItem('deletedWorks', JSON.stringify(deleted)); }
  const idx = DATA.findIndex(w => w.id === id);
  if (idx > -1) DATA.splice(idx, 1);
  buildFilters();
  applyFilters();
  // Admin için pending sayısını göster
  if (isAdmin()) {
    const pendingWorks = DATA.filter(w => w.status === 'pending');
    const pendingBtn = document.getElementById('btnPendingReview');
    const pendingCount = document.getElementById('pendingCount');
    if (pendingBtn && pendingWorks.length > 0) {
      pendingBtn.style.display = '';
      if (pendingCount) pendingCount.textContent = pendingWorks.length;
    }
  }
  document.getElementById('detailEmpty').style.display = '';
  document.getElementById('detailContent').style.display = 'none';
  selectedId = null;
}

async function assignEditor() {
  const email = document.getElementById('editorEmailInput').value.trim();
  const msg = document.getElementById('editorMsg');
  if (!email) return;
  msg.style.display = 'block';
  msg.textContent = 'Aranıyor...';
  msg.style.color = 'var(--text3)';

  // 1. auth.users'dan email ile UUID bul
  const rUser = await fetch(SUPA_URL + '/rest/v1/profiles?display_name=eq.' + encodeURIComponent(email) + '&select=id,role', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token') }
  });
  const users = rUser.ok ? await rUser.json() : [];

  if (users.length > 0) {
    // Profil var — sadece rolü güncelle
    const uid = users[0].id;
    await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + uid, {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token'), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ role: 'editor' })
    });
    msg.style.color = '#3FB950';
    msg.textContent = '✓ Editör olarak atandı.';
    document.getElementById('editorEmailInput').value = '';
    showEditorManager();
  } else {
    // Profil yok — auth.users'dan UUID alıp INSERT yap
    // Bunun için admin RPC gerekir, SQL ile yapılmalı
    msg.style.color = '#e07060';
    msg.textContent = 'Kullanıcı profili bulunamadı. Kullanıcının en az bir kez giriş yapmış olması gerekiyor.';
  }
}

async function removeEditor(id) {
  await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + id, {
    method: 'PATCH',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token'), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ role: 'member' })
  });
  showEditorManager();
}

async function showPendingWorks() {
  const list = document.getElementById('pendingList');
  list.innerHTML = '<div class="pm-empty">Yükleniyor...</div>';
  document.getElementById('pendingModal').style.display = 'flex';
  const r = await fetch(SUPA_URL + '/rest/v1/works?status=eq.pending&order=id.desc', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY) }
  });
  const pendingWorks = r.ok ? await r.json() : [];
  if (!pendingWorks.length) {
    list.innerHTML = '<div class="pm-empty">Bekleyen eser yok 🎉</div>';
  } else {
    list.innerHTML = pendingWorks.map(w => `
      <div class="pm-item" id="pm-item-${w.id}">
        <div class="pm-item-name">${w.name || '(isimsiz)'}</div>
        <div class="pm-item-meta">
          ${w.submitter_email ? `<span>👤 ${w.submitter_email}</span>` : ''}
          ${w.submitted_at ? `<span>🕐 ${new Date(w.submitted_at).toLocaleString('tr-TR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span>` : ''}
          ${w.composer ? `<span>🎼 ${w.composer}</span>` : ''}
          ${w.makam ? `<span>🎵 ${w.makam}</span>` : ''}
          ${w.region ? `<span>📍 ${w.region}</span>` : ''}
          ${w.measurement ? `<span>♩ ${w.measurement}</span>` : ''}
        </div>
        ${w.lyrics ? `<div class="pm-item-lyrics">${w.lyrics.substring(0,300)}${w.lyrics.length>300?'…':''}</div>` : ''}
        <div class="pm-actions">
          <button class="pm-approve" onclick="approveWork(${w.id})">✓ Onayla</button>
          <button class="pm-edit"    onclick="closePendingModal();openEditEserModal(${w.id})">✏️ Düzenle</button>
          <button class="pm-reject"  onclick="rejectWork(${w.id})">✕ Reddet</button>
        </div>
      </div>`).join('');
  }
}

function closePendingModal() {
  document.getElementById('pendingModal').style.display = 'none';
}

async function approveWork(id) {
  const btn = document.querySelector(`#pm-item-${id} .pm-approve`);
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  const r = await fetch(SUPA_URL+'/rest/v1/works?id=eq.'+id, {
    method: 'PATCH',
    headers: {...{'apikey':SUPA_KEY,'Authorization':'Bearer '+localStorage.getItem('sb_token'),'Content-Type':'application/json','Prefer':'return=minimal'}},
    body: JSON.stringify({ status: 'approved', reviewed_by: getUserId(), reviewed_at: new Date().toISOString() })
  });
  if (r.ok || r.status === 204) {
    const w = DATA.find(x => x.id === id);
    if (w) w.status = 'approved';
    const item = document.getElementById('pm-item-'+id);
    if (item) { item.style.opacity = '.4'; item.innerHTML = '<div style="padding:8px;color:#3FB950;font-size:13px;">✓ Onaylandı</div>'; }
    updatePendingCount();
  } else {
    alert('Hata: ' + await r.text());
    if (btn) { btn.disabled = false; btn.textContent = '✓ Onayla'; }
  }
}

async function rejectWork(id) {
  if (!confirm('Bu eseri reddetmek ve silmek istiyor musunuz?')) return;
  const r = await fetch(SUPA_URL+'/rest/v1/works?id=eq.'+id, {
    method: 'DELETE',
    headers: {'apikey':SUPA_KEY,'Authorization':'Bearer '+localStorage.getItem('sb_token'),'Content-Type':'application/json'}
  });
  if (r.ok || r.status === 204) {
    const idx = DATA.findIndex(x => x.id === id);
    if (idx > -1) DATA.splice(idx, 1);
    const item = document.getElementById('pm-item-'+id);
    if (item) { item.remove(); }
    updatePendingCount();
    applyFilters();
  } else {
    alert('Hata: ' + await r.text());
  }
}

async function updatePendingCount() {
  const r = await fetch(SUPA_URL + '/rest/v1/works?status=eq.pending&select=id', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY) }
  });
  const data = r.ok ? await r.json() : [];
  const cnt = data.length;
  const btn = document.getElementById('btnPendingReview');
  const countEl = document.getElementById('pendingCount');
  if (btn) {
    btn.classList.remove('admin-only');
    btn.style.display = cnt > 0 ? '' : 'none';
  }
  if (countEl) countEl.textContent = cnt;
}

function openSuggestModal() {
  openNewEserModal();
  const title = document.getElementById('modalTitle');
  if (title) title.textContent = '🎵 Eser Öner';
  setTimeout(() => {
    const existingNote = document.getElementById('suggestNote');
    if (!existingNote) {
      const form = document.querySelector('#newEserModal .modal-body') || document.querySelector('#newEserModal .md');
      if (form) {
        const note = document.createElement('div');
        note.id = 'suggestNote';
        note.style.cssText = 'background:rgba(249,160,74,.1);border:1px solid rgba(249,160,74,.3);border-radius:8px;padding:10px 12px;font-size:12px;color:#F9A04A;margin-bottom:12px;';
        note.textContent = 'Öneriniz admin onayından sonra herkese açık olacak.';
        form.insertBefore(note, form.firstChild);
      }
    }
  }, 100);
}
</script>
