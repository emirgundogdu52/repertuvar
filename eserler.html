<!DOCTYPE html>
<!-- design-test v1 -->

<html lang="tr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Repertuvar_logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuar — Eserler</title>
<style>
  :root {
    --bg: #070B18;
    --surface: #19233F;
    --surface2: #222B45;
    --border: rgba(48,58,85,0.6);
    --border2: rgba(48,58,85,0.85);
    --accent: #FFC83D;
    --accent2: #4DA3FF;
    --text: #FFFFFF;
    --text2: #B8BFD2;
    --text3: #78829A;
    --red: #FF5A5F;
    --green: #34C759;
    --tag-bg: #222B45;
    --tag-text: #B8BFD2;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-size:14px; min-height:100vh; }

  /* LAYOUT */
  .layout { display:flex; height:calc(100vh - var(--topnav-h, 56px)); }
  @media (min-width:1024px) { .layout { height:calc(100vh - 49px); } } /* desktop topbar height */

  /* SIDEBAR FILTERS */
  .sidebar:not(#r-sidebar) { display:none; }
  .sidebar::-webkit-scrollbar { width:4px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

  /* FILTER SHEET (Sırala + Filtreler tek yerde) */
  .filter-sheet-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:900; }
  .filter-sheet-overlay.open { display:block; }
  #sidebar.filter-sheet {
    display:block !important; position:fixed !important; z-index:901; background:var(--surface);
    border:1px solid var(--border); transition:transform .25s ease; overflow-y:auto;
  }
  #sidebar.filter-sheet { left:0; right:0; bottom:0; top:auto; max-height:78vh;
    border-radius:16px 16px 0 0; transform:translateY(105%); padding:16px 16px 28px; }
  #sidebar.filter-sheet.open { transform:translateY(0); }
  @media (min-width:769px) {
    #sidebar.filter-sheet { left:auto; top:0; right:0; bottom:0; width:300px; max-height:100vh;
      border-radius:0; transform:translateX(105%); padding:20px; }
    #sidebar.filter-sheet.open { transform:translateX(0); }
  }
  .filter-sheet-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .filter-sheet-header h3 { font-size:15px; font-weight:700; color:var(--text); margin:0; }
  .filter-sheet-close { background:none; border:none; color:var(--text2); font-size:18px; cursor:pointer; line-height:1; }
  .filter-section { padding:0 16px 16px; border-bottom:1px solid var(--border); margin-bottom:0; }
  .filter-section:last-child { border-bottom:none; }
  .filter-label { font-size:10px; font-weight:500; letter-spacing:0.1em; color:var(--text3); text-transform:uppercase; margin-bottom:8px; padding-top:16px; display:block; }
  .filter-btn { display:block; width:100%; text-align:left; background:none; border:none; padding:5px 8px; border-radius:6px; color:var(--text2); font-size:13px; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; cursor:pointer; transition:all .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .filter-btn:hover { background:var(--surface2); color:var(--text); }
  .filter-btn.active { background:rgba(88,166,255,0.15); color:var(--accent); }
  .filter-btn .badge { float:right; background:var(--surface2); border-radius:10px; padding:0 6px; font-size:10px; color:var(--text3); }
  .filter-btn.active .badge { background:rgba(88,166,255,0.2); color:var(--accent); }

  /* WORK LIST */
  .list-panel { flex:1; overflow-y:auto; }
  .list-panel::-webkit-scrollbar { width:5px; }
  .list-panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .work-item { display:flex; align-items:flex-start; gap:12px; padding:8px 20px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  .work-item.zebra { background:var(--surface); }
  [data-theme="light"] .work-item.zebra { background: #f0eeff; }
  [data-theme="light"] .work-item { background: #ffffff; }
  .work-item:hover { background:var(--surface2); }
  .work-item.selected { background:var(--surface2); border-left:3px solid var(--accent); padding-left:17px; }
  .work-num { display:none; }
  .work-info { flex:1; min-width:0; }
  .work-name { font-size:14px; font-weight:500; color:var(--text); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .work-sub { font-size:12px; color:var(--text2); display:flex; gap:8px; flex-wrap:wrap; }
  .work-sub span { display:flex; align-items:center; gap:3px; }
  .work-tags { display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .work-rep-count { font-size:11px; color:var(--text3); margin-top:4px; }
  .work-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; align-self:center; }
  .work-fav { background:none; border:none; font-size:20px; line-height:1; color:var(--text2); cursor:pointer; padding:4px; }
  .work-fav.active { color:var(--accent); }
  .work-chevron { color:var(--text3); font-size:18px; line-height:1; }
  .tag { background:var(--tag-bg); color:var(--tag-text); border-radius:4px; padding:1px 6px; font-size:11px; border:1px solid var(--border); }
  .tag.makam { border-color:#3a3060; color:#9b8fd4; background:#1e1b2e; }
  .tag.form { border-color:#2a3d2a; color:#7ab87a; background:#1a271a; }
  .tag.tuning { border-color:#3d2a1a; color:#c8904a; background:#271a0d; }

  /* DETAIL PANEL */
  .detail { width:520px; min-width:520px; max-width:100vw; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; overflow-x:hidden; }
  .detail::-webkit-scrollbar { width:4px; }
  .detail::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .detail-empty { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; height:100%; color:var(--text3); gap:12px; }
  .detail-empty svg { opacity:.3; }
  .detail-header { padding:14px 16px 12px; border-bottom:1px solid var(--border); background:var(--surface); box-sizing:border-box; width:100%; }
  .detail-id { font-size:11px; color:var(--text3); letter-spacing:.05em; margin-bottom:6px; }
  .detail-title { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-size:18px; font-weight:700; color:var(--text); line-height:1.3; margin-bottom:10px; word-break:break-word; }
  .detail-chips { display:flex; gap:5px; flex-wrap:wrap; max-width:100%; }
  .chip { padding:3px 8px; border-radius:20px; font-size:11px; font-weight:500; white-space:nowrap; }
  .chip.makam { background:#1e1b2e; color:#9b8fd4; border:1px solid #3a3060; }
  .chip.form  { background:#1a271a; color:#7ab87a; border:1px solid #2a3d2a; }
  .chip.tuning{ background:#271a0d; color:#c8904a; border:1px solid #3d2a1a; }
  .chip.meas  { background:#1a1e27; color:#6a9fd4; border:1px solid #1f3050; }
  .detail-body { padding:16px 20px; }
  .detail-row { margin-bottom:14px; }
  .detail-row-label { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:4px; }
  .detail-row-value { font-size:13px; color:var(--text2); line-height:1.5; }
  .detail-divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
  .lyrics-box { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:14px; font-size:13px; color:var(--text2); line-height:1.8; max-height:none; text-align:left;white-space:pre-wrap; word-break:break-word; }
  .lyrics-box::-webkit-scrollbar { width:3px; }
  .lyrics-box::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .video-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; background:rgba(88,166,255,.1); border:1px solid rgba(88,166,255,.3); border-radius:6px; color:var(--accent); font-size:13px; text-decoration:none; transition:all .15s; }
  .video-btn:hover { background:rgba(88,166,255,.2); }

  /* TOOLBAR */
  .toolbar { padding:6px 20px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--bg); }
  .sort-dropdown-wrap { position:relative; }
  .sort-main-btn { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--text2); font-size:12px; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; cursor:pointer; transition:all .15s; }
  .sort-main-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(88,166,255,.08); }
  .sort-dropdown { display:none; position:absolute; top:calc(100% + 4px); left:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; min-width:160px; z-index:500; box-shadow:0 4px 16px rgba(0,0,0,.3); overflow:hidden; }
  .sort-dropdown.open { display:block; }
  .sort-dd-item { display:block; width:100%; text-align:left; padding:8px 14px; font-size:13px; color:var(--text2); background:none; border:none; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; cursor:pointer; transition:background .12s; }
  .sort-dd-item:hover { background:var(--surface2); color:var(--text); }
  .sort-dd-item.active { color:var(--accent); font-weight:600; }
  .sort-btn { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--text2); font-size:12px; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; cursor:pointer; transition:all .15s; }
  .sort-btn:hover { border-color:var(--border2); color:var(--text); }
  .sort-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(88,166,255,.08); }
  .clear-btn { margin-left:auto; background:none; border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--text3); font-size:12px; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; cursor:pointer; transition:all .15s; }
  .clear-btn:hover { color:var(--text2); border-color:var(--border2); }

  /* EMPTY STATE */
  .empty-list { padding:60px 20px; text-align:center; color:var(--text3); }

  @media (max-width: 768px) {
    .sidebar { display:none; }
    .fab-new-eser { bottom: calc(var(--bottom-h, 68px) + 16px) !important; right:16px !important; width:52px !important; height:52px !important; }
    .detail { display:none; width:100vw !important; min-width:0 !important; }
    .detail.mobile-visible {
      display:block; position:fixed;
      top:var(--topnav-h, 56px); left:0; right:0; bottom:var(--bottom-h, 68px);
      z-index:150; overflow-y:auto; overflow-x:hidden; scrollbar-width:none;
      box-sizing:border-box; max-width:100vw; width:100vw;
      min-width:0 !important;
      background:var(--bg);
    }
    .detail.mobile-visible * { max-width:100%; box-sizing:border-box; }
    .detail.mobile-visible .detail-header { padding:12px 14px 10px; width:100%; overflow:visible; }
    .detail.mobile-visible .detail-chips { display:flex; flex-wrap:wrap; gap:4px; overflow:visible; width:100%; }
    .detail.mobile-visible .chip { white-space:nowrap; font-size:10px; padding:2px 7px; }
    .detail.mobile-visible .detail-stage-row { flex-wrap:wrap !important; gap:6px; overflow:visible; }
    .detail.mobile-visible .stage-open-btn,
    .detail.mobile-visible .edit-btn,
    .detail.mobile-visible .delete-btn { font-size:11px; padding:5px 8px; }
    .detail.mobile-visible .tab-dropdown-wrap { padding:6px 14px; box-sizing:border-box; width:100%; overflow:visible; display:flex; justify-content:flex-start; }
    .detail.mobile-visible .tab-main-btn { width:auto; box-sizing:border-box; }
    .detail.mobile-visible .tab-dropdown { left:14px; right:14px; }
    .detail.mobile-visible .detail-body { padding:12px 14px; overflow-x:hidden; width:100%; }
    .detail.mobile-visible .lyrics-box { overflow-x:hidden; word-break:break-word; white-space:pre-wrap; width:100%; max-width:100%; box-sizing:border-box; }
    .detail.mobile-visible::-webkit-scrollbar { display:none; }
    .back-btn { display:flex; align-items:center; gap:6px; padding:12px 20px; color:var(--accent); font-size:14px; cursor:pointer; border-bottom:1px solid var(--border); }
    .sort-bar { padding:8px 12px; gap:6px; }
    .sort-btn { font-size:11px; padding:4px 10px; }
    .layout { height:calc(100vh - var(--topnav-h, 56px) - var(--bottom-h, 68px)); }
  }
  @media (max-width: 480px) {
    .layout { height:calc(100vh - var(--topnav-h, 56px) - var(--bottom-h, 68px)); }
  }
  @media (min-width: 769px) {
    .back-btn { display:none; }
  }

  /* ── SİL BUTONU & ONAY ── */
  .delete-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(192,84,68,0.1); border: 1px solid rgba(192,84,68,0.35);
    color: #e07060; font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all .15s; font-family: inherit; white-space:nowrap;
  }
  .delete-btn:hover { background: rgba(192,84,68,0.22); border-color: rgba(192,84,68,0.6); }

  .stage-open-btn {
    display: inline-flex; align-items: center; justify-content:flex-start; gap: 5px;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.35);
    color: var(--accent); font-size: 12px; font-weight: 500;
    text-decoration: none; transition: all .15s; white-space:nowrap;
  }
  .stage-open-btn:hover { background: rgba(88,166,255,0.2); border-color: rgba(88,166,255,0.6); }

  .actions-wrap { display:none; }

  .tab-dropdown-wrap { position:relative; padding:8px 16px; }
  .tab-main-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 8px;
    background: transparent; border: none;
    color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: color .15s;
    width: 44px; height: 44px;
  }
  .tab-main-btn:hover { color: #fff; background: transparent; }
  .tab-dropdown {
    display: none; position: absolute; top: calc(100% - 4px); left: 16px; right: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; z-index: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); overflow: hidden;
  }
  .tab-dropdown.open { display: block; }
  .tab-dd-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 11px 16px; font-size: 13px;
    color: var(--text2); background: none; border: none;
    font-family: inherit; cursor: pointer; transition: background .12s; text-align: left;
  }
  .tab-dd-item:hover { background: var(--surface2); color: var(--text); }
  .tab-dd-item.active { color: var(--accent); font-weight: 600; background: rgba(88,166,255,.05); }

  .confirm-bar {
    display: none; margin-top: 10px; padding: 12px 14px;
    background: rgba(192,84,68,0.08); border: 1px solid rgba(192,84,68,0.3);
    border-radius: 8px; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .confirm-bar.open { display: flex; }
  .confirm-bar span { font-size: 13px; color: var(--text); flex: 1; min-width: 160px; }
  .confirm-yes {
    padding: 6px 14px; border-radius: 7px; border: none;
    background: #c05444; color: #fff; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .confirm-yes:hover { filter: brightness(1.2); }
  .confirm-no {
    padding: 6px 14px; border-radius: 7px;
    background: none; border: 1px solid var(--border);
    color: var(--text2); font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .confirm-no:hover { border-color: var(--border2); color: var(--text); }


  .edit-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.35);
    color: #60a5fa; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all .15s; font-family: inherit; white-space:nowrap;
  }
  .edit-btn:hover { background: rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.6); }

  #ne_lyrics_editor:empty:before {
    content: attr(placeholder);
    color: var(--text3);
    pointer-events: none;
  }
  #ne_lyrics_editor:focus { outline: none; }

  /* ── MOBILE GLOBAL ── */
  @media (max-width: 768px) {
    body { overflow-x: hidden; max-width: 100vw; -webkit-text-size-adjust: 100%; }
    button:not(.r-theme-toggle), a:not(.r-theme-toggle) { min-height: 36px; }
    input, select, textarea { font-size: 16px !important; } /* prevent iOS zoom */
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .sb { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }


  @media (max-width: 600px) {
    /* Üstteki koyu boşluğu kaldır ve çift iç içe scroll'u engelle */
    #newEserModal {
      padding-top: 0 !important;
      align-items: center !important;
      overflow-y: hidden !important;
    }
    #newEserModal > div {
      width: 96vw !important;
      max-height: 92vh !important;
      padding: 16px !important;
      border-radius: 12px !important;
      overflow-y: auto !important;
    }
    #newEserModal > div > div[style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
    }
    #neTabPanelsWrap { height: 500px !important; overflow-y: auto !important; }
    .ne-tab-panel { min-height: 0 !important; gap: 8px !important; align-content: start !important; }
    #ne_lyrics_editor { min-height: 300px !important; max-height: 300px !important; }
    #ne_chords { height: 300px !important; }
    /* Toolbar'daki grup etiketlerini gizle, satır sayısını azalt */
    #lyricsToolbar > span { display: none !important; }
    #lyricsToolbar { padding: 4px 6px !important; gap: 1px !important; }
    #lyricsToolbar button { height: 24px !important; }
    #newEserModal h2 { margin-bottom: 0 !important; }
    #newEserModal > div > div:first-child { margin-bottom: 12px !important; }
    #newEserModal > div > div > div[style*="margin-bottom:18px"] { margin-bottom: 10px !important; }
    #newEserModal > div > div > div[style*="margin-bottom:16px"] { margin-bottom: 10px !important; }
  }


  /* Yetki sistemi — bkz. topnav.js (tek kaynak, tüm sayfalarda) */
  .pending-badge {
    display: inline-block;
    background: rgba(249,160,74,.15);
    border: 1px solid rgba(249,160,74,.4);
    color: #F9A04A;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .pending-row { opacity: 0.75; }

  /* DETAIL TABS */
  .detail-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--surface); }
  .detail-tab {
    flex:1; padding:10px 6px; text-align:center; font-size:13px; font-weight:700;
    color:var(--text3); cursor:pointer; border-bottom:2px solid transparent;
    transition:all .15s; letter-spacing:.02em; user-select:none;
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  }
  .detail-tab:hover { color:var(--text2); background:var(--surface2); }
  .detail-tab.active { color:var(--accent); border-bottom-color:var(--accent); background:rgba(88,166,255,.05); }
  .detail-tab-content { display:none; }
  .detail-tab-content.active { display:block; }

  /* PENDING MODAL */
  #pendingModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:2000; align-items:flex-start; justify-content:flex-start; padding:40px 16px; overflow-y:auto; }
  .pm-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:min(680px,96vw); padding:28px; }
  .pm-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .pm-title { font-size:16px; font-weight:600; color:var(--text); }
  .pm-close { background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; }
  .pm-item { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px; }
  .pm-item-name { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .pm-item-meta { font-size:12px; color:var(--text2); margin-bottom:10px; display:flex; gap:12px; flex-wrap:wrap; }
  .pm-item-lyrics { font-size:12px; color:var(--text3); background:var(--bg); border-radius:6px; padding:10px; max-height:100px; overflow-y:auto; white-space:pre-wrap; margin-bottom:12px; line-height:1.6; }
  .pm-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .pm-approve { padding:6px 16px; border-radius:7px; background:#3FB950; border:none; color:#fff; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .pm-approve:hover { filter:brightness(1.15); }
  .pm-edit { padding:6px 16px; border-radius:7px; background:rgba(88,166,255,.15); border:1px solid rgba(88,166,255,.4); color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .pm-edit:hover { background:rgba(88,166,255,.25); }
  .pm-reject { padding:6px 16px; border-radius:7px; background:rgba(192,84,68,.12); border:1px solid rgba(192,84,68,.4); color:#e07060; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .pm-reject:hover { background:rgba(192,84,68,.25); }

<body>


<!-- ══ DESKTOP SIDEBAR ══ -->
<!-- ══ MAIN WRAP ══ -->
<div id="r-topnav-container"></div>


<div class="main-wrap">

<div class="layout">

    <div class="filter-section">

  <div id="listCol" style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <div style="padding:10px 16px 0;background:var(--bg);">
      <div style="position:relative;">
        <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none;">&#9906;</span>
        <input type="text" id="searchInput" placeholder="Eser adı veya söz ara..." autocomplete="off"
          style="width:100%;height:42px;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0 12px 0 36px;color:var(--text);font-size:14px;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;outline:none;transition:border-color .2s;"
          oninput="applyFilters();">

    <div class="toolbar">
      <button class="clear-btn" id="filterSheetBtn" onclick="toggleFilterSheet(true)" style="display:flex;align-items:center;gap:6px;">⚙️ Filtre<span id="filterActiveDot" style="display:none;width:7px;height:7px;border-radius:50%;background:var(--accent);"></span></button>
      <button id="btnAdminNewEser" class="admin-only fab-new-eser" onclick="openNewEserModal()" title="Yeni Eser Ekle" style="position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;box-shadow:0 8px 24px rgba(255,200,61,0.4);display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;color:#111;font-weight:600;cursor:pointer;z-index:500;">+</button>
      <button id="btnPendingReviewDesktop" class="admin-only" onclick="showPendingWorks()" style="display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 13px;font-size:12px;color:#F9A04A;font-weight:600;cursor:pointer;font-family:var(--font);">⏳ Onay Bekleyen <span id="pendingCountDesktop" style="background:rgba(249,160,74,.25);border-radius:10px;padding:1px 7px;">0</span></button>
      <button id="btnMobileUserSuggest" onclick="openSuggestModal()" style="display:none;margin-left:auto;align-items:center;gap:5px;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);border-radius:7px;padding:6px 13px;font-size:12px;color:var(--accent);font-weight:600;cursor:pointer;font-family:var(--font);">🎵 Öner</button>
      <button id="btnUserSuggest" onclick="openSuggestModal()" style="display:none;padding:5px 12px;border-radius:7px;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);">🎵 Eser Öner</button>
      <button id="btnOnerilerim" onclick="window.location.href='onerilerim.html'" style="display:none;padding:5px 12px;border-radius:7px;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);">📋 Önerilerim</button>
    </div>

  </div>

  <aside class="detail" id="detailPanel">

      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      <p>Bir eser seçin</p>
    </div>
    <div id="detailContent" style="display:none;"></div>
  </aside>
</div>

<script>
let DATA = []; // Supabase'den yüklenecek


function parseWorksRows(rows) {
  DATA = rows.map(w => ({
    id: w.id, name: w.name || '', composer: w.composer || '',
    lyricWriter: w.lyric_writer || '', makam: w.makam || '',
    form: w.form || '', measurement: w.measurement || '',
    metronom: '', genre: '', instrument: w.instrument || '',
    tuning: w.tuning || '', closingNote: w.closing_note || '',
    area: '', region: w.region || '', sourcePerson: w.source_person || '',
    videoLink: w.video_link || '', lyrics: w.lyrics || '',
    chords: w.chords || '', notaUrl: w.nota_url || '',
    status: w.status || 'approved', submitted_by: w.submitted_by || '',
    submitter_email: w.submitter_email || '', submitted_at: w.submitted_at || ''
  }));
  filteredData = [...DATA];
  buildFilters();
  applyFilters();
}
async function loadWorksFromSupabase() {
  try {
    const token = localStorage.getItem('sb_token') || SUPA_KEY;
    // Admin ve editör tüm eserleri görür, üye sadece onaylananları
    const groupId = getGroupId();
    const groupFilter = groupId ? '&group_id=eq.'+groupId : '';
    const uid = getUserId();
    const statusFilter = (isAdmin() || isEditor()) ? '' : '&or=(status.eq.approved,and(status.eq.pending,submitted_by.eq.'+uid+'))'
    const r = await fetch(SUPA_URL+'/rest/v1/works?select=*&order=name&limit=2000'+groupFilter+statusFilter, {
      headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+token}
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    if (!Array.isArray(rows)) throw new Error('Unexpected response');
    if (typeof db !== 'undefined') db.works.saveAll(rows).catch(()=>{});
    DATA = rows.map(w => ({
      id: w.id,
      name: w.name || '',
      composer: w.composer || '',
      lyricWriter: w.lyric_writer || '',
      makam: w.makam || '',
      form: w.form || '',
      measurement: w.measurement || '',
      metronom: '',
      genre: '',
      instrument: w.instrument || '',
      tuning: w.tuning || '',
      closingNote: w.closing_note || '',
      area: '',
      region: w.region || '',
      sourcePerson: w.source_person || '',
      videoLink: w.video_link || '',
      lyrics: w.lyrics || '',
      chords: w.chords || '',
      notaUrl: w.nota_url || '',
      status: w.status || 'approved',
      submitted_by: w.submitted_by || '',
      submitter_email: w.submitter_email || '',
      submitted_at: w.submitted_at || ''
    }));
    return true;
  } catch(e) {
    console.warn('[eserler] Supabase hatasi, IndexedDB deneniyor:', e.message);
    try {
      if (typeof db !== 'undefined') {
        const cached = await db.works.getAll();
        if (cached && cached.length > 0) {
          console.log('[eserler] IndexedDB fallback:', cached.length, 'eser');
          parseWorksRows(cached);
          return true;
        }
      }
    } catch(e2) { console.warn('[eserler] IndexedDB hatasi:', e2); }
    return false;
  }
}
let filteredData = [...DATA];
let selectedId = null;
let sortMode = 'name';
let activeFilters = { form: null, tuning: null, region: null, makam: null };

function getUnique(field) {
  const counts = {};
  DATA.forEach(w => { const v = w[field]; if(v) counts[v] = (counts[v]||0)+1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], 'tr'));
}

function buildFilters() {
  function makeSection(id, field) {
    const el = document.getElementById(id);
    const items = getUnique(field);
    el.innerHTML = items.map(([val, cnt]) =>
      `<button class="filter-btn" data-field="${field}" data-val="${val.replace(/"/g,'&quot;')}" onclick="toggleFilter('${field}','${val.replace(/'/g,"\'")}')">
        ${val} <span class="badge">${cnt}</span>
      </button>`
    ).join('');
  }
  makeSection('formFilters', 'form');
  makeSection('tuningFilters', 'tuning');
  makeSection('regionFilters', 'region');
  makeSection('makamFilters', 'makam');
}

function toggleFilter(field, val) {
  activeFilters[field] = activeFilters[field] === val ? null : val;
  updateFilterButtons();
  applyFilters();
}

function updateFilterButtons() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const f = btn.dataset.field, v = btn.dataset.val;
    btn.classList.toggle('active', activeFilters[f] === v);
  });
}

function clearFilters() {
  activeFilters = { form: null, tuning: null, region: null, makam: null };
  document.getElementById('searchInput').value = '';
  updateFilterButtons();
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filteredData = DATA.filter(w => {
    if (w.status === 'pending' && w.submitted_by !== getUserId()) return false; // Sadece kendi pending eserlerini göster
    if (activeFilters.form && w.form !== activeFilters.form) return false;
    if (activeFilters.tuning && w.tuning !== activeFilters.tuning) return false;
    if (activeFilters.region && w.region !== activeFilters.region) return false;
    if (activeFilters.makam && w.makam !== activeFilters.makam) return false;
    if (q) {
      const search = (w.name+w.composer+w.lyricWriter+w.makam+w.region+w.sourcePerson+w.lyrics).toLowerCase();
      if (!search.includes(q)) return false;
    }
    return true;
  });
  sortData();
  renderList();
  const countBadgeEl = document.getElementById('countBadge');
  if (countBadgeEl) countBadgeEl.textContent = filteredData.length + ' eser';
}

// ── Favoriler (localStorage, kullanıcıya özel) ──
function getFavKey() {
  const uid = (typeof getUserId === 'function') ? getUserId() : null;
  return 'repertuvar_favs_' + (uid || 'anon');
}
function getFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(getFavKey()) || '[]').map(Number)); }
  catch(e) { return new Set(); }
}
function toggleFavorite(id, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const favs = getFavs();
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  localStorage.setItem(getFavKey(), JSON.stringify([...favs]));
  renderList();
}

// ── Her eserin kaç repertuvarda kullanıldığı (Supabase repertoire_items) ──
async function loadRepertoireCounts() {
  try {
    const token = localStorage.getItem('sb_token') || SUPA_KEY;
    const r = await fetch(SUPA_URL + '/rest/v1/repertoire_items?select=work_id', {
      headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token}
    });
    if (!r.ok) return;
    const rows = await r.json();
    const counts = {};
    rows.forEach(row => { counts[row.work_id] = (counts[row.work_id] || 0) + 1; });
    window.WORK_REP_COUNTS = counts;
    renderList();
  } catch(e) { console.warn('[eserler] Repertuvar sayımı alınamadı:', e.message); }
}

function toggleFilterSheet(show) {
  const overlay = document.getElementById('filterSheetOverlay');
  const sheet = document.getElementById('sidebar');
  if (!overlay || !sheet) return;
  overlay.classList.toggle('open', show);
  sheet.classList.toggle('open', show);
}

function toggleSortDropdown() {
  const dd = document.getElementById('sortDropdown');
  dd.classList.toggle('open');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.sort-dropdown-wrap')) {
    const dd = document.getElementById('sortDropdown');
    if (dd) dd.classList.remove('open');
  }
});

const SORT_LABELS = { name:'Ada Göre', composer:'Besteciye Göre', makam:'Makama Göre', form:'Forma Göre', region:'Yöreye Göre' };

function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-dd-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sort-dd-item').forEach(b => { if(b.textContent.trim() === SORT_LABELS[mode]) b.classList.add('active'); });
  const btn = document.getElementById('sortMainBtn');
  if (btn) btn.textContent = (SORT_LABELS[mode] || 'Sırala') + ' ▾';
  const dd = document.getElementById('sortDropdown');
  if (dd) dd.classList.remove('open');
  sortData();
  renderList();
}

function sortData() {
  if (sortMode === 'name') filteredData.sort((a,b) => (a.name||'').localeCompare(b.name||'','tr'));
  else if (sortMode === 'composer') filteredData.sort((a,b) => (a.composer||'zzz').localeCompare(b.composer||'zzz','tr'));
  else if (sortMode === 'makam') filteredData.sort((a,b) => (a.makam||'zzz').localeCompare(b.makam||'zzz','tr'));
  else if (sortMode === 'form') filteredData.sort((a,b) => (a.form||'zzz').localeCompare(b.form||'zzz','tr'));
  else if (sortMode === 'region') filteredData.sort((a,b) => (a.region||'zzz').localeCompare(b.region||'zzz','tr'));
}

function renderList() {
  const panel = document.getElementById('listPanel');
  if (!filteredData.length) {
    panel.innerHTML = '<div class="empty-list">Eser bulunamadı</div>';
    return;
  }
  const favs = getFavs();
  panel.innerHTML = filteredData.map((w, _zi) => {
    const tags = [
      w.makam ? `<span class="tag makam">Makam: ${w.makam}</span>` : '',
      w.form ? `<span class="tag form">Form: ${w.form}</span>` : '',
      w.tuning ? `<span class="tag tuning">Akort: ${w.tuning}</span>` : '',
      w.measurement ? `<span class="tag" style="border-color:#1f3050;color:#6a9fd4;background:#1a1e27;">Usul: ${w.measurement}</span>` : '',
    ].filter(Boolean).join('');
    const sub = [
      w.composer ? `<span>🎼 ${w.composer}</span>` : '',
      w.region ? `<span>📍 Bölge: ${w.region}</span>` : '',
    ].filter(Boolean).join('');
    const repCount = (window.WORK_REP_COUNTS && window.WORK_REP_COUNTS[w.id]) || 0;
    const repLine = repCount > 0 ? `<div class="work-rep-count">🎵 ${repCount} repertuvarda kullanılıyor</div>` : '';
    const isFav = favs.has(w.id);
    return `<div class="work-item${selectedId===w.id?' selected':_zi%2===1?' zebra':''}" onclick="selectWork(${w.id})" data-id="${w.id}">
      <div class="work-num">${w.id||'—'}</div>
      <div class="work-info">
        <div class="work-name">${w.name||'(isimsiz)'}</div>
        <div class="work-sub">${sub}</div>
        ${tags ? `<div class="work-tags">${tags}</div>` : ''}
        ${repLine}
      </div>
      <div class="work-actions">
        <button class="work-fav${isFav?' active':''}" onclick="toggleFavorite(${w.id}, event)" title="Favori">${isFav ? '★' : '☆'}</button>
        <span class="work-chevron">›</span>
      </div>
    </div>`;
  }).join('');
}


function saveStageList(currentId) {
  const ids = filteredData.map(x => String(parseInt(x.id)));
  localStorage.setItem('stageWorkList', JSON.stringify(ids));
  localStorage.setItem('stageWorkId', currentId);
}
function selectWork(id) {
  selectedId = id;
  const w = DATA.find(x => x.id === id);
  document.querySelectorAll('.work-item').forEach(el => el.classList.toggle('selected', parseInt(el.dataset.id)===id));
  if (!w) return;

  document.getElementById('detailEmpty').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'block';

  const chips = [
    w.makam ? `<span class="chip makam">🎵 Makam: ${w.makam}</span>` : '',
    w.form ? `<span class="chip form">📋 Form: ${w.form}</span>` : '',
    w.tuning ? `<span class="chip tuning">🎸 Akort: ${w.tuning}</span>` : '',
    w.measurement ? `<span class="chip meas">♩ Usul: ${w.measurement}</span>` : '',
  ].filter(Boolean).join('');

  function row(label, val) {
    if (!val) return '';
    return `<div class="detail-row"><div class="detail-row-label">${label}</div><div class="detail-row-value">${val}</div></div>`;
  }
  function row2(label, val) {
    if (!val) return '';
    return `<div class="detail-row" style="min-width:0;"><div class="detail-row-label">${label}</div><div class="detail-row-value" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${val}">${val}</div></div>`;
  }

  const videoBtn = w.videoLink ? `<a href="${w.videoLink}" target="_blank" class="video-btn">▶ Video İzle</a>` : '';
  const stageId = String(parseInt(w.id));
  const lastTab = 'gufte';  // Her eser açılışında güfteden başla
  const stageBtn = `<a href="stage.html?work=${stageId}" class="stage-open-btn" onclick="openStageFromDetail('${stageId}');return false;">🎭 Sahne Modunda Aç</a>`;

  dc.innerHTML = `
    <div class="back-btn" onclick="backFromDetail()">← Listeye Dön</div>
    <div class="detail-header">
      <div class="detail-title">${w.name||'(isimsiz)'}</div>
      <div class="detail-chips">${chips}</div>
      <div class="detail-stage-row" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;width:100%;">
        ${stageBtn}
        ${videoBtn}
        <button class="edit-btn" onclick="openEditEserModal(${w.id})" id="editBtn-${w.id}" style="display:none">✏️ Düzenle</button>
        <button class="delete-btn" onclick="showDeleteConfirm(${w.id})" id="deleteBtn-${w.id}" style="display:none">🗑 Sil</button>
      </div>
      <div class="confirm-bar" id="confirm-${w.id}">
        <span>Bu eseri silmek istediğinize emin misiniz?</span>
        <button class="confirm-yes" onclick="deleteWork(${w.id})">Evet, Sil</button>
        <button class="confirm-no" onclick="hideDeleteConfirm(${w.id})">İptal</button>
      </div>
    </div>

    <div class="tab-dropdown-wrap">
      <button class="tab-main-btn" id="tabMainBtn" onclick="event.stopPropagation();toggleTabDropdown()">
        <svg width="24" height="24" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="4" cy="10" r="2.5" fill="currentColor"/>
          <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
          <circle cx="16" cy="10" r="2.5" fill="currentColor"/>
        </svg>
      </button>
      <div class="tab-dropdown" id="tabDropdown">
        <button class="tab-dd-item${lastTab==='gufte'?' active':''}" onclick="switchDetailTab('gufte')">🎵 Güfte</button>
        <button class="tab-dd-item${lastTab==='akorlar'?' active':''}" onclick="switchDetailTab('akorlar')">🎸 Akorlar</button>
        <button class="tab-dd-item${lastTab==='bilgiler'?' active':''}" onclick="switchDetailTab('bilgiler')">📋 Bilgiler</button>
        <button class="tab-dd-item${lastTab==='nota'?' active':''}" onclick="switchDetailTab('nota')">🎼 Nota</button>
        <button class="tab-dd-item${lastTab==='hikaye'?' active':''}" onclick="switchDetailTab('hikaye')">📖 Hikaye</button>
      </div>
    </div>

    <div id="tab-gufte" class="detail-tab-content detail-body${lastTab==='gufte'?' active':''}">
      ${w.lyrics
        ? `<div class="lyrics-box">${renderLyricsHtml(w.lyrics)}</div>`
        : `<div style="color:var(--text3);font-size:13px;padding:12px 0;">Bu eser için güfte eklenmemiş.</div>`
      }
    </div>

    <div id="tab-akorlar" class="detail-tab-content detail-body${lastTab==='akorlar'?' active':''}">
      <div style="margin-bottom:16px;">
        <div style="font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">Güfte & Akorlar</div>
        <div class="lyrics-box" style="font-family:monospace;font-size:13px;line-height:2;">

function renderChords(text) {
  const lines = text.trim().split('\n');
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('%%')) {
      const akorlar = line.slice(2).trim();
      if (akorlar) {
        html += `<span style="color:#58A6FF;opacity:.9;font-size:12px;letter-spacing:.08em;display:block;margin-top:4px;">${akorlar}</span>`;
      }
    } else if (line.trim() === '') {
      html += `<span style="display:block;height:8px;"></span>`;
    } else {
      html += `<span style="color:var(--text2);display:block;">${line.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`;
    }
  }
  return html;
}

async function saveChords(id) {
  const ta = document.getElementById('inline_chords_'+id);
  if (!ta) { console.error('textarea bulunamadı: inline_chords_'+id); return; }
  const chords = ta.value.trim();
  const token = localStorage.getItem('sb_token') || SUPA_KEY;
  fetch(SUPA_URL + '/rest/v1/works?id=eq.' + id, {
    method: 'PATCH',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({chords: chords})
  }).then(r => {
    if (r.ok || r.status === 204) {
      const idx = DATA.findIndex(x => x.id === id || x.id === parseInt(id));
      if (idx > -1) DATA[idx].chords = chords;
      const display = document.querySelector('#tab-akorlar .lyrics-box');
      if (display) {
        display.innerHTML = chords ? renderChords(chords) : '<span style="color:var(--text3);font-size:12px;">Akor bilgisi henüz eklenmemiş.</span>';
      }
      const alertMsg = document.createElement('div');
      alertMsg.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;';
      alertMsg.textContent = '✓ Akorlar kaydedildi';
      document.body.appendChild(alertMsg);
      setTimeout(() => alertMsg.remove(), 2500);
    } else {
      r.text().then(t => alert('Kayıt hatası: ' + t));
    }
  }).catch(err => alert('Bağlantı hatası: ' + err.message));
}

async function uploadNota(id, input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('notaUploadStatus_'+id);
  if (status) status.textContent = '⏳ Yükleniyor...';
  const token = localStorage.getItem('sb_token') || SUPA_KEY;
  const ext = file.name.split('.').pop();
  const path = `works/${id}/nota_${Date.now()}.${ext}`;
  // Upload to Supabase Storage
  const uploadRes = await fetch(`${SUPA_URL}/storage/v1/object/notalar/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Type': file.type,
      'x-upsert': 'true'
    },
    body: file
  });
  if (!uploadRes.ok) {
    if (status) status.textContent = '❌ Yükleme hatası!';
    return;
  }
  const notaUrl = `${SUPA_URL}/storage/v1/object/public/notalar/${path}`;
  // Save URL to works table
  const patchRes = await fetch(`${SUPA_URL}/rest/v1/works?id=eq.${id}`, {
    method: 'PATCH',
    headers: {'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({nota_url: notaUrl})
  });
  if (patchRes.ok || patchRes.status === 204) {
    const idx = DATA.findIndex(x => x.id === id);
    if (idx > -1) DATA[idx].notaUrl = notaUrl;
    if (status) status.textContent = '✓ Yüklendi!';
    setTimeout(() => selectWork(id), 800);
  } else {
    if (status) status.textContent = '❌ Kayıt hatası!';
  }
}

async function deleteNota(id) {
  if (!confirm('Notayı kaldırmak istediğinizden emin misiniz?')) return;
  const token = localStorage.getItem('sb_token') || SUPA_KEY;
  const r = await fetch(`${SUPA_URL}/rest/v1/works?id=eq.${id}`, {
    method: 'PATCH',
    headers: {'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({nota_url: null})

    selectWork(id);
  }
}

// Güfte metnini satır satır işleyip "❗" ile başlayan satırları vurgulu gösterir.
// Not: Bu fonksiyon eserler.html içindeki eser detay görünümünü kapsar.
// Sahne Modu / Yazdır gibi güftenin gösterildiği diğer sayfalarda da aynı vurguyu
// istersen bu fonksiyonu oraya da eklememiz gerekir.
function renderLyricsHtml(lyrics) {
  if (!lyrics) return '';
  return lyrics.split('\n').map(line => {
    const esc = line.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (/^\s*❗/.test(line)) {
      const clean = esc.replace(/^\s*❗\s?/, '');
      return `<span style="color:#ef4444;font-weight:700;">❗ ${clean}</span>`;
    }
    return esc;
  }).join('\n');
}
function getLyricsValue() {
  const ed = document.getElementById('ne_lyrics_editor');
  if (!ed) return '';
  // innerHTML'i düz metne çevir (satır sonları koru)
  return ed.innerText || ed.textContent || '';
}
function setLyricsValue(text) {
  const ed = document.getElementById('ne_lyrics_editor');
  if (!ed) return;
  ed.innerText = text || '';
}

function lyricsInsert(text) {
  const ed = document.getElementById('ne_lyrics_editor');
  ed.focus();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    ed.innerText += text;
  }
}

        'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY),
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(saveFields)
    })
    .then(r => r.json())
    .then(data => {
      const newWork = { ...saveFields, id: data[0]?.id || Date.now() };
      DATA.push(newWork);
      closeNewEserModal();
      buildFilters();
      applyFilters();
      if (status === 'pending') {
        alert('Eser öneriniz iletildi! Admin onayından sonra yayınlanacak.');
      } else {
        alert('Eser kaydedildi.');
        setTimeout(() => {
          const item = document.querySelector('[data-id="' + newWork.id + '"]');
          if (item) { item.click(); item.scrollIntoView({behavior:'smooth',block:'center'}); }
        }, 100);
      }
    })
    .catch(err => {
      alert('Kayıt hatası: ' + err.message);
    });
  }
}

async function deleteWork(id) {
  const r = await fetch(SUPA_URL+'/rest/v1/works?id=eq.'+id, {
    method: 'DELETE',
    headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer '+(getToken()||SUPA_KEY)}
  });
  if (!r.ok && r.status !== 204) { alert('Silme hatası: ' + await r.text()); return; }
  const customs = getCustomWorks().filter(w => w.id !== id);
  saveCustomWorks(customs);
  const deleted = JSON.parse(localStorage.getItem('deletedWorks') || '[]');
  if (!deleted.includes(id)) { deleted.push(id); localStorage.setItem('deletedWorks', JSON.stringify(deleted)); }
  const idx = DATA.findIndex(w => w.id === id);
  if (idx > -1) DATA.splice(idx, 1);
  buildFilters();
  applyFilters();
  // Admin için pending sayısını göster
  if (isAdmin()) {
    const pendingWorks = DATA.filter(w => w.status === 'pending');
    const pendingBtn = document.getElementById('btnPendingReview');
    const pendingCount = document.getElementById('pendingCount');
    if (pendingBtn && pendingWorks.length > 0) {
      pendingBtn.style.display = '';
      if (pendingCount) pendingCount.textContent = pendingWorks.length;
    }
  }
  document.getElementById('detailEmpty').style.display = '';
  document.getElementById('detailContent').style.display = 'none';
  selectedId = null;
}

    const mobileNewBtn = document.getElementById('btnMobileNewEser');

    const suggestBtn = document.getElementById('btnUserSuggest');
    if (suggestBtn) suggestBtn.style.display = 'none';
    const mobileSuggestBtn = document.getElementById('btnMobileUserSuggest');
    if (mobileSuggestBtn) mobileSuggestBtn.style.display = 'none';
    const onerilerimBtn = document.getElementById('btnOnerilerim');
    if (onerilerimBtn) onerilerimBtn.style.display = 'none';
    updatePendingCount();
  } else {
    const suggestBtn = document.getElementById('btnUserSuggest');
    if (suggestBtn) suggestBtn.style.display = '';
    const mobileSuggestBtn = document.getElementById('btnMobileUserSuggest');
    if (mobileSuggestBtn) mobileSuggestBtn.style.display = 'flex';
    const onerilerimBtn = document.getElementById('btnOnerilerim');
    if (onerilerimBtn) onerilerimBtn.style.display = '';
  }

  const _lp = document.getElementById('listPanel'); if(_lp) _lp.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3);">Eserler yükleniyor...</div>';
  
  await loadWorksFromSupabase();
  loadRepertoireCounts(); // arka planda, listeyi bloklamadan
  
  // URL'den id parametresi varsa o eseri seç
  const urlId = new URLSearchParams(window.location.search).get('id');
  if (urlId) {
    const found = DATA.find(x => String(x.id) === String(urlId));
    if (found) setTimeout(() => selectWork(found.id), 100);
  }
  
  // Cache works list for Solistler page (DATA artık dolu)
  try {
    const list = DATA.filter(w => w.name).map(w => ({id: String(w.id), name: w.name, composer: w.composer||'', makam: w.makam||''}));
    localStorage.setItem('worksListCache', JSON.stringify(list));
  } catch(e) {}

  buildFilters();
  applyFilters();
  if (isAdmin() || isEditor()) updatePendingCount();
})();



async function showEditorManager() {
  document.getElementById('editorModal').style.display = 'flex';
  const list = document.getElementById('editorList');
  list.innerHTML = '<div style="color:var(--text3);font-size:13px;">Yükleniyor...</div>';
  const r = await fetch(SUPA_URL + '/rest/v1/profiles?role=eq.editor&select=id,email,role', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token') }
  });
  const editors = await r.json();
  if (!editors.length) {
    list.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:12px 0;">Henüz editör yok.</div>';
  } else {
    list.innerHTML = editors.map(e => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:8px;">
        <span style="font-size:13px;color:var(--text);">${e.email || e.id}</span>
        <button onclick="removeEditor('${e.id}')" style="padding:4px 10px;border-radius:6px;background:rgba(192,84,68,.1);border:1px solid rgba(192,84,68,.3);color:#e07060;font-size:12px;cursor:pointer;font-family:inherit;">Kaldır</button>
      </div>`).join('');
  }
}

async function assignEditor() {
  const email = document.getElementById('editorEmailInput').value.trim();
  const msg = document.getElementById('editorMsg');
  if (!email) return;
  msg.style.display = 'block';
  msg.textContent = 'Aranıyor...';
  msg.style.color = 'var(--text3)';

  // 1. profiles'dan email ile UUID bul
  const rUser = await fetch(SUPA_URL + '/rest/v1/profiles?email=eq.' + encodeURIComponent(email) + '&select=id,role', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token') }
  });
  const users = rUser.ok ? await rUser.json() : [];

  if (users.length > 0) {
    // Profil var — sadece rolü güncelle
    const uid = users[0].id;
    await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + uid, {
      method: 'PATCH',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token'), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ role: 'editor' })
    });
    msg.style.color = '#3FB950';
    msg.textContent = '✓ Editör olarak atandı.';
    document.getElementById('editorEmailInput').value = '';
    showEditorManager();
  } else {
    // Profil yok — auth.users'dan UUID alıp INSERT yap
    // Bunun için admin RPC gerekir, SQL ile yapılmalı
    msg.style.color = '#e07060';
    msg.textContent = 'Kullanıcı profili bulunamadı. Kullanıcının en az bir kez giriş yapmış olması gerekiyor.';
  }
}

async function removeEditor(id) {
  await fetch(SUPA_URL + '/rest/v1/profiles?id=eq.' + id, {
    method: 'PATCH',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + localStorage.getItem('sb_token'), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ role: 'member' })
  });
  showEditorManager();
}

async function showPendingWorks() {
  const list = document.getElementById('pendingList');
  list.innerHTML = '<div class="pm-empty">Yükleniyor...</div>';
  document.getElementById('pendingModal').style.display = 'flex';
  const r = await fetch(SUPA_URL + '/rest/v1/works?status=eq.pending&order=id.desc', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY) }
  });
  const pendingWorks = r.ok ? await r.json() : [];
  if (!pendingWorks.length) {
    list.innerHTML = '<div class="pm-empty">Bekleyen eser yok 🎉</div>';
  } else {
    list.innerHTML = pendingWorks.map(w => `
      <div class="pm-item" id="pm-item-${w.id}">
        <div class="pm-item-name">${w.name || '(isimsiz)'}</div>
        <div class="pm-item-meta">
          ${w.submitter_email ? `<span>👤 ${w.submitter_email}</span>` : ''}
          ${w.submitted_at ? `<span>🕐 ${new Date(w.submitted_at).toLocaleString('tr-TR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span>` : ''}
          ${w.composer ? `<span>🎼 ${w.composer}</span>` : ''}
          ${w.makam ? `<span>🎵 ${w.makam}</span>` : ''}
          ${w.region ? `<span>📍 ${w.region}</span>` : ''}
          ${w.measurement ? `<span>♩ ${w.measurement}</span>` : ''}
        </div>
        ${w.lyrics ? `<div class="pm-item-lyrics">${w.lyrics.substring(0,300)}${w.lyrics.length>300?'…':''}</div>` : ''}
        <div class="pm-actions">
          <button class="pm-approve" onclick="approveWork(${w.id})">✓ Onayla</button>
          <button class="pm-edit"    onclick="closePendingModal();openEditEserModal(${w.id})">✏️ Düzenle</button>
          <button class="pm-reject"  onclick="rejectWork(${w.id})">✕ Reddet</button>
        </div>
      </div>`).join('');
  }
}

function closePendingModal() {
  document.getElementById('pendingModal').style.display = 'none';
}

async function approveWork(id) {
  const btn = document.querySelector(`#pm-item-${id} .pm-approve`);
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  const r = await fetch(SUPA_URL+'/rest/v1/works?id=eq.'+id, {
    method: 'PATCH',
    headers: {...{'apikey':SUPA_KEY,'Authorization':'Bearer '+localStorage.getItem('sb_token'),'Content-Type':'application/json','Prefer':'return=minimal'}},
    body: JSON.stringify({ status: 'approved', reviewed_by: getUserId(), reviewed_at: new Date().toISOString() })
  });
  if (r.ok || r.status === 204) {
    const w = DATA.find(x => x.id === id);
    if (w) w.status = 'approved';
    const item = document.getElementById('pm-item-'+id);
    if (item) { item.style.opacity = '.4'; item.innerHTML = '<div style="padding:8px;color:#3FB950;font-size:13px;">✓ Onaylandı</div>'; }
    updatePendingCount();
  } else {
    alert('Hata: ' + await r.text());
    if (btn) { btn.disabled = false; btn.textContent = '✓ Onayla'; }
  }
}

async function rejectWork(id) {
  if (!confirm('Bu eseri reddetmek ve silmek istiyor musunuz?')) return;
  const r = await fetch(SUPA_URL+'/rest/v1/works?id=eq.'+id, {
    method: 'DELETE',
    headers: {'apikey':SUPA_KEY,'Authorization':'Bearer '+localStorage.getItem('sb_token'),'Content-Type':'application/json'}
  });
  if (r.ok || r.status === 204) {
    const idx = DATA.findIndex(x => x.id === id);
    if (idx > -1) DATA.splice(idx, 1);
    const item = document.getElementById('pm-item-'+id);
    if (item) { item.remove(); }
    updatePendingCount();
    applyFilters();
  } else {
    alert('Hata: ' + await r.text());
  }
}

async function updatePendingCount() {
  const r = await fetch(SUPA_URL + '/rest/v1/works?status=eq.pending&select=id', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || SUPA_KEY) }
  });
  const data = r.ok ? await r.json() : [];
  const cnt = data.length;
  const btn = document.getElementById('btnPendingReview');
  const countEl = document.getElementById('pendingCount');
  if (btn) {
    btn.classList.remove('admin-only');
    btn.style.display = cnt > 0 ? '' : 'none';
  }
  if (countEl) countEl.textContent = cnt;
  // Desktop topbar butonu
  const btnD = document.getElementById('btnPendingReviewDesktop');
  const countD = document.getElementById('pendingCountDesktop');
  if (btnD) { btnD.classList.remove('admin-only'); btnD.style.display = ''; }
  if (countD) countD.textContent = cnt;
}

function openSuggestModal() {
  openNewEserModal();
  const title = document.getElementById('modalTitle');
  if (title) title.textContent = '🎵 Eser Öner';
  setTimeout(() => {
    const existingNote = document.getElementById('suggestNote');
    if (!existingNote) {
      const form = document.querySelector('#newEserModal .modal-body') || document.querySelector('#newEserModal .md');
      if (form) {
        const note = document.createElement('div');
        note.id = 'suggestNote';

        note.textContent = 'Öneriniz admin onayından sonra herkese açık olacak.';
        form.insertBefore(note, form.firstChild);
      }
    }
  }, 100);
}

<script>
(function(){
  function _v2NavInit(){
    if(typeof getUser !== 'function') return;
    const u = getUser();
    if(!u) return;
    const name = u?.user_metadata?.full_name || u?.email?.split('@')[0] || '—';
    const initial = name.charAt(0).toUpperCase();
    ['sbUserName','tnUserName'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=name;});
    ['sbAvatar','tnAvatar'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=initial;});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',_v2NavInit);
  else _v2NavInit();
  // Role-based nav items
  function _v2RoleInit(){
    if(typeof isAdmin!=='function') return;
    if(isAdmin()||isEditor()){document.querySelectorAll('.admin-only').forEach(el=>el.classList.remove('admin-only'));}
    const roleEl=document.getElementById('sbUserRole');
    if(roleEl){
      if(typeof isAdmin==='function'&&isAdmin()) roleEl.textContent='Admin';
      else if(typeof isEditor==='function'&&isEditor()) roleEl.textContent='Editör';
      else roleEl.textContent='Üye';
    }
  }
  setTimeout(_v2RoleInit,300);
})();
</script>
<script>
// Ana sayfadan "Eser ara" butonuyla gelindiyse arama kutusuna fokuslan
if (new URLSearchParams(window.location.search).get('search') === '1') {
  function _focusSearch() {
    const inp = document.getElementById('searchInput');
    if (inp) {
      requestAnimationFrame(() => { inp.focus(); inp.select(); });
    } else {
      setTimeout(_focusSearch, 150);
    }
  }
  setTimeout(_focusSearch, 800);
}
</script>
