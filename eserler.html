<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertuar — Eserler</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: #2a2a2f;
    --border2: #38383f;
    --accent: #c9963a;
    --accent2: #e8b055;
    --text: #f0ede6;
    --text2: #9b9890;
    --text3: #5c5a56;
    --red: #c05444;
    --green: #4a9462;
    --tag-bg: #252528;
    --tag-text: #b8b4ac;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans', sans-serif; font-size:14px; min-height:100vh; }

  /* HEADER */
  header { background:var(--surface); border-bottom:1px solid var(--border); padding:0 20px; display:flex; align-items:center; gap:16px; height:56px; position:sticky; top:0; z-index:100; }
  .logo { font-family:'Playfair Display', serif; font-size:20px; color:var(--accent); letter-spacing:0.02em; white-space:nowrap; }
  .logo span { color:var(--text2); font-size:13px; font-family:'DM Sans', sans-serif; margin-left:8px; font-weight:300; }
  .search-wrap { flex:1; max-width:480px; position:relative; }
  .search-wrap input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px 8px 36px; color:var(--text); font-size:14px; font-family:'DM Sans', sans-serif; outline:none; transition:border-color .2s; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-wrap input::placeholder { color:var(--text3); }
  .search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:15px; pointer-events:none; }
  .count-badge { margin-left:auto; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:12px; color:var(--text2); white-space:nowrap; }

  /* LAYOUT */
  .layout { display:flex; height:calc(100vh - 56px); }

  /* SIDEBAR FILTERS */
  .sidebar { width:220px; min-width:220px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; padding:16px 0; }
  .sidebar::-webkit-scrollbar { width:4px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .filter-section { padding:0 16px 16px; border-bottom:1px solid var(--border); margin-bottom:0; }
  .filter-section:last-child { border-bottom:none; }
  .filter-label { font-size:10px; font-weight:500; letter-spacing:0.1em; color:var(--text3); text-transform:uppercase; margin-bottom:8px; padding-top:16px; display:block; }
  .filter-btn { display:block; width:100%; text-align:left; background:none; border:none; padding:5px 8px; border-radius:6px; color:var(--text2); font-size:13px; font-family:'DM Sans', sans-serif; cursor:pointer; transition:all .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .filter-btn:hover { background:var(--surface2); color:var(--text); }
  .filter-btn.active { background:rgba(201,150,58,0.15); color:var(--accent); }
  .filter-btn .badge { float:right; background:var(--surface2); border-radius:10px; padding:0 6px; font-size:10px; color:var(--text3); }
  .filter-btn.active .badge { background:rgba(201,150,58,0.2); color:var(--accent); }

  /* WORK LIST */
  .list-panel { flex:1; overflow-y:auto; }
  .list-panel::-webkit-scrollbar { width:5px; }
  .list-panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .work-item { display:flex; align-items:flex-start; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  .work-item:hover { background:var(--surface); }
  .work-item.selected { background:var(--surface2); border-left:3px solid var(--accent); padding-left:17px; }
  .work-num { min-width:36px; height:36px; background:var(--surface2); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text3); font-weight:500; border:1px solid var(--border); flex-shrink:0; }
  .work-info { flex:1; min-width:0; }
  .work-name { font-size:14px; font-weight:500; color:var(--text); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .work-sub { font-size:12px; color:var(--text2); display:flex; gap:8px; flex-wrap:wrap; }
  .work-sub span { display:flex; align-items:center; gap:3px; }
  .work-tags { display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .tag { background:var(--tag-bg); color:var(--tag-text); border-radius:4px; padding:1px 6px; font-size:11px; border:1px solid var(--border); }
  .tag.makam { border-color:#3a3060; color:#9b8fd4; background:#1e1b2e; }
  .tag.form { border-color:#2a3d2a; color:#7ab87a; background:#1a271a; }
  .tag.tuning { border-color:#3d2a1a; color:#c8904a; background:#271a0d; }

  /* DETAIL PANEL */
  .detail { width:380px; min-width:380px; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; }
  .detail::-webkit-scrollbar { width:4px; }
  .detail::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .detail-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text3); gap:12px; }
  .detail-empty svg { opacity:.3; }
  .detail-header { padding:20px 20px 16px; border-bottom:1px solid var(--border); }
  .detail-id { font-size:11px; color:var(--text3); letter-spacing:.05em; margin-bottom:6px; }
  .detail-title { font-family:'Playfair Display', serif; font-size:20px; color:var(--text); line-height:1.3; margin-bottom:12px; }
  .detail-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:3px 10px; border-radius:20px; font-size:12px; font-weight:500; }
  .chip.makam { background:#1e1b2e; color:#9b8fd4; border:1px solid #3a3060; }
  .chip.form  { background:#1a271a; color:#7ab87a; border:1px solid #2a3d2a; }
  .chip.tuning{ background:#271a0d; color:#c8904a; border:1px solid #3d2a1a; }
  .chip.meas  { background:#1a1e27; color:#6a9fd4; border:1px solid #1f3050; }
  .detail-body { padding:16px 20px; }
  .detail-row { margin-bottom:14px; }
  .detail-row-label { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:4px; }
  .detail-row-value { font-size:13px; color:var(--text2); line-height:1.5; }
  .detail-divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
  .lyrics-box { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:14px; font-size:13px; color:var(--text2); line-height:1.8; max-height:300px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
  .lyrics-box::-webkit-scrollbar { width:3px; }
  .lyrics-box::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .video-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; background:rgba(201,150,58,.1); border:1px solid rgba(201,150,58,.3); border-radius:6px; color:var(--accent); font-size:13px; text-decoration:none; transition:all .15s; }
  .video-btn:hover { background:rgba(201,150,58,.2); }

  /* TOOLBAR */
  .toolbar { padding:10px 20px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border); background:var(--bg); }
  .sort-btn { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--text2); font-size:12px; font-family:'DM Sans', sans-serif; cursor:pointer; transition:all .15s; }
  .sort-btn:hover { border-color:var(--border2); color:var(--text); }
  .sort-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(201,150,58,.08); }
  .clear-btn { margin-left:auto; background:none; border:1px solid var(--border); border-radius:6px; padding:5px 10px; color:var(--text3); font-size:12px; font-family:'DM Sans', sans-serif; cursor:pointer; transition:all .15s; }
  .clear-btn:hover { color:var(--text2); border-color:var(--border2); }

  /* EMPTY STATE */
  .empty-list { padding:60px 20px; text-align:center; color:var(--text3); }

  @media (max-width: 768px) {
    .sidebar { display:none; }
    .detail { display:none; }
    .detail.mobile-visible { display:block; position:fixed; top:56px; left:0; right:0; bottom:0; z-index:200; width:100%; }
    .back-btn { display:flex; align-items:center; gap:6px; padding:12px 20px; color:var(--accent); font-size:14px; cursor:pointer; border-bottom:1px solid var(--border); }
  }
  @media (min-width: 769px) {
    .back-btn { display:none; }
  }

  /* ── YENİ ESER MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #131315;
    border: 1px solid #2a2a2e;
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    position: relative;
  }
  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #f0ede6;
    margin-bottom: 24px;
  }
  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .modal-grid .full { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 11px; color: #9b9890; letter-spacing: .08em; text-transform: uppercase; }
  .form-group input, .form-group textarea, .form-group select {
    background: #1a1a1d;
    border: 1px solid #252528;
    border-radius: 8px;
    padding: 9px 12px;
    color: #f0ede6;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: rgba(201,150,58,.5);
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #252528;
  }
  .btn-cancel {
    padding: 9px 20px; border-radius: 8px;
    background: none; border: 1px solid #252528;
    color: #9b9890; font-family: 'DM Sans', sans-serif;
    font-size: 13px; cursor: pointer;
    transition: border-color .15s;
  }
  .btn-cancel:hover { border-color: #4a4845; color: #f0ede6; }
  .btn-save {
    padding: 9px 24px; border-radius: 8px;
    background: #c9963a; border: none;
    color: #1a1000; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: filter .15s;
  }
  .btn-save:hover { filter: brightness(1.1); }
  .btn-new-eser {
    margin-left: auto;
    padding: 5px 14px;
    background: rgba(201,150,58,.15);
    border: 1px solid rgba(201,150,58,.4);
    border-radius: 7px;
    color: #c9963a;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .btn-new-eser:hover { background: rgba(201,150,58,.25); border-color: rgba(201,150,58,.7); }
</style>
</head>
<body>

<header>
  <div class="logo">🎵 <span style="font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text2);margin-right:8px;font-weight:300;">Eserler</span></div>
  <a href="eserler.html" style="padding:4px 12px;border-radius:6px;border:1px solid rgba(201,150,58,.3);background:rgba(201,150,58,.12);color:var(--accent);font-size:13px;text-decoration:none;margin-right:2px;">Eserler</a>
  <a href="repertoires.html" style="padding:4px 12px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;text-decoration:none;margin-right:2px;">Repertuvar</a>
  <a href="artiesten.html" style="padding:4px 12px;border-radius:6px;border:1px solid transparent;color:var(--text2);font-size:13px;text-decoration:none;"></a>
  <div class="search-wrap">
    <span class="search-icon">&#9906;</span>
    <input type="text" id="searchInput" placeholder="Eser adı, besteci, güftekâr, makam..." autocomplete="off">
  </div>
  <div class="count-badge" id="countBadge">411 eser</div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="filter-section">
      <span class="filter-label">Tür / Form</span>
      <div id="formFilters"></div>
    </div>
    <div class="filter-section">
      <span class="filter-label">Akort</span>
      <div id="tuningFilters"></div>
    </div>
    <div class="filter-section">
      <span class="filter-label">Bölge</span>
      <div id="regionFilters"></div>
    </div>
    <div class="filter-section">
      <span class="filter-label">Makam</span>
      <div id="makamFilters"></div>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <div class="toolbar">
      <span style="font-size:12px;color:var(--text3);margin-right:4px;">Sırala:</span>
      <button class="sort-btn active" id="sortName" onclick="setSort('name')">Ada Göre</button>
      <button class="sort-btn" id="sortId" onclick="setSort('id')">Numaraya Göre</button>
      <button class="sort-btn" id="sortComposer" onclick="setSort('composer')">Besteciye Göre</button>
      <button class="clear-btn" onclick="clearFilters()">Filtreleri Temizle</button>
      <button class="btn-new-eser" onclick="openNewEserModal()">+ Yeni Eser</button>
    </div>
    <div class="list-panel" id="listPanel"></div>
  </div>

  <aside class="detail" id="detailPanel">
    <div class="detail-empty" id="detailEmpty">

      <p>Bir eser seçin</p>
    </div>
    <div id="detailContent" style="display:none;"></div>
  </aside>
</div>

egion":"","sourcePerson":"","form":"","videoLink":""},{"id":137.0,"name":"Şiir 2","composer":"","lyricWriter":"","lyrics":"HERKES ÖLDÜRÜR SEVDİĞİNİ\n\t-\t“Oysa herkes öldürür sevdiğini, kulak verin bu sözlerime. \n\t-\tKimi bir bakışıyla yapar bunu, kimi dalkavukça sözlerle. \n\t-\tKorkaklar öpücük ile öldürür, yürekliler kılıç tutan elleriyle. \n\t-\tKimi gençken öldürür sevdiğini, kimi yaşlı iken.\n\t-\tŞehvetli ellerle boğar kimi, kimi altından ellerle. \n\t-\tMerhametli kişi bıçak kullanır, bıçakla ölen çabuk soğur. \n\t-\tKimi yeterince sevmez, kimi fazla sever. \n\t-\tKimi satar, kimi de satın alır. \n\t-\tKimi göz yaşı döker öldürürken, kimi kılı kıpırdamadan. \n\t-\tÇünkü, herkes öldürür sevdiğini ama herkes öldürdü diye ölmez.”\n\t\nTuncel Kurtiz.","makam":"","measurement":"","metronom":"","genre":"","instrument":"","tuning":"","closingNote":"","area":"","region":"","sourcePerson":"","form":"","videoLink":""},{"id":138.0,"name":"Şiir 3","composer":"","lyricWriter":"Serkan Uçar","lyrics":"-\tUSTAM!\n\n\t-\tAklım firarda.\n\t-\tGözbebeklerimde müebbet hüzün,\n\t-\tDilimde ay kesiği bir yara,\n\t-\tDüşüm kırık dökük,\n\t-\tUmudumun boynu bükük,\n\t-\tBir öksüzün omuzlarında sükut.\n\t-\tYüreğim sana emanet sıkı tut.\n\t-\tTut ki; kancık pusulara düşmesin.\n\t-\tBir hain kurşunu gelip deşmesin.\n\n\t-\tUstam,\n\t-\tNe zaman o senin bildiğin zaman,\n\t-\tNe sevda gördüğün masallardaki.\n\t-\tEskiden,\n\t-\tHalı tezgahında dokunurdu aşklar,\n\t-\tNakış nakış, körpe kız ellerinde.\n\t-\tMendillere yazılırdı isimler,\n\t-\tYüreklere kazılırdı gizlice.\n\t-\tSevdalılar asil ve de yürekli\n\t-\tSevdalar, kavgalar iki kişilik.\n\n\t-\tOysa şimdi;\n\t-\tÇorak gönüllere ekiliyor sevdalar seher vakitlerinde.\n\t-\tMeşru sevdalardan,\n\t-\tGayrı meşru acılar doğuyor kundaklara Günahkar gecelerden. \n\n\t-\tBeni herkes sevdaya asi sanır,\n\t-\tOysa aşk, beni nerde görse tanır,\n\t-\tHasret tanır,\n\t-\tZulüm tanır,\n\t-\tÖlüm tanır,\n\t-\tYüzüm yüzümden utanır.\n\n\t-\tYor  anne, ağlama] 4x\n\n[1. Bölüm]\nKaç zamandır yüzüm tıraşlı Gözlerim şafak bekledim!\nUzarken ellerim, kulağım kirişte ölümü özledim anne\nYaşamak isterken delice...\n\nAh verebilseydim keşke Yüreği avucunda koşan her bir anneye,\nTepeden tırnağa oğla ve kıza kesmiş bir ülkeyi armağan!\n\nDüşlerimle sınırsız, diretmişliğimle genç,\nŞaşkınlığımla çocuk, devrederken sırdaşıma\nusulca açılıverdi yanağında tomurcuk!\n\nPir Sultan'ı düşün anne, Şeyh Bedrettin'ni, Börklüce'yi\nİnsanları düşün anne, Düşün ki yüreğin sallansın!\n\nDüşün ki, o an güneşli, güzel günlere inanan\nMutlu bir Yusufcuk havalansın\n\n[Geçiş]\nBeni burada arama, arama anne\nKapıda adımı, adımı sorma\n\n[Nakarat]\n[Saçlarına yıldız düşmüş Koparma anne, ağlama] 4x\n\n[2. Bölüm]\nYani benim güzel annem\nAla şafağında ülkemin yıldız uçurmak varken,\nOturup yıldızlar içinde kendi buruk kanımı içtim.\n\nNe garip duygu şu ölmek, öptüğüm kızlar geliyor aklıma... \nBir açıklaması vardır elbet giderken dar ağacına. \n\nGeride Masa üstünde boynu bükük kaldı kağıt kalem. \n\nBağışla beni güzel annem, oğul tadında bir mektup yazamadım diye kızma bana. \nElleri değsin istemedim, gözleri değsin istemedim. \n\nAğlayıp koklayacaktın, belki bir ömür taşıyacaktın koynunda...\nYaşamak ağrısı asıldı boynumda.. \nOysa türkü tadında yaşamak isterdim...\n\n[Nakarat]\n[Saçlarına yıldız düşmüş Koparma anne, ağlama] 4x","makam":"","measurement":"","metronom":"","genre":"Ahmet Kaya","instrument":"U. SAP","tuning":"","closingNote":"","area":"","region":"","sourcePerson":"","form":"","videoLink":""},{"id":193.0,"name":"Yan Yaralı Yüreğim Yan","composer":"Avni Kaysal","lyricWriter":"Dursun Ali Akınet","lyrics":"Giden geri döner sanma yan yaralı yüreğim yan\nAlev canda söner sanma yan yaralı yüreğim yan 2X\nAvcılar çökmüş oturur ceylan yavrusun yitirir\nGece bir çığlık duyulur yan yaralı yüreğim yan 2X\n\nSitemle kalkarsan şaha işlerin kalır eyvaha\nTövbe etmeden bir daha yan yaralı yüreğim yan 2X \nAl feryadın ezberine susma inerk let filteredData = [...DATA];
let selectedId = null;
let sortMode = 'name';
let activeFilters = { form: null, tuning: null, region: null, makam: null };

function getUnique(field) {
  const counts = {};
  DATA.forEach(w => { const v = w[field]; if(v) counts[v] = (counts[v]||0)+1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], 'tr'));
}

function buildFilters() {
  function makeSection(id, field) {
    const el = document.getElementById(id);
    const items = getUnique(field);
    el.innerHTML = items.map(([val, cnt]) =>
      `<button class="filter-btn" data-field="${field}" data-val="${val.replace(/"/g,'&quot;')}" onclick="toggleFilter('${field}','${val.replace(/'/g,"\'")}')">
        ${val} <span class="badge">${cnt}</span>
      </button>`
    ).join('');
  }
  makeSection('formFilters', 'form');
  makeSection('tuningFilters', 'tuning');
  makeSection('regionFilters', 'region');
  makeSection('makamFilters', 'makam');
}

function toggleFilter(field, val) {
  activeFilters[field] = activeFilters[field] === val ? null : val;
  updateFilterButtons();
  applyFilters();
}

function updateFilterButtons() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const f = btn.dataset.field, v = btn.dataset.val;
    btn.classList.toggle('active', activeFilters[f] === v);
  });
}

function clearFilters() {
  activeFilters = { form: null, tuning: null, region: null, makam: null };
  document.getElementById('searchInput').value = '';
  updateFilterButtons();
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filteredData = DATA.filter(w => {
    if (activeFilters.form && w.form !== activeFilters.form) return false;
    if (activeFilters.tuning && w.tuning !== activeFilters.tuning) return false;
    if (activeFilters.region && w.region !== activeFilters.region) return false;
    if (activeFilters.makam && w.makam !== activeFilters.makam) return false;
    if (q) {
      const search = (w.name+w.composer+w.lyricWriter+w.makam+w.region+w.sourcePerson).toLowerCase();
      if (!search.includes(q)) return false;
    }
    return true;
  });
  sortData();
  renderList();
  document.getElementById('countBadge').textContent = filteredData.length + ' eser';
}

function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  sortData();
  renderList();
}

function sortData() {
  if (sortMode === 'name') filteredData.sort((a,b) => (a.name||'').localeCompare(b.name||'','tr'));
  else if (sortMode === 'id') filteredData.sort((a,b) => (a.id||9999)-(b.id||9999));
  else if (sortMode === 'composer') filteredData.sort((a,b) => (a.composer||'zzz').localeCompare(b.composer||'zzz','tr'));
}

function renderList() {
  const panel = document.getElementById('listPanel');
  if (!filteredData.length) {
    panel.innerHTML = '<div class="empty-list">Eser bulunamadı</div>';
    return;
  }
  panel.innerHTML = filteredData.map(w => {
    const tags = [
      w.makam ? `<span class="tag makam">${w.makam}</span>` : '',
      w.form ? `<span class="tag form">${w.form}</span>` : '',
      w.tuning ? `<span class="tag tuning">${w.tuning}</span>` : '',
    ].filter(Boolean).join('');
    const sub = [
      w.composer ? `<span>🎼 ${w.composer}</span>` : '',
      w.region ? `<span>📍 ${w.region}</span>` : '',
      w.measurement ? `<span>♩ ${w.measurement}</span>` : '',
    ].filter(Boolean).join('');
    return `<div class="work-item${selectedId===w.id?' selected':''}" onclick="selectWork(${w.id})" data-id="${w.id}">
      <div class="work-num">${w.id||'—'}</div>
      <div class="work-info">
        <div class="work-name">${w.name||'(isimsiz)'}</div>
        <div class="work-sub">${sub}</div>
        ${tags ? `<div class="work-tags">${tags}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function selectWork(id) {
  selectedId = id;
  const w = DATA.find(x => x.id === id);
  document.querySelectorAll('.work-item').forEach(el => el.classList.toggle('selected', parseInt(el.dataset.id)===id));
  if (!w) return;

  document.getElementById('detailEmpty').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'block';

  const chips = [
    w.makam ? `<span class="chip makam">${w.makam}</span>` : '',
    w.form ? `<span class="chip form">${w.form}</span>` : '',
    w.tuning ? `<span class="chip tuning">Akort: ${w.tuning}</span>` : '',
    w.measurement ? `<span class="chip meas">${w.measurement}</span>` : '',
  ].filter(Boolean).join('');

  function row(label, val) {
    if (!val) return '';
    return `<div class="detail-row"><div class="detail-row-label">${label}</div><div class="detail-row-value">${val}</div></div>`;
  }

  const videoBtn = w.videoLink ? `<a href="${w.videoLink}" target="_blank" class="video-btn">▶ Video İzle</a>` : '';

  dc.innerHTML = `
    <div class="detail-header">
      <div class="detail-id">#${w.id||'—'}</div>
      <div class="detail-title">${w.name||'(isimsiz)'}</div>
      <div class="detail-chips">${chips}</div>
    </div>
    <div class="detail-body">
      ${row('Besteci', w.composer)}
      ${row('Güftekâr', w.lyricWriter)}
      ${row('Kaynak Kişi', w.sourcePerson)}
      ${row('Bölge', w.region)}
      ${row('Alan', w.area)}
      ${row('Enstrüman', w.instrument)}
      ${row('Metronom', w.metronom)}
      ${row('Kapanış Notası', w.closingNote)}
      ${w.genre ? row('Composer', w.genre) : ''}
      ${videoBtn ? `<div class="detail-row">${videoBtn}</div>` : ''}
      ${w.lyrics ? `<hr class="detail-divider"><div class="detail-row"><div class="detail-row-label">Güfte</div><div class="lyrics-box">${w.lyrics.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>` : ''}
    </div>`;

  // Mobile: show detail panel
  document.getElementById('detailPanel').classList.add('mobile-visible');
}

document.getElementById('searchInput').addEventListener('input', applyFilters);

// ── YENİ ESER FONKSİYONLARI ──
const LOCAL_KEY = 'customWorks';

function getCustomWorks() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch { return []; }
}

function saveCustomWorks(arr) {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(arr));
}

function openNewEserModal() {
  // Clear form
  ['name','composer','lyricWriter','makam','measurement','form','genre','tuning',
   'closingNote','instrument','region','sourcePerson','videoLink','lyrics'].forEach(f => {
    document.getElementById('ne_' + f).value = '';
  });
  document.getElementById('newEserModal').classList.add('open');
  document.getElementById('ne_name').focus();
}

function closeNewEserModal() {
  document.getElementById('newEserModal').classList.remove('open');
}

function saveNewEser() {
  const name = document.getElementById('ne_name').value.trim();
  if (!name) {
    document.getElementById('ne_name').focus();
    document.getElementById('ne_name').style.borderColor = '#c05444';
    setTimeout(() => document.getElementById('ne_name').style.borderColor = '', 1500);
    return;
  }

  // Generate a unique negative ID (custom works use negative IDs)
  const customs = getCustomWorks();
  const newId = customs.length > 0 ? Math.min(...customs.map(w => w.id), 0) - 1 : -1;

  const eser = {
    id: newId,
    name,
    composer: document.getElementById('ne_composer').value.trim(),
    lyricWriter: document.getElementById('ne_lyricWriter').value.trim(),
    makam: document.getElementById('ne_makam').value.trim(),
    measurement: document.getElementById('ne_measurement').value.trim(),
    form: document.getElementById('ne_form').value.trim(),
    genre: document.getElementById('ne_genre').value.trim(),
    tuning: document.getElementById('ne_tuning').value.trim(),
    closingNote: document.getElementById('ne_closingNote').value.trim(),
    instrument: document.getElementById('ne_instrument').value.trim(),
    region: document.getElementById('ne_region').value.trim(),
    sourcePerson: document.getElementById('ne_sourcePerson').value.trim(),
    videoLink: document.getElementById('ne_videoLink').value.trim(),
    lyrics: document.getElementById('ne_lyrics').value.trim(),
    area: '',
    metronom: '',
    _custom: true
  };

  // Save to localStorage
  customs.push(eser);
  saveCustomWorks(customs);

  // Add to live DATA array
  DATA.push(eser);

  // Rebuild filters and re-render
  buildFilters();
  applyFilters();

  // Update works cache
  try {
    const list = DATA.filter(w => w.name).map(w => ({id: String(w.id), name: w.name, composer: w.composer||'', makam: w.makam||''}));
    localStorage.setItem('worksListCache', JSON.stringify(list));
  } catch(e) {}

  closeNewEserModal();

  // Select the new work in the list
  setTimeout(() => {
    const item = document.querySelector('[data-id="' + newId + '"]');
    if (item) { item.click(); item.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }, 100);
}

// Load custom works on startup — DATA'ya ekle, sonra filtrele
(function loadCustomWorks() {
  const customs = getCustomWorks();
  if (customs.length > 0) {
    customs.forEach(w => DATA.push(w));
  }
})();

buildFilters();
applyFilters();

// Close modal on overlay click
document.getElementById('newEserModal').addEventListener('click', function(e) {
  if (e.target === this) closeNewEserModal();
});

// Keyboard shortcut: Escape to close
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeNewEserModal();
});

// Cache works list for Solistler page
try {
  const list = DATA.filter(w => w.name).map(w => ({id: String(w.id), name: w.name, composer: w.composer||'', makam: w.makam||''}));
  localStorage.setItem('worksListCache', JSON.stringify(list));
} catch(e) {}
</script>
