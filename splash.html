<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>repertuvar.app</title>
  <link rel="icon" type="image/png" href="Repertuvar_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet" />
  <style>
    /* Marka renkleri — uygulamanın style.css'iyle birebir aynı */
    :root{
      --bg:#070B18; --bg2:#10172C;
      --brand-gold:#FFC83D; --brand-white:#FFFFFF; --brand-muted:#8FA0BF;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    /* iOS Safari otomatik yazı büyütmesini kapat */
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;}

    body{
      background:var(--bg);
      min-height:100vh; min-height:100dvh;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    }
    /* zeminde yumuşak altın parıltı */
    body::before{
      content:''; position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(60% 45% at 50% 42%, rgba(255,200,61,.10), transparent 70%),
                 radial-gradient(80% 60% at 50% 100%, rgba(77,163,255,.06), transparent 70%);
    }

    #splash{ display:flex; flex-direction:column; align-items:center; padding:2rem; position:relative; }
    /* (2026-10-17) LOGO TEK STANDART: resmi logo_dark.png, yazı + çizgi YENİDEN ÇİZİLMEZ (login.html açılışıyla aynı).
       Animasyon için görsel üç parçaya kesilir: x 456 / 471 / 488, y 48 (664×127; "r"nin kolu noktanın üstüne taşar). */
    .sp-logo{ position:relative; width:min(360px,82vw); aspect-ratio:664/127; }
    .sp-parca{ position:absolute; inset:0; background:url('logo_dark.png') 0 0/100% 100% no-repeat; opacity:0; will-change:transform,opacity; }
    /* Parçalar login.html açılışıyla AYNI (kesimler 664×127 görselde): "repertuvar" (y<98) / sarı çizgi (y≥98, x<456) /
       nokta (yalnız 462–488 × 48–90; sarı çizginin ucu taşmasın) / "app" (y<98) / beyaz çizgi (y≥98) */
    #word-rep{ clip-path:polygon(0 0,70.93% 0,70.93% 37.8%,68.67% 37.8%,68.67% 77.17%,0 77.17%); transform-origin:35% 100%; }
    #gold    { clip-path:polygon(0 77.17%,68.67% 77.17%,68.67% 100%,0 100%); transform-origin:35% 100%; }
    #dot     { clip-path:polygon(69.58% 37.8%,73.49% 37.8%,73.49% 70.87%,69.58% 70.87%); transform-origin:71% 60%; z-index:3; }
    #word-app{ clip-path:polygon(73.49% 0,100% 0,100% 77.17%,73.49% 77.17%); transform-origin:87% 100%; }
    #line    { clip-path:polygon(73.49% 77.17%,100% 77.17%,100% 100%,73.49% 100%); transform-origin:74% 100%; z-index:2; }

    #slogan{
      font-weight:500; font-size:clamp(13px,2.4vw,17px); color:var(--brand-muted);
      margin-top:1.15rem; text-align:center; line-height:1.6; letter-spacing:.01em;
      white-space:pre-line; opacity:0; transform:translateY(8px);
    }

    @media (prefers-reduced-motion: reduce){
      #word-rep,#gold,#dot,#word-app,#line,#slogan{
        opacity:1 !important; transform:none !important; transition:none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="sp-logo" role="img" aria-label="repertuvar.app">
      <span class="sp-parca" id="word-rep"></span><span class="sp-parca" id="gold"></span><span class="sp-parca" id="dot"></span><span class="sp-parca" id="word-app"></span><span class="sp-parca" id="line"></span>
    </div>
    <div id="slogan">Müzisyenler İçin
Repertuvar ve Sahne Yönetimi</div>
  </div>

  <script src="i18n.js"></script>
  <script>
    // (2026-09-27) Slogan arayuz diline gore; login.html ile ayni anahtarlar.
    try {
      if (window.t) document.getElementById('slogan').textContent = t('giris.slogan1') + '\n' + t('giris.slogan2');
    } catch (e) {}

    // Toplam süre ~2.6 sn (eskiden ~8 sn idi: daktilo efekti + 2sn bekleme kaldırıldı)
    function anim(el, props, duration, delay, easing){
      return new Promise(resolve=>{
        setTimeout(()=>{
          el.style.transition = `all ${duration}ms ${easing||'cubic-bezier(0.22,1,0.36,1)'}`;
          Object.assign(el.style, props);
          setTimeout(resolve, duration);
        }, delay);
      });
    }
    const wait = ms => new Promise(r=>setTimeout(r, ms));

    async function runIntro(){
      const $ = id => document.getElementById(id);
      const rep = $('word-rep'), gold = $('gold'), dot = $('dot'), app = $('word-app'), line = $('line'), slogan = $('slogan');

      // Logo görseli yüklenmeden parçalar boş görünmesin (yüklenemezse de geçiş sürer)
      await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'logo_dark.png'; setTimeout(r, 1200); });

      // login.html açılışıyla AYNI sahne (ayrıntılı açıklama orada): kelimeler süzülür → beyaz çizgi sola kayıp sarıya
      // çarpar, TAM O ANDA düşen nokta beyaza değer → nokta yukarı, çizgi sağa yerine → Dock dalgası.
      const sakin = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const suz = 'cubic-bezier(0.16,1,0.3,1)', yercekimi = 'cubic-bezier(0.5,0,0.9,0.5)', yay = 'cubic-bezier(0.34,1.56,0.64,1)';
      const oyna = (el, kare, sure, gecikme, egri) => el.animate(kare, { duration: sakin ? 1 : sure, delay: sakin ? 0 : gecikme, easing: egri || suz, fill: 'forwards' }).finished.catch(() => {});
      const gel = dx => [{ opacity: 0, transform: `translateX(${dx}px) scale(.94)`, filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }];
      const T = 1600, AN = .42, CARPMA = '-5.72%', DUS = '20.5%';
      oyna(rep, gel(-26), 1100, 0); oyna(gold, gel(-26), 1100, 0); oyna(app, gel(26), 900, 120);
      await oyna(line, gel(26), 900, 120);
      await Promise.all([
        oyna(line, [
          { transform: 'none', easing: 'cubic-bezier(0.45,0,0.8,0.4)' },
          { transform: `translateX(${CARPMA})`, offset: AN, easing: 'cubic-bezier(0.2,0,0.2,1)' },
          { transform: `translateX(${CARPMA}) translateY(6%) scaleX(.96)`, offset: AN + .05, easing: 'cubic-bezier(0.3,0,0.3,1)' },
          { transform: 'translateX(.9%)', offset: .80, easing: 'ease-in-out' },
          { transform: 'translateX(-.25%)', offset: .91 },
          { transform: 'none' }
        ], T, 0, 'linear'),
        oyna(gold, [
          { transform: 'none' },
          { transform: 'none', offset: AN, easing: 'cubic-bezier(0.22,1,0.36,1)' },
          { transform: 'translateX(-1.1%)', offset: AN + .05, easing: yay },
          { transform: 'none', offset: AN + .24 },
          { transform: 'none' }
        ], T, 0, 'linear'),
        oyna(dot, [
          { opacity: 0, transform: 'translateY(-330%)', easing: yercekimi },
          { opacity: 1, transform: 'translateY(-250%)', offset: .10, easing: yercekimi },
          { opacity: 1, transform: `translateY(${DUS})`, offset: AN, easing: 'cubic-bezier(0.2,0,0.2,1)' },
          { opacity: 1, transform: `translateY(${DUS}) scale(1.28,.72)`, offset: AN + .05, easing: 'cubic-bezier(0.25,0.6,0.4,1)' },
          { opacity: 1, transform: 'translateY(-15%) scale(.95,1.07)', offset: .76, easing: 'ease-in-out' },
          { opacity: 1, transform: 'translateY(3%)', offset: .89 },
          { opacity: 1, transform: 'none' }
        ], T, 0, 'linear')
      ]);
      if (!sakin) {
        const dalga = [{ transform: 'none' }, { transform: 'scale(1.07)', offset: .45 }, { transform: 'none' }];
        await Promise.all([[rep, gold], [dot], [app, line]].map((grup, i) => Promise.all(grup.map(el => el.animate(dalga, { duration: 560, delay: i * 110, easing: 'cubic-bezier(0.45,0,0.55,1)' }).finished.catch(() => {})))));
      }
      await anim(slogan, {opacity:'1', transform:'translateY(0)'}, 600, 0, suz);

      await wait(420);
      window.location.href = 'login.html';
    }

    // Animasyon takılsa bile en geç 6 sn'de geç (sahne ~4,5 sn)
    setTimeout(()=>{ if(!window._splashDone){ window.location.href='login.html'; } }, 6000);
    runIntro().then(()=>{ window._splashDone = true; });
  </script>
</body>
</html>
