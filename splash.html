<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>repertuvar.app</title>
  <link rel="icon" type="image/png" href="Repertuvar_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet" />
  <style>
    /* Marka renkleri — uygulamanın style.css'iyle birebir aynı */
    :root{
      --bg:#070B18; --bg2:#10172C;
      --brand-gold:#FFC83D; --brand-white:#FFFFFF; --brand-muted:#8FA0BF;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    body{
      background:var(--bg);
      min-height:100vh; min-height:100dvh;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    }
    /* zeminde yumuşak altın parıltı */
    body::before{
      content:''; position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(60% 45% at 50% 42%, rgba(255,200,61,.10), transparent 70%),
                 radial-gradient(80% 60% at 50% 100%, rgba(77,163,255,.06), transparent 70%);
    }

    #splash{ display:flex; flex-direction:column; align-items:center; padding:2rem; position:relative; }
    .logo-row{ display:flex; align-items:baseline; line-height:1; }

    #word-rep, #dot, #word-app{
      font-weight:800; font-size:clamp(38px,9vw,66px); letter-spacing:-.03em;
      opacity:0; will-change:transform,opacity;
    }
    #word-rep{ color:var(--brand-white); transform:translateX(-46px); }
    #dot     { color:var(--brand-gold);  transform:translateY(-60px); display:inline-block; }
    #word-app{ color:var(--brand-gold);  transform:translateX(46px); }

    /* logodaki iki çizgi: uzun altın + kısa beyaz */
    .lines-row{ display:flex; align-items:flex-start; margin-top:12px; }
    #line-gold, #line-white{
      height:7px; border-radius:4px; opacity:0; transform:translateY(14px); will-change:transform,opacity;
    }
    #line-gold { background:var(--brand-gold); }
    #line-white{ background:var(--brand-white); margin-left:10px; }

    #slogan{
      font-weight:500; font-size:clamp(13px,2.4vw,17px); color:var(--brand-muted);
      margin-top:1.15rem; text-align:center; line-height:1.6; letter-spacing:.01em;
      white-space:pre-line; opacity:0; transform:translateY(8px);
    }

    @media (prefers-reduced-motion: reduce){
      #word-rep,#dot,#word-app,#line-gold,#line-white,#slogan{
        opacity:1 !important; transform:none !important; transition:none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-row">
      <span id="word-rep">repertuvar</span><span id="dot">.</span><span id="word-app">app</span>
    </div>
    <div class="lines-row">
      <div id="line-gold"></div>
      <div id="line-white"></div>
    </div>
    <div id="slogan">Modern Müzisyenler İçin
Akıllı Sahne ve Repertuvar Yönetimi</div>
  </div>

  <script>
    // Toplam süre ~2.6 sn (eskiden ~8 sn idi: daktilo efekti + 2sn bekleme kaldırıldı)
    function anim(el, props, duration, delay, easing){
      return new Promise(resolve=>{
        setTimeout(()=>{
          el.style.transition = `all ${duration}ms ${easing||'cubic-bezier(0.22,1,0.36,1)'}`;
          Object.assign(el.style, props);
          setTimeout(resolve, duration);
        }, delay);
      });
    }
    const wait = ms => new Promise(r=>setTimeout(r, ms));

    async function runIntro(){
      const rep=document.getElementById('word-rep'), dot=document.getElementById('dot'),
            app=document.getElementById('word-app'), lg=document.getElementById('line-gold'),
            lw=document.getElementById('line-white'), slogan=document.getElementById('slogan');

      try { await document.fonts.ready; } catch(e){}
      await wait(80);
      lg.style.width = rep.offsetWidth + 'px';
      lw.style.width = (dot.offsetWidth + app.offsetWidth) + 'px';

      // 1) nokta düşer (~380ms)
      await anim(dot, {opacity:'1', transform:'translateY(0)'}, 380, 0, 'cubic-bezier(0.34,1.35,0.64,1)');
      // 2) kelimeler yanlardan gelir (~420ms, paralel)
      anim(rep, {opacity:'1', transform:'translateX(0)'}, 420, 0);
      await anim(app, {opacity:'1', transform:'translateX(0)'}, 420, 0);
      // 3) çizgiler (~300ms)
      anim(lg, {opacity:'1', transform:'translateY(0)'}, 300, 0, 'cubic-bezier(0.34,1.3,0.64,1)');
      await anim(lw, {opacity:'1', transform:'translateY(0)'}, 300, 80, 'cubic-bezier(0.34,1.3,0.64,1)');
      // 4) slogan belirir (~320ms) — daktilo yerine yumuşak geçiş (hız için)
      await anim(slogan, {opacity:'1', transform:'translateY(0)'}, 320, 0);

      await wait(420);
      window.location.href = 'login.html';
    }

    // Animasyon takılsa bile en geç 3.2 sn'de geç
    setTimeout(()=>{ if(!window._splashDone){ window.location.href='login.html'; } }, 3200);
    runIntro().then(()=>{ window._splashDone = true; });
  </script>
</body>
</html>
