<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>repertuvar.app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-row {
      display: flex;
      align-items: baseline;
      line-height: 1;
    }

    #word-rep {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: clamp(40px, 8vw, 68px);
      color: #1A1733;
      opacity: 0;
      transform: translateX(-80px);
      letter-spacing: -2px;
    }

    #dot {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: clamp(40px, 8vw, 68px);
      color: #1A1733;
      opacity: 0;
      transform: translateY(-120px);
      display: inline-block;
      letter-spacing: -2px;
    }

    #word-app {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: clamp(40px, 8vw, 68px);
      color: #3522C9;
      opacity: 0;
      transform: translateX(80px);
      letter-spacing: -2px;
    }

    .lines-row {
      display: flex;
      align-items: flex-start;
      margin-top: 10px;
    }

    #line-blue {
      height: 8px;
      background: #3522C9;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(24px);
    }

    #line-dark {
      height: 8px;
      background: #1A1733;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(24px);
      margin-left: 12px;
    }

    #slogan {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(15px, 2.5vw, 21px);
      color: #3522C9;
      margin-top: 1rem;
      min-height: 2.8em;
      letter-spacing: 0.01em;
      text-align: center;
      line-height: 1.6;
      white-space: pre-line;
    }

    @media (prefers-reduced-motion: reduce) {
      #word-rep, #dot, #word-app, #line-blue, #line-dark {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-wrap">
      <div class="logo-row">
        <span id="word-rep">repertuvar</span><span id="dot">.</span><span id="word-app">app</span>
      </div>
      <div class="lines-row">
        <div id="line-blue"></div>
        <div id="line-dark"></div>
      </div>
      <div id="slogan"></div>
    </div>
  </div>

  <script>
    function anim(el, props, duration, delay, easing) {
      return new Promise(resolve => {
        setTimeout(() => {
          el.style.transition = `all ${duration}ms ${easing || 'cubic-bezier(0.22,1,0.36,1)'}`;
          Object.assign(el.style, props);
          setTimeout(resolve, duration);
        }, delay);
      });
    }

    async function runIntro() {
      const rep      = document.getElementById('word-rep');
      const dot      = document.getElementById('dot');
      const app      = document.getElementById('word-app');
      const lineBlue = document.getElementById('line-blue');
      const lineDark = document.getElementById('line-dark');
      const slogan   = document.getElementById('slogan');

      await document.fonts.ready;
      await new Promise(r => setTimeout(r, 500));

      lineBlue.style.width = rep.offsetWidth + 'px';
      lineDark.style.width = app.offsetWidth + 'px';

      // 1. Nokta yukarıdan yavaşça düşer
      await anim(dot, { opacity: '1', transform: 'translateY(0)' }, 900, 0, 'cubic-bezier(0.34,1.3,0.64,1)');
      await new Promise(r => setTimeout(r, 300));

      // 2. repertuvar soldan, app sağdan yavaşça gelir
      anim(rep, { opacity: '1', transform: 'translateX(0)' }, 900, 0, 'cubic-bezier(0.22,1,0.36,1)');
      await anim(app, { opacity: '1', transform: 'translateX(0)' }, 900, 0, 'cubic-bezier(0.22,1,0.36,1)');
      await new Promise(r => setTimeout(r, 300));

      // 3. Çizgiler aşağıdan yavaşça gelir
      anim(lineBlue, { opacity: '1', transform: 'translateY(0)' }, 700, 0, 'cubic-bezier(0.34,1.3,0.64,1)');
      await anim(lineDark, { opacity: '1', transform: 'translateY(0)' }, 700, 150, 'cubic-bezier(0.34,1.3,0.64,1)');
      await new Promise(r => setTimeout(r, 400));

      // 4. Slogan yavaş daktilo efektiyle yazılır
      const full = 'Modern Müzisyenler İçin\nAkıllı Sahne ve Repertuvar Yönetimi';
      let i = 0;
      await new Promise(resolve => {
        function typeChar() {
          if (i <= full.length) {
            slogan.textContent = full.slice(0, i) + (i < full.length ? '|' : '');
            i++;
            setTimeout(typeChar, 55);
          } else {
            resolve();
          }
        }
        typeChar();
      });

      // 5. 5 saniye bekle, sonra giris.html'e yönlendir
      await new Promise(r => setTimeout(r, 2000));
      window.location.href = 'giris.html';
    }

    runIntro();
  </script>
</body>
</html>
