<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>repertuvar.app</title>
  <link rel="icon" type="image/png" href="Repertuvar_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet" />
  <style>
    /* Marka renkleri — uygulamanın style.css'iyle birebir aynı */
    :root{
      --bg:#070B18; --bg2:#10172C;
      --brand-gold:#FFC83D; --brand-white:#FFFFFF; --brand-muted:#8FA0BF;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    /* iOS Safari otomatik yazı büyütmesini kapat */
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;}

    body{
      background:var(--bg);
      min-height:100vh; min-height:100dvh;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    }
    /* zeminde yumuşak altın parıltı */
    body::before{
      content:''; position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(60% 45% at 50% 42%, rgba(255,200,61,.10), transparent 70%),
                 radial-gradient(80% 60% at 50% 100%, rgba(77,163,255,.06), transparent 70%);
    }

    #splash{ display:flex; flex-direction:column; align-items:center; padding:2rem; position:relative; }
    /* (2026-10-17) LOGO TEK STANDART: resmi logo_dark.png, yazı + çizgi YENİDEN ÇİZİLMEZ (login.html açılışıyla aynı).
       Animasyon için görsel üç parçaya kesilir: x 456 / 471 / 488, y 48 (664×127; "r"nin kolu noktanın üstüne taşar). */
    .sp-logo{ position:relative; width:min(360px,82vw); aspect-ratio:664/127; }
    .sp-parca{ position:absolute; inset:0; background:url('logo_dark.png') 0 0/100% 100% no-repeat; opacity:0; will-change:transform,opacity; }
    #word-rep{ clip-path:polygon(0 0,70.93% 0,70.93% 37.8%,68.67% 37.8%,68.67% 100%,0 100%); transform:translateX(-46px); }
    #dot     { clip-path:polygon(68.67% 37.8%,73.49% 37.8%,73.49% 100%,68.67% 100%); transform:translateY(-60px); }
    #word-app{ clip-path:polygon(73.49% 0,100% 0,100% 100%,73.49% 100%); transform:translateX(46px); }

    #slogan{
      font-weight:500; font-size:clamp(13px,2.4vw,17px); color:var(--brand-muted);
      margin-top:1.15rem; text-align:center; line-height:1.6; letter-spacing:.01em;
      white-space:pre-line; opacity:0; transform:translateY(8px);
    }

    @media (prefers-reduced-motion: reduce){
      #word-rep,#dot,#word-app,#slogan{
        opacity:1 !important; transform:none !important; transition:none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="sp-logo" role="img" aria-label="repertuvar.app">
      <span class="sp-parca" id="word-rep"></span><span class="sp-parca" id="dot"></span><span class="sp-parca" id="word-app"></span>
    </div>
    <div id="slogan">Müzisyenler İçin
Repertuvar ve Sahne Yönetimi</div>
  </div>

  <script src="i18n.js"></script>
  <script>
    // (2026-09-27) Slogan arayuz diline gore; login.html ile ayni anahtarlar.
    try {
      if (window.t) document.getElementById('slogan').textContent = t('giris.slogan1') + '\n' + t('giris.slogan2');
    } catch (e) {}

    // Toplam süre ~2.6 sn (eskiden ~8 sn idi: daktilo efekti + 2sn bekleme kaldırıldı)
    function anim(el, props, duration, delay, easing){
      return new Promise(resolve=>{
        setTimeout(()=>{
          el.style.transition = `all ${duration}ms ${easing||'cubic-bezier(0.22,1,0.36,1)'}`;
          Object.assign(el.style, props);
          setTimeout(resolve, duration);
        }, delay);
      });
    }
    const wait = ms => new Promise(r=>setTimeout(r, ms));

    async function runIntro(){
      const rep=document.getElementById('word-rep'), dot=document.getElementById('dot'),
            app=document.getElementById('word-app'), slogan=document.getElementById('slogan');

      // Logo görseli yüklenmeden parçalar boş görünmesin (yüklenemezse de geçiş sürer)
      await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'logo_dark.png'; setTimeout(r, 1200); });

      // 1) nokta düşer (~380ms)
      await anim(dot, {opacity:'1', transform:'translateY(0)'}, 380, 0, 'cubic-bezier(0.34,1.35,0.64,1)');
      // 2) kelimeler yanlardan gelir (~420ms, paralel)
      anim(rep, {opacity:'1', transform:'translateX(0)'}, 420, 0);
      await anim(app, {opacity:'1', transform:'translateX(0)'}, 420, 0);
      // 3) slogan belirir (~320ms) — daktilo yerine yumuşak geçiş (hız için)
      await anim(slogan, {opacity:'1', transform:'translateY(0)'}, 320, 0);

      await wait(420);
      window.location.href = 'login.html';
    }

    // Animasyon takılsa bile en geç 3.2 sn'de geç
    setTimeout(()=>{ if(!window._splashDone){ window.location.href='login.html'; } }, 3200);
    runIntro().then(()=>{ window._splashDone = true; });
  </script>
</body>
</html>
