    else { yaz('baslik', M.bYeni); yaz('altBaslik', denemeVar || platform === 'web' ? M.aYeni : M.aYeniDenemesiz); }
  }

  // ── Fiyatlar (mağazadan) ─────────────────────────────────────────────
  function bicim(tutar, kod) {
    try { return new Intl.NumberFormat(navigator.language || (EN ? 'en-US' : 'tr-TR'), { style: 'currency', currency: kod }).format(tutar); }
    catch (e) { return tutar.toFixed(2) + ' ' + kod; }
  }
  // Mağazanın fiyat yazısıyla AYNI biçim: "49,99 €" → "4,16 €", "₺1.999,99" → "₺166,66", "$49.99" → "$4.16".
  // Tarayıcı dili mağaza vitrininden farklı olabildiği için Intl'e değil priceString'e bakılır.
  function ayniBicim(ornek, tutar, kod) {
    var m = String(ornek || '').match(/\d[\d.,\s\u00a0\u202f]*\d|\d/);
    if (!m) return bicim(tutar, kod);
    var sayi = m[0], ondalik = null;
    var son = Math.max(sayi.lastIndexOf(','), sayi.lastIndexOf('.'));
    if (son > -1 && sayi.length - son - 1 === 2) ondalik = sayi[son];
    var tam = Math.floor(tutar), kurus = Math.round((tutar - tam) * 100);
    var grup = ondalik === ',' ? '.' : ',';
    var g = (sayi.replace(/\d/g, '').replace(ondalik || '', '')[0]) || '';
    var tamYazi = String(tam).replace(/\B(?=(\d{3})+(?!\d))/g, g || '');
    var yeni = ondalik ? tamYazi + ondalik + String(kurus).padStart(2, '0') : String(tam);
    return ornek.replace(sayi, yeni);
  }
  function aydaAsagi(p, ay) { return ayniBicim(p.priceString, Math.floor((p.price / ay) * 100) / 100, p.currencyCode); }   // kuruş aşağı (karar)
  function avantaj(p, ay, aylik) { return aylik ? Math.round((1 - p.price / (aylik.price * ay)) * 100) : 0; }

  function planlariCiz() {
    var P = teklif.paketler, aylik = P.aylik && P.aylik.product;
    var sira = [['yillik', 12], ['alti', 6], ['aylik', 1]].filter(function (x) { return P[x[0]]; });
    $('planlar').innerHTML = sira.map(function (x) {
      var k = x[0], ay = x[1], p = P[k].product, t = M.plan[k];
      var rozet = '', alt;
      if (k === 'yillik') { var n = avantaj(p, 12, aylik); rozet = n > 0 ? '<span class="rozet sari">' + M.enAvantajli.replace('{n}', n) + '</span>' : ''; alt = M.ayda.replace('{x}', aydaAsagi(p, 12)); }
      else if (k === 'alti') { var n2 = avantaj(p, 6, aylik); rozet = n2 > 0 ? '<span class="rozet">' + M.avantaj.replace('{n}', n2) + '</span>' : ''; alt = M.ayda.replace('{x}', aydaAsagi(p, 6)); }
      else { alt = M.iptal; }   // (karar B) "1 ay ücretsiz" artık her planda — yalnız aylık kartta rozet yanıltırdı; deneme satırı seçilen plana göre
      return '<button class="plan' + (k === secim ? ' secili' : '') + '" role="radio" aria-checked="' + (k === secim) + '" data-k="' + k + '" type="button">'
        + '<span class="psol"><span class="nokta"></span><span class="pad"><b>' + t[0] + ' ' + rozet + '</b><small>' + alt + '</small></span></span>'
        + '<span class="psag"><b>' + p.priceString + '</b><small>' + t[1] + '</small></span></button>';
    }).join('');
    Array.prototype.forEach.call($('planlar').querySelectorAll('.plan'), function (b) {
      b.onclick = function () { secim = b.getAttribute('data-k'); planlariCiz(); };
    });
    var p = P[secim].product, dene = !!denemeler[secim], ios = platform === 'ios';
    $('denemeSatir').hidden = !dene;
    if (dene) yaz('denemeSatir', M.denemeSatir.replace('{x}', p.priceString).replace('{per}', M.plan[secim][1]));
    yaz('alBtn', dene ? M.ctaDene : M.ctaAl);
    var sablon = dene ? (ios ? M.acIosDeneme : M.acAndDeneme) : (ios ? M.acIos : M.acAnd);
    yaz('aciklama', sablon.replace('{x}', p.priceString).replace('{sonra}', M.plan[secim][2]));
  }

  async function satisAc() {
    ac('kilit', false); ac('yukleniyor', true); ac('satis', false); mesaj('');
    try {
      teklif = await Pro.teklifler();
      var kullanildi = !!(durum && durum.deneme_kullanildi);
      denemeler = {};
      Object.keys(teklif.denemeler || {}).forEach(function (k) { denemeler[k] = !!teklif.denemeler[k] && !kullanildi; });
      if (!teklif.denemeler && teklif.deneme && !kullanildi) denemeler.aylik = true;   // eski abonelik.js (önbellek) uyumu
      denemeVar = !!(denemeler.yillik || denemeler.alti || denemeler.aylik);
      secim = 'yillik';   // (karar B) varsayılan her zaman en avantajlı plan — deneme her planda
      if (!teklif.paketler[secim]) secim = Object.keys(teklif.paketler).filter(function (k) { return teklif.paketler[k]; })[0];
      basliklar(); planlariCiz();
      ac('yukleniyor', false); ac('satis', true);
    } catch (e) {
      ac('yukleniyor', false); ac('satis', true);
      $('ozellikler').hidden = false; $('planlar').innerHTML = ''; ac('denemeSatir', false); yaz('aciklama', '');
      var eklentiYok = e && /eklenti-yok|anahtar-yok/.test(String(e.message || e));
      mesaj(eklentiYok ? M.guncelle : M.yuklenemedi, true);
      yaz('alBtn', M.tekrar); $('alBtn').onclick = satisAc;
      return;
    }
    $('alBtn').onclick = satinAl;
  }

  async function bitti(sonuc, okMetni) {
    if (sonuc && sonuc.tamam) { mesaj(okMetni); setTimeout(function () { location.replace(donus); }, 900); return true; }
    return false;
  }
  async function satinAl() {
    var b = $('alBtn'); b.disabled = true; var eski = b.textContent; yaz('alBtn', M.isleniyor); mesaj('');
    try {
      var s = await Pro.satinAl(teklif.paketler[secim]);
      if (s.iptal) { /* vazgeçti: mesaj yok */ }
      else if (s.bekliyor) mesaj(M.bekliyor);
      else if (!(await bitti(s, M.tamam))) mesaj(M.hata, true);
    } catch (e) { mesaj(M.hata, true); }
    b.disabled = false; b.textContent = eski;
  }
  async function geriYukle() {
    if (platform === 'web') return;
    var b = $('geriYukleBtn'); b.disabled = true; mesaj('');
    try {
      var s = await Pro.geriYukle();
      if (!(await bitti(s, M.geriYuklendi))) { ac('satis', true); mesaj(M.geriYokYok); }
    } catch (e) { mesaj(M.hata, true); }
    b.disabled = false;
  }

  function kilitAc() {
    var yeni = !(durum && (durum.daha_once_pro || durum.deneme_kullanildi));
    ac('satis', false); ac('yukleniyor', false); ac('kilit', true);
    yaz('baslik', platform === 'web' ? M.bYeni : (yeni ? M.hosgeldin : M.kilitBaslik));
    yaz('altBaslik', '');
    yaz('kilitMetin', platform === 'web' ? M.webMetin : (yeni ? M.hosgeldinMetin : M.kilitMetin));
    ac('proyaDonBtn', platform !== 'web');
  }

  $('kapatBtn').onclick = function () {
    // Pro varsa ya da kilit zorunlu değilse (web, lansman öncesi) geldiği yere dön
    if (window.Pro && (Pro.proMu(durum) || !Pro.zorunluMu(durum))) { location.replace(donus); return; }
    kilitAc();
  };
  $('proyaDonBtn').onclick = satisAc;
  $('ayarlarBtn').onclick = function () { location.href = 'ayarlar.html'; };
  $('cikisBtn').onclick = function () { if (typeof logout === 'function') logout(); };
  $('geriYukleBtn').onclick = geriYukle;

  function proBekle() {
    return new Promise(function (ok) {
      if (window.Pro) return ok();
      var n = 0, t = setInterval(function () { if (window.Pro || ++n > 50) { clearInterval(t); ok(); } }, 100);
    });
  }

  (async function basla() {
    var girisli = await requireAuth();
    if (!girisli) return;
    await proBekle();
    if (!window.Pro) { mesaj(M.yuklenemedi, true); return; }
    platform = Pro.platform();
    durum = Pro.onbellek();
    try { durum = await Pro.durumTazele(); } catch (e) {}
    if (Pro.proMu(durum)) { location.replace(donus); return; }
    if (platform === 'web') { ac('geriYukleBtn', false); basliklar(); kilitAc(); return; }
    basliklar();
    satisAc();
  })();
})();
</script>
